:root{
  --bg:#0B1220;--panel:#111A2E;--panel2:#16213A;--line:rgba(148,163,184,.22);
  --teal:#2DD4BF;--violet:#8B5CF6;--gold:#F5B942;--ember:#FB923C;--text:#F1F5F9;--muted:#A3B1C6;
  --ok:#4ADE80;--r:16px;
  --font:"Lexend","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 30% 110%,rgba(251,146,60,.13),transparent 60%),radial-gradient(900px 500px at 90% -10%,rgba(139,92,246,.16),transparent 60%),var(--bg);color:var(--text);font:18px/1.4 var(--font);overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
a{color:var(--teal)}
#app{height:100%;display:flex;flex-direction:column}
.demo-bar{background:var(--teal);color:#06241f;text-align:center;padding:6px 12px;font-size:15px;flex:none}
.demo-bar a{color:#06241f;font-weight:700}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 16px;min-height:46px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:linear-gradient(135deg,var(--teal),#14b8a6);color:#04211c;border:none}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--ember));color:#2a1602;border:none}
.btn.ghost{background:transparent}
.btn.small{min-height:38px;padding:6px 12px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sel{outline:3px solid var(--gold);outline-offset:1px;background:#2a2410}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
/* header */
.top{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:rgba(17,26,46,.85);flex:none}
.top h1{font-size:20px;margin:0;letter-spacing:.3px}
.top .info{color:var(--muted);font-size:16px}
.top .grow{flex:1}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:#26324d;border:1px solid var(--line)}
.dot.ok{background:var(--ok)}.dot.help{background:var(--gold)}.dot.now{background:var(--teal);box-shadow:0 0 0 3px rgba(45,212,191,.3)}
/* home */
.home{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.home-card{max-width:760px;width:100%;text-align:center}

.logo{font-size:56px;margin:0;line-height:1.05;background:linear-gradient(90deg,var(--gold),var(--ember),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--muted);font-size:21px;margin:8px 0 26px}
.home-btns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.big{padding:20px;min-height:110px;flex-direction:column;font-size:22px;border-radius:18px}
.big small{font-weight:400;font-size:15px;opacity:.85}
.foot{color:var(--muted);font-size:14px;margin-top:22px}
/* map */
.map{flex:1;overflow:auto;padding:18px}
.map h2{margin:0 0 4px}
.ranks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:14px}
.rank{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.rank h3{margin:0;font-size:22px}
.rank .std{color:var(--muted);font-size:14px}
.rank .ex{font-size:22px;color:var(--gold);font-weight:700}
.rank .best{font-size:15px;color:var(--muted)}
.rank.locked{opacity:.6}
.rank .btn{margin-top:auto}
/* forge */
.forge{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);gap:12px;padding:12px}
.stage{background:linear-gradient(180deg,#121b31,#0e1526);border:1px solid var(--line);border-radius:var(--r);min-height:0;display:flex;flex-direction:column;position:relative}
.stage svg{flex:1;min-height:0;width:100%;height:100%}
.side{display:flex;flex-direction:column;gap:10px;min-height:0}
.steps{flex:1;min-height:80px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.steps h2{font-size:15px;color:var(--muted);margin:0 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.alg{display:grid;grid-template-columns:1fr auto 1fr;column-gap:12px;row-gap:2px;font-size:24px;align-items:center}
.alg .l{text-align:right}.alg .m{text-align:center;color:var(--muted)}.alg .r{text-align:left}
.alg .mv{color:var(--teal);font-size:19px}
.alg .cur{font-weight:700;color:var(--text)}
.alg .old{color:#c9d4e6}
.feedback{min-height:52px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:17px}
.feedback.good{border-color:var(--ok)}.feedback.warn{border-color:var(--gold)}.feedback.info{border-color:var(--teal)}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:9px;flex:none}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ops .btn{flex-direction:column;gap:0;padding:6px;font-size:15px;line-height:1.15}
.ops .btn b{font-size:24px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:40px;min-width:48px;border-radius:20px;padding:4px 12px;border:1px solid var(--line);background:#1c2843;cursor:pointer;font-weight:700;font-size:18px}
.chip:hover{border-color:var(--gold)}
.numin{width:110px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:#0c1424;padding:6px 10px;font-size:22px;text-align:center}
.preview{color:var(--gold);font-weight:700;font-size:17px;min-height:24px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:none;background:transparent;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--violet);color:#fff}
.lbl{color:var(--muted);font-size:15px}
.teachbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{font-size:24px;text-align:center;line-height:1.6}
.check .okc{color:var(--ok);font-weight:700}
/* summary */
.summary{flex:1;overflow:auto;padding:18px;display:flex;justify-content:center}
.sum-card{max-width:860px;width:100%}
.score{font-size:52px;font-weight:700;color:var(--gold);margin:4px 0}
.plist{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.pitem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.pitem .eq{font-size:21px;font-weight:700}
.pitem .worked{color:var(--muted);font-size:16px;margin-top:4px}
.tag-ok{color:var(--ok)}.tag-help{color:var(--gold)}
/* dialogs */
.modal-bg{position:fixed;inset:0;background:rgba(3,6,14,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px;max-width:620px;width:100%;max-height:90vh;overflow:auto}
.modal h2{margin:0 0 10px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.opt input[type=checkbox]{width:26px;height:26px;accent-color:var(--teal)}
.opt select{background:#0c1424;border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-height:42px}
.note{color:var(--muted);font-size:15px}
.howto{padding-left:22px}.howto li{margin:6px 0}
.teacher-screen{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.teacher-screen .huge{font-size:80px;font-weight:700;color:var(--gold)}
/* svg items */
.float{animation:floatup 1.3s ease-out forwards}
@keyframes floatup{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
.wobble{animation:wob .9s ease-in-out}
@keyframes wob{0%{transform:rotate(0)}30%{transform:rotate(-5deg)}60%{transform:rotate(2deg)}100%{transform:rotate(0)}}
.glow{filter:drop-shadow(0 0 10px rgba(74,222,128,.75))}
/* teach mode (projector) */
body.teach{font-size:21px}
body.teach .alg{font-size:32px}
body.teach .alg .mv{font-size:24px}
body.teach .feedback{font-size:22px}
/* small screens */
@media (max-width:900px){
  body{overflow:auto}
  .forge{grid-template-columns:1fr;overflow:auto}
  .stage{min-height:300px}
  .home-btns{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const DEMO = true;
const VERSION = '1.0';
const KEY = DEMO ? 'equationForge.demo.v1' : 'equationForge.v1';
const STORE_LINK = '../../#equation-forge';

/* ---------- Fractions (exact math) ---------- */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1}
class F{
  constructor(n,d=1){if(d===0)throw new Error('div0');if(d<0){n=-n;d=-d}const g=gcd(n,d);this.n=n/g;this.d=d/g;if(this.n===0)this.n=0}
  static of(v){return v instanceof F?v:new F(v,1)}
  add(o){o=F.of(o);return new F(this.n*o.d+o.n*this.d,this.d*o.d)}
  sub(o){o=F.of(o);return this.add(o.neg())}
  mul(o){o=F.of(o);return new F(this.n*o.n,this.d*o.d)}
  div(o){o=F.of(o);if(o.n===0)throw new Error('div0');return new F(this.n*o.d,this.d*o.n)}
  neg(){return new F(-this.n,this.d)}
  abs(){return new F(Math.abs(this.n),this.d)}
  recip(){return new F(this.d,this.n)}
  eq(o){o=F.of(o);return this.n===o.n&&this.d===o.d}
  isZero(){return this.n===0}
  isInt(){return this.d===1}
  sign(){return Math.sign(this.n)}
  val(){return this.n/this.d}
  terminating(){let d=this.d;while(d%2===0)d/=2;while(d%5===0)d/=5;return d===1}
  toJ(){return [this.n,this.d]}
  static J(a){return new F(a[0],a[1])}
}
function parseNum(str){
  if(str==null)return null;
  let s=String(str).trim().replace(/[−–]/g,'-').replace(/\s+/g,'');
  if(s.startsWith('+'))s=s.slice(1);
  let m;
  if((m=s.match(/^(-?)(\d+)$/)))return new F((m[1]?-1:1)*parseInt(m[2],10),1);
  if((m=s.match(/^(-?)(\d*)\.(\d+)$/))){const d=Math.pow(10,m[3].length);return new F((m[1]?-1:1)*(parseInt(m[2]||'0',10)*d+parseInt(m[3],10)),d)}
  if((m=s.match(/^(-?)(\d+)\/(\d+)$/))){if(+m[3]===0)return null;return new F((m[1]?-1:1)*parseInt(m[2],10),parseInt(m[3],10))}
  if((m=s.match(/^-?\((-?\d+)\/(\d+)\)$/))){if(+m[2]===0)return null;const f=new F(parseInt(m[1],10),parseInt(m[2],10));return s.startsWith('-')?f.neg():f}
  return null;
}

/* ---------- Formatting ---------- */
const MINUS='−';
function trimDec(v){return String(+v.toFixed(4))}
function fmtAbs(a,mode){ // a >= 0
  if(a.isInt())return String(a.n);
  if(mode==='dec'&&a.terminating())return trimDec(a.val());
  return a.n+'/'+a.d;
}
function fmtNum(f,mode){return (f.sign()<0?MINUS:'')+fmtAbs(f.abs(),mode)}
function fmtXBody(a,mode){ // a > 0 coefficient
  if(a.eq(1))return 'x';
  if(a.isInt())return a.n+'x';
  if(mode==='dec'&&a.terminating())return trimDec(a.val())+'x';
  if(a.n===1)return 'x/'+a.d;
  return '('+a.n+'/'+a.d+')x';
}
function sideParts(s,mode){
  const xs=s.x.isZero()?null:{neg:s.x.sign()<0,body:fmtXBody(s.x.abs(),mode)};
  const cs=s.c.isZero()?null:{neg:s.c.sign()<0,body:fmtAbs(s.c.abs(),mode)};
  const parts=[];
  if(s.cFirst){if(cs)parts.push(cs);if(xs)parts.push(xs)}else{if(xs)parts.push(xs);if(cs)parts.push(cs)}
  return parts;
}
function fmtSide(s,mode){
  const p=sideParts(s,mode);
  if(!p.length)return '0';
  return p.map((t,i)=>i===0?(t.neg?MINUS:'')+t.body:(t.neg?' '+MINUS+' ':' + ')+t.body).join('');
}
function fmtEq(e){return fmtSide(e.L,e.mode)+' = '+fmtSide(e.R,e.mode)}
function paren(v,mode){const s=fmtNum(v,mode);return '('+s+')'}
function fmtSub(s,xv,mode){ // substitution text
  const parts=[];
  const xpart=()=>{const a=s.x.abs();let t;
    if(a.eq(1))t=xv.sign()<0?paren(xv,mode):fmtNum(xv,mode);
    else if(a.isInt()||(mode==='dec'&&a.terminating()))t=fmtAbs(a,mode)+paren(xv,mode);
    else if(a.n===1)t=paren(xv,mode)+'/'+a.d;
    else t='('+a.n+'/'+a.d+')'+paren(xv,mode);
    return {neg:s.x.sign()<0,body:t}};
  const cpart=()=>({neg:s.c.sign()<0,body:fmtAbs(s.c.abs(),mode)});
  const order=s.cFirst?['c','x']:['x','c'];
  for(const k of order){if(k==='x'&&!s.x.isZero())parts.push(xpart());if(k==='c'&&!s.c.isZero())parts.push(cpart())}
  if(!parts.length)return '0';
  return parts.map((t,i)=>i===0?(t.neg?MINUS:'')+t.body:(t.neg?' '+MINUS+' ':' + ')+t.body).join('');
}
function evalSide(s,xv){return s.x.mul(xv).add(s.c)}

/* ---------- Equation model ---------- */
function S(x,c,cFirst=false){return {x:F.of(x),c:F.of(c),cFirst}}
function cloneEq(e){return {L:{...e.L},R:{...e.R},mode:e.mode}}
function eqToJ(e){return {L:[e.L.x.toJ(),e.L.c.toJ(),e.L.cFirst],R:[e.R.x.toJ(),e.R.c.toJ(),e.R.cFirst],mode:e.mode}}
function eqFromJ(j){return {L:{x:F.J(j.L[0]),c:F.J(j.L[1]),cFirst:j.L[2]},R:{x:F.J(j.R[0]),c:F.J(j.R[1]),cFirst:j.R[2]},mode:j.mode}}
function applyMove(e,mv){
  const n=cloneEq(e);
  for(const k of ['L','R']){
    const s={...n[k]};
    if(mv.op==='add'){if(mv.term==='x')s.x=s.x.add(mv.v);else s.c=s.c.add(mv.v)}
    else if(mv.op==='sub'){if(mv.term==='x')s.x=s.x.sub(mv.v);else s.c=s.c.sub(mv.v)}
    else if(mv.op==='mul'){s.x=s.x.mul(mv.v);s.c=s.c.mul(mv.v)}
    else if(mv.op==='div'){s.x=s.x.div(mv.v);s.c=s.c.div(mv.v)}
    n[k]=s;
  }
  return n;
}
function isolated(e){
  const one=(a,b)=>a.x.eq(1)&&a.c.isZero()&&b.x.isZero();
  if(one(e.L,e.R))return {side:'L',val:e.R.c};
  if(one(e.R,e.L))return {side:'R',val:e.L.c};
  return null;
}
function nextStep(e){
  const {L,R}=e;
  if(isolated(e))return null;
  if(!L.x.isZero()&&!R.x.isZero()){
    const small=L.x.val()<=R.x.val()?L.x:R.x;
    return small.sign()>0?{op:'sub',term:'x',v:small,type:'xboth'}:{op:'add',term:'x',v:small.abs(),type:'xboth'};
  }
  const s=!L.x.isZero()?L:R;
  if(!s.c.isZero())return s.c.sign()>0?{op:'sub',term:'num',v:s.c,type:'const'}:{op:'add',term:'num',v:s.c.abs(),type:'const'};
  const a=s.x;
  if(a.isInt()||(e.mode==='dec'&&a.terminating()))return {op:'div',term:'num',v:a,type:'coef'};
  return {op:'mul',term:'num',v:a.recip(),type:'coef'};
}
function stepsLeft(e){let n=0,cur=e;while(n<10){const s=nextStep(cur);if(!s)return n;cur=applyMove(cur,s);n++}return 99}
function solvePath(e){const out=[];let cur=e;for(let i=0;i<10;i++){const s=nextStep(cur);if(!s)break;out.push(s);cur=applyMove(cur,s)}return out}
function solution(e){let cur=e;for(const s of solvePath(e))cur=applyMove(cur,s);const iso=isolated(cur);return iso?iso.val:null}
function moveShort(mv,mode){
  const sym={add:'+',sub:MINUS,mul:'×',div:'÷'}[mv.op];
  let v=mv.term==='x'?(mv.v.sign()<0?MINUS:'')+fmtXBody(mv.v.abs(),mode):fmtNum(mv.v,mode);
  if(mv.v.sign()<0)v='('+v+')';
  return sym+v;
}
function moveText(mv,mode){
  const v=mv.term==='x'?(mv.v.sign()<0?MINUS:'')+fmtXBody(mv.v.abs(),mode):fmtNum(mv.v,mode);
  if(mv.op==='add')return 'Add '+v+' to both sides';
  if(mv.op==='sub')return 'Subtract '+v+' from both sides';
  if(mv.op==='mul')return 'Multiply both sides by '+v;
  return 'Divide both sides by '+v;
}
function hintFor(e){
  const s=nextStep(e);if(!s)return '';
  if(s.type==='xboth')return 'There are x-crystals on both sides. Take the same amount of x away from both sides, so x is on one side only.';
  if(s.type==='const'){
    const side=!e.L.x.isZero()?e.L:e.R;
    return side.c.sign()>0?'A number is added to x’s side. Undo adding by subtracting that number from both sides.':'A number is subtracted on x’s side. Undo subtracting by adding that number to both sides.';
  }
  const side=!e.L.x.isZero()?e.L:e.R;const a=side.x;
  if(a.sign()<0&&a.abs().eq(1))return 'x has a negative sign. Divide both sides by '+MINUS+'1 to make it a plain x.';
  if(s.op==='div')return 'x is being multiplied by '+fmtNum(a,e.mode)+'. Undo multiplying by dividing both sides by '+fmtNum(a,e.mode)+'.';
  if(a.abs().n===1)return 'x is being divided by '+a.abs().d+'. Undo dividing by multiplying both sides by '+fmtNum(s.v,e.mode)+'.';
  return 'x is being multiplied by the fraction '+fmtNum(a,e.mode)+'. Multiply both sides by its flip, '+fmtNum(s.v,e.mode)+', to undo it.';
}
function tooBig(e){for(const k of ['L','R'])for(const f of [e[k].x,e[k].c])if(Math.abs(f.n)>100000||f.d>5000)return true;return false}

/* ---------- Problem generator ---------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const nz=(a,b)=>{let v=0;while(v===0)v=ri(a,b);return v};
function maybeSwap(e,p){if(Math.random()<p){const t=e.L;e.L=e.R;e.R=t}return e}
function gen(rank,neg){
  let e;
  if(rank===0){
    const f=ri(0,2),a=ri(1,12);
    if(f===0){const x=ri(1,15);e={L:S(1,a),R:S(0,x+a),mode:'frac'}}
    else if(f===1){const b=ri(1,12);e={L:S(1,-a),R:S(0,b),mode:'frac'}}
    else{const x=ri(1,15);e={L:S(1,a,true),R:S(0,x+a),mode:'frac'}}
    maybeSwap(e,.2);
  }
  return e;
}
function genSet(rank,n,neg){
  const out=[],seen=new Set();let guard=0;
  while(out.length<n&&guard<500){guard++;const e=gen(rank,neg);const k=fmtEq(e);if(seen.has(k))continue;if(!solution(e))continue;seen.add(k);out.push(e)}
  return out;
}

function renderChips(){
  const e=curEq(),vals=[],seen=new Set();
  const addV=f=>{if(!f||f.isZero())return;const a=f.abs();const k=a.n+'/'+a.d;if(seen.has(k))return;seen.add(k);vals.push(a)};
  if(sel.term==='x'){addV(e.L.x);addV(e.R.x)}
  else{
    if(sel.op==='mul'||sel.op==='div'){for(const s of [e.L,e.R]){if(!s.x.isZero()&&!s.x.eq(1)){addV(s.x);if(!s.x.isInt())addV(s.x.recip())}}addV(new F(-1))}
    for(const s of [e.L,e.R])addV(s.c);
    if(sel.op!=='mul'&&sel.op!=='div')for(const s of [e.L,e.R])if(!s.x.isZero()&&!s.x.abs().eq(1))addV(s.x);
  }
  if(sel.op==='mul'||sel.op==='div'){if(!seen.has('1/1')){}};
  const neg1=(sel.op==='mul'||sel.op==='div');
  let html=vals.slice(0,6).map(v=>'<button class="chip" data-v="'+v.n+'/'+v.d+'">'+esc(sel.term==='x'?fmtXBody(v,e.mode):fmtAbs(v,e.mode))+'</button>').join('');

const PIV={x:410,y:110};
function itemsFor(s,mode){
  // returns list of draw items {k:'x'|'nx'|'one'|'none'|'ten'|'nten'|'bigx'|'bigc', label}
  const out=[];let rows=0;
  const xa=s.x.abs(),ca=s.c.abs();
  let xs=[],cs=[];
  if(!s.x.isZero()){
    if(xa.isInt()&&xa.n<=8){for(let i=0;i<xa.n;i++)xs.push({k:s.x.sign()>0?'x':'nx'})}
    else xs.push({k:'bigx',neg:s.x.sign()<0,label:(s.x.sign()<0?MINUS:'')+fmtXBody(xa,mode)});
  }
  if(!s.c.isZero()){
    if(ca.isInt()&&ca.n<=15){for(let i=0;i<ca.n;i++)cs.push({k:s.c.sign()>0?'one':'none'})}
    else if(ca.isInt()&&ca.n<=59){const t=Math.floor(ca.n/10),o=ca.n%10;for(let i=0;i<t;i++)cs.push({k:s.c.sign()>0?'ten':'nten'});for(let i=0;i<o;i++)cs.push({k:s.c.sign()>0?'one':'none'})}
    else cs.push({k:'bigc',neg:s.c.sign()<0,label:fmtNum(s.c,mode)});
  }
  return {xs,cs};
}
function panSVG(cx,s,mode){
  const {xs,cs}=itemsFor(s,mode);
  let g='',y=346;const W=196,left=cx-W/2;
  // layout: rows from bottom: constants first (heavier at bottom), then crystals
  const rowsOut=[];
  const pushRow=(arr,w,h)=>{const per=Math.max(1,Math.floor(W/w));for(let i=0;i<arr.length;i+=per)rowsOut.push({items:arr.slice(i,i+per),w,h})};
  const tens=cs.filter(i=>i.k==='ten'||i.k==='nten'),ones=cs.filter(i=>i.k==='one'||i.k==='none'),bigc=cs.filter(i=>i.k==='bigc');
  const crys=xs.filter(i=>i.k==='x'||i.k==='nx'),bigx=xs.filter(i=>i.k==='bigx');
  pushRow(bigc,130,52);pushRow(tens,96,26);pushRow(ones,38,38);pushRow(bigx,150,64);pushRow(crys,46,46);
  for(const r of rowsOut){
    const total=r.items.length*r.w,sx=cx-total/2;
    r.items.forEach((it,i)=>{const x=sx+i*r.w+r.w/2,yc=y-r.h/2;g+=drawItem(it,x,yc,r)});
    y-=r.h+2;
  }
  return g;
}

    case 'one':return '<g><circle cx="'+x+'" cy="'+y+'" r="16" fill="url(#go)" stroke="#92400e" stroke-width="2"/><text x="'+x+'" y="'+(y+6)+'" text-anchor="middle" font-size="16" font-weight="700" fill="#3b1d02">1</text></g>';

  }
  return '';
}

  const lx=120,rx=700;

  s+='<g id="floats"></g>';
  const fs=Math.max(22,Math.min(36,Math.floor(380/Math.max(fmtSide(L,e.mode).length,fmtSide(R,e.mode).length,6))));
  s+='<text x="'+lx+'" y="452" text-anchor="middle" font-size="'+fs+'" font-weight="700" fill="#F1F5F9">'+esc(fmtSide(L,e.mode))+'</text>';
  s+='<text x="410" y="452" text-anchor="middle" font-size="36" font-weight="700" fill="#F5B942">=</text>';
  s+='<text x="'+rx+'" y="452" text-anchor="middle" font-size="'+fs+'" font-weight="700" fill="#F1F5F9">'+esc(fmtSide(R,e.mode))+'</text>';
  $('#scale').innerHTML=s;
}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function animateMove(mv,mode){
  if(reduced)return;
  const b=$('#beam');if(b){b.classList.remove('wobble');void b.getBBox();b.classList.add('wobble')}
  const t=esc(moveShort(mv,mode));
  $('#floats').innerHTML=['120','700'].map(x=>'<text class="float" x="'+x+'" y="70" text-anchor="middle" font-size="34" font-weight="700" fill="#2DD4BF">'+t+'</text>').join('');
}

/* ---------- Actions ---------- */
function doApply(mv,auto){
  const c=curState(),e=curEq();
  if(!mv)return;
  if((mv.op==='mul'||mv.op==='div')&&mv.v.isZero())return;
  let n;try{n=applyMove(e,mv)}catch(err){setFb('That move doesn’t work. Try another.','warn');return}
  if(tooBig(n)){setFb('Those numbers are getting too big for the forge. Try a different move.','warn');return}
  const before=stepsLeft(e),after=stepsLeft(n);
  c.hist.push(n);c.moves.push(mv);
  sel.op=null;$('#numIn').value='';
  const iso=isolated(n);
  let msg,kind='good';
  if(iso){c.phase='answer'}
  else if(after>=before&&!auto){
    c.unhelpful++;
    if(mode==='student'&&c.unhelpful>=2){
      c.helped=true;c.hint=2;
      kind='warn';msg='The scale is still balanced, but that didn’t get x closer to alone. Tap ↶ Undo. Next step: '+moveText(nextStep(n),n.mode)+'.';
    }else{kind='warn';msg='The scale is still balanced — nice — but that move didn’t get x closer to alone. Tap ↶ Undo and try a different move.'}
  }else{msg=auto?'The forge did: '+moveText(mv,e.mode)+'.':pick(['Balanced! ','Nice move! ','The scale stays level! '])+moveText(mv,e.mode)+'.'}
  if(mode==='student')runToStore();
  renderForge();
  animateMove(mv,e.mode);
  if(msg)setFb(msg,kind);
  if(store.settings.read&&msg)speak(msg);
}
function doUndo(){
  const c=curState();
  if(c.hist.length<=1){setFb('This is the starting equation. Nothing to undo.','info');return}
  c.hist.pop();c.moves.pop();c.phase='solve';
  if(mode==='student')runToStore();
  renderForge();setFb('Undone. The scale is back one step.','info');
}
function doHint(){
  const c=curState(),e=curEq(),s=nextStep(e);if(!s)return;
  if(c.hint===0){c.hint=1;setFb('💡 '+hintFor(e),'info');if(store.settings.read)speak(hintFor(e))}
  else{
    c.hint=2;if(mode==='student')c.helped=true;
    const f=$('#fb');f.className='feedback warn';
    f.innerHTML='Next step: <b>'+esc(moveText(s,e.mode))+'</b> <button class="btn small gold" id="btnDoIt">Do it for me</button>';
    $('#btnDoIt').onclick=()=>{c.hint=0;doApply(nextStep(curEq()),true)};
  }
  if(mode==='student')runToStore();
}
function doAnswer(){
  const c=curState(),e=curEq(),iso=isolated(e);if(!iso)return;
  const v=parseNum($('#ansIn').value);
  if(!v){setFb('Type a number, like 4, '+MINUS+'2, 0.5 or 3/4.','warn');return}
  if(!v.eq(iso.val)){
    c.wrongAns=(c.wrongAns||0)+1;
    if(c.wrongAns>=2)setFb('Look at the side across from x: x is balanced with '+fmtNum(iso.val,e.mode)+'.','warn');
    else setFb('Not quite. x is balanced with whatever is on the other side of the scale. Read that side.','warn');
    if(mode==='student')runToStore();return;
  }
  c.phase='check';c.xval=v;
  if(mode==='student')runToStore();
  renderForge();renderCheck();
}
function renderCheck(){
  const c=curState(),e0=startEq(),last=curEq(),iso=isolated(last),xv=iso.val;
  const l=evalSide(e0.L,xv),r=evalSide(e0.R,xv);
  $('#checkBox').innerHTML='<div>Check it: put <b>x = '+esc(fmtNum(xv,e0.mode))+'</b> back in.</div><div>'+esc(fmtSub(e0.L,xv,e0.mode))+' = '+esc(fmtSub(e0.R,xv,e0.mode))+'</div><div class="okc">'+esc(fmtNum(l,e0.mode))+' = '+esc(fmtNum(r,e0.mode))+' ✓ Balanced!</div>';
  setFb(mode==='student'&&!c.helped?'You solved it on your own! The original scale balances with x = '+fmtNum(xv,e0.mode)+'.':'Solved! The original scale balances with x = '+fmtNum(xv,e0.mode)+'.','good');
  $('#btnNext').textContent=mode==='teach'?'🎲 New problem':(run.i+1>=run.problems.length?'See my results →':'Next problem →');
  if(store.settings.read)speak('Check it. '+fmtSub(e0.L,xv,e0.mode)+' equals '+fmtSub(e0.R,xv,e0.mode)+'. Balanced!');
}
function doNext(){
  if(mode==='teach'){teachNew();return}
  const c=run.cur;
  run.results.push({eq:fmtEq(run.problems[run.i]),helped:c.helped,moves:c.moves.length});
  run.i++;
  if(run.i>=run.problems.length){finishRun();return}
  run.cur=newCur(run.problems[run.i]);
  runToStore();renderForge(true);
}
function finishRun(){
  const ok=run.results.filter(r=>!r.helped).length,n=run.problems.length;
  const p=store.ranks[run.rank];
  if(p.best==null||ok/n>p.best/(p.bestOf||n)){p.best=ok;p.bestOf=n}
  const done={rank:run.rank,ok,n,results:run.results,problems:run.problems};
  run=null;store.run=null;save();
  renderSummary(done);
}
function renderSummary(d){
  const pass=ok=>ok>=Math.ceil(d.n*0.8);
  const next=d.rank+1<RANKS.length?d.rank+1:null;
  let msg;
  if(pass(d.ok))msg=next!=null?(DEMO?'You beat the Apprentice rank! The next ranks are in the full version.':'Rank complete! <b>'+RANKS[next].name+'</b> is unlocked.'):'You are a Grandmaster of the forge! 🏆';
  else msg='Keep forging! You need '+Math.ceil(d.n*0.8)+' solved on your own to unlock the next rank.';
  let list=d.results.map((r,k)=>{
    let worked='';
    if(r.helped){const path=solvePath(d.problems[k]);let cur=d.problems[k];const lines=[];for(const s of path){lines.push(moveText(s,cur.mode));cur=applyMove(cur,s)}worked='<div class="worked">Steps: '+esc(lines.join(' → '))+' → '+esc(fmtEq(cur))+'</div>'}
    return '<div class="pitem"><span class="eq">'+(k+1)+'. '+esc(r.eq)+'</span> &nbsp; '+(r.helped?'<span class="tag-help">needed a step shown</span>':'<span class="tag-ok">✓ solved on your own</span>')+worked+'</div>';
  }).join('');
  const nextBtn=next!=null&&!DEMO&&unlocked(next)?'<button class="btn primary" id="sNext">Go to '+RANKS[next].name+' →</button>':'';
  const demoBtn=DEMO&&next!=null?'<a class="btn gold" href="'+STORE_LINK+'" target="_top">Get the full version →</a>':'';
  $('#sumCard').innerHTML='<h2 style="margin:0">'+RANKS[d.rank].name+'</h2><div class="score">'+d.ok+' / '+d.n+'</div><p style="font-size:20px">'+msg+'</p><div class="row"><button class="btn" id="sAgain">↻ Try this rank again</button>'+nextBtn+demoBtn+'<button class="btn" id="sMap">Rank map</button><button class="btn gold" id="sTeacher">Show your teacher</button></div><div class="plist">'+list+'</div>';
  $('#sAgain').onclick=()=>startRank(d.rank);
  $('#sMap').onclick=renderMap;
  if($('#sNext'))$('#sNext').onclick=()=>startRank(next);
  $('#sTeacher').onclick=()=>{const t=$('#tScreen');t.hidden=false;t.innerHTML='<div style="font-size:28px">Equation Forge · '+esc(RANKS[d.rank].name)+'</div><div class="huge">'+d.ok+' / '+d.n+'</div><div style="font-size:22px">solved on my own · '+esc(new Date().toLocaleDateString())+'</div><button class="btn primary" style="margin-top:24px" id="tClose">Close</button>';$('#tClose').onclick=()=>{t.hidden=true};$('#tClose').focus()};
  show('scrSum');
  if(store.settings.read)speak(RANKS[d.rank].name+' results: '+d.ok+' out of '+d.n+'.');
}

/* ---------- Teach mode ---------- */
function openTeachSetup(){
  const rb=RANKS.map((r,i)=>{const lock=DEMO&&i>0;return lock?'<a class="btn" href="'+STORE_LINK+'" target="_top">🔒 '+r.name+'</a>':'<button class="btn" data-trank="'+i+'">'+r.name+'<span class="note" style="margin-left:6px">'+esc(r.ex)+'</span></button>'}).join('');
  modal('<h2 id="mTitle">Teach Mode</h2><p>Pick a rank for random problems, or type your own equation.</p><div style="display:grid;gap:8px">'+rb+'</div>'+
    '<h3 style="margin:16px 0 6px">Type your own</h3>'+(DEMO?'<p class="note">Typing your own equations is in the <a href="'+STORE_LINK+'" target="_top">full version</a>.</p>':'<div class="row"><input class="numin" style="flex:1;text-align:left" id="ownIn" placeholder="3x + 4 = 19" aria-label="Your equation"><button class="btn primary" id="ownGo">Forge it</button></div><p class="note" id="ownErr" aria-live="polite"></p>')+
    '<div class="acts"><button class="btn" data-close>Cancel</button></div>');
  $$('[data-trank]').forEach(b=>b.onclick=()=>{closeModal();teachStart(+b.dataset.trank)});
  if(!DEMO){const go=()=>{const r=parseEquation($('#ownIn').value);if(r.err){$('#ownErr').textContent=r.err;return}closeModal();teachStart(null,r.eq)};$('#ownGo').onclick=go;$('#ownIn').onkeydown=ev=>{if(ev.key==='Enter')go()}; setTimeout(()=>$('#ownIn').focus(),30)}
}
function teachStart(rank,eq){
  mode='teach';sel={op:null,term:'num'};
  const e=eq||genSet(rank,1,store.settings.neg)[0];
  T={rank,label:rank!=null?RANKS[rank].name+' problem':'Your equation',hist:[e],moves:[],hint:0,unhelpful:0,phase:isolated(e)?'answer':'solve'};
  show('scrForge');
  $('#backLbl').textContent='Home';
  $('#teachBar').hidden=false;$('#btnUndo').hidden=false;$('#btnHint').hidden=true;
  $('#btnSpeak').hidden=!store.settings.read;
  renderForge(true);
}
function teachNew(){if(T.rank!=null)teachStart(T.rank);else openTeachSetup()}

/* ---------- Dialogs ---------- */
let lastFocus=null;
function modal(html){lastFocus=document.activeElement;$('#modal').innerHTML=html;$('#modalBg').hidden=false;$$('#modal [data-close]').forEach(b=>b.onclick=closeModal);const f=$('#modal').querySelector('button,a,input,select');if(f)f.focus()}
function closeModal(){$('#modalBg').hidden=true;$('#modal').innerHTML='';if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function openHow(){
  modal('<h2 id="mTitle">How the forge works</h2><ol class="howto"><li>The scale is <b>balanced</b>: both sides weigh the same. That is what the = sign means.</li><li><b>Teal crystals</b> are x. <b>Gold stones</b> are +1 (gold bars are +10). <b>Purple</b> ones are negative.</li><li>Pick a move and a number. The forge always does it to <b>both sides</b>, so the scale stays balanced.</li><li>Your goal: get <b>one x alone</b> on one side. Then say what x equals and check it.</li><li>Stuck? Tap 💡 Hint once for a clue, twice to see the next step.</li></ol><div class="acts"><button class="btn primary" data-close>Got it</button></div>');
}
function openOptions(){
  if(DEMO){modal('<h2 id="mTitle">Teacher Options</h2><p>In the full version you can unlock every rank, choose 5, 10 or 15 problems per rank, turn negatives off, turn on read-aloud, and reset progress.</p><div class="acts"><a class="btn gold" href="'+STORE_LINK+'" target="_top">Get the full version</a><button class="btn" data-close>Close</button></div>');return}
  const st=store.settings;
  modal('<h2 id="mTitle">Teacher Options</h2>'+
    '<div class="opt"><label for="oCount">Problems per rank</label><select id="oCount">'+[5,10,15].map(n=>'<option'+(n===st.count?' selected':'')+'>'+n+'</option>').join('')+'</select></div>'+
    '<div class="opt"><label for="oNeg">Use negative numbers (Master &amp; Grandmaster)</label><input type="checkbox" id="oNeg"'+(st.neg?' checked':'')+'></div>'+
    '<div class="opt"><label for="oRead">Read-aloud button (uses the computer’s voice)</label><input type="checkbox" id="oRead"'+(st.read?' checked':'')+'></div>'+
    '<div class="opt"><label for="oAll">Unlock all ranks</label><input type="checkbox" id="oAll"'+(st.unlockAll?' checked':'')+'></div>'+
    '<div class="opt"><span>Reset progress on this computer</span><button class="btn small" id="oReset">Reset…</button></div>'+
    '<p class="note">Settings and progress are saved in this browser on this computer only. No names or student data are saved, and nothing is sent anywhere. These options aren’t password-protected.</p>'+
    '<div class="acts"><button class="btn primary" id="oSave">Save</button><button class="btn" data-close>Cancel</button></div>');
  $('#oSave').onclick=()=>{const c=+$('#oCount').value;if(c!==st.count&&store.run){store.run=null}st.count=c;st.neg=$('#oNeg').checked;st.read=$('#oRead').checked;st.unlockAll=$('#oAll').checked;save();closeModal();renderHome()};
  $('#oReset').onclick=()=>{modal('<h2 id="mTitle">Reset progress?</h2><p>This clears every rank’s best score and any problem set in progress on this computer. Settings stay. This can’t be undone.</p><div class="acts"><button class="btn gold" id="rYes">Yes, reset</button><button class="btn" data-close>Cancel</button></div>');$('#rYes').onclick=()=>{store.ranks=RANKS.map(()=>({best:null}));store.run=null;save();closeModal();renderHome()}};
}

/* ---------- Read aloud ---------- */
function speakText(t){return t.replace(/−/g,' minus ').replace(/\+/g,' plus ').replace(/=/g,' equals ').replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/(\d)x/g,'$1 x').replace(/\//g,' over ')}
function speak(t){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speakText(t));u.rate=.92;speechSynthesis.speak(u)}catch(e){}}

/* ---------- Wiring ---------- */
$('#btnPractice').onclick=renderMap;
$('#btnTeach').onclick=openTeachSetup;
$('#btnHow').onclick=openHow;$('#btnHow2').onclick=openHow;
$('#btnOptions').onclick=openOptions;
$('#btnContinue').onclick=()=>{run=runFromStore();if(run)openForge();else renderHome()};
$$('[data-go]').forEach(b=>b.onclick=()=>b.dataset.go==='home'?renderHome():renderMap());
$('#btnBack').onclick=()=>{if(mode==='teach')renderHome();else{runToStore();renderMap()}};
$('#rankList').addEventListener('click',ev=>{const b=ev.target.closest('[data-rank]');if(!b)return;const i=+b.dataset.rank;const r=runFromStore();if(r&&r.rank===i&&r.i<r.problems.length){run=r;openForge()}else startRank(i)});
$$('.ops .btn').forEach(b=>b.onclick=()=>{sel.op=b.dataset.op;if(sel.op==='mul'||sel.op==='div'){sel.term='num';setTerm('num')}renderChips();updatePreview();$('#numIn').focus()});
function setTerm(t){sel.term=t;$('#tNum').setAttribute('aria-pressed',t==='num');$('#tX').setAttribute('aria-pressed',t==='x');renderChips();updatePreview()}
$('#tNum').onclick=()=>setTerm('num');$('#tX').onclick=()=>setTerm('x');
$('#chips').addEventListener('click',ev=>{const b=ev.target.closest('.chip');if(!b)return;const [n,d]=b.dataset.v.split('/').map(Number);const f=new F(n,d);$('#numIn').value=(f.sign()<0?'-':'')+(f.abs().isInt()?f.abs().n:(curEq().mode==='dec'&&f.terminating()?trimDec(f.abs().val()):f.abs().n+'/'+f.abs().d));updatePreview();if(!sel.op)$('#preview').textContent='Now pick a move: add, subtract, multiply or divide.'});
$('#numIn').addEventListener('input',updatePreview);
$('#numIn').addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!$('#btnApply').disabled)doApply(readMove())});
$('#btnApply').onclick=()=>doApply(readMove());
$('#btnUndo').onclick=doUndo;
$('#btnHint').onclick=doHint;
$('#btnAns').onclick=doAnswer;
$('#ansIn').addEventListener('keydown',ev=>{if(ev.key==='Enter')doAnswer()});
$('#btnNext').onclick=doNext;
$('#btnSpeak').onclick=()=>speak(fmtEq(curEq()));
$('#tAsk').onclick=()=>{const s=nextStep(curEq());setFb(s?'🙋 Ask the class: What move gets x closer to being alone? Talk with a partner, then show your answer.':'x is alone! Ask: what does x equal?','info')};
$('#tNext').onclick=()=>{const s=nextStep(curEq());if(s)doApply(s,true)};
$('#tNew').onclick=teachNew;
$('#tOwn').onclick=()=>{if(DEMO){modal('<h2 id="mTitle">In the full version</h2><p>Typing your own equations is in the full version.</p><div class="acts"><a class="btn gold" href="'+STORE_LINK+'" target="_top">Get the full version</a><button class="btn" data-close>Close</button></div>');return}openTeachSetup()};
$('#modalBg').addEventListener('click',ev=>{if(ev.target.id==='modalBg')closeModal()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(!$('#modalBg').hidden)closeModal();else if(!$('#tScreen').hidden)$('#tScreen').hidden=true}});
if(DEMO){$('#demoBar').hidden=false;document.title='Equation Forge Demo | The Alchemist Classroom'}
window.EF={F,parseNum,parseEquation,gen,genSet,solution,solvePath,applyMove,nextStep,isolated,fmtEq,stepsLeft,store:()=>store,cur:()=>curEq()};
renderHome();
</script>
