<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thank You, Out Loud Demo | The Alchemist Classroom</title><style>
:root{--bg:#f5f3fc;--ink:#241e39;--muted:#625b76;--purple:#5834a6;--gold:#edb948;--card:#fff;--stroke:#ded9ed;--good:#14694e;--bad:#a64232}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;background:var(--purple);color:white;padding:12px 17px;font-weight:700}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}button.secondary{background:#eee9f8;color:var(--purple)}button.ghost{background:transparent;color:var(--purple);border:1px solid var(--stroke)}button:disabled{opacity:.45;cursor:not-allowed}header{background:linear-gradient(110deg,#352069,#6640b5);color:white;padding:22px max(20px,calc((100vw - 1200px)/2));border-bottom:5px solid var(--gold)}header p{margin:6px 0 0;color:#e2d8ff}h1{margin:0;font-size:clamp(1.65rem,3vw,2.5rem)}.wrap{max-width:1200px;margin:0 auto;padding:20px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px}.sidebar,.panel{background:var(--card);border:1px solid var(--stroke);border-radius:18px;box-shadow:0 6px 20px #36235b09}.sidebar{padding:14px;align-self:start;position:sticky;top:12px}.navbtn{width:100%;text-align:left;display:flex;gap:10px;align-items:center;background:transparent;color:var(--ink);padding:13px;margin:3px 0}.navbtn.active{background:#eee8fc;color:#4b2d96}.num{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:50%;background:#eee8fc;color:#503293;font-weight:800;flex:none}.active .num{background:var(--purple);color:white}.panel{padding:clamp(18px,3vw,34px);min-height:570px}.eyebrow{color:#6040aa;font-size:.79rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800}.lead{font-size:clamp(1.2rem,2.1vw,1.5rem);line-height:1.5}.muted{color:var(--muted)}h2{font-size:clamp(1.6rem,2.5vw,2.15rem);margin:9px 0 14px}h3{margin:15px 0 10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.tile{border:1px solid var(--stroke);border-radius:15px;padding:17px;background:#fcfbff}.tile strong{display:block;margin-bottom:6px}.hero{background:#f0ebfe;border-left:5px solid var(--purple);padding:21px;border-radius:13px;margin:18px 0}.gold{background:#fff8e7;border-left-color:#be8514}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:21px}.chips{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.chip{background:#eee9f8;color:#503293}.chip.selected{background:var(--purple);color:white}.example{border-radius:14px;background:#f8f7fb;padding:17px;margin:10px 0;border:1px solid var(--stroke)}.feedback{padding:13px;border-radius:12px;margin-top:12px;background:#e9f7ef;color:#135a3d;font-weight:700}.feedback.try{background:#fff0ea;color:#8b3329}.field{display:block;margin:14px 0;font-weight:750}.field input,.field textarea{display:block;margin-top:7px;width:100%;border:1px solid #c6bfd9;border-radius:11px;padding:11px;color:var(--ink);background:#fff}.field textarea{min-height:78px;resize:vertical}.cardpreview{background:#fffaf0;border:3px solid var(--gold);border-radius:16px;padding:26px;min-height:240px;white-space:pre-wrap;line-height:1.8;font-family:Georgia,serif;font-size:1.17rem}.timer{display:inline-block;font-variant-numeric:tabular-nums;font-size:2.5rem;font-weight:850;color:var(--purple);margin:7px 0}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.small{font-size:.9rem}.footer{margin-top:22px;border-top:1px solid var(--stroke);padding-top:16px;display:flex;justify-content:space-between;gap:10px}.hide{display:none!important}audio{display:block;width:100%;margin:14px 0}.check{display:flex;gap:9px;align-items:flex-start;margin:12px 0}.check input{width:18px;height:18px;margin-top:3px}.progress{height:9px;background:#e8e3f2;border-radius:9px;overflow:hidden;margin-top:12px}.progress div{height:100%;background:var(--gold);transition:width .2s}.project #panel{font-size:1.2em}.project .sidebar{display:none}.project .wrap{display:block;max-width:1120px}.project .panel{min-height:77vh}.status{font-size:.85rem;color:var(--muted)}@media(max-width:750px){.wrap{display:block;padding:10px}.sidebar{position:static;margin-bottom:10px;display:flex;overflow-x:auto;gap:5px}.navbtn{min-width:145px}.grid{grid-template-columns:1fr}.panel{min-height:0}.footer{flex-wrap:wrap}}@media print{header,.sidebar,.actions,.footer,.toolbar,.noprint{display:none!important}body{background:white}.wrap{display:block;padding:0}.panel{border:0;box-shadow:none;padding:0}.cardpreview{break-inside:avoid;margin:35px auto;max-width:680px;min-height:420px}}
</style></head><body><div style="background:#2DD4BF;color:#06241f;text-align:center;padding:8px 14px;font:14px system-ui,sans-serif;position:relative;z-index:50" role="note"><b>Demo</b> · Thank You, Out Loud works fully. Nothing is saved or sent. <a style="color:#06241f;font-weight:800" href="../../#sel-activity-pack" target="_top">Get the SEL Activity Pack →</a></div><header><h1>Thank You, Out Loud</h1><p>Grade 6 · Social Awareness · 30 minutes</p></header><div class="wrap"><nav class="sidebar" aria-label="Lesson stages" id="nav"></nav><main class="panel" id="panel" aria-live="polite"></main></div><script>
'use strict';const stages=[['Start Here',3],['Check-In',3],['Model It',4],['Gratitude Detective',5],['Make a Card',10],['Say It Out Loud',6],['Reflect & Exit',5]]; // timing is a suggested 30-minute sequence excluding Start Here
const lessonMins=[3,4,4,9,6,4];let step=0, remaining=30*60,running=false,timerId=null,recordedUrl=null,recorder=null,chunks=[],stream=null,score=null,recordMime='';const state={person:'',moment:'',impact:'',signature:'',prompt:'',detective:null,exitChoice:'',exitWhy:''};
const $=s=>document.querySelector(s),escapeHtml=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){ $('#nav').innerHTML=stages.map((s,i)=>`<button class="navbtn ${step===i?'active':''}" onclick="go(${i})"><span class="num">${i||'•'}</span><span>${s[0]}</span></button>`).join('')+`<div style="padding:12px;border-top:1px solid #ddd" class="noprint"><div class="small muted">Lesson clock</div><div class="timer" id="clock" aria-label="Time remaining">30:00</div><div class="toolbar"><button class="secondary" id="toggleClock" onclick="toggleClock()">Start</button><button class="ghost" onclick="resetClock()">Reset</button></div><p class="status">Manual clock; keeps running as you change screens.</p><button class="ghost" onclick="document.body.classList.toggle('project')">Projector view</button></div>`;updateClock()}
function updateClock(){let el=$('#clock');if(el)el.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;let b=$('#toggleClock');if(b)b.textContent=running?'Pause':'Start'}function toggleClock(){running=!running;if(running&&!timerId)timerId=setInterval(()=>{if(running&&remaining>0){remaining--;updateClock()}if(remaining===0){running=false;updateClock()}},1000);updateClock()}function resetClock(){running=false;remaining=1800;updateClock()}function go(n){step=Math.min(Math.max(n,0),stages.length-1);render()}function next(){go(step+1)}function prev(){go(step-1)}
function shell(label,title,body){return `<div class="eyebrow">${label}</div><h2>${title}</h2>${body}<div class="footer"><button class="secondary" ${step===0?'disabled':''} onclick="prev()">← Previous</button><span class="muted small">Screen ${step+1} of ${stages.length}</span><button ${step===stages.length-1?'disabled':''} onclick="next()">Next →</button></div>`}
function render(){nav();let b='';switch(step){case 0:b=shell('Teacher dashboard','Today we make appreciation specific',`<p class="lead">Students will thank someone for a <b>real, specific action</b> and explain why it mattered. They can write a card and optionally record a message.</p><div class="grid"><div class="tile"><strong>Learning target</strong>I can say thank you by naming what someone did and how it helped me.</div><div class="tile"><strong>Teacher prep</strong>Paper or card stock, art materials, optional Chromebook microphone/headphones.</div><div class="tile"><strong>Teacher look-fors</strong>✓ Person recognized<br>✓ Concrete moment<br>✓ Impact explained</div><div class="tile"><strong>SEL alignment</strong>CASEL Social Awareness</div></div><div class="hero gold"><strong>Privacy and choice:</strong> Students do not have to name their person aloud, share their card, or record. A private or imagined thank-you is acceptable if recalling support feels uncomfortable.</div><div class="actions"><button onclick="next()">Begin teaching</button><button class="ghost" onclick="document.body.classList.toggle('project')">Toggle projector view</button></div>`);break;
case 1:b=shell('Minutes 0–3 · Check-in','Think of someone who helped you',`<div class="hero"><p class="lead">Think of one person who did something kind for you recently.</p><p>You do not need to tell anyone their name.</p></div><div class="grid"><div class="tile"><strong>Quiet thinking</strong>Allow 20–30 seconds of silence. Students may choose a person from a different week.</div><div class="tile"><strong>Support options</strong>A friend · Family member · Teacher · Coach · Neighbor · School staff · Someone else</div></div><p class="muted">Teacher cue: “It can be a little thing. Maybe someone waited for you, listened, explained something, or included you.”</p>`);break;
case 2:b=shell('Minutes 3–7 · Teacher model','General or specific?',`<div class="example"><strong>Too general:</strong><p class="lead">“Thanks for everything.”</p><span class="muted">We don't know what the person did.</span></div><div class="example"><strong>Specific:</strong><p class="lead">“Thanks for helping me practice my free throws after school. I felt more confident at the game.”</p><span class="muted">We know the action <b>and</b> why it mattered.</span></div><div class="hero gold"><strong>Teacher think-aloud:</strong> “I name what they actually did. Then I explain the difference it made for me.”</div><h3>Student sentence frame</h3><p class="lead">Thank you for <u>________</u>. It mattered to me because <u>________</u>.</p>`);break;
case 3:b=shell('Minutes 7–11 · Practice','Gratitude Detective',`<p class="lead">Which message is a <b>specific</b> thank-you?</p><div class="grid"><button class="chip" onclick="answer('a')" style="text-align:left;line-height:1.6;padding:22px">A. “You're the best. Thanks for everything.”</button><button class="chip" onclick="answer('b')" style="text-align:left;line-height:1.6;padding:22px">B. “Thank you for sitting with me at lunch when I was alone. I felt included.”</button></div><div id="detectiveFeedback" role="status">${state.detective===null?'':state.detective==='b'?'<div class="feedback">Correct! It names the moment and how the person felt.</div>':'<div class="feedback try">That sounds kind, but it does not tell us what the person did. Try again.</div>'}</div><div class="hero"><strong>Turn and talk:</strong> What two details make a thank-you meaningful? <em>Expected: the action and its effect.</em></div><p class="muted">Facilitator option: Invite students to improve “Thanks for helping” with a who/what/why detail.</p>`);break;
case 4:b=shell('Minutes 11–20 · Create','Build a thank-you card',`<p>Students can copy the sentence frame onto their paper cards or create and print one here. For private work, skip typing the person's full name.</p><div class="grid"><section><label class="field">Who are you thanking? <input id="person" maxlength="80" placeholder="e.g., My friend" value="${escapeHtml(state.person)}" oninput="field('person',this.value)"></label><label class="field">What specific thing did they do? <textarea id="moment" maxlength="400" placeholder="e.g., invited me to join their group" oninput="field('moment',this.value)">${escapeHtml(state.moment)}</textarea></label><label class="field">How did it help or make you feel? <textarea id="impact" maxlength="400" placeholder="e.g., I felt welcome instead of left out" oninput="field('impact',this.value)">${escapeHtml(state.impact)}</textarea></label><label class="field">Sign your card (optional) <input id="signature" maxlength="80" value="${escapeHtml(state.signature)}" oninput="field('signature',this.value)"></label><div class="actions"><button onclick="window.print()">Print card</button><button class="secondary" onclick="copyCard()">Copy words</button></div></section><section><strong>Live card preview</strong><div class="cardpreview" id="cardpreview"></div><div class="status" id="cardStatus"></div></section></div><div class="hero gold"><strong>Teaching support:</strong> Students can draw the moment, dictate it to a trusted adult, or use the sentence frame. Do not require disclosure of personal details.</div>`);break;
case 5:b=shell('Minutes 20–26 · Optional recording','Say it out loud',`<p class="lead">Practice reading your card slowly and kindly. You can make a recording, listen to it, or simply say it privately.</p><div class="hero"><strong>30–45 second voice guide:</strong><ol><li>Say who you're thanking.</li><li>Describe the specific action.</li><li>Tell them why it mattered.</li></ol></div><div class="toolbar noprint"><button id="recordButton" onclick="startRecording()">Start recording</button><button class="secondary" id="stopButton" onclick="stopRecording()" disabled>Stop recording</button><button class="ghost" onclick="readCard()">Read my card aloud (device voice)</button></div><div id="audioArea" class="noprint"></div><p class="status">Microphone recording requires a supported browser and a secure connection (HTTPS or localhost). The recording stays on this device unless you choose to save it. Leaving or refreshing the page can erase it. Never upload student recordings without school authorization.</p><div class="hero gold">Recording is recommended as an experience, but <b>not required</b>. Students may read privately to the teacher, whisper it, or keep the written card only.</div>`);break;
case 6:b=shell('Minutes 26–30 · Exit','Reflect on the experience',`<p class="lead">Which felt harder for you?</p><div class="chips"><button class="chip ${state.exitChoice==='Writing'?'selected':''}" onclick="chooseExit('Writing')">Writing it</button><button class="chip ${state.exitChoice==='Saying'?'selected':''}" onclick="chooseExit('Saying')">Saying it</button><button class="chip ${state.exitChoice==='Similar'?'selected':''}" onclick="chooseExit('Similar')">About the same</button><button class="chip ${state.exitChoice==='Pass'?'selected':''}" onclick="chooseExit('Pass')">Prefer not to say</button></div><label class="field">Why do you think that was? (optional) <textarea id="exitWhy" oninput="field('exitWhy',this.value)" placeholder="Write, talk with a partner, or pass.">${escapeHtml(state.exitWhy)}</textarea></label><div class="hero"><strong>Teacher debrief:</strong> “We can show gratitude in different ways. A specific thank-you helps someone understand the difference they made.”</div><h3>Quick assessment</h3><label class="check"><input type="checkbox"> Names a specific supportive action</label><label class="check"><input type="checkbox"> Explains why it mattered</label><label class="check"><input type="checkbox"> Participates through writing, speech, drawing, or supported response</label><p class="muted small">These are teacher-only, session-level checkboxes; do not treat them as individual student records.</p><div class="actions"><button onclick="go(0)">Back to lesson overview</button><button class="secondary" onclick="resetLesson()">Clear student work</button></div>`);break;}$('#panel').innerHTML=b;if(step===4)updateCard();if(step===5)audioUI()}
function answer(a){state.detective=a;render()}function field(k,v){state[k]=v;if(step===4)updateCard()}function cardText(){return `Dear ${state.person.trim()||'________'},\n\nThank you for ${state.moment.trim()||'____________________'}.\n\nIt mattered to me because ${state.impact.trim()||'____________________'}.\n\nFrom,\n${state.signature.trim()||'________'}`}
function updateCard(){let p=$('#cardpreview');if(p)p.textContent=cardText();let status=$('#cardStatus');if(status)status.textContent=(state.moment.trim()&&state.impact.trim())?'You included the action and why it mattered.':'Try to include what happened and why it mattered.'}function copyCard(){navigator.clipboard?.writeText(cardText()).then(()=>alert('Card words copied.')).catch(()=>alert('Select and copy the card words instead.'))}function chooseExit(v){state.exitChoice=v;render()}function resetLesson(){if(!confirm('Clear the card and reflection on this device?'))return;['person','moment','impact','signature','exitWhy'].forEach(k=>state[k]='');state.exitChoice='';state.detective=null;cleanupAudio();go(0)}
function audioUI(){let a=$('#audioArea');if(!a)return;a.innerHTML=recordedUrl?`<audio controls src="${recordedUrl}"></audio><div class="actions"><a href="${recordedUrl}" download="thank-you-message.webm"><button>Save recording</button></a><button class="ghost" onclick="cleanupAudio();audioUI()">Delete recording</button></div>`:'<p class="muted">No recording stored in this session.</p>'}
async function startRecording(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){alert('Microphone recording is not supported here. Students can read their cards aloud without recording.');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});recordMime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(m=>MediaRecorder.isTypeSupported(m))||'';chunks=[];recorder=new MediaRecorder(stream,recordMime?{mimeType:recordMime}:undefined);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{let blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(recordedUrl)URL.revokeObjectURL(recordedUrl);recordedUrl=URL.createObjectURL(blob);stream?.getTracks().forEach(t=>t.stop());stream=null;audioUI();let btn=$('#recordButton'),stop=$('#stopButton');if(btn){btn.disabled=false;btn.textContent='Record again'}if(stop)stop.disabled=true};recorder.start();$('#recordButton').disabled=true;$('#stopButton').disabled=false;$('#audioArea').textContent='Recording… Press Stop when finished.'}catch(e){alert('Microphone access was not available. You can still complete the written lesson.');stream?.getTracks().forEach(t=>t.stop());stream=null}}
function stopRecording(){if(recorder?.state==='recording')recorder.stop()}function cleanupAudio(){if(recorder?.state==='recording')recorder.stop();stream?.getTracks().forEach(t=>t.stop());stream=null;if(recordedUrl)URL.revokeObjectURL(recordedUrl);recordedUrl=null;chunks=[]}
function readCard(){if(!('speechSynthesis' in window)){alert('Device text-to-speech is unavailable.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(cardText());u.rate=.86;speechSynthesis.speak(u)}
window.addEventListener('beforeunload',()=>{stream?.getTracks().forEach(t=>t.stop());if(recordedUrl)URL.revokeObjectURL(recordedUrl)});render();
</script><p style="text-align:center;font:12px system-ui,sans-serif;opacity:.7;margin:22px 0">Demo · © The Alchemist Classroom</p></body></html>
