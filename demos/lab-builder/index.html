      me(`${items[k].label} average: ${uu(v)}`);\n      if (Math.abs(v - m) <= 0.15) { if (t === 1) first++; await say(\"leo\", \"Checks out!\"); break; }\n      if (t === 1) await say(\"leo\", `Hmm, I got something different. Add ${us.join(\" + \")} = ${sum}. Then divide by ${us.length}.`);\n      else { await say(\"maya\", `It's ${uu(r1(m))}. ${sum} ÷ ${us.length} = ${r1(m)}.`); break; }\n    }\n    avgs[k] = r1(m);\n  }\n  return { avgs, first };\n}\nasync function phPart(pi) {\n  const PT = LAB.parts[pi], SP = S.parts[pi], items = PT.items, nT = PT.measure.trials, un = PT.measure.unit;\n  const uu = v => un ? `${v} ${un}` : `${v}`;\n  SP.answers = [];\n  await say(\"maya\", `On to ${PT.title || \"the next part\"}!`);\n  if (PT.intro) await chat(lines(PT.intro));\n  if (PT.question) await say(\"deshawn\", `Our question: ${PT.question}`);\n  if (PT.guess.on) {\n    if (PT.guess.leoLine) await say(\"leo\", PT.guess.leoLine);\n    if (PT.guess.mayaLine) await say(\"maya\", PT.guess.mayaLine);\n    await say(\"deshawn\", `{name}, what's your guess? ${PT.guess.prompt || \"\"}`.trim());\n    const g = await askNumber(\"Your guess\", un); me(`My guess: ${uu(g)}`);\n    SP.guess = g; save(); renderSheet();\n  }\n  if (PT.procedure.length) await say(\"maya\", \"Here's how we do it:\\n\" + PT.procedure.map((s, i) => `${i + 1}. ${s}`).join(\"\\n\"));\n  const useSim = S.mode === \"sim\" && PT.sim.enabled;\n  if (useSim) {\n    if (!SP.simTrue) { SP.simTrue = items.map(it => Array.from({ length: nT }, () => rndInt(it.simMin, it.simMax))); save(); }\n    if (PT.sim.setupLine) await say(\"maya\", PT.sim.setupLine);\n    await say(\"deshawn\", \"Count in your head as you go. Every one counts!\");\n    for (let k = 0; k < items.length; k++) for (let i = 0; i < nT; i++) {\n      if (SP.data[k][i] != null) continue;\n      SP.data[k][i] = await counterTrial({ label: items[k].label, detail: items[k].detail, T: nT, unit: un, sim: PT.sim, who: \"You\" }, i, SP.simTrue[k][i]);\n      save(); renderSheet();\n    }\n  } else {\n    if (S.mode === \"sim\") await say(\"maya\", \"This part doesn't have an on-screen version, so we need the real materials. Ask your teacher for them.\");\n    if (PT.materials) await say(\"maya\", `Materials: ${PT.materials}.`);\n    await say(\"leo\", \"Type each count in the table as you go.\");\n    SP.data = await dataEntry(`Data table: ${PT.measure.what || \"results\"}${un ? \" (\" + un + \")\" : \"\"}`, items, nT, SP.data);\n    me(\"Here's our data: \" + items.map((it, k) => `${it.label}: ${SP.data[k].map(uu).join(\", \")}`).join(\". \") + \".\");\n    save(); renderSheet();\n  }\n  if (nT > 1) { await say(\"leo\", \"Time for averages again! Add up the trials, then divide.\"); const r = await askAverages(items, SP.data, uu); SP.averages = r.avgs; SP.avgFirst = r.first; }\n  else { SP.averages = SP.data.map(r => r[0]); }\n  save(); renderSheet();\n  if (SP.guess != null) {\n    const a = SP.averages[0], d = r1(Math.abs(a - SP.guess));\n    await say(\"deshawn\", `You guessed ${uu(SP.guess)}. Our average${items.length > 1 ? \" for \" + items[0].label : \"\"} was ${uu(a)}. ` + (d === 0 ? \"Right on!\" : `You were off by ${uu(d)}.`));\n  }\n  for (const q of PT.questions) {\n    await say(\"deshawn\", q);\n    const a = await askText({ label: q, multiline: true }); me(a);\n    SP.answers.push({ q, a }); save(); renderSheet();\n  }\n  if (PT.outro) await chat(lines(PT.outro));\n}\nasync function phQuestions() {\n  S.answers = []; S.classShown = null;\n  const CR = LAB.classResults;\n  if (CR.on && CR.rows.length) {\n    await say(\"leo\", CR.intro || \"Here's what the other groups in class got:\");\n    const rowsTxt = CR.rows.map(r => {\n      const parts = String(r).split(\":\"), name = parts.length > 1 ? parts[0].trim() : \"Group\";\n      const vals = (parts.length > 1 ? parts.slice(1).join(\":\") : parts[0]).split(\",\").map(x => x.trim());\n      return `${name}: ` + IT.map((it, k) => `${it.label} ${vals[k] ? u(vals[k]) : \"–\"}`).join(\", \");\n    });\n    rowsTxt.push(\"Our group: \" + IT.map((it, k) => `${it.label} ${S.averages ? u(S.averages[k]) : \"–\"}`).join(\", \"));\n    await say(\"leo\", rowsTxt.join(\"\\n\"));\n    S.classShown = rowsTxt; save();\n  }\n  if (LAB.questions.length) await say(\"deshawn\", \"Last science questions. Answer in full sentences.\");\n  for (const Q of LAB.questions) {\n    await say(\"deshawn\", Q.q);\n    let a = await askText({ label: Q.q, multiline: true }); me(a);\n    const kw = (Q.keywords || []).map(k => String(k).trim()).filter(Boolean);\n    if (kw.length && !kw.some(k => a.toLowerCase().includes(k.toLowerCase()))) {\n      await say(\"maya\", Q.hint || `Try using these words: ${kw.join(\", \")}.`);\n      a = await askText({ label: Q.q, multiline: true, value: a }); me(a);\n    }\n    S.answers.push({ q: Q.q, a }); save(); renderSheet();\n  }\n}\nfunction partsSheet() {\n  return LAB.parts.map((PT, pi) => {\n    const SP = S.parts[pi], nT = PT.measure.trials, has = SP.data.some(r => r.some(v => v != null));\n    const tbl = has ? `<div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Item<\/th>${Array.from({ length: nT }, (_, i) => `<th>T${i + 1}<\/th>`).join(\"\")}${nT > 1 ? \"<th>Avg<\/th>\" : \"\"}<\/tr><\/thead><tbody>` +\n      PT.items.map((it, k) => `<tr><td>${esc(it.label)}<\/td>${SP.data[k].map(v => `<td>${v ?? \"–\"}<\/td>`).join(\"\")}${nT > 1 ? `<td class=\"avg\">${SP.averages && SP.averages[k] != null ? SP.averages[k] : \"–\"}<\/td>` : \"\"}<\/tr>`).join(\"\") + `<\/tbody><\/table><\/div>` : `<p class=\"empty\">Not yet<\/p>`;\n    return `<div class=\"sec\"><h3>${esc(PT.title || \"Part \" + (pi + 2))}${PT.measure.unit ? \" (\" + esc(PT.measure.unit) + \")\" : \"\"}<\/h3>${PT.question ? `<p>${esc(PT.question)}<\/p>` : \"\"}${SP.guess != null ? `<p>Guess: <b>${esc(SP.guess)}<\/b><\/p>` : \"\"}${tbl}${SP.answers.map(x => `<p><b>${esc(x.q)}<\/b><br>${esc(x.a)}<\/p>`).join(\"\")}<\/div>`;\n  }).join(\"\");\n}\n\n/* ---------- analysis ---------- */\nfunction median(a) { const s = a.slice().sort((x, y) => x - y), m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }\nfunction findOutlier() {\n  if (S.mode === \"sim\" && mistakeOn()) return { item: +MS.item, trial: +MS.trial };\n  if (T < 3) return null;\n  let best = null;\n  S.data.forEach((v, k) => {\n    if (v.some(x => x == null)) return; const m = median(v), tol = Math.max(tick * 2, Math.abs(m) * 0.3);\n    v.forEach((x, i) => {\n      const others = v.filter((_, j) => j !== i), dev = Math.abs(x - m);\n      const spread = Math.max(...others) - Math.min(...others);\n      if (dev > tol && spread <= tol && (!best || dev > best.dev)) best = { item: k, trial: i, dev };\n    });\n  });\n  return best;\n}\nfunction used(k) { return S.data[k].filter((x, i) => !(S.outlier && S.outlier.status === \"dropped\" && S.outlier.item === k && S.outlier.trial === i)); }\nconst mean = a => a.reduce((s, x) => s + x, 0) / a.length;\nconst r1 = x => Math.round(x * 10) / 10;\nfunction winner() {\n  if (!S.averages) return null; const hi = LAB.measure.winner !== \"lowest\";\n  return S.averages.reduce((b, v, k) => (hi ? v > S.averages[b] : v < S.averages[b]) ? k : b, 0);\n}\n\nasync function phAnalyze() {\n  const o = findOutlier();\n  if (!o) { if (T >= 3) await say(\"deshawn\", \"I checked every row for weird numbers. The trials are close to each other. That's careful work.\"); S.outlier = null; }\n  else {\n    const val = S.data[o.item][o.trial];\n    S.outlier = { item: o.item, trial: o.trial, value: val, status: \"kept\" }; save(); renderSheet();\n    await say(\"deshawn\", `Wait. Look at ${lab(o.item)}, Trial ${o.trial + 1}. It's ${u(val)}. That's way different from the other trials.`);\n    if (S.mode === \"sim\" && mistakeOn()) await say(\"leo\", MS.confess || \"Uh... that might be my fault.\");\n    else await say(\"maya\", \"Did something go different on that trial? Maybe the timing or how we set it up?\");\n    let act = \"drop\";\n    if (decOn(\"outlier\")) act = (await decision(\"outlier\")).act || \"keep\";\n    else await say(\"deshawn\", \"Let's leave it out of the average and say why in our report.\");\n    if (act === \"redo\") {\n      let nv;\n      if (S.mode === \"sim\") { nv = rndTick(IT[o.item].simMin ?? SIM.min, IT[o.item].simMax ?? SIM.max); S.simTrue[o.item][o.trial] = nv; S.data[o.item][o.trial] = null; renderSheet(); nv = await simTrial(o.item, o.trial, nv, { quick: true }); }\n      else { await say(\"maya\", \"Redo it carefully, following our plan. Type the new number.\"); nv = await askNumber(`New reading for ${lab(o.item)}, Trial ${o.trial + 1}`); me(`New reading: ${u(nv)}`); }\n      S.data[o.item][o.trial] = nv; S.outlier.status = \"redone\"; S.outlier.newValue = nv;\n      await say(\"leo\", \"That looks way more like the others.\");\n    } else S.outlier.status = act === \"drop\" ? \"dropped\" : \"kept\";\n    save(); renderSheet();\n  }\n  S.averages = IT.map(() => null); S.avgFirstTry = 0;\n  if (T >= 2) await say(\"leo\", \"Now we find the average for each one. Add up the trials, then divide by how many trials you used. You can use a calculator.\");\n  for (let k = 0; k < NI; k++) {\n    const us = used(k), m = mean(us), sum = r1(us.reduce((a, b) => a + b, 0) * 10) / 10;\n    if (us.length === 1) { S.averages[k] = r1(m); S.avgFirstTry++; continue; }\n    for (let t = 1; t <= 3; t++) {\n      const v = await askNumber(`Average for ${lab(k)}: (${us.join(\" + \")}) ÷ ${us.length}`);\n      me(`${lab(k)} average: ${u(v)}`);\n      if (Math.abs(v - m) <= 0.15) { if (t === 1) S.avgFirstTry++; await say(\"leo\", \"Checks out!\"); break; }\n      if (t === 1) await say(\"leo\", `Hmm, I got something different. Add ${us.join(\" + \")} = ${sum}. Then divide by ${us.length}.`);\n      else { await say(\"maya\", `It's ${u(r1(m))}. ${sum} ÷ ${us.length} = ${r1(m)}.`); break; }\n    }\n    S.averages[k] = r1(m); save(); renderSheet();\n  }\n  const w = winner(); CTX.winner = w;\n  await say(\"maya\", \"Look at the bar graph on our lab sheet!\");\n  await say(\"deshawn\", `Our prediction was ${lab(S.prediction.item)}. Was it right?`);\n  const pc = await choose(\"Was your prediction correct?\", [{ label: \"Yes, it was right\", v: true }, { label: \"No, it was wrong\", v: false }]);\n  me(pc.label);\n  const actual = S.prediction.item === w;\n  S.predCheck = { said: pc.v, actual, winner: w };\n  if (pc.v === actual) await say(\"deshawn\", actual ? `Yep. ${lab(w)} ${LAB.measure.winnerPhrase}. Nice prediction.` : `Right. ${lab(w)} ${LAB.measure.winnerPhrase}, not ${lab(S.prediction.item)}. And that's totally fine.`);\n  else await say(\"deshawn\", `Look again at the graph. ${lab(w)} ${LAB.measure.winnerPhrase}, and our prediction was ${lab(S.prediction.item)}. So it was ${actual ? \"right\" : \"wrong\"}.`);\n  const lp = Math.min(NI - 1, +LAB.prediction.leoPick || 0);\n  if (w !== lp) await say(\"leo\", `Okay, okay. I was wrong about ${lab(lp)}. The data doesn't lie.`);\n  if (S.guess) {\n    const a = S.averages[S.guess.item], d = r1(Math.abs(a - S.guess.value));\n    await say(\"deshawn\", `You guessed ${u(S.guess.value)} for ${lab(S.guess.item)}. Our average was ${u(a)}. ` + (d === 0 ? \"Right on!\" : `You were off by ${u(d)}.`));\n  }\n  save(); renderSheet();\n}\n\nasync function phConclude() {\n  const w = winner(); CTX.winner = w;\n  const C = LAB.conclusion;\n  await say(\"deshawn\", `Time for our conclusion. We use Claim, Evidence, Reasoning. Claim first. ${C.claimQ}`);\n  for (let t = 1; t <= 2; t++) {\n    const c = await choose(\"Claim\", IT.map((_, k) => ({ label: labd(k), v: k })));\n    me(`${lab(c.v)}.`);\n    if (c.v === w) break;\n    if (t === 2) { await say(\"deshawn\", `Our data says ${lab(w)}. The claim has to match the data.`); break; }\n    await say(\"deshawn\", \"Check the graph again. Which one does our data point to?\");\n  }\n  await say(\"maya\", \"Now write the claim as a full sentence.\");\n  S.cer.claim = await askText({ label: \"Claim sentence\", multiline: true, starter: `${lab(w)} ` }); me(S.cer.claim);\n  await say(\"deshawn\", \"Evidence next. Use numbers from our data. Compare them.\");\n  S.cer.evidence = await askText({ label: \"Evidence (use numbers)\", multiline: true, starter: `${lab(w)} had an average of ` }); me(S.cer.evidence);\n  if (!/\\d/.test(S.cer.evidence)) {\n    await say(\"deshawn\", \"I don't see any numbers. Evidence needs data. Try adding our averages.\");\n    S.cer.evidence = await askText({ label: \"Evidence (use numbers)\", multiline: true, value: S.cer.evidence }); me(S.cer.evidence);\n  }\n  await say(\"maya\", `Last part is reasoning. ${C.reasoningHint}`);\n  S.cer.reasoning = await askText({ label: \"Reasoning (explain why)\", multiline: true, starter: `I think this happened because ` }); me(S.cer.reasoning);\n  const sw = (C.scienceWords || []).filter(Boolean).map(x => x.replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\"));\n  if (sw.length && !new RegExp(\"(\" + sw.join(\"|\") + \")\", \"i\").test(S.cer.reasoning)) {\n    await say(\"leo\", `Can you add a science word? Like ${C.scienceWords.slice(0, 3).join(\", \")}?`);\n    S.cer.reasoning = await askText({ label: \"Reasoning (explain why)\", multiline: true, value: S.cer.reasoning }); me(S.cer.reasoning);\n  }\n  save(); renderSheet();\n  if (!decOn(\"cer\")) return;\n  const nums = (S.cer.evidence.match(/\\d+(\\.\\d+)?/g) || []).length;\n  const hi = LAB.measure.winner !== \"lowest\";\n  const other = S.averages.reduce((b, v, k) => k === w ? b : (b == null || (hi ? v < S.averages[b] : v > S.averages[b]) ? k : b), null);\n  let target, critique, example;\n  if (nums < 2 && NI > 1) {\n    target = \"evidence\"; critique = \"Your evidence talks about one of them. How do we know it's the winner unless we compare it to the others?\";\n    example = `${lab(w)} had an average of ${u(S.averages[w])}. ` + IT.map((_, k) => k).filter(k => k !== w).map(k => `${lab(k)} had ${u(S.averages[k])}`).join(\" and \") + \".\";\n  } else if (words(S.cer.reasoning) < 14) {\n    target = \"reasoning\"; critique = \"Your reasoning is a good start. Can you explain more about WHY it happened?\";\n    example = `${lab(w)} ${LAB.measure.winnerPhrase}. ${IT[w].why || \"\"}`.trim();\n  } else {\n    target = \"evidence\"; critique = other != null ? `This is strong. One more idea: can you say how big the difference was between ${lab(w)} and ${lab(other)}?` : \"This is strong. Can you add one more detail from our data?\";\n    example = other != null ? `${lab(w)} had ${u(r1(Math.abs(S.averages[w] - S.averages[other])))} ${hi ? \"more\" : \"less\"} than ${lab(other)}.` : `Our average was ${u(S.averages[w])}.`;\n  }\n  await say(\"deshawn\", critique);\n  const D = LAB.decisions.cer;\n  const exChoice = D.choices.find(c => c.act === \"example\");\n  if (exChoice && !exChoice.react) exChoice.react = \"Deshawn: Sure. Something like: “\" + example.replace(/\\n/g, \" \") + \"”\";\n  const d = await decision(\"cer\");\n  if (d.act === \"revise\" || d.act === \"example\") {\n    const nv = await askText({ label: target === \"evidence\" ? \"Revise your evidence\" : \"Revise your reasoning\", multiline: true, value: S.cer[target] });\n    me(nv); S.cer.revised = nv !== S.cer[target]; S.cer[target] = nv;\n    await say(\"deshawn\", S.cer.revised ? \"Way better. That's a conclusion I'd believe.\" : \"Okay. We'll keep it how it is.\");\n  }\n  save(); renderSheet();\n}\n\nconst RATE_Q = [[\"listen\", \"I listened to my teammates' ideas.\"], [\"share\", \"I shared my own ideas.\"], [\"disagree\", \"When I disagreed, I was respectful.\"], [\"evidence\", \"I used evidence to make decisions.\"]];\nconst RATE_L = [\"Not yet\", \"Sometimes\", \"Mostly\", \"Always\"];\nasync function phReflect() {\n  await say(\"maya\", \"Last step before our report. Let's think about how our team worked together. Be honest. There are no wrong answers.\");\n  S.ratings = await new Promise(res => {\n    const c = card(\"Rate yourself\"), val = {};\n    const box = document.createElement(\"div\"); box.className = \"rate\";\n    const go = document.createElement(\"button\"); go.className = \"btn\"; go.type = \"button\"; go.textContent = \"Done\"; go.disabled = true; go.style.marginTop = \"12px\";\n    RATE_Q.forEach(([k, q]) => {\n      const row = document.createElement(\"div\"); row.className = \"rate-row\";\n      row.innerHTML = `<p>${esc(q)}<\/p><div class=\"opts\" role=\"group\" aria-label=\"${esc(q)}\">` + RATE_L.map((l, i) => `<button type=\"button\" aria-pressed=\"false\" data-v=\"${i + 1}\"><b>${i + 1}<\/b>${l}<\/button>`).join(\"\") + \"<\/div>\";\n      row.querySelectorAll(\"button\").forEach(b => b.onclick = () => { row.querySelectorAll(\"button\").forEach(x => x.setAttribute(\"aria-pressed\", \"false\")); b.setAttribute(\"aria-pressed\", \"true\"); val[k] = +b.dataset.v; go.disabled = Object.keys(val).length < RATE_Q.length; });\n      box.appendChild(row);\n    });\n    go.onclick = () => { clearReply(); res(val); };\n    c.append(box, go); scrollDown();\n  });\n  me(\"My ratings: \" + RATE_Q.map(([k, q]) => `${q.replace(/^I /, \"\").replace(/\\.$/, \"\")}: ${S.ratings[k]}`).join(\"; \") + \".\");\n  save();\n  await say(\"deshawn\", \"What's one group decision you made today, and why did you make it?\");\n  const a = await askText({ label: \"One decision and why\", multiline: true }); me(a);\n  await say(\"leo\", \"What would you do differently next time you work in a group?\");\n  const b = await askText({ label: \"Next time I would...\", multiline: true }); me(b);\n  S.reflect = { decision: a, next: b };\n  await say(\"maya\", \"And how are you feeling right now, at the end of the lab?\");\n  const f = await choose(\"How are you feeling?\", [\"Proud\", \"Good\", \"Okay\", \"Tired\", \"Frustrated\", \"Confused\"].map(x => ({ label: x })));\n  S.feeling = f.label; me(`I feel ${f.label.toLowerCase()}.`);\n  if (/Frustrated|Confused/.test(f.label)) await say(\"maya\", \"Thanks for telling us. That's good for your teacher to know. You still finished the whole lab.\");\n  save(); renderSheet();\n}\n\n/* ---------- report + send ---------- */\nfunction fmtTime(sec) { const m = Math.round(sec / 60); return m < 1 ? \"less than 1 min\" : m + \" min\"; }\nfunction buildReport() {\n  const d = new Date(), L = [], date = `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`;\n  const brk = S.breaks.length ? ` (${S.breaks.length} break${S.breaks.length > 1 ? \"s\" : \"\"}, ${fmtTime(S.breaks.reduce((a, b) => a + b, 0))})` : \"\";\n  L.push(`SOLO LAB REPORT: ${CONFIG.labTitle.toUpperCase()}`, `Question: ${LAB.question}`, \"\",\n    `Student: ${fullName()}`, `Role: ${ROLES[S.role]?.name || \"-\"}`, `Date: ${date}`,\n    `Lab mode: ${S.mode === \"sim\" ? \"On-screen simulation\" : \"Real materials\"}`, `Time on task: ${fmtTime(S.activeSec)}${brk}`, \"\");\n  L.push(\"PREDICTION\", labd(S.prediction.item), `\"${S.prediction.reason}\"`);\n  if (S.guess) L.push(`Number guess for ${lab(S.guess.item)}: ${u(S.guess.value)} (our average: ${S.averages ? u(S.averages[S.guess.item]) : \"-\"})`);\n  L.push(\"\");\n  const tr = n => n === 1 ? \"1st try\" : `${n} tries`, V = LAB.variables;\n  L.push(\"VARIABLES\");\n  if (V.ivCorrect) L.push(`Independent variable: ${tr(S.varTries.iv)}`);\n  if (V.dvCorrect) L.push(`Dependent variable: ${tr(S.varTries.dv)}`);\n  if (V.constants.length) L.push(`Constants: ${tr(S.varTries.constants)}`);\n  L.push(\"\");\n  if (S.fair) L.push(\"FAIR TEST CHECK (Leo's unfair plan)\", `Found ${S.fair.found.length} of ${S.fair.total} problems.` + (S.fair.missed.length ? ` Missed: ${S.fair.missed.join(\"; \")}.` : \"\"), ...(T >= 2 ? [`Why ${T} trials: ${tr(S.whyTrials)}`] : []), \"\");\n  L.push(`DATA (${LAB.measure.what}${UNIT ? \", \" + UNIT : \"\"})`);\n  IT.forEach((it, k) => {\n    const vals = S.data[k].map((v, i) => {\n      const o = S.outlier && S.outlier.item === k && S.outlier.trial === i;\n      return o && S.outlier.status === \"redone\" ? `${v} (redo; first ${S.outlier.value})` : o ? `${v}*` : `${v}`;\n    });\n    L.push(`${labd(k)}: ${vals.join(\", \")}${T > 1 ? ` -> average ${u(S.averages[k])}` : \"\"}`);\n  });\n  if (S.outlier) L.push(`* Outlier found in ${lab(S.outlier.item)}, Trial ${S.outlier.trial + 1}. Decision: ${{ dropped: \"left it out of the average\", redone: \"redid the trial\", kept: \"kept it in the average\" }[S.outlier.status]}.`);\n  else if (T >= 3) L.push(\"No outliers found.\");\n  if (T > 1) L.push(`Averages correct on 1st try: ${S.avgFirstTry} of ${NI}`);\n  if (S.mode === \"sim\") L.push(`${INSTR[SIM.instrument].name[0].toUpperCase() + INSTR[SIM.instrument].name.slice(1)} readings correct on 1st try: ${S.readings.first} of ${S.readings.total}`);\n  L.push(`Result: ${lab(S.predCheck.winner)} ${LAB.measure.winnerPhrase}. Prediction was ${S.predCheck.actual ? \"correct\" : \"not correct\"}; student judged this ${S.predCheck.said === S.predCheck.actual ? \"correctly\" : \"incorrectly\"}.`, \"\");\n  L.push(\"CONCLUSION (CER)\", `Claim: ${S.cer.claim}`, `Evidence: ${S.cer.evidence}`, `Reasoning: ${S.cer.reasoning}`);\n  if (decOn(\"cer\")) L.push(`Revised after teammate feedback: ${S.cer.revised ? \"yes\" : \"no\"}`);\n  L.push(\"\");\n  if (S.decisions.length) {\n    L.push(\"GROUP DECISIONS\");\n    S.decisions.forEach((x, i) => { L.push(`${i + 1}. ${x.moment} [${x.skill}: ${x.quality.toUpperCase()}]`, `   Said: \"${x.choice}\"`); if (x.first) L.push(`   First tried: \"${x.first}\" (teammate redirected)`); });\n    L.push(\"\");\n  }\n  LAB.parts.forEach((PT, pi) => {\n    const SP = S.parts[pi], un = PT.measure.unit;\n    L.push((PT.title || `Part ${pi + 2}`).toUpperCase());\n    if (PT.question) L.push(`Question: ${PT.question}`);\n    if (SP.guess != null) L.push(`Guess: ${SP.guess}${un ? \" \" + un : \"\"}`);\n    PT.items.forEach((it, k) => L.push(`${it.label}: ${SP.data[k].join(\", \")}${PT.measure.trials > 1 && SP.averages ? ` -> average ${SP.averages[k]}` : \"\"}${un ? \" \" + un : \"\"}`));\n    if (PT.measure.trials > 1) L.push(`Averages correct on 1st try: ${SP.avgFirst} of ${PT.items.length}`);\n    SP.answers.forEach(x => L.push(`Q: ${x.q}`, `A: ${x.a}`));\n    L.push(\"\");\n  });\n  if (S.classShown) L.push(\"OTHER GROUPS' RESULTS (shown to student)\", ...S.classShown, \"\");\n  if (S.answers && S.answers.length) { L.push(\"QUESTIONS\"); S.answers.forEach((x, i) => L.push(`${i + 1}. ${x.q}`, `   ${x.a}`)); L.push(\"\"); }\n  L.push(\"SELF-RATING (1 = not yet, 4 = always)\");\n  RATE_Q.forEach(([k, q]) => L.push(`${q} ${S.ratings[k]}`));\n  L.push(\"\", \"REFLECTION\", `One decision and why: ${S.reflect.decision}`, `Next time I would: ${S.reflect.next}`, `Feeling at the end: ${S.feeling}`);\n  return L.join(\"\\n\");\n}\nfunction subject() { const d = new Date(); return `Solo Lab Report - ${CONFIG.labTitle} - ${fullName()} - ${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`; }\nfunction mailLinks() { return { gm: \"#\", ol: \"#\", mt: \"#\", longNote: \"\" }; }\nconst okEmail = () => true;\nfunction sendCard(finished) {\n  const rep = buildReport(), su = subject();\n  let to = CONFIG.teacherEmail || S.temail || \"\";\n  let L = mailLinks(to || \"teacher@example.org\", rep, su);\n  const c = card(finished ? \"Your report\" : \"Check your report, then send it\");\n  c.insertAdjacentHTML(\"beforeend\", `<pre class=\"report\" id=\"rep\" tabindex=\"0\">${esc(rep)}<\/pre><div id=\"longNote\">${L.longNote}<\/div>\n    <div id=\"askTo\" ${to ? \"hidden\" : \"\"}><label class=\"hint\" for=\"toIn\" style=\"display:block;margin:0 0 6px\"><b>Type ${esc(CONFIG.teacherLabel)}'s email address.<\/b> Ask if you're not sure.<\/label>\n    <div class=\"row\"><input id=\"toIn\" type=\"email\" autocomplete=\"off\" placeholder=\"teacher@yourschool.org\" style=\"flex:1;min-width:220px;padding:10px 12px;border-radius:10px;border:1px solid #c9c4d6;font:inherit\">\n    <button class=\"btn\" type=\"button\" id=\"toSave\">Save email<\/button><\/div><p class=\"hint\" id=\"toMsg\" aria-live=\"polite\"><\/p><\/div>\n    <p style=\"margin:0 0 10px\" id=\"toLine\" ${to ? \"\" : \"hidden\"}>It goes to ${esc(CONFIG.teacherLabel)}: <span class=\"addr\" id=\"toAddr\">${esc(to)}<\/span><\/p>\n    <div class=\"row\" id=\"sendRow\" ${to ? \"\" : \"hidden\"}><a class=\"btn big\" id=\"gm\" href=\"${L.gm}\" target=\"_blank\" rel=\"noopener\">Send with Gmail<\/a>\n    <a class=\"btn big\" id=\"ol\" href=\"${L.ol}\" target=\"_blank\" rel=\"noopener\">Send with Outlook<\/a>\n    <button class=\"btn ghost\" type=\"button\" id=\"cp\">Copy report<\/button><\/div>\n    <p class=\"hint\" id=\"sendHint\" ${to ? \"\" : \"hidden\"}>Use the button for the email your school uses. It opens in a new tab with your report filled in. Check it, then press <b>Send<\/b>. Neither one? <a id=\"mt\" href=\"${L.mt}\">Try another email app<\/a>, or copy the report and paste it into an email.<\/p>\n    <p class=\"hint\" id=\"cpmsg\" aria-live=\"polite\"><\/p>\n    ${finished ? \"\" : `<div class=\"row\" style=\"margin-top:10px\"><button class=\"btn\" type=\"button\" id=\"sent\" disabled>I pressed Send<\/button><\/div>`}`);\n  const unlock = () => { const s = c.querySelector(\"#sent\"); if (s) s.disabled = false; };\n  [\"#gm\", \"#ol\", \"#mt\"].forEach(id => c.querySelector(id).addEventListener(\"click\", unlock));\n  c.querySelector(\"#toSave\").onclick = () => {\n    const v = c.querySelector(\"#toIn\").value.trim();\n    if (!okEmail(v)) { c.querySelector(\"#toMsg\").textContent = \"That doesn't look like a full email address. It needs an @ and a dot.\"; return; }\n    to = v; S.temail = v; save(); L = mailLinks(to, rep, su);\n    c.querySelector(\"#gm\").href = L.gm; c.querySelector(\"#ol\").href = L.ol; c.querySelector(\"#mt\").href = L.mt;\n    c.querySelector(\"#toAddr\").textContent = to;\n    [\"#toLine\", \"#sendRow\", \"#sendHint\"].forEach(id => c.querySelector(id).hidden = false);\n    c.querySelector(\"#askTo\").hidden = true;\n  };\n  c.querySelector(\"#cp\").onclick = async () => {\n    const m = c.querySelector(\"#cpmsg\");\n    try { await navigator.clipboard.writeText(rep); m.textContent = \"Copied. Paste it into your email.\"; }\n    catch (e) { const r = document.createRange(); r.selectNodeContents(c.querySelector(\"#rep\")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); m.textContent = \"The report is selected. Press Ctrl+C to copy it.\"; }\n    unlock();\n  };\n  return c;\n}\nasync function phSend() {\n  await say(\"leo\", \"I'm the Recorder, so I put together our report! Check it over, then send it to your teacher.\");\n  await new Promise(res => { const c = sendCard(false); c.querySelector(\"#sent\").onclick = () => { clearReply(); res(); }; });\n  me(\"I sent our report!\");\n  S.sent = true; save();\n  await chat([[\"maya\", `Thanks for being on our team, {name}. You kept us organized.`], [\"deshawn\", \"And you backed up your ideas with evidence. That's the whole point of science.\"], [\"leo\", \"Best lab group ever. Same team next time?\"]]);\n}\nfunction doneView() {\n  const c = sendCard(true);\n  c.insertAdjacentHTML(\"afterbegin\", `<div class=\"done-banner\" style=\"margin:0 0 14px\"><h3>Lab complete<\/h3><p style=\"margin:0\">Nice work, ${esc(nm())}. If your email didn't send, use the buttons below to try again.<\/p><\/div>`);\n}\n\nconst PHASES = [\n  { label: \"Team\", run: phTeam }, { label: \"Predict\", run: phPredict }, { label: \"Variables\", run: phVariables },\n  { label: \"Plan\", run: phPlan }, { label: \"Test\", run: phTest }, { label: \"Analyze\", run: phAnalyze },\n  { label: \"Conclude\", run: phConclude },\n  ...LAB.parts.map((p, i) => ({ label: p.short || `Part ${i + 2}`, run: () => phPart(i) })),\n  ...((LAB.questions.length || (LAB.classResults.on && LAB.classResults.rows.length)) ? [{ label: \"Questions\", run: phQuestions }] : []),\n  { label: \"Reflect\", run: phReflect }, { label: \"Send\", run: phSend }\n];\n\n/* ---------- lab sheet ---------- */\nfunction renderSteps() { $(\"#steps\").innerHTML = PHASES.map((p, i) => `<li class=\"${i < S.phase ? \"done\" : i === S.phase ? \"now\" : \"\"}\"${i === S.phase ? ' aria-current=\"step\"' : \"\"}>${p.label}<\/li>`).join(\"\"); }\nfunction chartSVG() {\n  const a = S.averages; if (!a || a.some(x => x == null)) return \"\";\n  const lo = Math.min(0, ...a), mx = Math.max(...a), step = niceStep(mx - lo), top = Math.max(step, Math.ceil(mx / step) * step), bot = Math.floor(lo / step) * step;\n  const W = 300, H = 170, x0 = 38, y0 = 140, h = 120, gap = (W - x0 - 8) / NI, bw = Math.min(56, gap * .7), w = winner();\n  const yv = v => y0 - (v - bot) / (top - bot) * h;\n  let g = \"\";\n  for (let v = bot; v <= top + 1e-9; v += step) { const y = yv(v); g += `<line class=\"ax\" x1=\"${x0}\" x2=\"${W - 6}\" y1=\"${y}\" y2=\"${y}\"/><text x=\"${x0 - 6}\" y=\"${y + 4}\" text-anchor=\"end\">${fmt(v)}<\/text>`; }\n  a.forEach((v, k) => {\n    const x = x0 + gap * k + (gap - bw) / 2, yt = Math.min(yv(v), yv(0)), bh = Math.abs(yv(v) - yv(0));\n    const tag = (IT[k].label.split(/\\s+/).pop() || \"\").slice(0, 8);\n    g += `<rect x=\"${x}\" y=\"${yt}\" width=\"${bw}\" height=\"${bh}\" rx=\"3\" style=\"fill:${k === w ? \"var(--accent)\" : \"var(--accent-soft)\"}\"/>`;\n    g += `<text x=\"${x + bw / 2}\" y=\"${yt - 5}\" text-anchor=\"middle\">${fmt(v)}<\/text><text x=\"${x + bw / 2}\" y=\"${y0 + 16}\" text-anchor=\"middle\">${esc(tag)}<\/text>`;\n  });\n  return `<svg class=\"chart\" viewBox=\"0 0 ${W} ${H}\" width=\"100%\" role=\"img\" aria-label=\"Bar graph of averages\"><text x=\"4\" y=\"12\" style=\"font-size:10px;fill:var(--muted)\">${esc(UNIT)}<\/text>${g}<\/svg>`;\n}\nfunction niceStep(r) { r = Math.max(r, 1e-6); const raw = r / 5, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }\nfunction renderSheet() {\n  const sh = $(\"#sheet\"), E = t => `<p class=\"empty\">${t}<\/p>`;\n  const pred = S.prediction ? `<p><b>${esc(lab(S.prediction.item))}.<\/b> ${esc(S.prediction.reason)}<\/p>` : E(\"Not yet\");\n  const V = LAB.variables;\n  const vars = S.varsDone ? (V.ivCorrect ? `<p><b>Change (independent):<\/b> ${esc(V.ivCorrect)}<\/p>` : \"\") + (V.dvCorrect ? `<p><b>Measure (dependent):<\/b> ${esc(V.dvCorrect)}<\/p>` : \"\") + (V.constants.length ? `<p><b>Keep the same:<\/b> ${esc(V.constants.join(\"; \"))}<\/p>` : \"\") : E(\"Not yet\");\n  const plan = S.planFixed && LAB.procedure.length ? `<ol style=\"margin:0;padding-left:20px;font-size:.88rem\">${LAB.procedure.map(s => `<li>${esc(s)}<\/li>`).join(\"\")}<\/ol>` : E(\"Not yet\");\n  const hasData = S.data.some(r => r.some(v => v != null));\n  let table = E(\"Not yet\");\n  if (hasData) {\n    table = `<div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Item<\/th>${Array.from({ length: T }, (_, i) => `<th>T${i + 1}<\/th>`).join(\"\")}${T > 1 ? \"<th>Avg<\/th>\" : \"\"}<\/tr><\/thead><tbody>` +\n      IT.map((it, k) => `<tr><td>${esc(it.label)}<\/td>` + S.data[k].map((v, i) => {\n        const o = S.outlier && S.outlier.item === k && S.outlier.trial === i;\n        const cls = o ? (S.outlier.status === \"dropped\" ? \"drop\" : S.outlier.status === \"redone\" ? \"\" : \"out\") : \"\";\n        return `<td class=\"${cls}\">${v ?? \"–\"}<\/td>`;\n      }).join(\"\") + (T > 1 ? `<td class=\"avg\">${S.averages && S.averages[k] != null ? S.averages[k] : \"–\"}<\/td>` : \"\") + `<\/tr>`).join(\"\") + `<\/tbody><\/table><\/div>` +\n      (S.outlier ? `<p class=\"hint\">${esc(lab(S.outlier.item))}, trial ${S.outlier.trial + 1}: ${{ kept: \"outlier (kept)\", dropped: \"left out of the average\", redone: `redone (first try was ${u(S.outlier.value)})` }[S.outlier.status]}<\/p>` : \"\");\n  }\n  const cer = S.cer.claim ? `<p><b>Claim:<\/b> ${esc(S.cer.claim)}<\/p>${S.cer.evidence ? `<p><b>Evidence:<\/b> ${esc(S.cer.evidence)}<\/p>` : \"\"}${S.cer.reasoning ? `<p><b>Reasoning:<\/b> ${esc(S.cer.reasoning)}<\/p>` : \"\"}` : E(\"Not yet\");\n  const dec = S.decisions.length ? `<ul class=\"dlist\">` + S.decisions.map(d => `<li><span class=\"tag ${d.quality}\">${esc(d.skill)}<\/span><br>${esc(d.moment)}<\/li>`).join(\"\") + `<\/ul>` : E(\"Your group decisions will show up here.\");\n  const cols = Math.min(NI, 3);\n  sh.innerHTML = `<div class=\"shead\"><h2>Lab Sheet<\/h2><p class=\"q\">${esc(LAB.question)}<\/p>\n    <div class=\"meta\"><span>Name: <b>${esc(fullName()) || \"–\"}<\/b><\/span><span>Role: <b>${esc(ROLES[S.role]?.name || \"–\")}<\/b><\/span><span>Mode: <b>${S.mode ? (S.mode === \"sim\" ? \"Simulation\" : \"Real materials\") : \"–\"}<\/b><\/span><\/div><\/div>\n    <div class=\"sbody\">\n    <div class=\"sec\"><h3>What we're testing<\/h3><div class=\"towels\" style=\"grid-template-columns:repeat(${cols},minmax(0,1fr))\">${IT.map(it => `<div class=\"tw\"><b>${esc(it.label)}<\/b>${esc(it.detail || \"\")}${it.desc ? `<br><span style=\"color:var(--muted)\">${esc(it.desc)}<\/span>` : \"\"}<\/div>`).join(\"\")}<\/div><\/div>\n    <div class=\"sec\"><h3>Prediction<\/h3>${pred}${S.guess ? `<p>Guess for ${esc(lab(S.guess.item))}: <b>${esc(u(S.guess.value))}<\/b><\/p>` : \"\"}<\/div>\n    <div class=\"sec\"><h3>Variables<\/h3>${vars}<\/div>\n    <div class=\"sec\"><h3>Procedure<\/h3>${plan}<\/div>\n    <div class=\"sec\"><h3>Data${UNIT ? \" (\" + esc(UNIT) + \")\" : \"\"}<\/h3>${table}${chartSVG()}<\/div>\n    <div class=\"sec\"><h3>Conclusion<\/h3>${cer}<\/div>\n    ${partsSheet()}${S.answers && S.answers.length ? `<div class=\"sec\"><h3>Questions<\/h3>${S.answers.map(x => `<p><b>${esc(x.q)}<\/b><br>${esc(x.a)}<\/p>`).join(\"\")}<\/div>` : \"\"}<div class=\"sec\"><h3>Teamwork<\/h3>${dec}<\/div><\/div>`;\n}\n\n/* ---------- controls ---------- */\nfunction applySettings() {\n  $(\"#tRead\").setAttribute(\"aria-pressed\", S.settings.read); $(\"#tBig\").setAttribute(\"aria-pressed\", S.settings.big);\n  document.body.classList.toggle(\"big\", !!S.settings.big); $(\"#tSpeed\").value = S.settings.speed;\n}\n$(\"#tRead\").onclick = () => { S.settings.read = !S.settings.read; if (!S.settings.read) { try { speechSynthesis.cancel(); } catch (e) { } speakDone && speakDone(); } save(); applySettings(); };\n$(\"#tBig\").onclick = () => { S.settings.big = !S.settings.big; save(); applySettings(); };\n$(\"#tSpeed\").onchange = e => { S.settings.speed = e.target.value; save(); };\n$(\"#sheetToggle\").onclick = () => $(\"#sheet\").classList.toggle(\"closed\");\nlet resetArmed = null;\n$(\"#tReset\").onclick = e => {\n  const b = e.currentTarget;\n  if (!resetArmed) { b.textContent = \"Tap again to erase everything\"; resetArmed = setTimeout(() => { b.textContent = \"Start over\"; resetArmed = null; }, 4000); return; }\n  try { localStorage.removeItem(KEY); } catch (x) { }\n  location.reload();\n};\nlet brkStart = 0, brkTimer = null;\n$(\"#tBreak\").onclick = () => {\n  onBreak = true; brkStart = Date.now(); try { speechSynthesis.cancel(); } catch (e) { } speakDone && speakDone();\n  $(\"#brk\").hidden = false; $(\"#brkDone\").focus();\n  const orb = $(\"#orb\"); let inhale = true; orb.textContent = \"breathe in\";\n  brkTimer = setInterval(() => {\n    const s = Math.floor((Date.now() - brkStart) / 1000);\n    $(\"#brkTime\").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, \"0\")}`;\n    if (s % 4 === 0) { orb.textContent = inhale ? \"breathe in\" : \"breathe out\"; inhale = !inhale; }\n  }, 1000);\n};\n$(\"#brkDone\").onclick = () => {\n  clearInterval(brkTimer); $(\"#brk\").hidden = true; onBreak = false;\n  S.breaks.push(Math.round((Date.now() - brkStart) / 1000)); save();\n  const w = breakWaiters; breakWaiters = []; w.forEach(f => f());\n};\nsetInterval(() => { if (!onBreak && !document.hidden && S.phase < PHASES.length && S.first) { S.activeSec++; if (S.activeSec % 10 === 0) save(); } }, 1000);\n\nfunction renderTeam() { $(\"#team\").innerHTML = Object.entries(PEOPLE).map(([k, p]) => `<div class=\"mate\"><div class=\"av ${k}\" aria-hidden=\"true\">${p.name[0]}<\/div><div>${p.name}<small>${p.role}<\/small><\/div><\/div>`).join(\"\"); }\nfunction restore() { S.transcript.forEach(m => thread.appendChild(m.plan ? planBubble() : bubble(m.who, m.text))); }\n\nasync function main() {\n  document.title = CONFIG.labTitle; $(\"#labTitle\").textContent = CONFIG.labTitle;\n  $(\"#labSub\").textContent = \"Solo Lab Partners\" + (LAB.subtitle ? \" · \" + LAB.subtitle : \"\");\n  applySettings(); renderTeam();\n  if (NI < 2) { reply.innerHTML = `<div class=\"err\">This lab needs at least 2 things to test. Open it in Lab Builder to fix it.<\/div>`; return; }\n  if (S.phase < PHASES.length) { S.transcript = S.transcript.slice(0, S.phaseTLen); S.decisions = S.decisions.filter(d => d.phase < S.phase); }\n  if (S.prediction) CTX.pick = S.prediction.item;\n  if (S.averages && S.averages.every(x => x != null)) CTX.winner = winner();\n  restore(); renderSteps(); renderSheet();\n  try {\n    for (let i = S.phase; i < PHASES.length; i++) {\n      S.phase = i; S.phaseTLen = S.transcript.length; save(); renderSteps(); renderSheet();\n      await PHASES[i].run();\n    }\n    S.phase = PHASES.length; save(); renderSteps();\n    doneView();\n  } catch (e) {\n    console.error(e);\n    reply.innerHTML = `<div class=\"err\">Something went wrong: ${esc(e.message)}. Your work is saved. Reload the page to keep going.<\/div>`;\n  }\n}\nmain();\n\n<\/script>\n<p style=\"text-align:center;font-size:12px;color:#777;margin:24px 0\">Made with Lab Builder · © The Alchemist Classroom<\/p>";

const STORE = "solo-lab-builder-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const slug = s => (String(s || "lab").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "lab").slice(0, 40);
const newId = t => slug(t) + "-" + Math.random().toString(36).slice(2, 7);

let DB = null;
try { DB = JSON.parse(localStorage.getItem(STORE)); } catch (e) { DB = null; }
if (!DB || !DB.labs || !Object.keys(DB.labs).length) {
  const L = clone(DEFAULT_LAB); DB = { labs: { [L.id]: L }, current: L.id };
}
const STARTERS = [DEFAULT_LAB, WATER_LAB, LAVA_LAB];
DB.seeded = DB.seeded || Object.keys(DB.labs).filter(id => STARTERS.some(x => x.id === id));
STARTERS.forEach(L => { if (!DB.seeded.includes(L.id)) { if (!DB.labs[L.id]) DB.labs[L.id] = clone(L); DB.seeded.push(L.id); } });
if (!DB.labs[DB.current]) DB.current = Object.keys(DB.labs)[0];
let lab = DB.labs[DB.current];
let saveT = null;
function persist(msg) {
  try { (()=>{})(STORE, JSON.stringify(DB)); $("#status").textContent = msg || "Demo: changes aren't saved"; }
  catch (e) { $("#status").textContent = "Couldn't save in this browser. Use “Save lab file” to keep a copy."; }
}
function scheduleSave() { $("#status").textContent = "Saving…"; clearTimeout(saveT); saveT = setTimeout(() => { persist(); updateChecks(); }, 400); }

function blankLab() {
  const L = clone(DEFAULT_LAB);
  Object.assign(L, {
    id: newId("new-lab"), title: "New lab", subtitle: DEFAULT_LAB.subtitle, question: "", materials: "", modes: "real",
    items: ["A", "B", "C"].map(x => ({ label: "Item " + x, detail: "", desc: "", why: "", simMin: 0, simMax: 10 })),
    measure: { what: "", unit: "", trials: 3, winner: "highest", winnerPhrase: "had the highest result", maxReasonable: 0 },
    prediction: { prompt: "", starter: "I think {pick} will win because ", leoPick: 0, leoLine: "", mayaPick: 1, mayaLine: "" },
    variables: { ivCorrect: "", ivWrong: [], ivHint: "", dvCorrect: "", dvWrong: [], dvHint: "", constants: [], decoys: [] },
    plan: { steps: [], problems: [], fine: [], fineNote: "" },
    procedure: [],
    conclusion: { claimQ: "", reasoningHint: "Explain WHY it happened. Use science words.", scienceWords: [] },
    introLines: "", classResults: { on: false, intro: "", rows: [] }, questions: [], parts: []
  });
  L.prediction.guess = { on: false, prompt: "", item: 0, leoLine: "", mayaLine: "" };
  L.sim = Object.assign(clone(DEFAULT_LAB.sim), { enabled: false, setupLine: "", readTip: "", steps: [{ label: "Start the test", seconds: 10 }], finalStep: "Measure it" });
  L.sim.mistake = Object.assign(L.sim.mistake, { enabled: false, item: 0, trial: 1, note: "Whoa! Leo rushed that one!", leoLine: "Uh... was that okay?", confess: "That might be my fault. I rushed it." });
  return L;
}

/* ---------- path helpers ---------- */
function get(path) { return path.split(".").reduce((o, k) => (o == null ? o : o[k]), lab); }
function set(path, v) {
  const ks = path.split("."); let o = lab;
  for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {}; o = o[ks[i]]; }
  o[ks[ks.length - 1]] = v;
}

/* ---------- field builders ---------- */
const help = h => h ? `<small>${h}</small>` : "";
const uid = p => "f-" + p.replace(/\./g, "-");
function fText(p, label, h = "", o = {}) { return `<label class="f${o.wide ? " wide" : ""}"><span>${label}</span><input id="${uid(p)}" data-path="${p}" data-t="text" value="${esc(get(p) ?? "")}"${o.ph ? ` placeholder="${esc(o.ph)}"` : ""}${o.rr ? ` data-rr="${o.rr}"` : ""}>${help(h)}</label>`; }

function fLines(p, label, h = "", o = {}) { return `<label class="f${o.narrow ? "" : " wide"}"><span>${label}</span><textarea id="${uid(p)}" data-path="${p}" data-t="lines"${o.tall ? ' class="tall"' : ""}${o.ph ? ` placeholder="${esc(o.ph)}"` : ""}>${esc((get(p) || []).join("\n"))}</textarea>${help(h || "One per line.")}</label>`; }
function fNum(p, label, h = "", o = {}) { return `<label class="f"><span>${label}</span><input id="${uid(p)}" type="number" step="${o.step || "any"}" data-path="${p}" data-t="num" value="${get(p) ?? ""}"${o.rr ? ` data-rr="${o.rr}"` : ""}>${help(h)}</label>`; }
function fSel(p, label, opts, h = "", o = {}) {
  const v = get(p);
  return `<label class="f"><span>${label}</span><select id="${uid(p)}" data-path="${p}" data-t="${o.num ? "numsel" : "text"}"${o.rr ? ` data-rr="${o.rr}"` : ""}>${opts.map(([val, t]) => `<option value="${esc(val)}"${String(val) === String(v) ? " selected" : ""}>${esc(t)}</option>`).join("")}</select>${help(h)}</label>`;
}
function fBool(p, label, o = {}) { return `<label class="tog"><input type="checkbox" id="${uid(p)}" data-path="${p}" data-t="bool"${get(p) !== false && get(p) ? " checked" : ""}${o.rr ? ` data-rr="${o.rr}"` : ""}> ${label}</label>`; }

/* ---------- render ---------- */
function renderAll() {
  $("#form").innerHTML = SECTIONS.map(s => `<section class="sec" id="${s.id}" aria-labelledby="h-${s.id}"><h2 id="h-${s.id}">${s.title}</h2><p class="lead">${s.lead}</p><div class="body">${s.render()}</div></section>`).join("");
  renderPick(); updateChecks(); wireExport();
}
function renderSection(id) {
  const s = SECTIONS.find(x => x.id === id); if (!s) return;
  const el = $(`#${id} .body`); const y = window.scrollY;
  el.innerHTML = s.render(); if (id === "export") wireExport();
  window.scrollTo(0, y); updateChecks();
}
function renderPick() {
  $("#labPick").innerHTML = Object.values(DB.labs).sort((a, b) => (a.title || "").localeCompare(b.title || "")).map(l => `<option value="${esc(l.id)}"${l.id === DB.current ? " selected" : ""}>${esc(l.title || "Untitled lab")}</option>`).join("");
}

/* ---------- binding ---------- */
function onField(e) {
  const el = e.target, p = el.dataset.path; if (!p) return;
  const t = el.dataset.t; let v;
  if (t === "bool") v = el.checked;
  else if (t === "num") v = el.value === "" ? null : parseFloat(el.value);
  else if (t === "numsel") v = parseInt(el.value);
  else if (t === "lines") v = el.value.split("\n").map(x => x.trim()).filter(Boolean);
  else v = el.value;
  set(p, v);
  if (p === "title") renderPick();
  scheduleSave();
  const rr = el.dataset.rr;
  if (rr && (e.type === "change" || t === "bool" || t === "numsel")) {
    if (rr === "all") { const y = window.scrollY; const f = el.id; renderAll(); window.scrollTo(0, y); const n = document.getElementById(f); n && n.focus({ preventScroll: true }); }
    else renderSection(rr);
  }
}
$("#form").addEventListener("input", onField);
$("#form").addEventListener("change", e => { if (e.target.dataset.rr) onField(e); });
let delPartArm = null;
function blankPart(n) {
  return { title: `Part ${n + 2}`, short: "", intro: "", question: "", guess: { on: false, prompt: "", leoLine: "", mayaLine: "" },
    items: [{ label: "Item A", detail: "", simMin: 0, simMax: 10 }], measure: { what: "", unit: "", trials: 3 }, materials: "", procedure: [],
    sim: { enabled: false, style: "clips", button: "", countQ: "", spillNote: "", setupLine: "" }, questions: [], outro: "" };
}
$("#form").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, i = +b.dataset.i, k = b.dataset.k;
  if (a === "addItem" && lab.items.length < 5) { const n = lab.items.length; lab.items.push({ label: "Item " + String.fromCharCode(65 + n), detail: "", desc: "", why: "", simMin: lab.sim.min, simMax: lab.sim.max }); }
  if (a === "delItem" && lab.items.length > 2) {
    lab.items.splice(i, 1);
    ["leoPick", "mayaPick"].forEach(f => { if (lab.prediction[f] >= lab.items.length) lab.prediction[f] = 0; });
    if (lab.sim.mistake.item >= lab.items.length) lab.sim.mistake.item = 0;
  }
  if (a === "addStep") lab.sim.steps.push({ label: "", seconds: 10 });
  if (a === "delStep") { lab.sim.steps.splice(i, 1); if (lab.sim.mistake.step >= lab.sim.steps.length) lab.sim.mistake.step = 0; }
  if (a === "addChoice") lab.decisions[k].choices.push({ text: "", quality: "strong", act: (DEC_META[k][3] || [[""]])[0][0], react: "" });
  if (a === "delChoice" && lab.decisions[k].choices.length > 1) lab.decisions[k].choices.splice(i, 1);
  if (a === "addPart") { lab.parts = lab.parts || []; lab.parts.push(blankPart(lab.parts.length)); }
  if (a === "delPart") { delPartArm = delPartArm === i ? null : i; if (delPartArm === i) { b.textContent = "Click again to remove"; return; } lab.parts.splice(i, 1); }
  if (a === "addPartItem") lab.parts[i].items.push({ label: "", detail: "", simMin: 0, simMax: 10 });
  if (a === "delPartItem" && lab.parts[i].items.length > 1) lab.parts[i].items.splice(+b.dataset.k, 1);
  if (a === "addQ") { lab.questions = lab.questions || []; lab.questions.push({ q: "", hint: "", keywords: [] }); }
  if (a === "delQ") lab.questions.splice(i, 1);
  persist(); const y = window.scrollY; renderAll(); window.scrollTo(0, y);

/* ---------- checks ---------- */
function validate() {
  const out = [], E = (sec, msg) => out.push({ sec, lvl: "err", msg }), W = (sec, msg) => out.push({ sec, lvl: "warn", msg });
  if (!lab.title) E("basics", "Give the lab a title.");
  if (!lab.question) E("basics", "Write the lab question.");
  if (!lab.teacherEmail) W("basics", "No email yet: students will type yours when they send their report. Add it here so they don't have to.");
  else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(lab.teacherEmail)) E("basics", "Your email doesn't look complete.");
  if ((lab.modes === "sim" || lab.modes === "both") && !lab.sim.enabled) W("basics", "Students can't pick the simulation until you turn it on. For now they'll use real materials.");
  if (lab.modes !== "sim" && !lab.materials) W("basics", "Add a materials list for the real lab.");
  if (lab.items.length < 2) E("items", "Add at least 2 things to test.");
  const names = lab.items.map(i => (i.label || "").trim());
  if (names.some(n => !n)) E("items", "Every item needs a name.");
  if (new Set(names.map(n => n.toLowerCase())).size !== names.length) E("items", "Two items have the same name.");
  if (lab.items.some(i => !i.why)) W("items", "Add a “why” sentence to each item so Deshawn can give a reasoning example.");
  if (!lab.measure.what) W("measure", "Say what students measure.");
  if (!lab.measure.winnerPhrase) E("measure", "Write the winner phrase.");
  const P = lab.prediction;
  if (P.leoPick === P.mayaPick) W("predict", "Leo and Maya predict the same item, so there's less to disagree about.");
  if (!P.prompt) W("predict", "Write the prediction question.");
  if (!lab.variables.ivCorrect && !lab.variables.dvCorrect && !lab.variables.constants.length) W("vars", "No variable questions. This part will be skipped.");
  if (lab.variables.ivCorrect && !lab.variables.ivWrong.length) W("vars", "Add wrong choices for the independent variable.");
  if (lab.variables.dvCorrect && !lab.variables.dvWrong.length) W("vars", "Add wrong choices for the dependent variable.");
  if (lab.plan.steps.length && !lab.plan.problems.length) E("plan", "Leo's plan has steps but no problems marked.");
  if (!lab.plan.steps.length) W("plan", "No unfair plan. This part will be skipped.");
  if (!lab.procedure.length) W("procedure", "Add the fair procedure so it shows on the lab sheet.");
  const S = lab.sim;
  if (S.enabled) {
    if (!(S.max > S.min)) E("sim", "The scale's end must be bigger than its start.");
    if (!(S.tick > 0)) E("sim", "The small-line size must be more than 0.");
    else if ((S.max - S.min) / S.tick > 150) E("sim", "Too many small lines to read (over 150). Make each small line bigger.");
    lab.items.forEach(it => {
      if (it.simMin == null || it.simMax == null) E("items", `${it.label}: set the simulation result range.`);
      else if (it.simMin > it.simMax) E("items", `${it.label}: the lowest result is bigger than the highest.`);
      else if (it.simMin < S.min || it.simMax > S.max) E("items", `${it.label}: its simulation range doesn't fit on the instrument (${S.min} to ${S.max}).`);
    });
    if (S.mistake.enabled) {
      if (S.mistake.trial >= lab.measure.trials) E("sim", "The planted mistake is on a trial that doesn't exist.");
      if (lab.measure.trials < 2) W("sim", "With only 1 trial, the mistake can't be compared to other trials.");
      if (S.mistake.min < S.min || S.mistake.max > S.max || S.mistake.min > S.mistake.max) E("sim", "The planted mistake's result range doesn't fit on the instrument.");
    }
  }
  Object.entries(lab.decisions).forEach(([k, D]) => {
    if (!D.on || !DEC_META[k]) return;
    const cs = D.choices.filter(c => c.text && c.text.trim());
    if (!cs.length) E("decisions", `${DEC_META[k][0]}: add at least one choice.`);
    else if (!cs.some(c => c.quality !== "weak")) E("decisions", `${DEC_META[k][0]}: needs at least one choice that isn't Weak.`);
  });
  if (!lab.conclusion.claimQ) W("conclusion", "Write the claim question.");
  if (S.enabled && S.instrument === "counter" && lab.measure.unit === "") W("measure", "Add a unit, like drops or clips.");
  if (lab.prediction.guess && lab.prediction.guess.on && !lab.prediction.guess.prompt) W("predict", "Write the number-guess question.");
  (lab.parts || []).forEach((PT, p) => {
    const nmP = PT.title || `Part ${p + 2}`;
    if (!PT.items.length || PT.items.some(it => !(it.label || "").trim())) E("parts", `${nmP}: every item needs a name.`);
    if (!PT.question) W("parts", `${nmP}: write the question.`);
    if (PT.sim && PT.sim.enabled && PT.items.some(it => it.simMin == null || it.simMax == null || it.simMin > it.simMax || it.simMin < 0)) E("parts", `${nmP}: check the simulation low and high numbers.`);
    if (lab.modes !== "real" && lab.sim.enabled && !(PT.sim && PT.sim.enabled)) W("parts", `${nmP}: no simulation, so students in simulation mode will need real materials for this part.`);
  });
  if (lab.classResults && lab.classResults.on && !(lab.classResults.rows || []).length) W("questions", "Add at least one group's results, or turn that off.");
  (lab.questions || []).forEach((Q, j) => { if (!(Q.q || "").trim()) E("questions", `Question ${j + 1} is empty.`); });
  return out;
}
function updateChecks() {
  const v = validate();
  $("#nav").innerHTML = SECTIONS.map(s => {
    const lv = v.filter(x => x.sec === s.id);
    const cls = s.id === "export" ? "" : lv.some(x => x.lvl === "err") ? "err" : lv.length ? "warn" : "ok";
    return `<a href="#${s.id}">${s.title}${cls ? `<i class="dot ${cls}" aria-label="${cls === "ok" ? "ready" : cls === "err" ? "needs a fix" : "check this"}"></i>` : ""}</a>`;
  }).join("");
  const box = $("#checks"); if (!box) return;
  const errs = v.filter(x => x.lvl === "err");
  box.innerHTML = v.length ? v.map(x => `<li class="${x.lvl}"><b>${x.lvl === "err" ? "Fix" : "Check"}</b> <span>${esc(SECTIONS.find(s => s.id === x.sec).title)}: ${esc(x.msg)}</span></li>`).join("") : `<li class="ok"><b>Ready</b> <span>No problems found.</span></li>`;
  ["#bCopy", "#bDownload", "#bShow"].forEach(id => { const b = $(id); if (b) b.disabled = errs.length > 0; });
  if (errs.length && $("#exMsg")) $("#exMsg").textContent = "Fix the red items before exporting.";
  else if ($("#exMsg") && $("#exMsg").textContent === "Fix the red items before exporting.") $("#exMsg").textContent = "";
}

/* ---------- export ---------- */
function exportHTML(l) {
  if (!l || !l.__preview) return '';
  const json = JSON.stringify(l).replace(/</g, "\\u003c");
  const title = esc(l.title || "Science Lab");
  return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
    PLAYER_TPL.replace("__LAB_JSON__", () => json).replace(/__LAB_TITLE__/g, () => title) + "</html>";
}
const DL = (window.claude && typeof window.claude.use === "function") ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null);
async function download(name, text, type) {
  $("#status").textContent = "Saving lab files is in the full version."; return "declined";
  const dl = await DL;
  if (dl) {
    try { await dl.save({ filename: name, data: new Blob([text], { type }) }); return "saved"; }
    catch (e) { return e && e.code === "declined" ? "declined" : false; }
  }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return "saved";
  } catch (e) { return false; }
}
function wireExport() {
  const say = () => { $("#exMsg").textContent = "Copying and downloading your lab are in the full version. Use Preview to try it as a student."; };
  ["#bCopy", "#bDownload", "#bShow"].forEach(id => { const el = $(id); if (el) el.onclick = say; });
  updateChecks();
}
function openPreview() {
  const errs = validate().filter(x => x.lvl === "err");
  if (errs.length) { location.hash = "export"; $("#exMsg") && ($("#exMsg").textContent = "Fix the red items first, then preview."); return; }
  $("#pvFrame").srcdoc = exportHTML(Object.assign(clone(lab), { __preview: true }));
  $("#pv").hidden = false; $("#pvClose").focus();
}
$("#bPreview").onclick = openPreview;
$("#pvRestart").onclick = openPreview;
$("#pvClose").onclick = () => { $("#pv").hidden = true; $("#pvFrame").srcdoc = ""; };
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#pv").hidden) $("#pvClose").click(); });

/* ---------- library ---------- */
function switchTo(id) { DB.current = id; lab = DB.labs[id]; persist(); renderAll(); window.scrollTo(0, 0); }
$("#labPick").onchange = e => switchTo(e.target.value);
$("#bNew").onclick = () => { const L = blankLab(); L.teacherEmail = lab.teacherEmail; L.teacherLabel = lab.teacherLabel; DB.labs[L.id] = L; switchTo(L.id); $("#status").textContent = "New lab created"; };
$("#bDup").onclick = () => { const L = clone(lab); L.id = newId(L.title); L.title = (L.title || "Lab") + " (copy)"; DB.labs[L.id] = L; switchTo(L.id); $("#status").textContent = "Copy created"; };
let delArm = null;
$("#bDel").onclick = e => {
  const b = e.currentTarget;
  if (!delArm) { b.textContent = "Click again to delete"; delArm = setTimeout(() => { b.textContent = "Delete"; delArm = null; }, 4000); return; }
  clearTimeout(delArm); delArm = null; b.textContent = "Delete";
  delete DB.labs[DB.current];
  if (!Object.keys(DB.labs).length) { const L = clone(DEFAULT_LAB); DB.labs[L.id] = L; }
  switchTo(Object.keys(DB.labs)[0]); $("#status").textContent = "Lab deleted";
};
$("#bSave").onclick = async () => {
  const r = await download(slug(lab.title) + ".lab.json", JSON.stringify({ soloLab: 1, lab }, null, 2), "application/json");
  $("#status").textContent = r === "saved" ? `Saved ${slug(lab.title)}.lab.json` : r === "declined" ? "Save canceled" : "Couldn't save a file here. Your lab is still kept in this browser.";
};
$("#fOpen").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text()); const L = data.lab || data;
    if (!L || !Array.isArray(L.items) || !L.decisions) throw new Error("not a lab file");
    if (!L.id || DB.labs[L.id]) { L.id = newId(L.title); if (Object.values(DB.labs).some(x => x.title === L.title)) L.title += " (opened)"; }
    DB.labs[L.id] = L; switchTo(L.id); $("#status").textContent = `Opened ${f.name}`;
  } catch (x) { $("#status").textContent = "That file isn't a Lab Builder lab file."; }
  e.target.value = "";
};

renderAll();

</script>

</body></html>
