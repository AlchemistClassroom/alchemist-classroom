<style>
:root{
  --bg:#EDF2F4; --paper:#FFFFFF; --paper-2:#F6F9FA; --ink:#16242E; --muted:#55687A; --line:#D2DCE2;
  --accent:#0B7C72; --accent-ink:#FFFFFF; --accent-tint:#E1F2EF;
  --amber:#B8741A; --amber-tint:#FBEFD9; --good:#2E7D4F; --good-tint:#E3F3E8; --warn:#B24A1C; --warn-tint:#FBE6DC;
  --maya:#7A4FB0; --deshawn:#2463A8; --leo:#C2561A;
  --shadow:0 1px 2px rgba(22,36,46,.06),0 4px 14px rgba(22,36,46,.06);
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F171C; --paper:#172229; --paper-2:#1C2931; --ink:#E3ECF0; --muted:#94A7B5; --line:#2A3A44;
    --accent:#3FC1B2; --accent-ink:#0B1A1D; --accent-tint:#173430;
    --amber:#E8A94E; --amber-tint:#3A2C15; --good:#6CCB8F; --good-tint:#16301F; --warn:#F08D62; --warn-tint:#3A2016;
    --maya:#B797E3; --deshawn:#82B2EA; --leo:#F09A62;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F171C; --paper:#172229; --paper-2:#1C2931; --ink:#E3ECF0; --muted:#94A7B5; --line:#2A3A44;
  --accent:#3FC1B2; --accent-ink:#0B1A1D; --accent-tint:#173430;
  --amber:#E8A94E; --amber-tint:#3A2C15; --good:#6CCB8F; --good-tint:#16301F; --warn:#F08D62; --warn-tint:#3A2016;
  --maya:#B797E3; --deshawn:#82B2EA; --leo:#F09A62;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 60px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px;padding-block:10px}
.top-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.45rem;margin:0}
.brand span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.88rem}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--paper);color:var(--warn);border:1px solid var(--warn)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.labsel{display:flex;gap:6px;align-items:center;font-size:.85rem}
.labsel select{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 10px;max-width:260px}
.status{font-size:.78rem;color:var(--muted)}

.main{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;margin-top:18px;align-items:start}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:2px}
.nav a{color:var(--ink);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:.88rem;display:flex;justify-content:space-between;gap:6px}
.nav a:hover{background:var(--paper)}
.nav a .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.dot.ok{background:var(--good)}.dot.warn{background:var(--amber)}.dot.err{background:var(--warn)}
@media (max-width:860px){.main{grid-template-columns:1fr}.nav{position:static;flex-direction:row;flex-wrap:wrap}}

.sec{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:var(--shadow);scroll-margin-top:90px}
.sec>h2{font-family:var(--display);font-weight:800;font-size:1.2rem;margin:0 0 2px}
.sec>.lead{color:var(--muted);font-size:.88rem;margin:0 0 14px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f>span{font-size:.8rem;font-weight:600}
.f>small{font-size:.76rem;color:var(--muted)}
.f input,.f textarea,.f select{width:100%;border:1.5px solid var(--line);background:var(--paper-2);border-radius:8px;padding:8px 10px}
.f textarea{min-height:70px;resize:vertical}
.f textarea.tall{min-height:120px}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--accent);outline:none}
.tog{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--accent)}
.sub{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper-2);margin-top:12px}
.sub h3{margin:0 0 10px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.items{display:grid;gap:12px}
.item-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper-2)}
.item-card h3{margin:0 0 10px;font-family:var(--display);font-size:1rem;display:flex;justify-content:space-between;align-items:center}
.choice{border-left:4px solid var(--line);padding:10px 12px;background:var(--paper);border-radius:0 10px 10px 0;margin-top:10px}
.choice.strong{border-left-color:var(--good)}.choice.okay{border-left-color:var(--amber)}.choice.weak{border-left-color:var(--warn)}
.choice .grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.dec{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.dec.off{opacity:.6}
.dec>header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.dec>header h3{margin:0;font-size:1rem}
.dec>header p{margin:2px 0 0;font-size:.8rem;color:var(--muted);max-width:60ch}
.tokens{font-size:.8rem;background:var(--amber-tint);border:1px solid var(--amber);border-radius:10px;padding:8px 12px;margin-bottom:10px}
code{font-family:var(--mono);font-size:.82em;background:var(--paper-2);padding:1px 5px;border-radius:5px;border:1px solid var(--line)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;padding:6px 10px;border-radius:8px}
.checks li.err{background:var(--warn-tint);color:var(--warn)}
.checks li.warn{background:var(--amber-tint);color:var(--amber)}
.checks li.ok{background:var(--good-tint);color:var(--good)}
.export-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.steps-help{margin:10px 0 0;padding-left:20px;font-size:.88rem}
.codebox{width:100%;min-height:120px;font-family:var(--mono);font-size:.72rem;border:1px solid var(--line);border-radius:8px;background:var(--paper-2);padding:8px}
.msg{font-size:.85rem;margin-top:8px;min-height:1.2em}
.pv{position:fixed;inset:0;z-index:60;background:rgba(10,18,24,.6);display:flex;flex-direction:column;padding:12px}
.pv-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);border-radius:12px 12px 0 0;padding:8px 12px;flex-wrap:wrap}
.pv-bar b{font-family:var(--display)}
.pv iframe{flex:1;width:100%;border:none;background:var(--bg);border-radius:0 0 12px 12px}
.simrow{display:grid;grid-template-columns:minmax(0,2fr) 90px 36px;gap:8px;align-items:end;margin-top:6px}
</style>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand"><h1>Lab Builder</h1><span>Solo Lab Partners · teacher only</span></div>
      <div class="bar">
        <label class="labsel">Lab <select id="labPick" aria-label="Choose a lab"></select></label>
        <button class="btn ghost" id="bNew">New</button>
        <button class="btn ghost" id="bDup">Duplicate</button>
        <button class="btn danger" id="bDel">Delete</button>
      </div>
    </div>
    <div class="top-row" style="margin-top:8px">
      <div class="bar">
        <button class="btn ghost" id="bSave">Save lab file</button>
        <label class="btn ghost" for="fOpen" style="cursor:pointer">Open lab file</label>
        <input type="file" id="fOpen" accept=".json,.lab,application/json" hidden>
        <span class="status" id="status">Demo: changes aren't saved</span>
      </div>
      <div class="bar">
        <button class="btn ghost" id="bPreview">Preview as student</button>
        <a class="btn" href="#export">Export</a>
      </div>
    </div>
  </header>

  <div class="main">
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div id="form"></div>
  </div>
</div>

<div class="pv" id="pv" hidden>
  <div class="pv-bar"><span><b>Student preview</b> · nothing is saved or sent</span><div class="bar"><button class="btn ghost sm" id="pvRestart">Restart</button><button class="btn sm" id="pvClose">Close preview</button></div></div>
  <iframe id="pvFrame" title="Student preview"></iframe>
</div>

<script>
const DEFAULT_LAB = {
  "schema": 1,
  "id": "paper-towel",
  "title": "Paper Towel Lab",
  "subtitle": "Grade 6 Science",
  "question": "Which paper towel absorbs the most water?",
  "teacherEmail": "",
  "teacherLabel": "your teacher",
  "modes": "both",
  "materials": "3 kinds of paper towels, scissors, a ruler, a cup of room-temperature water, a graduated cylinder, and a timer",
  "items": [
    { "label": "Towel A", "detail": "Budget 1-ply", "desc": "Thin. One layer.", "why": "It is thin, but its loose fibers leave some gaps for water to fill.", "simMin": 8, "simMax": 10 },
    { "label": "Towel B", "detail": "Thick 2-ply", "desc": "Two layers with quilted bumps.", "why": "It has two layers. The space between the layers and all the fibers give water more places to go.", "simMin": 19, "simMax": 22 },
    { "label": "Towel C", "detail": "Recycled 1-ply", "desc": "One layer. Rough and a little stiff.", "why": "Its rough fibers have lots of tiny gaps that can hold water.", "simMin": 12, "simMax": 15 }
  ],
  "measure": {
    "what": "how much water each towel soaks up",
    "unit": "mL",
    "trials": 3,
    "winner": "highest",
    "winnerPhrase": "soaked up the most water",
    "maxReasonable": 60
  },
  "prediction": {
    "prompt": "Which towel will soak up the most water?",
    "starter": "I think {pick} will soak up the most because ",
    "leoPick": 0,
    "leoLine": "Easy. Towel A wins. It's the thinnest, so water gets in faster!",
    "mayaPick": 1,
    "mayaLine": "Hmm. I think Towel B. It has two layers."
  },
  "variables": {
    "ivCorrect": "The type of paper towel",
    "ivWrong": ["The amount of water in the cup", "How much water gets soaked up"],
    "ivHint": "Think about what we're comparing. What's different between Towel A, B, and C?",
    "dvCorrect": "How much water each towel soaks up, in mL",
    "dvWrong": ["The color of each towel", "The type of paper towel"],
    "dvHint": "The thing we measure is the result. What number will we write in our data table?",
    "constants": ["The size of the towel square", "How long it soaks in the water", "The water temperature", "How long it drips before we squeeze", "How we squeeze out the water"],
    "decoys": ["The kind of paper towel"]
  },
  "plan": {
    "steps": [
      "Cut a BIG piece of Towel B and a small piece of Towel A. Towel C can be any size.",
      "Dunk Towel A for 5 seconds. Dunk Towel B for 30 seconds because it's thicker.",
      "Use cold water for Towel A and warm water for Towel C.",
      "Squeeze each towel into the graduated cylinder and read it in mL.",
      "Do it one time for each towel. Done!"
    ],
    "problems": ["The towel pieces are different sizes", "The towels soak for different amounts of time", "The water temperature is different", "Only one trial for each towel"],
    "fine": ["Squeezing the water into the graduated cylinder", "Measuring in mL"],
    "fineNote": "Squeezing into the cylinder and measuring in mL are fine, as long as we do it the same way every time."
  },
  "procedure": [
    "Cut a 10 cm × 10 cm square of the towel.",
    "Dip it in room-temperature water for 10 seconds.",
    "Hold it up to drip for 10 seconds.",
    "Squeeze it into the graduated cylinder.",
    "Read the bottom of the curved water line in mL.",
    "Do 3 trials for each towel."
  ],
  "conclusion": {
    "claimQ": "Which towel was the most absorbent?",
    "reasoningHint": "WHY did that towel soak up more? Try science words like layers, fibers, space, or thickness.",
    "scienceWords": ["layer", "fiber", "space", "gap", "thick", "ply", "hole", "texture", "rough", "air", "pocket", "absorb"]
  },
  "sim": {
    "enabled": true,
    "instrument": "cylinder",
    "min": 0,
    "max": 30,
    "tick": 1,
    "setupLine": "The on-screen lab is set up. Each towel is a 10 cm by 10 cm square. The water is room temperature.",
    "readTip": "Read the bottom of the curved water line.",
    "steps": [{ "label": "Dip it in the water", "seconds": 10 }, { "label": "Let it drip", "seconds": 10 }],
    "finalStep": "Squeeze into the cylinder",
    "mistake": {
      "enabled": true,
      "item": 1,
      "trial": 1,
      "step": 0,
      "stopAt": 3,
      "min": 10,
      "max": 12,
      "note": "Whoa! Leo pulled it out at 3 seconds!",
      "leoLine": "Uh... was that too short? It's fine, right?",
      "confess": "That might be my fault. It came out of the water at 3 seconds instead of 10."
    }
  },
  "decisions": {
    "predict": {
      "on": true,
      "prompt": "How do you answer {rival}?",
      "choices": [
        { "text": "You might be right, {rival}. We have different ideas, and that's okay. Let's test it and let the data decide.", "quality": "strong", "react": "Rival: Deal. May the best one win.\nDeshawn: That's how scientists do it. Nobody has to be right yet." },
        { "text": "I hear you, {rival}, but I still think my reason makes sense. The test will show us.", "quality": "strong", "react": "Rival: Fair. We'll see!" },
        { "text": "No, you're wrong. Your idea doesn't make sense.", "quality": "weak", "react": "Rival: Oh. Okay...\nMaya: Hey, that kind of shut them down. Can you try saying it another way?" },
        { "text": "Fine, whatever. We'll just use your prediction.", "quality": "weak", "react": "Deshawn: Wait. You don't have to drop your idea just because someone disagrees. What do YOU want to say?" }
      ]
    },
    "feedback": {
      "on": true,
      "prompt": "How do you tell Leo his plan needs fixing?",
      "choices": [
        { "text": "Leo, you did the hard part by writing it down. Some steps aren't fair yet. Can we fix them together?", "quality": "strong", "react": "Leo: Yeah, okay. I kind of rushed it. Let's fix it." },
        { "text": "Every towel needs the same chance, so size, soak time, and water have to match. And we need more trials.", "quality": "strong", "react": "Leo: Oh. That makes sense. Same chance for every one." },
        { "text": "This plan is terrible, Leo.", "quality": "weak", "react": "Leo: Wow. Thanks a lot.\nMaya: Leo worked on that. Tell him what's wrong and how to fix it, without calling it terrible." }
      ]
    },
    "turns": {
      "on": true,
      "setup": "Maya: Okay, I'll do the testing. I'm the careful one.\nLeo: No fair! I never get to do the fun part!\nMaya: Last time you spilled water everywhere.\nLeo: That was ONE time.\nDeshawn: {name}, can you help us sort this out?",
      "prompt": "What do you say?",
      "choices": [
        { "text": "Let's take turns. We'll each test a different towel, and everyone watches the timer.", "quality": "strong", "act": "share", "react": "Maya: Okay. That's fair.\nLeo: Yes! I'll be SO careful." },
        { "text": "Leo, what would help you be careful this time? Maya, what are you worried about?", "quality": "strong", "act": "share", "react": "Leo: Um... I could go slower and use the timer.\nMaya: I just don't want to redo everything. If Leo uses the timer, he can take a turn.\nDeshawn: Nice. You got them to listen to each other." },
        { "text": "I'll just do all of it myself.", "quality": "okay", "act": "self", "react": "Maya: I guess that works...\nLeo: Aw. Can I at least hold the timer?\nDeshawn: It's fine this time. Just remember, teammates want a part too." },
        { "text": "Maya is more careful, so Leo can't do it.", "quality": "weak", "act": "share", "react": "Leo: ...fine.\nDeshawn: Leo looks pretty left out. Is there a way where everyone gets a part?" }
      ]
    },
    "skip": {
      "on": true,
      "setup": "Leo: Hey, can we just do ONE trial for each one? We already know who's gonna win.",
      "prompt": "What do you tell Leo?",
      "choices": [
        { "text": "We planned more than one trial so one mistake won't fool us. Let's stick to our plan.", "quality": "strong", "react": "Leo: Ugh, you're right. We'll do them all." },
        { "text": "We don't actually know yet. That's why we're testing.", "quality": "strong", "react": "Deshawn: Good point. If we already knew, we wouldn't need a lab." },
        { "text": "Okay, one trial is fine.", "quality": "weak", "react": "Deshawn: Hold on. Remember why we said we need more than one trial?" }
      ]
    },
    "outlier": {
      "on": true,
      "prompt": "What should we do with that number?",
      "choices": [
        { "text": "Let's redo that trial the right way.", "quality": "strong", "act": "redo", "react": "Deshawn: Good call. Same plan, same timing." },
        { "text": "Let's leave it out of the average and explain why in our report.", "quality": "strong", "act": "drop", "react": "Deshawn: That works. We know it broke our plan, and we'll say so. Being honest about it is what matters." },
        { "text": "Just keep it. A number is a number.", "quality": "weak", "act": "keep", "react": "Deshawn: But we know that trial didn't follow our plan. If we keep it, our average will be off. What else could we do?" },
        { "text": "Change it to a number that looks right.", "quality": "weak", "act": "keep", "react": "Deshawn: Whoa. That's making up data. Scientists never do that, even when a number looks wrong. What could we do instead?" }
      ]
    },
    "cer": {
      "on": true,
      "prompt": "How do you respond?",
      "choices": [
        { "text": "Good point. Let me revise it.", "quality": "strong", "act": "revise", "react": "" },
        { "text": "Can you show me what you mean?", "quality": "strong", "act": "example", "react": "" },
        { "text": "No. It's fine the way it is.", "quality": "weak", "act": "none", "react": "Maya: Deshawn is trying to help make our work better. Feedback isn't an attack. Want to try again?" }
      ]
    }
  }

\", mayaLine: \"\" }, p.guess || {});\n    p.sim = Object.assign({ enabled: false, style: \"clips\", button: \"\", countQ: \"\", spillNote: \"\", setupLine: \"\" }, p.sim || {});\n    p.procedure = p.procedure || []; p.questions = (p.questions || []).filter(Boolean);\n    return p;\n  });\n  L.modes = L.modes || \"both\";\n  if (!L.sim.enabled) L.modes = \"real\";\n  return L;\n}\nconst CONFIG = { teacherEmail: LAB.teacherEmail || \"\", teacherLabel: LAB.teacherLabel || \"your teacher\", labTitle: LAB.title || \"Science Lab\" };\nconst PREVIEW = !!LAB.__preview;\nconst KEY = \"solo-lab-\" + (LAB.id || \"lab\");\nconst IT = LAB.items, NI = IT.length, T = LAB.measure.trials, UNIT = LAB.measure.unit;\nconst lab = i => IT[i].label;\nconst labd = i => IT[i].label + (IT[i].detail ? ` (${IT[i].detail})` : \"\");\nconst PEOPLE = {\n  maya: { name: \"Maya\", role: \"Materials Manager\", pitch: 1.2 },\n  deshawn: { name: \"Deshawn\", role: \"Skeptic\", pitch: 0.85 },\n  leo: { name: \"Leo\", role: \"Recorder\", pitch: 1.35 }\n};\nconst ROLES = {\n  lead: { name: \"Lead Investigator\", info: \"You run the tests and make the final calls.\" },\n  checker: { name: \"Data Checker\", info: \"You double-check every measurement.\" },\n  talk: { name: \"Discussion Leader\", info: \"You make sure everyone gets heard.\" }\n};\nconst INSTR = {\n  cylinder: { tip: \"Read the bottom of the curved water line.\", name: \"graduated cylinder\" },\n  thermometer: { tip: \"Read where the red line stops.\", name: \"thermometer\" },\n  scale: { tip: \"Read the line the pointer points to.\", name: \"spring scale\" },\n  ruler: { tip: \"Read the mark where the bar ends.\", name: \"ruler\" },\n  counter: { tip: \"Count carefully as you go.\", name: \"count\" }\n};\n\n/* ---------- state ---------- */\nfunction fresh() {\n  return {\n    v: 3, phase: 0, phaseTLen: 0, first: \"\", initial: \"\", role: \"\", mode: \"\",\n    started: new Date().toISOString(), activeSec: 0, breaks: [],\n    prediction: null, varTries: { iv: 0, dv: 0, constants: 0 },\n    fair: null, whyTrials: 0, turns: null,\n    data: IT.map(() => Array(T).fill(null)),\n    simTrue: null, readings: { first: 0, total: 0 }, guess: null, answers: [], classShown: null,\n    parts: LAB.parts.map(p => ({ guess: null, data: p.items.map(() => Array(p.measure.trials).fill(null)), simTrue: null, averages: null, avgFirst: 0, answers: [] })),\n    outlier: null, averages: null, avgFirstTry: 0, predCheck: null,\n    cer: { claim: \"\", evidence: \"\", reasoning: \"\", revised: false },\n    decisions: [], ratings: null, reflect: null, feeling: \"\", sent: false, planFixed: false,\n    transcript: [], settings: { read: false, speed: \"normal\", big: false }\n  };\n}\nfunction load() { if (PREVIEW) return null; try { const r = localStorage.getItem(KEY); const s = r ? JSON.parse(r) : null; return s && s.v === 3 && s.data && s.data.length === NI && s.parts && s.parts.length === LAB.parts.length ? s : null; } catch (e) { return null; } }\nfunction save() { if (PREVIEW) return; try { (()=>{})(KEY, JSON.stringify(S)); } catch (e) { } }\nlet S = load() || fresh();\nconst $ = s => document.querySelector(s);\nconst esc = s => String(s ?? \"\").replace(/[&<>\"]/g, c => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\" }[c]));\nconst nm = () => S.first || \"friend\";\nconst fullName = () => (S.first + (S.initial ? \" \" + S.initial.toUpperCase() + \".\" : \"\")).trim();\nconst words = t => (t.trim().match(/\\S+/g) || []).length;\nconst shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };\nconst u = v => UNIT ? `${v} ${UNIT}` : `${v}`;\nlet CTX = {};\nfunction fill(t) {\n  return String(t || \"\").replace(/\\{name\\}/g, nm()).replace(/\\{rival\\}/g, CTX.rival ? PEOPLE[CTX.rival].name : \"\")\n    .replace(/\\{pick\\}/g, CTX.pick != null ? lab(CTX.pick) : \"\").replace(/\\{winner\\}/g, CTX.winner != null ? lab(CTX.winner) : \"\")\n    .replace(/\\{unit\\}/g, UNIT).replace(/\\{trials\\}/g, T);\n}\nfunction lines(text) {\n  return String(text || \"\").split(\"\\n\").map(l => l.trim()).filter(Boolean).map(l => {\n    const m = l.match(/^([A-Za-z]+)\\s*:\\s*(.+)$/); if (!m) return [\"deshawn\", fill(l)];\n    let w = m[1].toLowerCase(); if (w === \"rival\") w = CTX.rival || \"leo\";\n    if (!PEOPLE[w]) w = \"deshawn\";\n    return [w, fill(m[2])];\n  });\n}\n\n/* ---------- pacing / break ---------- */\nlet onBreak = false, breakWaiters = [], skipper = null;\nconst FACTOR = { slow: 1.6, normal: 1, fast: 0.35 };\nfunction pause(ms) {\n  return new Promise(res => {\n    const done = () => { clearTimeout(t); skipper = null; waitBreak().then(res); };\n    const t = setTimeout(done, ms * FACTOR[S.settings.speed]);\n    skipper = done;\n  });\n}\nfunction waitBreak() { return onBreak ? new Promise(r => breakWaiters.push(r)) : Promise.resolve(); }\nconst typingMs = t => Math.min(2400, 500 + t.length * 16);\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\n\n/* ---------- speech ---------- */\nlet speakDone = null;\nfunction speak(text, who) {\n  if (!(\"speechSynthesis\" in window)) return Promise.resolve();\n  try {\n    speechSynthesis.cancel();\n    return new Promise(res => {\n      const ut = new SpeechSynthesisUtterance(text);\n      ut.pitch = (PEOPLE[who] || {}).pitch || 1; ut.rate = S.settings.speed === \"slow\" ? 0.85 : 1;\n      let fin = false; const end = () => { if (!fin) { fin = true; clearTimeout(g); speakDone = null; res(); } };\n      const g = setTimeout(end, Math.max(3000, text.length * 95));\n      ut.onend = end; ut.onerror = end; speakDone = end;\n      speechSynthesis.speak(ut);\n    });\n  } catch (e) { return Promise.resolve(); }\n}\n\n/* ---------- thread ---------- */\nconst thread = $(\"#thread\"), reply = $(\"#reply\");\nfunction bubble(who, text) {\n  const d = document.createElement(\"div\");\n  d.className = \"msg \" + who;\n  const isYou = who === \"you\";\n  const nmTxt = isYou ? esc(nm()) : esc(PEOPLE[who].name);\n  const role = isYou ? (ROLES[S.role] ? ROLES[S.role].name : \"You\") : PEOPLE[who].role;\n  const init = isYou ? esc((S.first || \"Y\")[0].toUpperCase()) : PEOPLE[who].name[0];\n  d.innerHTML = `<div class=\"av ${who}\" aria-hidden=\"true\">${init}<\/div><div class=\"bub\"><div class=\"who\">${nmTxt}<span>${esc(role)}<\/span><\/div><p><\/p><\/div>`;\n  if (text != null) setText(d, who, text);\n  return d;\n}\nfunction setText(d, who, text) {\n  d.querySelector(\"p\").textContent = text;\n  if (who !== \"you\") {\n    const b = document.createElement(\"button\");\n    b.className = \"say\"; b.type = \"button\"; b.textContent = \"▶ hear it\"; b.setAttribute(\"aria-label\", \"Read this message out loud\");\n    b.onclick = () => speak(text, who);\n    d.querySelector(\".who\").appendChild(b);\n  }\n}\nfunction scrollDown(el) { const t = el || reply; try { t.scrollIntoView({ block: \"end\", behavior: matchMedia(\"(prefers-reduced-motion: reduce)\").matches ? \"auto\" : \"smooth\" }); } catch (e) { } }\nasync function say(who, text) {\n  text = fill(text); if (!text.trim()) return;\n  const d = bubble(who, null);\n  d.querySelector(\"p\").innerHTML = `<span class=\"dots\"><i><\/i><i><\/i><i><\/i><\/span><button class=\"skip\" type=\"button\">skip<\/button>`;\n  d.querySelector(\".skip\").onclick = () => skipper && skipper();\n  thread.appendChild(d); scrollDown(d);\n  await pause(typingMs(text));\n  setText(d, who, text);\n  S.transcript.push({ who, text }); save();\n  if (S.settings.read) { await speak(text, who); await waitBreak(); }\n  else await pause(220);\n}\nasync function chat(ls) { for (const [w, t] of ls) await say(w, t); }\nfunction me(text) { thread.appendChild(bubble(\"you\", text)); S.transcript.push({ who: \"you\", text }); save(); }\nfunction clearReply() { reply.innerHTML = \"\"; }\nfunction card(label) {\n  clearReply();\n  const c = document.createElement(\"div\"); c.className = \"card\";\n  if (label) c.innerHTML = `<p class=\"lbl\">${esc(label)}<\/p>`;\n  reply.appendChild(c); scrollDown();\n  return c;\n}\n\n/* ---------- interaction helpers ---------- */\nfunction choose(label, options) {\n  return new Promise(res => {\n    const c = card(label);\n    const box = document.createElement(\"div\"); box.className = \"choices\";\n    options.forEach(o => {\n      const b = document.createElement(\"button\"); b.type = \"button\"; b.className = \"choice\";\n      b.innerHTML = esc(o.label) + (o.sub ? `<small>${esc(o.sub)}<\/small>` : \"\");\n      b.onclick = () => { clearReply(); res(o); };\n      box.appendChild(b);\n    });\n    c.appendChild(box); scrollDown();\n    const f = box.querySelector(\"button\"); f && f.focus({ preventScroll: true });\n  });\n}\nfunction askText({ label, placeholder = \"\", multiline = false, value = \"\", starter = \"\" }) {\n  return new Promise(res => {\n    const c = card(label);\n    const el = document.createElement(multiline ? \"textarea\" : \"input\");\n    el.className = \"inp\"; el.id = \"ans-\" + Date.now(); el.placeholder = placeholder; el.value = value || starter;\n    if (!multiline) el.maxLength = 60;\n    const row = document.createElement(\"div\"); row.className = \"row\"; row.style.marginTop = \"10px\";\n    const b = document.createElement(\"button\"); b.className = \"btn\"; b.type = \"button\"; b.textContent = \"Send\";\n    const go = () => { const v = el.value.trim(); if (!v || v === starter.trim()) { el.focus(); return; } clearReply(); res(v); };\n    b.onclick = go;\n    el.addEventListener(\"keydown\", e => { if (e.key === \"Enter\" && (!multiline || e.ctrlKey)) { e.preventDefault(); go(); } });\n    row.appendChild(b); c.append(el, row);\n    if (multiline) { const h = document.createElement(\"p\"); h.className = \"hint\"; h.textContent = \"Write in full sentences. Press Send when you're done.\"; c.appendChild(h); }\n    el.focus({ preventScroll: true }); scrollDown();\n  });\n}\nfunction askNumber(label, unitOv) {\n  return new Promise(res => {\n    const c = card(label);\n    c.insertAdjacentHTML(\"beforeend\", `<div class=\"row\"><input class=\"inp\" id=\"num-${Date.now()}\" type=\"number\" inputmode=\"decimal\" step=\"any\" style=\"max-width:140px\"><span>${esc(unitOv ?? UNIT)}<\/span><button class=\"btn\" type=\"button\">Send<\/button><\/div>`);\n    const el = c.querySelector(\"input\"), b = c.querySelector(\"button\");\n    const go = () => { const v = parseFloat(el.value); if (isNaN(v)) { el.focus(); return; } clearReply(); res(v); };\n    b.onclick = go; el.addEventListener(\"keydown\", e => { if (e.key === \"Enter\") go(); });\n    el.focus({ preventScroll: true }); scrollDown();\n  });\n}\nfunction multiPick(label, items, btnText = \"Check my answer\") {\n  return new Promise(res => {\n    const c = card(label);\n    const box = document.createElement(\"div\"); box.className = \"checks\";\n    items.forEach((it, i) => box.insertAdjacentHTML(\"beforeend\", `<label class=\"check\"><input type=\"checkbox\" id=\"mp-${i}-${Date.now()}\" value=\"${i}\"><span>${esc(it.label)}<\/span><\/label>`));\n    const b = document.createElement(\"button\"); b.className = \"btn\"; b.type = \"button\"; b.textContent = btnText;\n    b.onclick = () => { const picked = [...box.querySelectorAll(\"input:checked\")].map(x => items[+x.value]); if (!picked.length) return; clearReply(); res(picked); };\n    c.append(box, b); scrollDown();\n  });\n}\nconst DEC_INFO = {\n  predict: { moment: \"Teammate disagreed with my prediction\", skill: \"Respectful disagreement\" },\n  feedback: { moment: \"Telling Leo his plan wasn't fair\", skill: \"Giving feedback kindly\" },\n  turns: { moment: \"Maya and Leo both wanted to do the testing\", skill: \"Compromise / problem solving\" },\n  skip: { moment: \"Leo wanted to skip trials\", skill: \"Justifying with evidence\" },\n  outlier: { moment: \"Found a trial that didn't match (outlier)\", skill: \"Using evidence\" },\n  cer: { moment: \"Deshawn gave feedback on our conclusion\", skill: \"Accepting feedback\" }\n};\nconst decOn = k => LAB.decisions[k] && LAB.decisions[k].on !== false && (LAB.decisions[k].choices || []).some(c => c.text && c.text.trim());\n/* group decision: weak choices get a redirect and another try */\nasync function decision(key) {\n  const D = LAB.decisions[key], info = DEC_INFO[key];\n  if (D.setup) await chat(lines(D.setup));\n  let first = null, left = D.choices.filter(c => c.text && c.text.trim());\n  while (true) {\n    const pick = await choose(fill(D.prompt || \"What do you say?\"), left.map(c => ({ label: fill(c.text), c })));\n    me(pick.label);\n    if (pick.c.react) await chat(lines(pick.c.react));\n    if (pick.c.quality === \"weak\" && left.length > 1) { first = first || pick.label; left = left.filter(o => o !== pick.c); continue; }\n    S.decisions.push({ phase: S.phase, moment: info.moment, skill: info.skill, choice: pick.label, quality: pick.c.quality || \"okay\", first });\n    save(); renderSheet();\n    return pick.c;\n  }\n}\n\n/* ============================================================\n   PHASES\n   ============================================================ */\nasync function phTeam() {\n  await chat([[\"maya\", \"Hi! I'm Maya. Welcome to our lab group. We were hoping you'd join us.\"], [\"maya\", \"What's your first name?\"]]);\n  let f = await askText({ label: \"Type your first name\", placeholder: \"First name\" });\n  f = f.split(/\\s+/)[0].slice(0, 20); S.first = f.charAt(0).toUpperCase() + f.slice(1);\n  me(S.first);\n  await say(\"maya\", `Nice to meet you, {name}! And what's the first letter of your last name?`);\n  let i = await askText({ label: \"Last initial (just one letter)\", placeholder: \"Example: S\" });\n  S.initial = (i.match(/[a-z]/i) || [\"?\"])[0].toUpperCase(); me(S.initial + \".\"); save(); renderSheet();\n  await chat([\n    [\"deshawn\", `Hey {name}. I'm Deshawn. I'm the Skeptic. That means I ask \"How do you know?\" a lot. It's how scientists catch mistakes.`],\n    [\"leo\", \"And I'm Leo! I'm the Recorder. I write everything down. I also have a LOT of ideas. Some of them are even good.\"]\n  ]);\n  if (LAB.modes === \"both\") {\n    await say(\"maya\", \"I'm the Materials Manager, so I keep our stuff organized. Quick question. Do you have the real materials, or should we use the on-screen lab?\");\n    const m = await choose(\"Pick how you'll do the lab\", [\n      { label: \"I have real materials\", sub: LAB.materials || \"\", v: \"real\" },\n      { label: \"Use the on-screen lab\", sub: LAB.sim.instrument === \"counter\" ? \"You'll run a simulation and count it yourself\" : `You'll run a simulation and read the ${INSTR[LAB.sim.instrument].name} yourself`, v: \"sim\" }\n    ]);\n    S.mode = m.v; me(m.label);\n  } else {\n    S.mode = LAB.modes;\n    await say(\"maya\", S.mode === \"sim\" ? \"I'm the Materials Manager. Today we're using the on-screen lab, so everything's ready.\" : `I'm the Materials Manager, so I keep our stuff organized. Today we need: ${LAB.materials || \"the lab materials\"}.`);\n  }\n  save(); renderSheet();\n  await say(\"leo\", \"Everybody in our group has a job. Which job do you want?\");\n  const r = await choose(\"Pick your role\", Object.entries(ROLES).map(([k, o]) => ({ label: o.name, sub: o.info, v: k })));\n  S.role = r.v; me(`I'll be the ${r.label}.`); save(); renderSheet();\n  await chat([[\"deshawn\", `Good pick. Okay team, here's our question: ${LAB.question}`], [\"maya\", \"You can see what we're testing on our lab sheet.\"]]);\n  if (LAB.introLines) await chat(lines(LAB.introLines));\n}\n\nasync function phPredict() {\n  const P = LAB.prediction, lp = Math.min(NI - 1, +P.leoPick || 0), mp = Math.min(NI - 1, +P.mayaPick || 0);\n  await chat([[\"leo\", P.leoLine || `I bet ${lab(lp)} wins!`], [\"maya\", P.mayaLine || `Hmm. I think ${lab(mp)}.`], [\"deshawn\", `{name}, what do you predict? ${P.prompt}`]]);\n  const p = await choose(\"Your prediction\", IT.map((it, k) => ({ label: labd(k), sub: it.desc, v: k })));\n  CTX.pick = p.v;\n  me(`I predict ${lab(p.v)}.`);\n  await say(\"deshawn\", \"Why do you think that? Try starting with “I think ___ because ___.”\");\n  const starter = fill(P.starter || \"I think {pick} will win because \");\n  let why = await askText({ label: \"Your reason\", multiline: true, starter });\n  me(why);\n  if (!/\\b(because|since|so|cause)\\b/i.test(why) || words(why) < 7) {\n    await say(\"deshawn\", \"I want to hear your reason. What is it about that one? Add a “because.”\");\n    why = await askText({ label: \"Add your reason\", multiline: true, value: why }); me(why);\n  }\n  S.prediction = { item: p.v, reason: why }; save(); renderSheet();\n  const rival = p.v !== lp ? \"leo\" : (mp !== p.v ? \"maya\" : \"leo\");\n  CTX.rival = rival;\n  if (rival === \"leo\") await say(\"leo\", `What?! No way. ${lab(lp)} is going to win. You're wrong, {name}.`);\n  else await chat([[\"leo\", `YES! Team ${lab(lp)}!`], [\"maya\", `I still think ${lab(mp)}. I think you're both wrong.`]]);\n  if (decOn(\"predict\")) await decision(\"predict\");\n  const G = P.guess;\n  if (G.on) {\n    const gi = Math.min(NI - 1, +G.item || 0);\n    await say(\"deshawn\", \"One more thing. Take a guess: \" + (G.prompt || `what number will we get for ${lab(gi)}?`));\n    if (G.leoLine) await say(\"leo\", G.leoLine);\n    if (G.mayaLine) await say(\"maya\", G.mayaLine);\n    const g = await askNumber(\"Your guess\"); me(`My guess: ${u(g)}`);\n    S.guess = { item: gi, value: g }; save(); renderSheet();\n  }\n  await say(\"deshawn\", \"Remember, a prediction is our best guess. Being wrong is fine. We learn either way.\");\n}\n\nasync function phVariables() {\n  const V = LAB.variables;\n  if (V.ivCorrect) {\n    await say(\"deshawn\", \"Before we test, we need our variables. What is the ONE thing we change on purpose?\");\n    await quiz(\"iv\", \"Independent variable (what we change)\", V.ivCorrect, V.ivWrong, V.ivHint || \"Think about what we're comparing.\");\n  }\n  if (V.dvCorrect) {\n    await say(\"leo\", \"Writing that down! Now, what do we MEASURE to see what happened?\");\n    await quiz(\"dv\", \"Dependent variable (what we measure)\", V.dvCorrect, V.dvWrong, V.dvHint || \"The thing we measure is the result.\");\n  }\n  if (V.constants.length) {\n    await say(\"deshawn\", \"Last one. Which things should stay the SAME every time? Pick all of them.\");\n    const items = shuffle([...V.constants.map(l => ({ label: l, ok: true })), ...V.decoys.map(l => ({ label: l }))]);\n    for (let t = 1; t <= 2; t++) {\n      S.varTries.constants = t;\n      const picked = await multiPick(\"Constants (what stays the same)\", items);\n      me(\"I picked: \" + picked.map(p => p.label.toLowerCase()).join(\"; \") + \".\");\n      const wrong = picked.filter(p => !p.ok), missed = items.filter(i => i.ok && !picked.includes(i));\n      if (!wrong.length && !missed.length) { await say(\"deshawn\", \"Perfect. Those are our constants. That's what makes it a fair test.\"); break; }\n      let msg = \"\";\n      if (wrong.length) msg += wrong.map(w => `“${w.label}”`).join(\" and \") + \" can't stay the same. That's what we're changing! \";\n      if (missed.length) msg += `You missed ${missed.length}. `;\n      if (t < 2) await say(\"deshawn\", msg + \"Try again.\");\n      else await say(\"deshawn\", msg + \"Here's the full list: \" + V.constants.join(\"; \").toLowerCase() + \".\");\n    }\n  }\n  S.varsDone = true; save(); renderSheet();\n}\nasync function quiz(key, label, correct, wrong, hint) {\n  const opts = shuffle([{ label: correct, ok: true }, ...(wrong || []).filter(Boolean).map(l => ({ label: l }))]);\n  for (let t = 1; t <= 3; t++) {\n    S.varTries[key] = t;\n    const o = await choose(label, opts);\n    me(o.label);\n    if (o.ok) { await say(\"deshawn\", \"Yep. \" + (t === 1 ? \"Got it on the first try.\" : \"You got it.\")); break; }\n    if (t === 3) { await say(\"maya\", `It's “${correct}.” ${hint}`); break; }\n    await say(\"maya\", hint);\n  }\n  save(); renderSheet();\n}\n\nasync function phPlan() {\n  const PL = LAB.plan;\n  if (PL.steps.length && PL.problems.length) {\n    await say(\"leo\", \"I wrote our plan! Check it out:\");\n    thread.appendChild(planBubble()); S.transcript.push({ who: \"leo\", plan: true, text: \"\" });\n    await say(\"deshawn\", \"Hmm. Is this a fair test? Find every problem with Leo's plan.\");\n    const items = shuffle([...PL.problems.map(l => ({ label: l, ok: true })), ...PL.fine.map(l => ({ label: l }))]);\n    const picked = await multiPick(\"Problems in Leo's plan\", items);\n    me(\"Problems I found: \" + picked.map(p => p.label.toLowerCase()).join(\"; \") + \".\");\n    const found = picked.filter(p => p.ok), extra = picked.filter(p => !p.ok), missed = items.filter(i => i.ok && !picked.includes(i));\n    S.fair = { total: PL.problems.length, found: found.map(f => f.label), missed: missed.map(m => m.label), extra: extra.map(e => e.label) }; save();\n    if (!missed.length && !extra.length) await say(\"deshawn\", `You found all ${PL.problems.length}. Sharp eyes.`);\n    else {\n      let m = `You found ${found.length} of ${PL.problems.length}. `;\n      if (missed.length) m += \"You missed: \" + missed.map(x => x.label.toLowerCase()).join(\"; \") + \". \";\n      if (extra.length) m += PL.fineNote || (extra.map(x => `“${x.label}”`).join(\" and \") + \" is fine, as long as we do it the same way every time.\");\n      await say(\"deshawn\", m.trim());\n    }\n    if (decOn(\"feedback\")) await decision(\"feedback\");\n  }\n  S.planFixed = true; save(); renderSheet();\n  if (LAB.procedure.length) await say(\"maya\", \"Here's our fair plan. I added it to the lab sheet.\");\n  if (T >= 2) {\n    await say(\"deshawn\", `Question for you. Why do we do ${T} trials for each one?`);\n    const opts = shuffle([{ label: \"So one mistake doesn't fool us\", ok: true }, { label: \"Because the teacher said so\", t: 1 }, { label: \"To take up more time\" }]);\n    for (let t = 1; t <= 3; t++) {\n      const o = await choose(`Why ${T} trials?`, opts);\n      me(o.label); S.whyTrials = t;\n      if (o.ok) { await say(\"deshawn\", \"Exactly. If one trial goes wrong, the others will show it.\"); break; }\n      if (t === 3) { await say(\"deshawn\", \"It's so one mistake doesn't fool us. More trials make our data more trustworthy.\"); break; }\n      if (o.t) await say(\"deshawn\", \"Ha, maybe. But there's a science reason too. What if one trial goes wrong?\");\n      else await say(\"leo\", \"Think about what happens if one trial gets messed up.\");\n    }\n  }\n  save();\n}\nfunction planBubble() {\n  const c = document.createElement(\"div\"); c.className = \"msg leo\";\n  c.innerHTML = `<div class=\"av leo\" aria-hidden=\"true\">L<\/div><div class=\"plan\"><h4>Leo's Plan<\/h4><ol>${LAB.plan.steps.map(s => `<li>${esc(s)}<\/li>`).join(\"\")}<\/ol><\/div>`;\n  return c;\n}\n\nasync function phTest() {\n  let act = \"share\";\n  if (decOn(\"turns\")) { const d = await decision(\"turns\"); act = d.act || \"share\"; }\n  const rot = [\"Maya\", \"Leo\", \"You\"];\n  S.turns = IT.map((_, i) => act === \"self\" ? \"You\" : rot[i % 3]); save();\n  if (T >= 2 && decOn(\"skip\")) await decision(\"skip\");\n  if (S.mode === \"real\") await testReal(); else await testSim();\n  save(); renderSheet();\n}\n\nasync function testReal() {\n  await chat([\n    [\"maya\", `Get out the materials${LAB.materials ? \": \" + LAB.materials : \"\"}.`],\n    [\"maya\", \"Follow our plan on the lab sheet, step by step.\"],\n    [\"leo\", \"Type each measurement in the table as soon as you read it. I'll help keep track.\"]\n  ]);\n  await new Promise(res => {\n    const c = card(`Data table: ${LAB.measure.what}${UNIT ? \" (\" + UNIT + \")\" : \"\"}`);\n    const head = Array.from({ length: T }, (_, i) => `<th>Trial ${i + 1}<\/th>`).join(\"\");\n    const rows = IT.map((it, k) => `<tr><td><b>${esc(it.label)}<\/b> ${esc(it.detail || \"\")}<\/td>` + Array.from({ length: T }, (_, i) =>\n      `<td><input type=\"number\" inputmode=\"decimal\" step=\"any\" id=\"d-${k}-${i}\" aria-label=\"${esc(it.label)} trial ${i + 1}\" value=\"${S.data[k][i] ?? \"\"}\"><\/td>`).join(\"\") + \"<\/tr>\").join(\"\");\n    c.insertAdjacentHTML(\"beforeend\", `<div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Item<\/th>${head}<\/tr><\/thead><tbody>${rows}<\/tbody><\/table><\/div>\n      <p class=\"hint\" id=\"dmsg\">Fill in all ${NI * T} boxes.<\/p><div class=\"row\" style=\"margin-top:8px\"><button class=\"btn\" type=\"button\" id=\"dsave\">Save our data<\/button><\/div>`);\n    let warned = false;\n    c.querySelector(\"#dsave\").onclick = () => {\n      let missing = 0; const odd = [], mx = +LAB.measure.maxReasonable || 0;\n      const vals = IT.map((it, k) => Array.from({ length: T }, (_, i) => { const v = parseFloat(c.querySelector(`#d-${k}-${i}`).value); if (isNaN(v)) { missing++; return null; } if (mx && (v > mx || v < 0)) odd.push(`${it.label} trial ${i + 1}`); return v; }));\n      if (missing) { c.querySelector(\"#dmsg\").textContent = `${missing} box${missing > 1 ? \"es are\" : \" is\"} still empty.`; return; }\n      if (odd.length && !warned) { warned = true; c.querySelector(\"#dmsg\").textContent = `Deshawn: “${odd.join(\", \")} looks unusual. Check it, then press Save again if it's right.”`; return; }\n      S.data = vals; save(); renderSheet(); clearReply();\n      me(\"Here's our data: \" + IT.map((it, k) => `${it.label}: ${vals[k].map(u).join(\", \")}`).join(\". \") + \".\");\n      res();\n    };\n  });\n  await say(\"leo\", \"Got it all written down!\");\n}\n\n/* ---------- simulation ---------- */\nconst SIM = LAB.sim, MS = SIM.mistake;\nconst tick = Math.max(0.01, +SIM.tick || 1);\nconst snap = v => Math.round(Math.round(v / tick) * tick * 100) / 100;\nfunction rndTick(a, b) { a = +a; b = +b; if (b < a) [a, b] = [b, a]; const n = Math.floor((b - a) / tick + 1e-9); return snap(a + Math.floor(Math.random() * (n + 1)) * tick); }\nconst mistakeOn = () => SIM.enabled && MS.enabled && MS.item < NI && MS.trial < T;\nfunction makeSim() {\n  const t = IT.map(it => Array.from({ length: T }, () => rndTick(it.simMin ?? SIM.min, it.simMax ?? SIM.max)));\n  if (mistakeOn()) t[MS.item][MS.trial] = rndTick(MS.min, MS.max);\n  return t;\n}\nconst V = { top: 22, bot: 222 }, R = { l: 40, r: 380, y: 200 };\nconst span = () => (+SIM.max - +SIM.min) || 1;\nconst yOf = v => V.bot - (v - SIM.min) / span() * (V.bot - V.top);\nconst xOf = v => R.l + (v - SIM.min) / span() * (R.r - R.l);\nconst fmt = v => String(Math.round(v * 100) / 100);\nfunction instrSVG() {\n  const kind = SIM.instrument, n = Math.round(span() / tick), every = n > 60 ? Math.ceil(n / 60) : 1;\n  let t = \"\", body = \"\";\n  for (let s = 0; s <= n; s += every) {\n    const v = +SIM.min + s * tick, long = s % 5 === 0;\n    if (kind === \"ruler\") {\n      const x = xOf(v).toFixed(1);\n      t += `<line class=\"tick\" x1=\"${x}\" x2=\"${x}\" y1=\"${R.y}\" y2=\"${R.y + (long ? 14 : 7)}\" stroke-width=\"${long ? 1.4 : .8}\"/>`;\n      if (long) t += `<text class=\"svgt\" x=\"${x}\" y=\"${R.y + 26}\" text-anchor=\"middle\">${fmt(v)}<\/text>`;\n    } else {\n      const y = yOf(v).toFixed(1);\n      t += `<line class=\"tick\" x1=\"${long ? 318 : 324}\" x2=\"334\" y1=\"${y}\" y2=\"${y}\" stroke-width=\"${long ? 1.4 : .8}\"/>`;\n      if (long) t += `<text class=\"svgt\" x=\"312\" y=\"${+y + 3.5}\" text-anchor=\"end\">${fmt(v)}<\/text>`;\n    }\n  }\n  if (kind === \"cylinder\") body = `<rect x=\"334\" y=\"${V.top - 10}\" width=\"40\" height=\"${V.bot - V.top + 14}\" rx=\"4\" fill=\"none\" style=\"stroke:var(--glass)\" stroke-width=\"2.5\"/>\n    <clipPath id=\"cc\"><rect x=\"335.5\" y=\"0\" width=\"37\" height=\"${V.bot + 2}\"/><\/clipPath>\n    <g clip-path=\"url(#cc)\"><rect class=\"lvl\" id=\"lv\" x=\"335\" y=\"${V.bot}\" width=\"38\" height=\"0\" style=\"fill:var(--water)\"/>\n    <g class=\"mov\" id=\"ls\" style=\"transform:translateY(${V.bot}px)\"><path d=\"M335 -4 Q354 4 373 -4 L373 2 L335 2 Z\" style=\"fill:var(--water-2)\"/><\/g><\/g>`;\n  else if (kind === \"thermometer\") body = `<rect x=\"345\" y=\"${V.top - 10}\" width=\"18\" height=\"${V.bot - V.top + 22}\" rx=\"9\" style=\"fill:var(--paper);stroke:var(--glass)\" stroke-width=\"2\"/>\n    <circle cx=\"354\" cy=\"${V.bot + 20}\" r=\"14\" style=\"fill:var(--therm);stroke:var(--glass)\" stroke-width=\"2\"/>\n    <rect class=\"lvl\" id=\"lv\" x=\"350\" y=\"${V.bot}\" width=\"8\" height=\"12\" style=\"fill:var(--therm)\"/>`;\n  else if (kind === \"scale\") body = `<rect x=\"338\" y=\"${V.top - 12}\" width=\"44\" height=\"${V.bot - V.top + 26}\" rx=\"6\" style=\"fill:var(--paper);stroke:var(--glass)\" stroke-width=\"2\"/>\n    <g class=\"mov\" id=\"ptr\" style=\"transform:translateY(0px)\"><path d=\"M336 ${V.bot} l14 -6 v12 z\" style=\"fill:var(--warn)\"/><line x1=\"348\" x2=\"378\" y1=\"${V.bot}\" y2=\"${V.bot}\" style=\"stroke:var(--warn)\" stroke-width=\"2\"/><\/g>\n    <text class=\"svgm\" x=\"360\" y=\"${V.bot + 28}\" text-anchor=\"middle\">hook<\/text>`;\n  else body = `<rect x=\"${R.l - 6}\" y=\"${R.y - 2}\" width=\"${R.r - R.l + 12}\" height=\"34\" rx=\"3\" style=\"fill:var(--amber-tint);stroke:var(--amber)\" stroke-width=\"1.5\"/>\n    <rect class=\"lvl\" id=\"lv\" x=\"${R.l}\" y=\"${R.y - 26}\" width=\"0\" height=\"20\" rx=\"3\" style=\"fill:var(--accent)\"/>`;\n  return body + t;\n}\nfunction simSVG(k) {\n  const tag = (IT[k].label.split(/\\s+/).pop() || \"?\").slice(0, 5);\n  const unitLbl = SIM.instrument === \"ruler\" ? `<text class=\"svgm\" x=\"${R.r}\" y=\"${R.y - 34}\" text-anchor=\"end\">${esc(UNIT)}<\/text>` : `<text class=\"svgm\" x=\"354\" y=\"${V.bot + 40}\" text-anchor=\"middle\">${esc(UNIT)}<\/text>`;\n  return `<svg viewBox=\"0 0 400 ${SIM.instrument === \"ruler\" ? 240 : 270}\" role=\"img\" aria-label=\"${esc(IT[k].label)}, timer, and ${INSTR[SIM.instrument].name}\">\n  <rect class=\"tile\" id=\"tile\" x=\"30\" y=\"30\" width=\"96\" height=\"96\" rx=\"10\" style=\"fill:var(--tile);stroke:var(--glass)\" stroke-width=\"2\"/>\n  <text x=\"78\" y=\"88\" text-anchor=\"middle\" style=\"font-family:var(--display);font-weight:800;font-size:${tag.length > 3 ? 20 : 30}px;fill:var(--ink)\">${esc(tag)}<\/text>\n  <text class=\"svgm\" id=\"stepLbl\" x=\"78\" y=\"146\" text-anchor=\"middle\">ready<\/text>\n  <circle cx=\"210\" cy=\"70\" r=\"34\" style=\"fill:var(--paper);stroke:var(--line)\" stroke-width=\"3\"/>\n  <line id=\"hand\" x1=\"210\" y1=\"70\" x2=\"210\" y2=\"44\" stroke-width=\"3\" stroke-linecap=\"round\" style=\"stroke:var(--ink);transform-origin:210px 70px\"/>\n  <text class=\"svgt\" id=\"clk\" x=\"210\" y=\"124\" text-anchor=\"middle\" style=\"font-size:13px\">0 s<\/text>\n  ${instrSVG()}${unitLbl}<\/svg>`;\n}\nfunction animClock(sec, realMs, stopAt) {\n  return new Promise(res => {\n    const hand = $(\"#hand\"), clk = $(\"#clk\"), end = stopAt ?? sec; let t0 = null;\n    const step = ts => {\n      if (!t0) t0 = ts; const p = Math.min(1, (ts - t0) / realMs), s = p * sec, shown = Math.min(s, end);\n      if (hand) hand.style.transform = `rotate(${(shown / Math.max(sec, 1)) * 360}deg)`; if (clk) clk.textContent = Math.floor(shown) + \" s\";\n      if (s >= end || p >= 1) return res(); requestAnimationFrame(step);\n    };\n    requestAnimationFrame(step);\n  });\n}\nfunction setLevel(v) {\n  const kind = SIM.instrument, lv = $(\"#lv\");\n  if (kind === \"cylinder\") { const y = yOf(v); lv.setAttribute(\"y\", y); lv.setAttribute(\"height\", V.bot - y); lv.style.y = y + \"px\"; lv.style.height = (V.bot - y) + \"px\"; $(\"#ls\").style.transform = `translateY(${y}px)`; }\n  else if (kind === \"thermometer\") { const y = yOf(v); lv.setAttribute(\"y\", y); lv.setAttribute(\"height\", V.bot + 12 - y); lv.style.y = y + \"px\"; lv.style.height = (V.bot + 12 - y) + \"px\"; }\n  else if (kind
