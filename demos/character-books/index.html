        s.marked && { label: "Burn the Ember. All of it.", tag: "Ember burn", go: (s, r) => ({ text: ["You let go. Light pours out of you, red-gold and bright as sunrise. It fills the window and the whole dark around you. " + (r.f.pod ? "Far away, a Guild cutter turns toward it." : "Every ship in the convoy turns toward it and follows.") + " It hurts. A lot. And far beyond the Cinderfall, people with silver collars look up from their scanners and say, <i>“There.”</i>", burn(s, r), addWound(s, "too_much_light"), addBurden(s, "kroll_hunt"), truth(s)] }) },
        !r.f.pod && { label: "Keep the old hand-lamp burning yourself", go: s => ({ text: ["There's an old manual lamp in the unheated outer housing, from before ships had electric lights. It has to be cranked by hand. You crank it for an hour. Your fingers go numb, then white. But the light never goes out. Not once.", fearHit(s, r, "fire"), N("Everyone gets out.", "good"), addWound(s, "cold_hands"), truth(s)] }) },
        !r.f.beaconOff && !r.f.grieveCaught && !r.f.evidence ? { label: "Switch Grieve's beacon on and call for a tow", go: (s, r) => r.f.pell
            ? { text: ["A Guild tug answers instead of the Quench, thanks to Pell's trick. Everyone gets towed out. Nobody gets taken."] }
            : { text: ["Within the hour, a Quench tug tows you out. Everyone lives. The Quench officer is polite and thorough and writes down every name." + (ensureComp(s, "Hal").wound ? " When the tug leaves, Hal is on it." : ""), ensureComp(s, "Hal").wound ? addBurden(s, "hal_taken") : "", addBurden(s, "quench_face")] } }
          : { label: "Use the beacon to call for a tow", go: () => ({ text: ["The beacon is broken or locked up. That option's gone. You'll have to find another way."], next: "s13" }) },
        trustHigh(s, "Hal") && { label: "Look at Hal", tag: "Hal's trust is high", go: s => ({ text: ["His hands are already glowing.", D("Hal", "I can talk to all the engines at once. I think. I've never tried. I don't think I can do it alone. Stand with me?"), "You put your hand on his shoulder. He puts both hands on the wall and <i>hums</i>, a deep, steady note that goes on and on. One by one, every engine roars back to life. Every lamp blazes on. On the other ships, people are pressed against their windows, staring. Some of them start to clap.", N("Everyone gets out.", "good"), ensureComp(s, "Hal").wound ? compHeal(s, "Hal") : compStep(s, "Hal"), truth(s)] }) },
        !s.marked && s.star >= 3 && { label: "The red light isn't outside you anymore…", tag: "✦ Hidden choice", go: () => ({ text: ["It's in your hands. Your chest. Your eyes."], next: "awaken" }) }
      ].filter(Boolean)
    },
    awaken: { title: "The Mark Awakens", next: "s13",
      text: s => P(`Light pours out of you for the first time in your life. What kind of light is it?`),
      choices: s => ["lantern", "forge", "ward", "echo"].map(k => ({ label: { lantern: "Lantern: your eyes blaze, and you can see through everything", forge: "Forge: your hands burn hot enough to bend steel", ward: "Ward: light wraps around you like a shield", echo: "Echo: every machine in the ship starts humming your name" }[k],
        go: s => { s.marked = true; s.kind = k; s.stats.ember = 2; return { text: [N(`<b>Your Mark has awakened: ${k[0].toUpperCase() + k.slice(1)}.</b> Now choose again, with your new Mark.`, "mark")] }; } }))
    },
    s14: { title: "Kessa Reach", next: "END",
      text: (s, r) => P(
        `The Cinderfall fades behind you like a bad dream. Stars come back, one by one. Ahead, a huge spinning wheel of lights appears: <b>Kessa Reach Station</b>, noisy and bright and lawless, with a thousand ships buzzing around it like bees.`,
        r.f.pod && `(Your pod gets towed in by a very grumpy Guild cutter pilot.)`,
        hasBurden(s, "hal_taken") ? `Hal isn't on the dock. He's on a Quench ship, somewhere. You stand where he should be standing and make yourself a promise.`
          : `Hal stands at the end of the dock, looking up at the station lights. His hands are out of his pockets for once.` + D("Hal", "So. What happens now?")),
      choices: (s, r) => hasBurden(s, "hal_taken") ? [
        { label: "Find out where they took him", go: s => ({ text: ["It takes a day of asking around. A dockhand finally whispers it: a prison barge called the <i>Iron Mercy</i>.", N("This opens <b>The Prison Barge</b>.", "mark")] }) }
      ] : [
        { label: "Stay with the Guild", go: s => ({ text: ["Captain Marrow hands you a brass lamp pin. “Full contract. If you want it.”", addAlly(s, "Captain Marrow (Lantern Guild)")] }) },
        trustOk(s, "Hal") && { label: "“Where are YOU going? I'll come with you.”", go: s => { ensureComp(s, "Hal").travel = true; return { text: ["Hal laughs, surprised, like nobody's ever said that to him before. “Honestly? No idea. But I bet it's somewhere with broken engines.”", addAlly(s, "Hal Brandt")] }; } },
        { label: "Read the note in your pocket", go: s => ({ text: ["You didn't put it there. Someone must have slipped it into your coat on the dock. Thick old paper, neat handwriting:", "<i>You heard the Promise. Come find me. — L.</i>", "The Lamplighter.", mystery(s, "The Lamplighter knows you found the Promise.")] }) }
      ].filter(Boolean)
    }
  }
});

</script>
<script>
/* Adventure 04 — The Prison Barge (follow-up; demo plays the Hal rescue) */
EF.books.push({
  id: "barge", title: "The Prison Barge", where: "The Iron Mercy", starting: false,
  blurb: "A Dominion prison ship is three days from Hollow Throne, and someone you care about is in a cell aboard it. Nobody comes back from Hollow Throne. Get them off.",
  recommend: s => hasBurden(s, "hal_taken") ? "Hal needs you!" : (s.done.includes("lantern") ? null : "Best after The Lantern Run"),
  start: "s1",
  setup: (s, r) => { r.f.metHal = !!s.comp.Hal; ensureComp(s, "Hal", 1); },
  scenes: {
    s1: { title: "Three Days", next: "s2",
      text: (s, r) => P(
        r.f.metHal ? `Captain Marrow didn't have to help you. She tells you that twice. Then she slides a slate across the table.`
                   : `You've never met Captain Ilse Marrow of the Lantern Guild before today. She found you in a Kessa Reach noodle shop, sat down across from you, and slid a slate across the table.`,
        D("Marrow", r.f.metHal ? "A friend saw the Quench transfer him. Hal Brandt. He's on a Dominion barge called the <i>Iron Mercy</i>, headed for Hollow Throne. Three days. I put him on my crew list. Get him off that ship."
          : `My mechanic, Hal Brandt, is on a Dominion prison barge called the <i>Iron Mercy</i>. The Quench took him because he's Marked. Three days until it reaches Hollow Throne. I'm told you're the kind of person who does stupid, brave things. I'll pay.`),
        `Her contact is a cargo pilot named Teague, who flies a battered hauler and asks no questions. That's your ride.`,
        `Three days. You do the math in your head, then do it again, because you don't like the answer.`),
      choices: s => [
        { label: "“We go tonight.”", go: (s, r) => ({ text: ["Teague shrugs and starts the engines. “Fine by me.”"] }) },
        { label: "“We plan it right. We go tomorrow.”", go: (s, r) => { r.f.planned = true; return { text: ["One more day to plan. One day closer to Hollow Throne.", N("You'll get an extra edge on one check.", "good")] }; } }
      ]
    },
    s2: { title: "The Plan", next: "s3",
      text: (s, r) => P(
        `The cabin table is covered with everything you have: a blurry scan of the <i>Iron Mercy</i>, a list of guard shifts that might be a week old, and a lot of guesses. The barge is huge and slow and ugly, like a metal brick with engines bolted on. Three cell decks. One shuttle bay. Scanners at every door that can sniff out a Mark from ten paces.`,
        s.marked ? `Ten paces. You'd have to walk right past them.` : `The scanners won't find anything on you. That means you're the one who has to go deepest.`,
        { pell: N("<b>Old Pell</b> got out of the <i>Iron Mercy</i> once. He told the story every time: <i>“Through the garbage chute. Smelled like a dead fish for a month. Worth it.”</i> You know a secret way in.", "good"),
          haldane: N("<b>Commander Haldane</b> drilled Dominion procedure into you. Guard shifts change at the top of every fourth hour, and for two minutes nobody watches the cargo doors.", "good"),
          ibarra: N("<b>Navigator Ibarra</b> taught you to spot the blind side of a ship. There's a sensor shadow behind the barge's engines. You can come in unseen.", "good"),
          amon: N("<b>Brother Amon</b> taught you which herbs calm a fever, and which ones make a grown man yawn so hard he forgets his own name. You've got some in your pack.", "good") }[s.mentor],
        hasTrait(s, "Planner") && N("Planner: you go over the plan until you find its weak spot and patch it.", "good"),
        `One big problem: every cell door needs a Dominion access code, and you don't have one.`),
      onEnter: (s, r) => { r.f.mentor = s.mentor; if (hasTrait(s, "Planner")) r.f.planned = true; }
    },
    s3: { title: "Who Helps", next: "s4",
      text: s => P(
        `Teague has been quiet the whole trip. Now she leans in.`,
        D("Teague", "I can get you a code through some old Free Wake friends. They'll want something back. Not money. A job. Whenever they call, no questions. That's how it works out here."),
        N("<b>Trade.</b> Gain something, take on a burden.", "mark")),
      choices: s => [
        { label: "Take the Free Wake code", go: (s, r) => { r.f.code = true; return { text: ["Teague makes a call. An hour later, a string of numbers arrives on your slate.", addBurden(s, "owe_vane")] }; } },
        { label: "Go without a code", go: () => ({ text: ["You owe no one. But every door is going to be a fight."] }) }
      ]
    },
    s4: { title: "Boarding", next: "s5",
      text: (s, r) => P(
        `The <i>Iron Mercy</i> fills the window as you get close: gray metal, stained with years of space dust, with narrow slit windows like squinting eyes.`,
        r.f.mentor === "ibarra" && `You slide in behind the engines, in the heat-shadow where no scanner can see.`,
        `The plan: dock with a supply crew. Nobody looks hard at people carrying boxes. You pick up a crate and walk toward the cargo door. Right in front of you is the first scanner arch, tall and gray with a red light on top, humming to itself.`,
        s.marked && fearHit(s, r, "seen")),
      choices: (s, r) => [
        !s.marked && { label: "Just walk through", go: () => ({ text: ["The red light stays red. Nothing happens. You realize you've been holding your breath. You're in."] }) },
        s.kind === "echo" && { label: "Hum to the scanner", tag: "Echo Mark", go: () => ({ text: ["It hums at you. You hum back under your breath, like talking to a nervous dog. <i>Nothing to see here.</i> The red light blinks… and turns green. It lets you through like an old friend."] }) },
        s.kind === "lantern" && { label: "Find the scanner's blind angle", tag: "Lantern Mark", go: () => ({ text: ["Your eyes heat for a second. The beam sweeps left to right, then pauses. There's a blind spot right at the edge. You step through at exactly the right moment. Nothing."] }) },
        s.kind === "ward" && { label: "Burn the Ember to pull your light inward", tag: "Ember burn", go: (s, r) => ({ text: ["It feels like holding your breath underwater. But you walk through, and the light stays red.", burn(s, r)] }) },
        r.f.mentor === "pell" && { label: "Take Pell's garbage chute", tag: "Mentor: Old Pell", go: () => ({ text: ["It is exactly as smelly as Pell promised. Worse, maybe. But you're in, and nobody saw a thing."] }) },
        r.f.mentor === "haldane" && { label: "Walk through during the shift change", tag: "Mentor: Commander Haldane", go: () => ({ text: ["Top of the fourth hour. The guards turn to swap posts, and for two minutes nobody is watching. You stroll through like you own the place."] }) },
        hasSkill(s, "Hack") && { label: "Forge the manifest: you're a scanner technician", tag: "Skill: Hack", check: { stat: "tech", dc: r.f.code ? 0 : 5 }, go: (s, r, pass) => ({ text: pass ? ["The guard reads your fake badge, nods, and waves you around the arch."] : ["The guard frowns at your badge. You talk fast and get through, but now he'll remember your face.", strain(s, "Shaken")] }) },
        hasSkill(s, "Linguist") && { label: "Bluff the guard in Dominion officer-speak", tag: "Skill: Linguist", check: { stat: "nerve", dc: 4 }, go: (s, r, pass) => ({ text: pass ? ["“Is there a PROBLEM, trooper?” He snaps to attention and waves you around the arch."] : ["He squints at you, but a crate falls over behind him and you slip past while he's distracted.", strain(s, "Shaken")] }) },
        hasTrait(s, "Slippery") && { label: "Climb into an empty water barrel and get carried in", tag: "Strength: Slippery", go: () => ({ text: ["Very uncomfortable. Very effective."] }) },
        { label: "Find another way in", check: { stat: "reflex", dc: 5 }, go: (s, r, pass) => ({ text: pass ? ["You slip through a maintenance hatch the moment a guard looks away."] : ["A guard grabs your shoulder. “You. Supervisor wants to see you.” You go with him, and then, in an empty corridor, you run. You're aboard. But they know someone is.", strain(s, "Shaken")] }) }
      ].filter(Boolean)
    },
    s5: { title: "The Cells", next: "s6",
      text: (s, r) => P(
        `The cargo door slides shut behind you with a heavy clang.`,
        `The cell decks are long and gray and very quiet. The floors are scrubbed so clean they squeak. Every few steps there's a heavy metal door with a tiny window, and behind every window, a face. At the end of the corridor someone has painted the Dominion crown, and underneath: <b>ORDER IS MERCY.</b>`,
        hasWound(s, "count_the_breaths") && N("The air is thin and stale and tastes like metal. You're counting your breaths again. <span class='dim'>(Count the Breaths fires.)</span>", "bad"),
        fearHit(s, r, "dark"),
        `Halfway down, a guard sits on a stool beside the stairs up.`),
      choices: (s, r) => [
        r.f.mentor === "amon" && { label: "Offer him a cup of tea from your thermos", tag: "Mentor: Brother Amon", go: () => ({ text: ["Amon's sleepy herbs work fast. Thirty seconds later the guard is snoring with his chin on his chest."] }) },
        r.f.code && { label: "Walk past like you belong, flashing the code", go: () => ({ text: ["You tap the code into the stair door. Green. The guard doesn't even look up from his snack."] }) },
        { label: "Wait for your moment and sneak past", check: { stat: "wits", dc: 5, bonus: r.f.planned ? 1 : 0 }, go: (s, r, pass) => ({ text: pass ? ["You wait. He sneezes. You're past him before he opens his eyes."] : ["He spots you. You run. You lose him, but now there's an alert on the whole deck.", strain(s, "Shaken")] }) }
      ].filter(Boolean)
    },
    s6: { title: "The Prisoners", next: "s7",
      text: (s, r) => P(
        `Cell block B. You move from window to window. An old man knitting a sock out of his own blanket. A teenage girl doing push-ups. A man asleep with his boots on.`,
        `At the very end, alone in a cell with nothing but a cot and a stool, sits a tall man with a gray beard, perfectly straight, like a soldier. He's looking right at the door, like he's been expecting you.`,
        D("Haldane", "You're not a guard. Guards don't tiptoe."),
        mentor(s, "haldane") ? P(`His eyes go wide. He stands so fast the stool falls over.`, D("Haldane", `…${nm(s)}?`), `It's him. <b>Commander Haldane.</b> The man who taught you everything, and then disappeared without a word.`, D("Haldane", "You got tall. And you're doing something very stupid. Good. I taught you well."))
          : D("Haldane", "Commander Aurel Haldane. Former Dominion officer. Current guest. I know this ship. I know its codes. Get me out, and I'll get you anywhere you want to go."),
        `Across the corridor is a much bigger door with a bigger window. Inside, it's crowded: families, old folks, little kids, packed onto the floor. A small girl with braids sits right by the door, holding a doorstop wedge like a teddy bear.`)
    },
    s7: { title: "Two Doors", next: "s8",
      text: (s, r) => P(
        `<i>WHOOP. WHOOP. WHOOP.</i> Red lights flash. A calm computer voice speaks from the ceiling:`,
        `<b>LOCKDOWN IN TWO MINUTES. ALL BLOCKS WILL SEAL. HAVE A PRODUCTIVE DAY.</b>`,
        `Left: the corridor to cell block C, where Hal is. Right: the overflow block, twelve people inside, kids too. The girl with braids, Pip, has jammed her wedge under the door to keep it from sealing. It's sliding. It won't hold.`,
        D("Pip", "Hey! HEY! Are you a rescue? Are you rescuing us?"),
        `Two minutes. Two doors. Far apart. You can only reach one.`,
        N("<b>Hard choice.</b> Every option costs something.", "mark")),
      choices: s => [
        { label: "Run for Hal", go: (s, r) => ({ text: ["You sprint. Behind you, the overflow door grinds shut. You hear Pip yelling. You don't turn around. You reach block C as its doors start moving and slam the panel. They stop. You made it. When you look back, the overflow door is sealed, and Pip's face is in the little window, watching you.", addWound(s, "not_enough_hands")] }) },
        { label: "Run for the overflow block", go: (s, r) => { r.f.overflow = true; return { text: ["You grab the door with both hands and <i>heave</i>, and twelve people pour out around you: grandparents, parents, little kids holding hands. Pip hugs your leg. Behind you, block C seals with a heavy <i>CLANK</i>. Getting to Hal just got much harder.", strain(s, "Exhausted"), truth(s)] }; } },
        s.marked && { label: { forge: "Burn the Ember: hold one door with blazing hands", ward: "Burn the Ember: hold BOTH doors open", lantern: "Burn the Ember: find the crawlway that connects them", echo: "Burn the Ember: yell at the lockdown computer" }[s.kind], tag: "Ember burn", go: (s, r) => { r.f.overflow = true; r.f.both = true; return { text: [
          { forge: "You jam your glowing hand into the overflow door. The metal screams and stops. Everyone squeezes out, and you run for block C with your hand still smoking.",
            ward: "Light explodes out of you, so wide it reaches both corridors, wrapping both doors like a giant hand holding them open.",
            lantern: "Your eyes blaze and you see a maintenance crawlway behind the walls, connecting both blocks. You get everyone into it.",
            echo: "“STOP!” The lockdown stops. “…PAUSING LOCKDOWN,” it says, sounding confused. “HAVE A PRODUCTIVE DAY.”" }[s.kind], N("Everyone gets out. Both doors.", "good"), burn(s, r), truth(s)] }; } }
      ].filter(Boolean)
    },
    s8: { title: "Hal", next: "s9",
      text: (s, r) => P(
        r.f.overflow && !r.f.both && D("Haldane", "(tapping a long code into block C's panel) Officer override. They never changed it. Lazy."),
        `The cell door slides open.`,
        `Hal is sitting in the corner with his hands jammed under his armpits, hiding them. He flinches. Then he sees you.`,
        r.f.metHal ? D("Hal", "…Oh, you've GOT to be kidding me.") : D("Hal", "Who… who are you?"),
        r.f.metHal ? P(`He starts laughing, then he's crying a little and laughing at the same time, wiping his nose on his sleeve.`, D("Hal", "You came to a <i>prison barge</i>. For <i>me</i>. That's the dumbest thing anyone's ever done for me. Thank you."))
          : P(`“Marrow sent me.” His face cracks open into the biggest grin you've ever seen.`, D("Hal", "Marrow sent a stranger to break me out of a prison barge? I love that woman. Hi. I'm Hal. Let's go.")),
        ensureComp(s, "Hal").wound === "crew_turned" && `When he sees the crowd of freed prisoners in the corridor, he pulls back. Groups scare him now.`,
        ensureComp(s, "Hal").wound === "seen" && `When the freed prisoners stare at his glowing hands, he flinches and starts talking a mile a minute. “It's fine, it's a thing, it's not contagious…”`,
        hasBurden(s, "hal_taken") && dropBurden(s, "hal_taken"))
    },
    s9: { title: "Dr. Solace", next: "s10",
      text: s => P(
        `On the way to the stairs you pass the barge infirmary, locked from outside. Through the window, a woman in a stained white coat looks up from a book and raises an eyebrow, like you're a mildly interesting bug.`,
        D("Solace", "Dr. Imre Solace. Forge Compact. They locked me up for fixing Marked patients. I've been bored out of my mind for six weeks."),
        anyWound(s) ? P(D("Solace", "You're carrying something. I can tell by how you stand. Let me out, give me ten minutes, and I'll help you put it down."), `Above you, an alarm whoops. They're sealing the shuttle bay.`, N("<b>Heal Fork.</b> Heal now, and Haldane stops waiting for you and Kroll seals the main shuttle bay. Or keep moving, still carrying it.", "mark"))
          : P(`You let her out. While you run, she talks.`, D("Solace", "Want a secret? The Dominion's been <i>counting</i> you Marked. A hundred years of records. And the number's going up faster every year. They're terrified of what happens when it reaches the end."), mystery(s, "The Dominion has been counting the Marked for a hundred years."))),
      choices: s => anyWound(s) ? [
        { label: "Take the ten minutes", go: (s, r) => { r.f.healed = true; const w = s.wounds[s.wounds.length - 1];
          const txt = { not_enough_hands: "Solace listens to the whole story about Pip. Then: “I've been choosing who to help first for twenty years. You don't carry them all yourself. You carry them with the next person. Go find the next person.”",
            too_much_light: "Solace has treated Marked patients in secret for years. She presses two cold metal discs to your wrists and the burning drains, slow and steady, like water out of a tub.",
            count_the_breaths: "Solace opens the air vent all the way and sits with you. “In for four. Out for four.” She counts with you until you're not counting alone anymore.",
            untethered: "Solace has you stand on a chair, eyes closed, holding her hand. Then on the desk. Then you open your eyes. You're fine. You were always fine." }[w] || "Solace pulls out a little humming tool that looks like a glowing pencil. “Hold still. This tickles.” It does not tickle. It feels like fire ants. But five minutes later, it doesn't hurt anymore.";
          return { text: [txt, healWound(s, w), N("The cost: Haldane went ahead on his own, and Kroll sealed the main shuttle bay.", "bad")] }; } },
        { label: "Open her door and keep moving", go: () => ({ text: ["Solace shrugs. “Your loss. Literally.” She follows you anyway."] }) }
      ] : null
    },
    s10: { title: "Kroll", next: "s11",
      text: (s, r) => P(
        `The stairway opens into a long glass corridor full of stars. Warden Sabeth Kroll is standing in the middle of it, alone, hands behind her back.`,
        hasBurden(s, "kroll_hunt") ? D("Kroll", "I wondered how long it would take you. I had a bet with myself. You're early.") : D("Kroll", "Hello. You must be the one who's been opening my doors."),
        `She doesn't call guards. She just turns and looks at you, calm and patient.`,
        D("Kroll", "Let me tell you about Commander Haldane. He trained me, when I was younger than you. The best officer in the fleet. Then one day he found a Marked child on a supply ship and let her go. Just opened the hatch. I'm the one who reported him."),
        D("Kroll", "You think I'm the villain. But I've read the old records. The <i>very</i> old ones. They say when enough Marked are born, Vael comes back. Not as a star. As something that <i>uses</i> you. I'm not trying to hurt anyone. I'm trying to stop the end of the world."),
        mystery(s, "The Dominion believes Vael will come back through the Marked.")),
      choices: s => [
        mentor(s, "haldane") && { label: "“He trained me too. Do you remember what he taught us?”", tag: "Mentor: Commander Haldane", check: { stat: "nerve", dc: 5 }, go: (s, r, pass) => { r.f.reachedKroll = pass; return { text: pass ? ["For the first time, her calm face cracks, just a little. She looks away. “He used to say, ‘Orders are a map, not a road.’” A long pause. “I'd forgotten that.”", N("Something changed in her.", "good")] : ["She smiles sadly. “He taught you to talk back, I see. That was always his weakness.”"] }; } },
        { label: "Hold her gaze and say nothing", check: { stat: "nerve", dc: 4 }, go: (s, r, pass) => ({ text: pass ? ["You don't flinch. Something like respect crosses her face. She steps aside. “I'll see you at the shuttle bay.”"] : ["She sees you're scared. “You can't hide it, you know.” Then she steps aside anyway. “I'll see you at the shuttle bay.”"] }) },
        { label: "“The end of the world? You lock up KIDS.”", go: () => ({ text: ["Kroll's jaw tightens. “Yes,” she says quietly. “I do.” She steps aside. “Go. I'll see you at the shuttle bay.”"] }) }
      ].filter(Boolean)
    },
    s11: { title: "Haldane's Codes", next: "s12",
      text: (s, r) => P(
        r.f.healed ? `By the time you reach the shuttle deck, Haldane is already there, holding a set of guard keys. He's been busy.` : `Haldane catches up with you at the shuttle deck, breathing hard, holding a set of guard keys. You don't ask where he got them.`,
        D("Haldane", "With my command codes, I can take the bridge. Turn this whole barge around. Open every cell on every deck. Two hundred prisoners, free."),
        `That sounds amazing. Then he keeps talking.`,
        D("Haldane", `And then I keep the ship. It has cannons. Plenty of the people in those cells are Marked, and angry, and they'd follow someone who set them free. The Dominion has hunted your kind for a hundred years, ${nm(s)}. Time someone hunted back.`),
        N("<b>Dilemma.</b> No choice here is clean.", "mark")),
      choices: (s, r) => [
        !r.f.healed && { label: "“Free them all. But no war. Put everyone in the lifeboats and let the barge drift.”", tag: hasTrait(s, "Peacemaker") ? "Strength: Peacemaker" : undefined, check: { stat: "nerve", dc: hasTrait(s, "Peacemaker") ? 0 : 6 }, go: (s, r, pass) => pass
          ? { text: ["Haldane stares at you. Then he laughs, short and surprised. “That's what I would have said. Twenty years ago.” He nods. Every cell opens. Every prisoner climbs into a lifeboat. The <i>Iron Mercy</i> will drift away empty.", truth(s)] }
          : { text: ["“No. Too slow. They'll catch us.” He's already turning toward the bridge. You'll have to decide fast."], next: "s11" } },
        { label: "Let Haldane do it his way", go: s => ({ text: ["He grips your shoulder. “You won't regret this.” Then he's gone. Minutes later, every cell door on the ship opens at once, and people pour into the corridors cheering. Through the window, the barge's cannons swing slowly around to face the stars.", addBurden(s, "haldane_war")] }) },
        { label: "Lock him back in his cell", go: s => ({ text: ["You lock the door between you. He doesn't shout. He just looks at you through the little window. “I understand,” he says. “I'd have done the same, once.”", mentor(s, "haldane") && addWound(s, "left_the_teacher")] }) },
        { label: "Warn Kroll about his plan", go: s => ({ text: ["You find a comm and call the bridge. “Haldane's coming for you.” Kroll answers instantly, like she was waiting. “Thank you. Your shuttle is free to go.” Everyone you came for is safe. Nobody will ever know what you did. Except you.", addWound(s, "bought_our_way_out")] }) }
      ].filter(Boolean)
    },
    s12: { title: "The Shuttle Bay", next: "s13",
      text: (s, r) => P(
        `You run. Everyone runs: you, Hal, ${r.f.overflow ? "Pip and the overflow families, " : ""}Dr. Solace, all of you, as fast as you can. Then a pipe bursts in the engine deck below, and black smoke pours up through the floor grates.`,
        fearHit(s, r, "fire"),
        hasWound(s, "untethered") && N("The fastest route is outside the hull, on a maintenance rail over open space. <span class='dim'>(Untethered: Wits −2 up high.)</span>", "bad")),
      choices: (s, r) => [
        { label: "Sprint for the shuttle", check: { stat: "reflex", dc: r.f.healed ? 6 : 5, bonus: hasSkill(s, "Pilot") ? 1 : 0 }, go: (s, r, pass) => ({ text: pass ? ["You skid into the shuttle bay. The little gray shuttle is right there, engines warming."] : ["You make it, but you slam into a doorframe on the way in.", strain(s, "Battered")] }) },
        trustOk(s, "Hal") && { label: "“Hal, which way?”", go: () => ({ text: ["Hal grabs your sleeve and pulls you down a side corridor. “Ventilation shaft. It's what I'd do if I were a ship.” He's right. You beat the smoke."] }) }
      ].filter(Boolean)
    },
    s13: { title: "The Last Hatch", next: "s14",
      text: s => P(
        `Everyone piles into the shuttle. It's crowded and loud and someone's elbow is in your ear.`,
        D("Pilot", "The outer hatch won't open from in here! Someone has to hold the manual release from inside the bay until we're clear. That big red lever by the wall!"),
        `There's the lever. Whoever holds it won't be on the shuttle when it leaves. And through the far doorway, walking calmly toward you, comes Warden Kroll.`,
        N("<b>The Crucible.</b> The biggest choice in the book.", "mark")),
      choices: (s, r) => [
        { label: "Hold the lever yourself", go: s => ({ text: ["You climb out and pull the big red lever with both hands. The outer hatch grinds open. The shuttle lifts off, and the last thing you see is Hal's face pressed against the glass. You hold on until the shuttle is a dot in the stars. Then you let go and <i>run</i>: through a maintenance tube, into a tiny escape pod, out into space. An hour later, the shuttle swings back and picks you up.", N("Everyone escapes.", "good"), addWound(s, "last_one_out"), truth(s)] }) },
        s.marked && { label: "Burn the Ember and hold the hatch open from the shuttle", tag: "Ember burn", go: (s, r) => ({ text: [
          { forge: "Your burning hands grip the edge of the hatch from ten feet away, like they're made of light.", ward: "Your shield wedges the hatch open like a glowing doorstop.", lantern: "You see the lever's wiring through the wall and burn it shut with a look.", echo: "You shout at the hatch, and it <i>listens</i>, and it stays open." }[s.kind],
          "The shuttle shoots through the gap. Kroll reaches the bay just in time to see your light, burning bright. She'll never forget it.", burn(s, r), addBurden(s, "kroll_hunt")] }) },
        trustHigh(s, "Hal") && { label: "Look at Hal", tag: "Hal's trust is high", go: s => ({ text: ["His hands are already glowing.", D("Hal", "I can talk to the hatch motor from here. Make it stay open. I've never talked to anything that wasn't an engine, but… stand with me?"), "You stand next to him. He puts his palms on the shuttle wall and hums, and across the bay, the hatch motor hums back. It stays open. The shuttle shoots free with everyone aboard. Hal sits down hard, staring at his hands, grinning so big it looks like it hurts.", N("Everyone escapes.", "good"), ensureComp(s, "Hal").wound ? compHeal(s, "Hal") : compStep(s, "Hal"), truth(s)] }) },
        r.f.reachedKroll && { label: "Wait. Watch Kroll.", tag: "You reached her with Haldane's words", go: s => ({ text: ["She reaches the lever first. Her hand is on it. She looks up and sees you through the window. Neither of you moves. Then, very slowly, she takes her hand away and steps back, and holds the hatch release open for you herself. She doesn't say anything. She just watches you go.", N("Everyone escapes.", "good"), addBurden(s, "kroll_owes"), truth(s)] }) },
        !s.marked && s.star >= 3 && { label: "Your hands are burning…", tag: "✦ Hidden choice", go: () => ({ text: ["Not hurting. <i>Burning.</i> Light, pouring out of you."], next: "awaken" }) }
      ].filter(Boolean)
    },
    awaken: { title: "The Mark Awakens", next: "s13",
      text: s => P(`Light pours out of you for the first time in your life. What kind of light is it?`),
      choices: s => ["lantern", "forge", "ward", "echo"].map(k => ({ label: { lantern: "Lantern: your eyes blaze, and you can see through everything", forge: "Forge: your hands burn hot enough to bend steel", ward: "Ward: light wraps around you like a shield", echo: "Echo: every machine on the barge starts humming your name" }[k],
        go: s => { s.marked = true; s.kind = k; s.stats.ember = 2; return { text: [N(`<b>Your Mark has awakened: ${k[0].toUpperCase() + k.slice(1)}.</b> Now choose again, with your new Mark.`, "mark")] }; } }))
    },
    s14: { title: "Open Sky", next: "END",
      text: s => P(
        `The <i>Iron Mercy</i> gets smaller and smaller behind you.`,
        hasBurden(s, "haldane_war") ? `As you watch, it turns slowly around, cannons glowing, and heads off toward the Dominion.` : `All around it, little lifeboats scatter like dandelion seeds.`,
        `Inside the shuttle, it's finally quiet. Hal sits beside you, looking at his hands. They're glowing faintly. He isn't hiding them.`,
        D("Hal", "In there, I kept thinking: what's the point of having this, if all it does is get me locked up? Still don't know. But I'm kind of glad I'm not hiding it anymore.")),
      choices: s => [
        { label: "Just listen", go: s => ({ text: ["You don't say anything. You stay there next to him while he talks. Sometimes that's enough.", trustOk(s, "Hal") ? trust(s, "Hal", 1) : ""] }) },
        { label: "“Next time, I'll come faster. Promise.”", go: s => ({ text: ["He laughs, a real laugh. “You'd better.”", trust(s, "Hal", 1), addBurden(s, "new_promise")] }) },
        anyWound(s) && { label: "Tell him about your own wound", go: s => ({ text: ["About the thing you've been carrying. He listens. When you're done, he nods. “Thought so. Takes one to know one.”", trust(s, "Hal", 2)] }) }
      ].filter(Boolean)
    }
  }
});

</script>

  },
  fears: { hit: "Afraid of Getting Hit", letdown: "Afraid of Letting People Down", leftout: "Afraid of Being Left Out", cameras: "Afraid of the Cameras" },
  strengths: { Bold: "You go for it.", Planner: "You study it.", Peacemaker: "You calm everyone down.", "Me First": "You protect your spot." },
  mentors: {

  },
  gaveUp: { friend: "A best friend on a different path", degree: "A degree you didn't finish", family: "Time with family", nothing: "Nothing. Not yet." },
  keepsakes: ["taped wristband", "high school game ball", "note in your cleat", "Grandpa's old whistle", "lucky mouthguard case", "photo of Junie"],
  extraSkills: ["Playbook", "Film Study", "Weight Room", "Special Teams", "Conditioning", "Route Running"],
  lateSports: ["basketball", "track", "soccer"],
  teams: [
    { tier: "First Round", name: "Harbor City Hammers", burden: "spotlight_deep" },
    { tier: "Middle Rounds", name: "Twin Rivers Thunder", burden: "depth_chart" },
    { tier: "Last Pick", name: "Northern Prairie Kings", burden: "last_pick" }
  ]

window.ob = {
  O: () => EF.series.oath,
  cls: (s, k) => s.cls === k,
  born: s => !!s.oathborn,
  kind: s => s.okind,
  home: (s, k) => s.home === k,
  // Calling on your Oath: like burning the Ember
  call: (s, r) => {
    r.burns += 1;
    let out = strain(s, "Oath-spent");
    if (r.burns >= 2 || hasWound(s, "hollowed")) out += addWound(s, "hollowed");
    return out;
  },
  calls: r => r.burns,
  firstTag: (s, t) => { const o = EF.series.oath.firstOaths[s.firstOath]; return !!o && o.tag === t; },
  firstText: s => {
    if (s.firstOath === "custom") return s.customOath ? String(s.customOath).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])) : "(the oath you wrote yourself)";
    const o = EF.series.oath.firstOaths[s.firstOath]; return o ? o.text : "your first oath";
  },
  oathName: (s, id) => id === "first" ? `Your first oath: “${ob.firstText(s)}”` : (EF.series.oath.oaths[id] || id),
  open: s => (s.oaths || []).filter(o => o.st === "open"),
  has: (s, id) => (s.oaths || []).some(o => o.id === id && o.st === "open"),
  status: (s, id) => { const o = (s.oaths || []).find(x => x.id === id); return o ? o.st : null; },
  swear: (s, id) => {
    s.oaths = s.oaths || [];
    if (ob.has(s, id)) return "";
    let out = "";
    const open = ob.open(s);
    if (open.length >= 3) {
      const drop = open.find(o => o.id !== "first") || open[0];
      drop.st = "down";
      out += N(`<b>Oath set down:</b> ${ob.oathName(s, drop.id).split(":")[0]}. You can only carry three. Setting it down isn't breaking it, but you can't pick it up again.`, "mark");
    }
    s.oaths.push({ id, st: "open" });
    return out + N(`<b>Sworn Oath:</b> ${ob.oathName(s, id)}`, "mark");
  },
  keep: (s, id) => { const o = (s.oaths || []).find(x => x.id === id && x.st === "open"); if (!o) return ""; o.st = "kept"; return N(`<b>Oath kept:</b> ${ob.oathName(s, id).split(":")[0]}.`, "good"); },
  breakOath: (s, id) => {
    const o = (s.oaths || []).find(x => x.id === id && x.st === "open");
    if (!o) return "";
    o.st = "broken";
    s.stats.oath = Math.max(0, s.stats.oath - 1);
    return N(`<b>Oath broken:</b> ${ob.oathName(s, id).split(":")[0]}. Something cracks inside your chest. <span class="dim">(Oath −1.)</span>`, "bad") + addWound(s, "oathbroken");
  },
  // true choices (Legend meter + Awakening)
  tc: (s, r) => { r.f.tc = (r.f.tc || 0) + 1; s.star += 1; return ""; },
  canAwaken: (s, r) => !s.oathborn && (r.f.tc || 0) >= 2,
  awaken: s => {
    const k = pick(Object.keys(EF.series.oath.kinds));
    s.oathborn = true; s.okind = k; s.stats.oath = Math.max(1, s.stats.oath);
    return N(`<b>Your Oath awakens: ${EF.series.oath.kinds[k].name}.</b> It feels like ${EF.series.oath.kinds[k].feel}. <span class="dim">(Oath ${s.stats.oath}.)</span>`, "mark");
  },
  // Posy
  posyW: s => { const c = s.comp.Posy; return c ? [c.wound, c.wound2].filter(Boolean) : []; },
  posyHas: (s, id) => ob.posyW(s).includes(id),
  posyFresh: s => ob.posyW(s).length === 0,
  posySilent: s => ob.posyHas(s, "posy_words") || ob.posyHas(s, "posy_shout"),
  posyGain: (s, id) => {
    const c = ensureComp(s, "Posy");
    if (c.wound || c.wound2) return "";
    return compWound(s, "Posy", id);
  },
  posyHeal: (s, id) => {
    const c = ensureComp(s, "Posy");
    if (c.wound === id) return compHeal(s, "Posy");
    if (c.wound2 === id) { const w = EF.wounds[id]; c.scar = id; c.wound2 = null; return N(`<b>Posy works through it. Scar: ${w.scar}.</b> ${w.scarText}`, "good"); }
    return "";
  },
  // Posy says a line: out loud, or on her slate if she's silent
  say: (s, text) => ob.posySilent(s)
    ? `<div class="slate">${text.toUpperCase().replace(/[“”"]/g, "")}</div>`
    : D("Posy", text),
  // items
  give: (s, item) => { s.items = s.items || []; if (!s.items.includes(item)) s.items.push(item); return N(`<b>You gained:</b> ${item}.`, "good"); },
  item: (s, item) => (s.items || []).includes(item),
  drop: (s, item) => { s.items = (s.items || []).filter(x => x !== item); return ""; },
  // who comes along
  brynHome: s => s.flags.bryn !== "taken",
  played: (s, id) => s.done.includes(id),
  firstBook: (s) => !EF.series.oath.starters.some(id => s.done.includes(id)),
  // a choice that only shows when a condition holds
  when: (cond, choice) => cond ? choice : null
};

<script>
/* ===== Oathbound Book 01 — The Night the Stone Cracked ===== */
(function () {
const rowanCls = s => s.cls === "knight" ? "Ranger" : "Knight";
const posyT = s => compTrust(s, "Posy");
EF.books.push({
  id: "stone", series: "oath", title: "The Night the Stone Cracked", where: "Hollin's Ford", starting: true,
  blurb: "It's Oath Day, and you're old enough to swear your first great oath in front of the whole village. Halfway through, the oathstone splits, and the forest answers.",
  recommend: s => s.done.length === 0 ? "Great first book" : (!s.done.includes("stone") ? "Home to Hollin's Ford" : null),
  start: "s1",
  setup: (s, r) => {
    ensureComp(s, "Posy", 1); ensureComp(s, "Rowan", 1);
    s.comp.Posy.travel = true;
    r.f.fresh = ob.posyFresh(s);
  },
  resultsExtra: (s, r) => {
    const next = [];
    if (s.flags.bryn === "taken") next.push("<b>Into the Deep Wood:</b> Aunt Bryn is somewhere in the forest. You're going to get her back.");
    if (ob.has(s, "marrow")) next.push("<b>The Road to Greyspire:</b> A sword, a promise, and a long road to the capital.");
    if (s.flags.rowan === "jailed") next.push("<b>The Warden's Keep:</b> Rowan is in Vale's prison.");
    if (ob.has(s, "forest") || ob.has(s, "wood") || ob.has(s, "friend") || s.flags.thornling) next.push("<b>The Thornling's Path:</b> Walk the edge of the wood, and learn what the Eldfolk want.");
    return `<h3>🌿 Oaths and promises</h3>${obOathsList(s)}
      ${s.flags.thornling ? `<p>🦊 <b>The thornling</b> is curled around your neck like a leafy scarf. It has decided you belong to it.</p>` : ""}
      ${next.length ? `<h3>Stories waiting for you</h3><ul>${next.map(x => `<li>${x} <span class="dim">(coming soon)</span></li>`).join("")}</ul>` : ""}
      <p class="dim">You can also play <b>The Drowned Road</b> or <b>The Wolf Winter</b> next.</p>`;
  },
  scenes: {
    s1: { title: "Oath Day Morning", next: "s2",
      text: s => P(
        `The first thing you hear on Oath Day is Posy.`,
        D("Posy", `Wake up wake up wake up. ${nm(s)}. It's <i>today</i>. Are you awake? Your eyes are open. That means you're awake.`),
        `Your cousin is ten years old and sitting on the end of your bed, already dressed, already wearing three ribbons in her hair: red, yellow and green. None of them match. She doesn't care.`,
        D("Posy", "Mama made honey cakes. I already ate two. Don't tell her. Actually, she knows. She counted."),
        `Downstairs, the ferry house smells like smoke and honey. Through the window you can see the river, wide and brown and slow, and the big flat ferry with ribbons knotted along every rope. Behind the village green, dark and close, is the old forest.`,
        `Nobody in Hollin's Ford goes into the forest. Nobody has for three hundred years. That's the <b>First Oath</b>, the oldest promise in Aldermere: <i>people stay out of the deep wood, and the wood stays out of the towns.</i>`,
        { millbrook: "You grew up two farms over, close enough to hear Bryn's ferry bell. When your parents moved downriver for work, you stayed.",
          greyspire: "You were sent here from the city “for some fresh air,” after trouble you'd rather not talk about. It's been a year. You still miss the noise.",
          saltreach: "Your parents are fishing the far coast this season. Bryn is your mother's sister, and she has the same laugh.",
          highfall: "The clan sent you down the mountain to learn a trade, and to learn to get along with lowlanders. The second part is harder.",
          fenwood: "Your village upriver flooded last spring. Bryn took you in without even asking how long you'd stay.",
          shrine: "Bryn took you in from the shrine when you were small. She has never once called you anything but family. You still aren't sure you believe it." }[s.home],
        `Aunt Bryn is at the stove: tall, sunburned, rope-rough hands. She runs the only ferry for twenty miles. When she sees you, she fixes your collar without a word, the way she does when she's proud and doesn't want to say so.`,
        D("Bryn", "Big day."),
        D("Posy", "The <i>biggest</i> day. When I'm thirteen I'm going to swear I'll be the best ferry captain in all of Aldermere. And find a real dragon. And never eat turnips again. You can swear more than one, right?"),
        D("Bryn", "You can swear as many as you can keep. That's the part people forget."),
        ob.born(s) && `For a moment, Bryn's eyes drop to your hands. She looks at them the way you'd look at a pot that might boil over. Then she turns back to the stove.`,
        hasTrait(s, "Looks Down on Others") && N(`<b>Looks Down on Others.</b> Out the window, a farmer is chasing a goose across the dock. In Greyspire, Oath Day had trumpets. Here it has geese.`, "mark"),
        hasTrait(s, "Wants to Belong") && N(`<b>Wants to Belong.</b> Today the whole village watches you swear. What if nobody cheers?`, "mark"),
        hasTrait(s, "Never Left Home") && N(`<b>Never Left Home.</b> Today is the biggest crowd you'll ever stand in front of. Your hands are sweating already.`, "mark"),
        ob.posyHas(s, "posy_promises") && `When Bryn says “keep,” Posy rolls her eyes. She's heard a lot of promises lately.`,
        ob.posyHas(s, "posy_fault") && `Posy knocks over the honey pot and says sorry four times before it even stops rolling.`,
        `Posy grabs your hand and pulls. “Come <i>on</i>. If we're late, Hob Tully gets the good spot by the pie table.”`
      )
    },
    s2: { title: "The Fair", next: "s2b",
      text: s => P(
        `The village green is full: pie tables and ribbon stalls, a fiddler, two goats wearing hats. In the middle of it all stands the <b>oathstone</b>: taller than a grown man, gray as a storm, and covered in carved promises packed so close together they look like lace. Brother Tam from the shrine is up on a ladder, brushing moss out of the old letters.`,
        `Near the top, one line has been scratched away so hard the stone is gouged. Everyone has seen it their whole life. Nobody knows what it said.`,
        { healer: "A crash at the greased pole. A boy has slipped and landed on his arm. You're there before the adults are. Not broken, just twisted. You bind it with a strip of your sleeve, and by the time his mother arrives he's sniffling instead of screaming. Your hands are steady. They always are, when someone's hurt.",
          knight: "By the cider barrel, a big farmhand named Hob Tully shoves a younger boy out of line. You step between them before you've decided to. Hob is bigger than you, but you plant your feet and don't move. After a long moment, he snorts and walks off. Your knees feel like water. But you didn't move.",
          rogue: "You spot a thin man in a brown coat bumping into people by the pie table. Each time, his hand slides into a pocket and out again. It's a good trick. You know, because you've done it. A minute later the three purses he stole are back on the pie table, and you're eating a pie, looking somewhere else.",
          wizard: "The lantern contest: whoever makes their lantern burn brightest wins. Most kids use better oil. You use a spell, the first one you ever learned. The flame shrinks to a speck, then blooms white and clean, so bright people shade their eyes. You win. Barely. Your head aches like you've read all night.",
          ranger: "You're watching the forest edge when every bird in the trees lifts at once. Hundreds of them, all flying <i>away</i>, the wrong way for this time of day. Nobody else notices. They're watching the goats in hats. You keep watching the trees.",
          barbarian: "The stone-carry: pick up the big river stone, walk it end to end, don't drop it. You make it all the way and back, and the crowd roars. But when you set it down, the stone is warm, like it's been in the sun all day. It's been in the cold river all morning." }[s.cls],
        `Then you notice someone not watching the games at all: a boy about your age, with dark hair that needs cutting and a traveler's coat that's seen a lot of road. <b>Rowan Ashe.</b> He came to Hollin's Ford a month ago. He's staring at the oathstone like he's trying to memorize it.`,
        `He catches you looking. For half a second, he looks guilty. Then he grins.`,
        D("Rowan", "Big rock. Ever wonder what that scratched-out line said?"),
        `Before you can answer, he's gone into the crowd.`
      ),
      onEnter: (s, r) => { if (s.cls === "wizard" || s.cls === "barbarian") r.f.ribbon = "have"; return ""; },
      choices: (s, r) => [
        mentor(s, "tam")
          ? { label: "Read the stone the way Brother Tam taught you", tag: "Mentor: Brother Tam", go: (s, r) => { r.f.crack = true; return { text: ["Top to bottom, crack by crack. There's a crack running down from the scratched line, thin as a hair. Growing out of it are three tiny green leaves. Spring leaves. <i>It's autumn.</i>"] }; } }
          : { label: "Look closely at the oathstone", check: { stat: "lore", dc: 4 }, go: (s, r, pass) => { r.f.crack = pass; return { text: pass ? ["There's a crack running down from the scratched line, thin as a hair. Growing out of it are three tiny green leaves. Spring leaves. <i>It's autumn.</i>"] : ["The stone looks the way it always does: old, gray, and covered in promises."] }; } },
        { label: "Go find Posy", go: () => ({ text: ["You find her at the ribbon stall, staring at a blue ribbon like it's made of gold."] }) }
      ]
    },
    s2b: { title: "A Blue Ribbon", next: "s3",
      text: (s, r) => P(
        D("Posy", "That one. The blue one. If you win a ribbon at the games, will you give it to me? <i>Promise?</i>"),
        r.f.ribbon === "have" && `You pull your blue ribbon out of your pocket. Posy's mouth falls open.`
      ),
      choices: (s, r) => r.f.ribbon === "have" ? [
        { label: "Give it to her now", go: s => { r.f.ribbon = "given"; return { text: ["She ties it into her hair with the other three. Now nothing matches even more. She has never looked happier.", trust(s, "Posy", 1)] }; } },
        { label: "“After the swearing.”", go: s => { r.f.ribbon = "pocket"; return { text: ["You keep it in your pocket for now. <span class='dim'>(Small promise: Posy's ribbon.)</span>"] }; } }
      ] : [
        { label: "“I promise.”", go: (s, r) => { r.f.ribbon = "promised"; return { text: ["Posy squeals and hugs you around the middle. <span class='dim'>(Small promise: Posy's ribbon. You'll need to win one.)</span>"], next: "s2c" }; } },
        { label: "“Maybe.”", go: () => ({ text: ["She rolls her eyes. “Maybe means no.” But she's still smiling."] }) }
      ]
    },
    s2c: { title: "The Sack Race", next: "s3",
      text: s => P(`There's one game left before the swearing: the sack race. You climb into a potato sack next to Hob Tully's little brother.`),
      choices: s => [
        { label: "Hop for it!", check: { stat: "swift", dc: 4 }, go: (s, r, pass) => {
          if (pass) { r.f.ribbon = "given"; return { text: ["You hop, stumble, nearly fall, and cross the line just ahead of Hob Tully's little brother. Blue ribbon! You hand it to Posy, and she ties it on with the other three. <span class='dim'>(Small promise kept.)</span>", trust(s, "Posy", 1)] }; }
          return { text: ["You trip on the second hop and land in a heap. Posy laughs so hard she has to sit down. <span class='dim'>(No ribbon yet. The promise is still open.)</span>"] };
        } }
      ]
    },
    s3: { title: "Your First Great Oath", next: "s4",
      text: s => P(
        `The bell at the shrine rings three times. The whole village gathers in a ring around the oathstone. Brother Tam stands in front of it, holding a small chisel and a hammer.`,
        D("Tam", "A promise spoken at the oathstone is not a small thing. Say only what you mean. Mean everything you say."),
        `One by one, the new oath-takers step up. Hob Tully swears to take over his father's mill. The blacksmith's daughter swears to forge a sword for the king someday, and everyone laughs kindly. Then Brother Tam says your name.`,
        hasTrait(s, "Wants to Belong") && `Your legs don't want to move. Your heart is pounding in your throat.`,
        `You put your hand flat against the stone. It's cool and rough, and you can feel a hundred other promises under your palm. You say it out loud:`,
        `<p style="font-size:1.15em"><b>“${ob.firstText(s)}”</b></p>`,
        ob.born(s)
          ? P(`The moment you finish speaking, the stone <i>lights up</i>. It starts under your hand, a warm glow like sunlight through a leaf, then races outward along every carved letter at once. Three hundred years of promises blaze gold. The crowd gasps. Brother Tam's chisel slips from his fingers into the grass.`,
              { shield: "Your chest feels heavy and warm, like armor made of sunlight.", truth: "Your ears are ringing, a clear, high note only you can hear.", bind: "Your hands are cold and tight, like you just let go of a rope.", mend: "You feel a tug inside you, like a thread being pulled straight." }[s.okind],
              `Nobody cheers. In the silence you find Aunt Bryn's face in the crowd. She doesn't look surprised. She looks <i>frightened</i>, like something she's been afraid of for a long time just came true.`,
              D("Tam", "(quietly) That has not happened in my lifetime."), `He carves your oath anyway. His hands shake a little.`)
          : P(`Brother Tam carves your words into the stone. <i>Tink. Tink. Tink.</i> Each letter is a little bit of you, staying here forever. When he's done, the village cheers, and somewhere in the middle of it a small, high voice yells louder than anyone:`,
              D("Posy", "THAT'S MY COUSIN!"),
              hasTrait(s, "Wants to Belong") && `They cheered. For you. You let out a breath you've been holding since breakfast.`),
        mentor(s, "marrow") && `At the back of the crowd, Old Marrow catches your eye and nods once, slowly, the way a knight nods at another knight.`,
        mentor(s, "isel") && `You think you see Grandmother Isel at the edge of the trees, watching. When you look again, she's gone.`,
