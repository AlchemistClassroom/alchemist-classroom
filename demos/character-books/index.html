        { label: "Wake Posy. Show her.", go: (s, r) => { r.f.frogs = true; return { text: ["You carry her down, still half asleep. Her eyes get wider and wider.", ob.posySilent(s) ? "She doesn't write anything. She leans against you and watches." : "“He said he'd show me,” she whispers. “He promised.” “I know,” you say. “I'm keeping it for him.”", trust(s, "Posy", 1)] }; } },
        { label: "Let her sleep", go: () => ({ text: ["You watch the frogs alone. It's beautiful. It's lonely."] }) }
      ]
    },
    s12: { title: "The Drowned Stone", next: "s13",
      text: s => P(
        `On the third morning the fog lifts all at once, like a curtain, and there it is: <b>Sedge Crossing</b>. A wide, slow river, and in the middle of it the oathstone, waist-deep, leaning like a tired giant, split from top to bottom. Water pours through the crack.`,
        `On the bank, three long flat gray boats are pulled up on the mud. A dozen men and women in long gray oilcloth coats stand beside them, swords on their hips.`,
        hasWound(s, "grey_hands") && N("<b>Grey Hands.</b> Your stomach drops.", "bad"),
        ob.born(s) && `The moment you see the stone, your hand starts to pull toward it, like a compass needle pulling north. Your palm is warm. The stone wants you.`,
        s.flags.thornling && `The thornling's leaves stand up all over. It hisses at the gray boats like a dry twig snapping.`
      ),
      choices: (s, r) => {
        const auto = s.cls === "wizard" || (ob.born(s) && s.okind === "truth");
        const ok = (s, r) => {
          s.flags.m2 = true;
          return [`<div class="wcard"><i>Here the First Queen of Aldermere and the River make their promise. The people will not enter the river's deep places. The river will keep within its banks. And I, knight of the Queen, swear to the river as I swore to the wood: I will keep the Queen's word when she cannot. — AL…</i><br><br>And under it, carved later in a shakier hand: <b>Broken. Forgive me.</b></div>`,
            "Somebody broke the promise. And they were sorry.",
            s.flags.m1 && "It's the same knight, the one whose name begins with AL, who witnessed the First Oath at Hollin's Ford. They didn't just witness one promise. They swore to keep all of them. And then they broke one.",
            s.flags.m3 && "And you know what happened next: the knight's own oath took their name from every stone.",
            mystery(s, "The Unnamed Knight swore to the river too. Someone later carved “Broken. Forgive me.”")];
        };
        return [auto
          ? { label: s.cls === "wizard" ? "Wade out and whisper the reading-spell" : "Wade out and let your Oath read it", tag: s.cls === "wizard" ? "Wizard: Spellwork" : "Oath: Truth", go: (s, r) => ({ text: ok(s, r) }) }
          : { label: "Wade out and read the inside of the stone", check: { stat: "lore", dc: 6, bonus: (s.flags.thornling ? 1 : 0) + (r.f.healed ? -1 : 0) }, go: (s, r, pass) => ({ text: pass ? ok(s, r) : ["A Grey Coat reaches the stone before you and holds a lantern to the crack, blocking it with his body. You can't see a thing."] }) }];
      }
    },
    s13: { title: "The Grey Coats", next: "s14",
      text: (s, r) => {
        let w = "";
        if (r.f.fresh) w = ob.posyGain(s, "posy_promises");
        return P(
          `A tall, thin woman with a long pale face and gray hair pulled back tight walks out to meet the caravan. She carries no sword. The others watch her like dogs watching their owner.`,
          D("Sallow", ob.born(s) ? "Mister Pike. You're late. I'm Captain Sallow. The Oathborn child comes with us and puts their hand on the stone. Then the rest of you can walk home." : "Mister Pike. You're late. I'm Captain Sallow. The merchant's winch, and every strong back in this caravan, until that stone is up and copied. Then… we'll see."),
          r.f.pike === "exposed"
            ? `Then Pike steps out from behind the gray boats. He came straight here after he ran. Before anyone can move, two Grey Coats grab Posy and pull her away from you. “Insurance,” says Sallow. Pike flinches. But he doesn't move.`
            : `Then Pike moves. He walks over to Posy, takes her hand, gently, the way he did in the frog boat, and walks her across the mud. He puts her hand in Sallow's. “Insurance,” Sallow says, almost kindly. Pike won't look at Posy. He won't look at you.`,
          r.f.fresh ? P(`Posy looks up at him, and her face crumples. Not into crying. Into confusion, like a sum that keeps coming out wrong.`, D("Posy", "But you <i>promised</i>."), w)
            : ob.posyHas(s, "posy_words") ? `Posy drops her slate in the mud. The man who said <i>no promise needed</i> just handed her to strangers.`
            : ob.posyHas(s, "posy_shout") ? `Posy has gone perfectly still in Sallow's grip. If anyone shouts, she won't be able to run.`
            : `Posy stares at Pike with flat, hard eyes. She isn't surprised. That's the worst part.`,
          ob.calls(r) >= 1 && N("Your Oath is still thin. Calling on it again would cost you more.", "mark")
        );
      },
      choices: (s, r) => [
        { label: ob.born(s) ? "“Let her go. I'll open your stone.”" : "“Let her go, and we'll raise your stone.”", go: (s, r) => ob.born(s)
          ? { text: ["Sallow lets Posy go, and she runs to you. You give her to Dunn. Then you wade into the river and put your palm flat on the crack. The stone <i>opens</i>, a hand's width, and light spills out, and Sallow's people crowd in with paper and charcoal. When you take your hand away, a little of your Oath stays behind in the stone.", addBurden(s, "grey_carving"), addWound(s, "opened_stone"), ob.tc(s, r)] }
          : { text: ["All day, every adult in the caravan hauls on ropes and cranks Odile's winch while Posy sits on the bank next to a Grey Coat. By sundown the stone is up and dripping and copied. Sallow lets Posy go. She lets you all go. She takes the winch.", addBurden(s, "grey_carving"), strain(s, "Exhausted"), ob.tc(s, r)] } },
        { label: "Fight", go: (s, r) => ({ text: ["“Dunn!” He's already moving, huge and fast and very quiet, and he hits the two Grey Coats nearest Posy like a falling tree.", r.f.pike === "odile" && "Odile was ready. She has a short cudgel up her sleeve, and she's using it.", ob.item(s, "Marrow's sword") && "Marrow's sword sings as it comes out.", "Gray coats everywhere. The river roaring. And then Posy is in your arms and the Grey Coats are scattering to their boats. For days afterward, every time you close your eyes, you see gray hands reaching.", addWound(s, "grey_hands"), N("Courage +1. <span class='dim'>(This wound can't be worked through in this book.)</span>", "good"), (s.stats.courage += 1, "")] }) },
        ob.when(ob.born(s), { label: "Call on your Oath", tag: "Oath", go: (s, r) => ({ text: [{ bind: "Your Oath grabs all three gray boats and holds them in the mud like they've been nailed down. Sallow looks at her boats, then at you, and slowly lets go of Posy.", shield: "Gold light bursts around Posy so suddenly that Sallow lets go with a yelp, like she touched a hot stove.", truth: "“You were never going to let them go. <i>Leave the rest to the fen.</i> Tell them, Sallow.” Some of the Grey Coats didn't know. Two of them put down their swords. In the confusion, Dunn grabs Posy.", mend: "You reach for the crack in the stone and <i>close</i> it. Stone grinds on stone. The carving is gone forever behind a solid wall. Sallow screams. There's nothing left to hold Posy for." }[s.okind], ob.call(s, r), addBurden(s, "grey_face")] }) }),
        ob.when(ob.item(s, "Reed skiff"), { label: "Drop the skiff in the water and paddle for Posy", tag: "Skiff", check: { stat: "swift", dc: 6, bonus: ob.posyHas(s, "posy_shout") ? -1 : 0, tags: ["water"] }, go: (s, r, pass) => pass
          ? { text: ["“POSY, JUMP!” She jumps and lands in the skiff in a heap, and you paddle out into the fast current where the heavy gray boats can't follow. Behind you, the Grey Coats wade out to the stone with paper and charcoal.", addBurden(s, "grey_carving")] }
          : { next: "s13", text: ["A Grey Coat catches the skiff's edge and flips it. You come up gasping in the cold river.", strain(s, "Soaked")] } }),
        ob.when(r.f.pike === "believed", { label: "Look at Pike", tag: "You told him he'd have to choose", go: (s, r) => { r.f.pikeChose = true; s.flags.pike = "taken"; return { text: ["You don't say anything. You just look at him. Pike looks back. Then at Posy. Something in his face changes. He walks up to Sallow, scoops Posy up, and <i>throws</i> her across the mud to Dunn, who catches her like a sack of flour. Then he turns and stands between the Grey Coats and the caravan, arms spread, nothing in his hands but his marsh pole.",
          D("Sallow", "Mister Pike. Think about your daughter."), D("Pike", "I am."),
          "He looks back once at Posy. “Told you they glowed, Captain. I keep the ones that matter.” The Grey Coats take his pole. They tie his hands. They put him in a gray boat. “We'll take what we came for another day,” Sallow says, and the boats disappear into the fog.",
          compStep(s, "Posy"), addBurden(s, "pike_taken"), ob.tc(s, r)] }; } }),
        ob.when(r.f.heron, { label: "A shadow passes over the river…", tag: "The heron", go: (s, r) => ({ text: ["It's the gray heron from the net. It glides down and lands, light as a leaf, on top of the leaning stone. And the river <i>rises</i>: one great smooth swell that lifts the gray boats off the mud and spins them away like leaves. The Grey Coat holding Posy lets go to save himself, and she wades to you.",
          D("The Fenmother", "The river remembers who cut the net. One promise: when the oaths are judged, speak for the river. Tell them it kept its word three hundred years. Tell them who broke it."),
          "“I swear it.” The river sighs. The heron lifts away.", ob.swear(s, "river"), ob.tc(s, r)] }) }),
        ob.when(ob.canAwaken(s, r), { label: "Your words have weight now. You can feel it.", tag: "Something new", go: (s, r) => ({ text: ["You look at Sallow. “Let her go. I promise you'll regret it if you don't.” Your words come out <i>glowing</i>. Sallow lets go of Posy as if her hand had been burned. Every Grey Coat on the bank takes a step back. “Oathborn,” she whispers. “But they said you were common…” “I was.”", ob.awaken(s), addBurden(s, "grey_face")] }) })
      ]
    },
    s14: { title: "Saltmere at Dusk", next: "END",
      text: (s, r) => P(
        `The caravan comes out of the Gloamfen at sunset onto a long shingle beach, and suddenly there's the sea: enormous, gray-gold and loud, all the way to the edge of the sky. Kit runs straight into the waves with his clothes on.`,
        `At the end of the beach, a tiny old woman in a huge wool coat waves both arms from the door of a stone house on the rocks. Grandmother Wend. Below her, three fat gray seal pups are barking.`,
        s.flags.bryn === "taken" && `Grandmother Wend hugs you, then holds you at arm's length. “Bryn,” she says. You nod. She closes her eyes a moment. “Inside. Food first. Then we make a plan.”`,
        `Later, you sit on the rocks with Posy and watch the seals. Finally she asks:`,
        ob.say(s, "Was Pike bad?")
      ),
      choices: (s, r) => [
        { label: "“Yes. He lied to all of us.”", go: s => ({ text: [r.f.pikeChose ? "“But he threw me,” Posy says. “Away from them.” She frowns, like the sum is coming out wrong again." : "“I thought so,” she says. She sounds very old.", odileEnd(s, r)] }) },
        { label: "“He did a bad thing, for a reason that mattered to him.”", go: s => { r.f.teal = true; return { text: ["You tell her about Teal, and the debt, and a dad who'd do anything for his girl.", r.f.pikeChose ? "“So he was bad and good,” she says finally. “At the same time.” “Yeah. I think most people are.” She leans against you." : "“I don't care about his girl,” she says. “I'm a girl too.” You don't have an answer for that.", r.f.pikeChose && trust(s, "Posy", 1), odileEnd(s, r)] }; } },
        { label: "“I don't know, Pos.”", go: s => ({ text: ["“Me neither.” She puts her head on your shoulder and watches the seals.", odileEnd(s, r)] }) }
      ]
    }
  }
});
function odileEnd(s, r) {
  const out = [];
  if (ob.posyHas(s, "posy_promises")) out.push("You almost say <i>I promise it'll be okay</i>, and stop yourself just in time. So you don't promise anything. You just sit with her.");
  if (ob.status(s, "odile") === "kept") out.push("Odile finds you before the caravan breaks up. “Every barrel. You swore it and you did it.” She presses a heavy little purse into your hand. “If you ever need anything at all, find Varga's in Saltmere.”", addAlly(s, "Odile Varga"));
  else if (ob.status(s, "odile") === "broken") out.push("Odile finds you. “You swore.” That's all she says. She doesn't ask for the skiff back.");
  else if (r.f.sluice === "people") out.push("Odile finds you. “I lost everything I own last night. And none of them did.” She looks at Kit in the waves. “I'd have told you to save the salt. I'm glad you didn't listen.”", addAlly(s, "Odile Varga"));
  if (!r.f.cartLost) out.push("Kit runs up dripping and presses a little wooden bird whistle into Posy's hand. “For calling seals.” She blows it. A seal barks back. They both scream with laughter.", ob.give(s, "Kit's bird whistle"));
  else out.push("Kit sits on Posy's other side. “Will you write to me?” Posy nods.");
  out.push("Out on the rocks, the very fat seal pup rolls over, looks at Posy upside down, and barks once. Posy laughs.");
  return P(...out);
}
})();
</script>
<script>
/* ===== Oathbound Book 03 — The Wolf Winter ===== */
(function () {
const maudryClues = r => (r.f.cR ? 1 : 0) + (r.f.cT ? 1 : 0) + (r.f.cB ? 1 : 0);
EF.books.push({
  id: "wolf", series: "oath", title: "The Wolf Winter", where: "Kestrel Hold", starting: true,
  blurb: "Snowed in at a mountain hold with a dozen strangers. Something takes the goats. Then it takes a person. Someone here broke an oath, and everyone wants someone to blame.",
  recommend: s => s.done.length === 0 ? "Great first book" : (!s.done.includes("wolf") ? "Always available" : null),
  start: "s1",
  setup: (s, r) => {
    ensureComp(s, "Posy", 1); s.comp.Posy.travel = true;
    r.f.fresh = ob.posyFresh(s);
  },
  resultsExtra: (s, r) => {
    const next = [];
    if (r.f.cR || s.burdens.includes("maudry_held")) next.push("<b>The Road to Greyspire:</b> The Grey Man is collecting the inside of every stone. Now you know why.");
    if (ob.has(s, "mountain") || ob.has(s, "mend")) next.push("<b>The Wolf's Due:</b> The Rime Wolf comes down out of season to call in its promise.");
    if (s.burdens.includes("brannoc_sleeps")) next.push("<b>Wake the Sleeper:</b> Brannoc is still asleep in the ice. The highest clan hold may know a cure.");
    if (r.f.iskaT) next.push("<b>The Highfall Moot:</b> Iska's clan calls a gathering, and everyone is talking about the cracked stones.");
    return `<h3>🌿 Oaths and promises</h3>${obOathsList(s)}
      ${next.length ? `<h3>Stories waiting for you</h3><ul>${next.map(x => `<li>${x} <span class="dim">(coming soon)</span></li>`).join("")}</ul>` : ""}
      <p class="dim">You can also play ${["stone", "drowned"].filter(id => !s.done.includes(id)).map(id => `<b>${bookById(id).title}</b>`).join(" or ") || "the other books again with a new hero"} next.</p>`;
  },
  scenes: {
    s1: { title: "The Last Cart Up", next: "s2",
      text: s => P(
        `The mule hates the mountain, and the mountain hates the mule. The cart crawls up the switchbacks one terrible turn at a time: cliff straight up on one side, straight down into nothing on the other. Small dry snowflakes sting your face.`,
        !ob.played(s, "stone") && !ob.played(s, "drowned") && P(`Aunt Bryn put you on this cart three days ago.`, D("Bryn", "Harl's my big brother. He keeps the hold at the top of the pass. He doesn't talk much, but he'll keep you safe. Just until the stones stop cracking.")),
        ob.played(s, "stone") && s.flags.bryn !== "taken" && `Aunt Bryn sent you as far from the forest as she could think of: up the mountains to her big brother Harl.`,
        ob.played(s, "stone") && s.flags.bryn === "taken" && `Nobody sent you. You're going to Uncle Harl because he's Bryn's brother, and if anyone knows a way into the deep wood, it might be a Highfall man.`,
        ob.played(s, "drowned") && `Grandmother Wend sent you inland. The Saltmere docks were full of men in gray oilcloth asking questions. “Go to Harl. Nobody finds anybody in the mountains in winter.”`,
        { highfall: "You know these mountains. Your clan's hold is three peaks east. The air tastes like home, cold and clean. You also know a Highfall hold remembers every grudge for a hundred years.",
          millbrook: "You've never seen anything so big. The mountains don't care that you're here. It makes you feel like a pebble.",
          saltreach: "Up here there's no sea anywhere. You keep listening for waves that aren't there.",
          greyspire: "In the city the tallest thing was the palace. Here the palace would look like a doghouse.",
          fenwood: "No trees this high. Just rock and snow and sky. You miss the whisper of leaves.",
          shrine: "Brother Tam told you the mountain clans swear on their hearths instead of on stones. You wonder what that looks like." }[s.home],
        `At the top of the last switchback stands <b>Kestrel Hold</b>: a squat stone fortress built into the cliff, with a goat barn, a woodshed, a high-walled yard, and a chimney pouring smoke. A huge man waits at the gate, as wide as the gate, with a beard like a bear and an axe on his shoulder. He lifts Posy off the cart with one hand.`,
        D("Harl", `Posy. ${nm(s)}. Inside. Snow's coming.`),
        ob.posySilent(s) ? P(`Posy holds up her slate:`, `<div class="slate">HI UNCLE HARL</div>`, `He reads it and nods, very seriously, the way he'd nod at another grown-up. Posy stands up a little straighter.`)
          : ob.posyHas(s, "posy_promises") ? P(D("Harl", "You'll be safe here. I promise."), `Posy rolls her eyes so hard you can almost hear it. Harl blinks. He's clearly never been rolled-eyes at before.`)
          : P(D("Posy", "(loud whisper) Is he always like this?"), D("Harl", "(not turning around) Yes."), `Posy giggles and takes his huge hand without asking. He looks down, surprised, and doesn't let go.`),
        s.flags.thornling && `Inside your coat, the thornling shivers and burrows deeper. Its leaves have gone brown at the edges.`
      )
    },
    s2: { title: "Strangers at the Hearth", next: "s3",
      text: (s, r) => P(
        `Inside, Kestrel Hold is one huge stone room around the biggest fire you've ever seen, in a hearth as big as a cart. Everyone heading over the pass before winter has ended up here. Harl points at each one with his spoon, like counting goats.`,
        `<b>Sister Maudry</b>, a traveling oath-keeper in a gray shrine robe, straight as a fence post, with a silver oath-token on a chain. When she says grace in the old oath-words, her eyes move around the table, watching who mumbles. <b>Lady Corvane</b> from Greyspire, in a fur cloak far too fine for the mountains, who sends her soup back twice. <b>Brannoc</b>, her guard, quiet, a scar on his chin, who winks at Posy. <b>Gammer Hesk</b>, the cook, about a hundred years old, who laughs at everything. And a young tinker in the corner named <b>Fennick Bell</b>, who knocks over a cup, then a pot, then another pot. “S-sorry. Sorry. I'm so sorry.”`,
        `After supper, Harl crouches in front of Posy. “Everyone works in the hold. Yours is the goats. Every night at dusk, you latch the pen. The big iron latch.”`,
        ob.posySilent(s) ? `<div class="slate">EVERY NIGHT</div>` : D("Posy", "I can do that! I'm <i>good</i> at latches!"),
        { healer: N(`<b>Healer.</b> Fennick's hands are covered in small round burn scars, old and new, in rows. You've seen scars like that on a blacksmith's apprentice: hot metal, again and again, for someone who doesn't care if you get burned. He sees you looking and pulls his sleeves down.`, "mark"),
          knight: N(`<b>Knight.</b> Brannoc stands by the door with his back to the wall, where he can see everyone. So do you. He raises his cup to you, just slightly.`, "mark"),
          rogue: N(`<b>Rogue.</b> Sister Maudry's satchel hangs wrong. The bottom is heavier than the top, an inch too deep for what's in it. A false bottom. You'd know. You've made one.`, "mark"),
          wizard: N(`<b>Wizard.</b> Maudry's oath-token is sealed with blue wax, and shrine seals are made once and never touched. This one has been cracked and sealed over a second time. You can see the line.`, "mark"),
          ranger: N(`<b>Ranger.</b> “Wolves are early this year,” Harl says to no one. “Birds left the peaks a week ago. All at once. Never seen that.”`, "mark"),
          barbarian: N(`<b>Barbarian.</b> Harl hands you an axe, the twin of his own, and nods at the woodpile. “Earn your supper.” You split wood until the moon comes up. Harl looks at the stack and grunts. From Harl, that's a speech.`, "mark") }[s.cls],
        (s.cls === "rogue" && (r.f.nb = true) && "") || (s.cls === "wizard" && (r.f.nw = true) && "") || (s.cls === "healer" && (r.f.nh = true) && "") || ""
      )
    },
    s3: { title: "The Snow Comes", next: "s4",
      text: s => P(
        `That night the snow comes for real. It's like the whole sky is falling. The wind screams around the hold, and the windows go white. Gammer cackles. “That's the pass closed. Nobody's going anywhere till spring, my ducks.” Lady Corvane: “<i>Spring?</i>”`,
        `You're half asleep when the pounding starts. <i>BOOM. BOOM.</i> Harl hauls back the bolt, and a girl falls through the door in a blast of snow: about fourteen, wrapped in iced goatskins, dragging a crook snapped in half. Her lips are blue.`,
        D("Iska", "S-something took my goats. All forty. S-something <i>big</i>."),
        `Harl carries her to the fire. “Iska Draven. Draven clan. Their hold is one peak over.” He looks at the screaming white outside. “Was.”`,
        s.home === "highfall" && hasTrait(s, "Holds a Grudge") && N(`<b>Holds a Grudge.</b> The Dravens. Your clan and theirs have a grudge so old nobody remembers how it started. You feel it in your stomach, even with her shaking on the floor.`, "mark"),
        `Iska sits wrapped in blankets, staring into the fire. She won't drink the soup. She won't answer Sister Maudry's questions.`
      ),
      choices: s => [
        { label: "Sit with her", go: (s, r) => { r.f.iska = true; r.f.iskaT = true; return { text: ["You sit on the floor beside her and look into the fire too. After a long time, without looking at you, she says, “They had names. All forty. I named every one.” You nod. You don't say you're sorry. She seems to like that better."] }; } },
        { label: "Leave her be", go: () => ({ text: ["Harl's already sitting with her. Behind you, you hear Iska crying for the first time, very quietly, where she thinks no one can hear."] }) }
      ]
    },
    s4: { title: "The Goat Pen", next: "s4t",
      text: (s, r) => {
        let w = "";
        if (r.f.fresh) w = ob.posyGain(s, "posy_fault");
        return P(
          `In the morning the snow has stopped. Harl goes out to the barn first. Then, low and terrible: “<i>Everyone. Out here.</i>”`,
          `The goat pen is empty. All twelve goats, gone. The gate swings in the wind, creak, creak. And in the snow there are <b>pawprints</b>, each one as wide as a cart wheel, not pressed into the snow but sitting <i>on top</i> of it, made of thick white frost in feathery lines.`,
          D("Gammer", "(not laughing now) The Rime Wolf."),
          `Sister Maudry points at the swinging gate. “Who was to latch this gate last night?” Every head turns toward Posy.`,
          D("Maudry", "The child let the beast in."),
          r.f.fresh ? P(`Posy has gone white. “I… I did it. I went out. I <i>thought</i> I did it…” She did go out. You watched her. But you never saw her hands on the latch. Lady Corvane takes a step back from her like she's dangerous. Posy turns and runs into the barn and up into the hayloft, and pulls the ladder up after her.`, w)
            : ob.posyHas(s, "posy_words") ? `Posy tries to write something, but her hand shakes so hard the chalk snaps. She runs for the barn.`
            : ob.posyHas(s, "posy_shout") ? `Everyone is talking at once, loud and scared. Posy has gone completely still in the middle of the yard.`
            : P(`Posy looks at Maudry with flat, hard eyes.`, ob.say(s, "I did latch it."), `Maudry sniffs. “Then you'll swear it, child.” Posy turns and walks away to the barn.`)
        );
      },
      choices: s => [
        { label: "Go after Posy right now", go: s => ({ text: ["You climb up to the hayloft. Posy is curled in the hay with her arms around her knees. You don't have the answer yet. But you're there.", trust(s, "Posy", 1)] }) },
        { label: "Look at the tracks first", go: () => ({ text: ["If you can find out what really happened, it'll help her more than anything you could say."] }) }
      ]
    },
    s4t: { title: "Frost Tracks", next: "s5",
      text: s => P(`You follow the frost-prints backward from the pen, through the yard, toward the wall.`),
      choices: s => [
        s.cls === "ranger"
          ? { label: "Read the tracks", tag: "Ranger: Trackwise", go: (s, r) => trackFound(s, r) }
          : { label: "Read the tracks", check: { stat: "lore", dc: 5 }, go: (s, r, pass) => pass ? trackFound(s, r) : { text: ["The tracks are everywhere: the pen, the gate, the wall, the yard. You can't tell where it came in."], next: windowNext(s) } }
      ]
    },
    s4tell: { title: "It Jumped", next: s => windowNext(s),
      text: s => P(`The wolf never used the gate. It came over the eight-foot wall in one leap. Latched or open, it was coming.`),
      choices: s => [
        { label: "Climb up and show Posy", go: (s, r) => { r.f.told = true; return { text: ["“Pos. Come look.” She doesn't want to. Eventually she takes your hand. You show her the frost-print on top of the wall. “It jumped. It didn't use the gate at all.”",
          r.f.fresh ? "“So it wasn't… because of me?” “It wasn't because of you.” She doesn't believe it all the way. Not yet. But she lets out a long, shaky breath." : ob.say(s, "Not me."),
          r.f.fresh && compStep(s, "Posy"), trust(s, "Posy", 1)] }; } },
        { label: "Tell everyone in the yard", go: () => ({ text: ["“It came over the wall! It didn't need the gate!” Harl looks. Gammer looks. Lady Corvane doesn't. Sister Maudry glances at the wall, then away. “It hardly matters how it came in. It matters why.”"] }) }
      ]
    },
    s4w: { title: "The Window", next: "s5",
      text: s => P(
        `The frost tracks don't just go to the pen. They circle the whole hold, three times, as if the wolf was searching. On the third circle they stop under one window. On that glass, frost has grown in great white feathers. No other window has any.`,
        ob.born(s) ? `It's <b>your</b> window. Where you slept.` : `It's the little window by the hearth corner. Where <b>Fennick</b> sleeps.`,
        `Behind you, someone else has noticed. Sister Maudry, very softly: “Well. Well, well.”`
      )
    },
    s5: { title: "The Cub in the Woodpile", next: "s6",
      text: s => P(
        `That afternoon Harl sends you for firewood. Nobody wants to go out alone anymore, so you go fast. You're pulling down an armful when you hear a thin whimper from under the logs.`,
        `Wedged at the bottom of the pile is a <b>wolf cub</b>: the size of a cat, white as snow, fur that glitters like frost. Pale blue eyes, huge and frightened. One paw stuck between logs. You can see its ribs. When you reach for it, it bares tiny teeth, and its breath comes out as a puff of frost.`,
        ob.posySilent(s) ? P(`Posy has followed you. She kneels in the snow and holds up her slate:`, `<div class="slate">BABY. PLEASE.</div>`)
          : ob.posyHas(s, "posy_fault") ? D("Posy", "(from the doorway) It's a baby. Can we keep it? I'll do everything, I won't mess it up. I'll try really hard not to mess it up.")
          : D("Posy", "(from the doorway) Oh. <i>Oh.</i> It's just a baby."),
        D("Harl", "(from the yard) That's a frost-wolf cub. Means its mother is near. You don't feed a thing that'll grow up the size of a horse. Drive it off. That's the kind thing."),
        hasTrait(s, "Listens to the Wild") && `It isn't just hungry. It's lost. It's been calling for its mother all night.`
      ),
      choices: s => [
        { label: "Free it and feed it your supper", tag: "You'll go hungry", go: (s, r) => { r.f.cub = true; ob.tc(s, r); return { text: [
          { ranger: "You hum low, and its teeth go back in. It lets you lift the log.", healer: "Its paw is scraped raw but not broken. You wrap it in a strip of your scarf, and it licks your fingers with a tongue cold as an icicle.", barbarian: "You lift the whole bottom of the woodpile on your back while Posy pulls the cub free.", rogue: "Freeing it is easy. Hiding it is the trick. You know the old stable at the back that nobody uses.", knight: "You work the log loose with cold fingers while the cub growls its tiny growl.", wizard: "A small warming charm, and the frozen logs loosen their grip." }[s.cls],
          "You give it your dried meat, then your cheese, then your bread. It eats everything and falls asleep in your lap, cold as a snowball and light as a feather. You hide it under sacks in the old stable. <span class='dim'>(You'll be hungry tonight: Courage −1 in the next big moment.)</span>"], next: ob.posyHas(s, "posy_fault") ? "s5p" : "s6" }; } },
        { label: "Drive it off into the snow", go: s => ({ text: ["You free its paw, then clap and stamp and shout until it runs, limping, across the yard. At the wall it stops and looks back at you with those huge blue eyes. Then it's gone.", ob.posyHas(s, "posy_fault") ? "Later you find Posy at the window. “Was that my fault too?” she asks. She doesn't wait for an answer." : "Posy doesn't say anything. She just goes back inside."] }) }
      ]
    },
    s5p: { title: "A Job for Posy", next: "s6",
      text: s => P(`The cub wakes up hungry again before supper. Posy is watching it from the stable door, not coming any closer, like she's afraid she'll break it.`),
      choices: s => [
        { label: "“You feed it. You're good at this.”", go: s => ({ text: ["You put the meat in her hand. “Me?” “You're good at latches. You're good at this too.” She holds it out with a shaking hand. The cub sniffs her fingers, then eats right out of her palm. Posy doesn't breathe. Then she smiles, the first real smile since the goats.", compStep(s, "Posy"), trust(s, "Posy", 1)] }) },
        { label: "Feed it yourself", go: () => ({ text: ["Posy watches from the door. She doesn't come closer."] }) }
      ]
    },
    s6: { title: "Iska's Hearth Oath", next: "s7",
      text: (s, r) => P(
        `That evening Iska gets up from the fire and walks straight across the room to you. ${r.f.iska ? "“You sat with me. You didn't ask stupid questions.”" : "“You. Harl's kin. The lowlander.”"}`,
        `She pulls out a pair of <b>snowshoes</b>: long ovals of bent ash wood laced with goat-gut, old and well loved.`,
        D("Iska", "My flock is up there. There's an ice gully above this hold that goes up to a cave. My grandmother said that's where the wolves go in a wolf winter. When the storm breaks, I'm going after them. These were my brother's. You can't walk the deep snow up there without them, and I'll teach you the goat paths only Draven know. But first you swear the hearth oath."),
        `She puts her hand flat on the warm stone of the hearth. “<i>I will defend this hearth, and everyone who sits at it, as if they were my own clan.</i> Everyone. Even the ones you don't like. <i>Especially</i> them. That's the point.”`,
        s.home === "highfall" && `You know the hearth oath. Every Highfall child does. You know what it costs.`,
        ob.open(s).length >= 3 && N("You already carry three open oaths. Swearing a new one means setting one down.", "mark")
      ),
      choices: s => [
        { label: "Put your hand on the hearth and swear it", tag: "Trade: gain snowshoes, take an oath", go: (s, r) => { r.f.iskaT = true; return { text: ["Iska nods once, hard, and shoves the snowshoes into your arms. “Good. Don't break it. Up here we don't forgive that.”", ob.give(s, "Iska's snowshoes"), ob.swear(s, "hearth")] }; } },
        { label: "“I can't swear that.”", go: (s, r) => { r.f.iskaT = false; return { text: ["Iska looks at you like you've proven something she already suspected. “Thought so. Lowlanders.” She takes the snowshoes back."] }; } }
      ]
    },
    s7: { title: "Brannoc Is Gone", next: "s7p",
      text: s => P(
        `On the second morning, Lady Corvane screams. Brannoc's bedroll by the door is empty and cold, covered in frost feathers. The bolt has been drawn back from the <i>inside</i>. In the snow, the cart-wheel prints lead to the wall, and beside them a long, gentle dragging line, like a sled. No footprints. Brannoc didn't walk.`,
        ob.posyHas(s, "posy_shout") && `Lady Corvane won't stop screaming. Posy has gone stone-still by the hearth.`,
        `Sister Maudry stands by the hearth, and the room goes quiet. “Tell them, Gammer.”`,
        D("Gammer", "The First Queen made a promise to the mountain: in summer the people may cross; in winter the pass belongs to the wolves. And the mountain made itself a hunter to keep it. The Rime Wolf. In a wolf winter it comes down off the peaks. It comes for oathbreakers."),
        D("Maudry", "And it does not stop until the oathbreaker is given to the snow. Every one of you will put your hand on this token and swear you have kept every oath you ever made."),
        `One by one, they do. Fennick's hand shakes so hard the chain rattles, and everyone watches him.`,
        ob.born(s) ? `When it's your turn, the token is warm under your hand, too warm, and Maudry's eyes narrow.` : `When it's your turn, the token is cold and ordinary.`,
        `Then it's Posy's turn.`
      ),
      choices: s => {
        if (ob.posyHas(s, "posy_words")) return [
          { label: "Step in front of her: “Children under thirteen can't be made to swear.”", go: s => ({ text: ["Posy backs away from the token, shaking her head, hands over her mouth. “You see?” says Maudry. “She won't.” You step in front of Posy. Maudry's lips go thin. “In the lowlands,” she says. But she moves on.", trust(s, "Posy", 1)] }) }
        ];
        return [{ label: "Watch", go: s => ({ text: [ob.posyHas(s, "posy_promises") ? "Posy puts her hand flat on the token, holds Maudry's eyes the whole time, and says nothing. It isn't swearing. It isn't <i>not</i> swearing. Maudry looks almost frightened of her." : ob.posyHas(s, "posy_shout") ? "Posy can't say it. She just nods, over and over. Maudry lets her go." : "Posy puts her little hand on the token. “I swear,” she whispers. “I <i>swear</i> I tried to latch it.”", "Everyone has sworn. No one has confessed. Which means someone in this room just lied on an oath-token, on top of everything else."] }) }];
      }
    },
    s7p: { title: "Looking for Answers", next: "s7z",
      text: (s, r) => P(
        r.f.looked ? `What else do you want to look into?` : `Now everyone is watching everyone. Lady Corvane sits on her trunks in a corner. If you want to know who the wolf is really hunting, you'll have to find out yourself.`,
        maudryClues(r) >= 2 && N(`You've found enough to point at <b>Sister Maudry</b>.`, "mark")
      ),
      choices: (s, r) => [
        ob.when(!r.f.tF, s.cls === "rogue"
          ? { label: "Unseen: go through Fennick's pack", tag: "Rogue", go: (s, r) => clue(r, "tF", ["Ten seconds while he helps Gammer with the soup.", fennickPack(r)]) }
          : { label: "Search Fennick's pack", check: { stat: "swift", dc: 5 }, go: (s, r, pass) => pass ? clue(r, "tF", [fennickPack(r)]) : clue(r, "tF", ["Fennick catches you, goes white, and grabs his pack. “Please don't. Please.” He won't speak to you after that."], true) }),
        ob.when(!r.f.tR, s.cls === "rogue" && r.f.nb
          ? { label: "Lift the false bottom of Maudry's satchel", tag: "Rogue", go: (s, r) => clue(r, "tR", [rubbing(s, r)]) }
          : { label: "Search Sister Maudry's satchel", check: { stat: "swift", dc: 6 }, go: (s, r, pass) => pass ? clue(r, "tR", [rubbing(s, r)]) : clue(r, "tR", ["Maudry turns around just as you touch the bag. She doesn't shout. “Thief,” she says quietly. From then on, she's watching you."], true) }),
        ob.when(!r.f.tT, (s.cls === "wizard" && r.f.nw) || s.home === "shrine"
          ? { label: "Think about Maudry's oath-token", tag: s.home === "shrine" ? "Shrine Orphanage" : "Wizard", go: (s, r) => clue(r, "tT", [tokenClue(r)]) }
          : { label: "Get a close look at Maudry's oath-token", check: { stat: "lore", dc: 6 }, go: (s, r, pass) => pass ? clue(r, "tT", [tokenClue(r)]) : clue(r, "tT", ["It's just a silver disc with blue wax. You can't tell anything from here."], true) }),
        ob.when(!r.f.tB, { label: "Watch who sleeps where", check: { stat: "lore", dc: (s.cls === "ranger" || s.cls === "healer") ? 5 : 6 }, go: (s, r, pass) => pass ? clue(r, "tB", [bedClue(s, r)]) : clue(r, "tB", ["People keep shifting around in the dark. You can't keep track."], true) }),
        ob.when(!r.f.tS && (r.f.nh || trustHigh(s, "Posy")), { label: "Find Fennick alone in the goat barn", go: (s, r) => clue(r, "tS", [fennickStory(s, r)]) }),
        { label: r.f.looked ? "That's enough. Wait for night." : "Don't go looking. Stay by the fire.", go: () => ({ next: "s7z" }) }
      ]
    },
    s7z: { title: "Night Falls", next: "s8",
      text: s => P(`That night nobody sleeps much. Far up the mountain comes a long, rising howl, so cold and clear it makes the windows hum. Then another, closer. And the fire in the great hearth, which has never gone out in a hundred years, starts to die.`)
    },
    s8: { title: "The Longest Night", next: s => ["whiteout", "what_i_burned", "oathbroken", "hollowed"].some(w => hasWound(s, w)) ? "s9" : "s9n",
      text: (s, r) => P(
        `The worst storm yet. The wind finds every crack in the old stone. Frost creeps across the inside of the windows. And the woodbox beside the hearth is empty.`,
        D("Harl", "Wood."),
        `The woodshed is forty steps across the yard. Tonight the yard is a wall of white, and somewhere in it, close, you can hear the wolf breathing.`,
        D("Gammer", "(very quietly) If the hearth goes out tonight, my ducks, the little ones won't see morning. Nor me, neither."),
        r.f.cub && N("You gave your food to the cub. Your hands are shaking from cold and hunger both. <span class='dim'>(Courage −1 tonight.)</span>", "bad")
      ),
      choices: (s, r) => [
        { label: "Go out to the woodshed", tag: ob.item(s, "Iska's snowshoes") ? "Snowshoes help" : "", go: (s, r) => { r.f.fuel = "wood"; ob.tc(s, r); return { text: ["You open the door and the storm hits you like a wall. White above, below, on every side, so total you can't tell which way is up. You walk with your hands out, counting steps. Something moves in the white. Something big. You keep walking. Forty. Wood. You fill your arms and walk back, counting again, with the wolf's cold breath somewhere close behind you the whole way. Harl pulls you in. You can't stop shaking for an hour.",
          addWound(s, "whiteout"), ob.item(s, "Iska's snowshoes") && N("The snowshoes kept you on top of the drifts. It could have been much worse.", "good")] }; } },
        { label: "Burn what's inside the hold", go: () => ({ next: "s8b", text: ["“Burn the benches.” So you do: the benches, the table, the goat stall door, Gammer's chopping block. For an hour, everyone is warm. Then the fire starts to die again."] }) },
        ob.when(s.cls === "barbarian", { label: "Rage: tear down the old stable", tag: "Barbarian", go: (s, r) => { r.f.fuel = "rage"; s.stats.courage = Math.max(0, s.stats.courage - 1); return { text: [r.f.cub ? "You move the sleeping cub into a sack by the hearth first. Then" : "", "you walk into the old stable with your axe and come out with the roof beams, then the walls, until there's a pile of wood taller than you. The fire roars all night.", strain(s, "Splinters and Bruises"), N("Courage −1 for the rest of the book.", "bad")] }; } }),
        ob.when(s.cls === "wizard", { label: "Spellwork: a fire that needs no wood", tag: "Wizard", go: (s, r) => { r.f.fuel = "spell"; return { text: ["You kneel on the bare hearthstone and trace the fire-spell with both hands. A flame rises off stone with nothing to burn, white and gold. And you have to hold it, every minute, all night. You hold it until the windows turn gray.", strain(s, "Spell-Drained"), N("Your head is splitting. <span class='dim'>(Lore −1 for the rest of this book.)</span>", "bad")] }; } }),
        ob.when(s.cls === "healer", { label: "Mend: keep the people warm, not the fire", tag: "Healer", go: (s, r) => { r.f.fuel = "huddle"; s.stats.courage += 1; return { text: ["“Everybody. In the middle. Now.” Every blanket and fur into one huge pile, the oldest and smallest in the center, you and Harl on the outside where it's coldest. Corvane refuses. You make her. All night you check hands, feet, breathing. In the morning the hearth is cold ashes, and everyone is alive.", strain(s, "Exhausted"), N("Courage +1. You didn't panic once.", "good")] }; } }),
        ob.when(ob.born(s), { label: "Call on your Oath", tag: "Oath", go: (s, r) => { r.f.fuel = "oath"; return { text: [{ shield: "Gold light settles over everyone like a warm blanket. The frost on the windows melts.", mend: "You feel for the fire that used to be in the cold coals, and <i>pull</i>. The hearth bursts back into flame from nothing.", bind: "You put both hands on the wall and hold the storm back. Every crack, every gap under every door. The wind howls and can't get in.", truth: "The ringing in your ears becomes the wolf's voice in the yard: <i>Not them. Not tonight.</i> You walk to the woodshed through the storm, and it watches you the whole way, and lets you pass." }[s.okind], ob.call(s, r)] }; } })
      ]
    },
    s8b: { title: "The Clan-Pole", next: s => ["whiteout", "what_i_burned", "oathbroken", "hollowed"].some(w => hasWound(s, w)) ? "s9" : "s9n",
      text: s => P(`There's only one big piece of wood left: a tall carved pole leaning by Iska's bedroll, every inch covered in tiny names. The <b>Draven clan-pole</b>, every Draven who ever lived, three hundred years of them. Iska carried it down the mountain alone. She stands in front of it. “No. Please. It's all that's left.” Gammer coughs. Posy is shivering under three blankets.`),
      choices: s => [
        { label: "Burn it", go: (s, r) => { r.f.fuel = "pole"; r.f.iskaT = false; return { text: ["She doesn't fight you. She stands there while the names burn one by one. Everyone lives through the night. Iska sits facing the wall until morning.", addWound(s, "what_i_burned"), ob.has(s, "hearth") && N("You kept the Hearth Oath. You defended everyone at the hearth. It has never felt worse.", "mark")] }; } },
        { label: "Burn Lady Corvane's trunk instead", go: (s, r) => { r.f.fuel = "chest"; return { text: ["It's full of books and letters tied in ribbon, in a man's neat handwriting. Her late husband's. She screams and hits you with both fists until Harl pulls her away. You burn them anyway. Everyone lives.", addBurden(s, "corvane_grudge")] }; } }
      ]
    },
    s9: { title: "The Hot Spring", next: "s10",
      text: s => P(`At gray light, Harl picks up a lantern and jerks his head. Behind the old stable, a hidden door, and old stone steps down into the mountain, getting warmer and warmer, until there's a cave with a glowing blue pool, steaming.`, D("Harl", "Hot spring. Mountain's own heart. My father brought me down here after my first wolf winter. Takes the night. But up there, they'll be deciding what to do about the wolf. Without you, if you stay.")),
      choices: (s, r) => [
        { label: "Stay", tag: "Heal: miss the start of the trial", go: (s, r) => { r.f.healed = true; const out = [];
          if (hasWound(s, "whiteout")) out.push("Harl, who says ten words a day, talks for an hour. About his first wolf winter at fourteen, lost in the white till dawn. “Still scares me. Didn't stop me going out in it. Just meant I went careful.”", healWound(s, "whiteout"));
          if (hasWound(s, "what_i_burned")) out.push("In the middle of the night, Iska comes down the steps and sits across the pool. She doesn't forgive you. She says names. “Ylva Draven. Orm Draven. Sigrun. Arn.” Every name from the pole, all night, so somebody else will know them.", healWound(s, "what_i_burned"));
          if (hasWound(s, "oathbroken")) out.push("“Up here there's two kinds of oathbreakers,” Harl says. “The ones who break it and walk away, and the ones who carry it. Which are you?” You tell him.", healWound(s, "oathbroken"));
          if (hasWound(s, "hollowed")) out.push("You lie back in the warm water. The mountain hums under you like a heartbeat, and you let it fill you up.", healWound(s, "hollowed"));
          out.push("On the cave wall is an old carving, worn almost smooth: a great wolf and a crowned woman facing each other. “The Queen and the mountain,” Harl says. “Clan stories say she came here herself.”", mystery(s, "The First Queen came to the mountain in person."));
          return { text: out }; } },
        { label: "“I can't stay. Not while they're deciding.”", go: () => ({ text: ["Harl nods slowly. “No. You can't.” He looks almost proud."] }) }
      ]
    },
    s9n: { title: "The Mountain's Heart", next: "s10",
      text: s => P(`In the morning, Harl takes you down a hidden stair behind the stable to a steaming blue hot spring. He doesn't say why he's showing you. On the wall is an old carving: a great wolf and a crowned woman, facing each other.`, D("Harl", "The Queen and the mountain. Clan stories say she came here herself."), mystery(s, "The First Queen came to the mountain in person."))
    },
    s10: { title: "The Hearth Trial", next: "s11",
      text: (s, r) => P(
        r.f.healed ? `You come up into the yard, and it's already happening. Everyone is by the open gate, and ${ob.born(s) ? "your bedroll has been thrown into the snow there, next to Fennick" : "Fennick is standing at it with a blanket and a lantern"}. “Ah,” says Lady Corvane. “You're back. We've voted.” They haven't pushed anyone out yet. You still have a moment.` : `In the morning, everyone gathers at the hearth. Nobody sits.`,
        D("Harl", "(heavy) When the Rime Wolf hunts a hearth, the hearth can give the oathbreaker to the snow. Then the wolf takes the one it came for. It's old law. We don't use it."),
        D("Corvane", "We're using it now."),

      text: (s, r) => P(
        (r.f.trial === "out") && `Halfway up you found Fennick, dug into a snow-hole, hands wrapped around his lantern to keep it lit, lips blue. He didn't look angry. Just tired. “I n-never swore anything. In my whole life. I told you.” You helped him up.`,

    s13: { title: "The Rime Wolf", next: "s14",
      text: (s, r) => P(
        `Then the cave gets colder. The air hurts to breathe. Frost races across the walls in white feathers, and the ice wall behind the waystone begins to <i>move</i>.`,
        `The <b>Rime Wolf</b> steps out of it: as tall as a horse, white as the inside of a cloud, its fur glittering like frost on a window. Its eyes are the pale blue of the coldest morning of the year. When it breathes out, the air turns to ice and falls like snow. It speaks inside your head, like wind across the highest peak.`,
        `<div class="d"><span class="who">The Rime Wolf</span><i>Someone at that hearth broke what they swore. The mountain is owed. Give the oathbreaker to the snow, and the pass will sleep until spring. The man will wake. The goats will wake.</i></div>`,

        ob.calls(r) >= 1 && N("Your Oath is thin and tired. Calling on it again would cost you more.", "mark")

            : "“She's at the hold. She's the one.” The wolf looks at you a long moment, then pads out of the cave. That night, the frost comes for Sister Maudry.", ...wake,

            const out = pc ? ["Posy looks at you. You nod. She walks out past the goats and Brannoc, toward a wolf taller than the cave ceiling, carrying the cub in both arms. Her hands are shaking so much you can see it from where you stand. She does it anyway.",

function windowNext(s) { return (s.cls === "wizard" || (ob.born(s) && s.okind === "truth")) ? "s4w" : "s5"; }
function trackFound(s, r) { return { text: ["The tracks don't come through the gate. They come up to the stone wall, eight feet high. On the other side there's one huge print, a gap, and then a print on <i>top</i> of the wall. <b>The wolf jumped it.</b>"], next: "s4tell" }; }
function clue(r, key, text, fail) { r.f[key] = true; r.f.looked = true; return { text, next: "s7p" }; }
