<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Books Demo | The Alchemist Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bungee&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1220; --bg2:#171b2e; --panel:#1e2338; --line:#2f3657;
    --ink:#f3ecdf; --dim:#b9b2a6; --ember:#ff6a3d; --ember2:#ffb347; --good:#7fd6a8; --bad:#ff8f8f; --blue:#8fb8ff;
    --fs:20px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:radial-gradient(ellipse at 70% -10%,#3a1a20 0%,var(--bg) 55%) fixed;color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:var(--fs);line-height:1.6}
  body.hc{--bg:#000;--bg2:#000;--panel:#111;--line:#666;--ink:#fff;--dim:#ddd}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(15,18,32,.85);position:sticky;top:0;z-index:5;backdrop-filter:blur(4px)}
  header .logo{font-family:Bungee,sans-serif;font-size:18px;color:var(--ember2);letter-spacing:.5px;cursor:pointer;white-space:nowrap}
  header .sp{flex:1}
  header button{font-size:15px;padding:6px 10px}
  main{max-width:760px;margin:0 auto;padding:20px 16px 80px}
  h1,h2,h3{font-family:Bungee,sans-serif;font-weight:400;line-height:1.2;letter-spacing:.3px}
  h1{font-size:2em;color:var(--ember2);margin:.4em 0}
  h2{font-size:1.35em;color:var(--ember2);margin:.2em 0 .6em}
  h3{font-size:1.05em;color:var(--ember);margin:1.2em 0 .4em}
  p{margin:.7em 0}
  .dim{color:var(--dim)}
  button,.btn{font-family:inherit;font-size:1em;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer}
  button:hover{border-color:var(--ember)}
  button:focus-visible{outline:3px solid var(--ember2);outline-offset:2px}
  button.primary{background:var(--ember);border-color:var(--ember);color:#1a0d08;font-weight:700}
  button.primary:hover{background:var(--ember2);border-color:var(--ember2)}
  button[disabled]{opacity:.45;cursor:not-allowed}
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:1.2em}
  .choice{text-align:left;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;line-height:1.4}
  .choice .num{flex:0 0 auto;background:var(--line);border-radius:8px;min-width:30px;text-align:center;font-weight:700;font-size:.9em;padding:2px 6px}
  .choice .tag{display:block;font-size:.75em;color:var(--ember2);margin-top:4px}
  .choice.locked{opacity:.5}
  .d{margin:.6em 0 .6em .2em;padding-left:12px;border-left:3px solid var(--blue)}
  .d .who{display:block;font-size:.72em;text-transform:uppercase;letter-spacing:1px;color:var(--blue);font-weight:700}
  .note{background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--ember);border-radius:10px;padding:10px 14px;margin:1em 0;font-size:.88em}
  .note.good{border-left-color:var(--good)} .note.bad{border-left-color:var(--bad)} .note.mark{border-left-color:var(--ember2)}
  .check{font-size:.85em;font-weight:700}
  .check.pass{color:var(--good)} .check.fail{color:var(--bad)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;line-height:1.4}
  .card:hover{border-color:var(--ember)}
  .card.sel{border-color:var(--ember2);box-shadow:0 0 0 3px rgba(255,179,71,.25)}
  .card b{display:block;font-size:1.05em;margin-bottom:4px;color:var(--ember2)}
  .card small{color:var(--dim);font-size:.82em}
  .book{display:flex;flex-direction:column;gap:6px;min-height:170px}
  .book .where{font-size:.75em;text-transform:uppercase;letter-spacing:1px;color:var(--blue)}
  .book.done{opacity:.55}
  .pill{display:inline-block;font-size:.72em;border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin:2px 4px 2px 0;color:var(--dim)}
  .pill.ember{border-color:var(--ember);color:var(--ember2)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=text],textarea{font-family:inherit;font-size:1em;background:var(--bg2);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
  textarea{min-height:90px;font-family:ui-monospace,monospace;font-size:.9em}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .stat b{font-size:.9em}
  .stat .v{font-size:1.2em;font-weight:700;color:var(--ember2);min-width:1.4em;text-align:center}
  .stat button{padding:2px 10px;font-size:.9em;border-radius:8px}
  .code{font-family:ui-monospace,monospace;font-size:1.05em;background:#0b0d17;border:2px dashed var(--ember);border-radius:12px;padding:12px;word-break:break-all;letter-spacing:1px}
  .steps{font-size:.8em;color:var(--dim);margin-bottom:.4em}
  .wcard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:.88em}
  .wcard b{color:var(--ember2)}
  .hidden{display:none!important}
  .scene-title{font-size:.8em;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:-.3em}
  hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ember2);color:#1a0d08;padding:10px 18px;border-radius:999px;font-weight:700;z-index:20}
  @media (max-width:520px){:root{--fs:18px} header .logo{font-size:14px}}

  /* v0.4: Library + Under the Lights theme */
  body.fb{--bg:#0b1a12;--bg2:#10241a;--panel:#163022;--line:#2a4a37;--ember:#f2c14e;--ember2:#ffe08a;--blue:#9fd3ff;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#2f5a3c 0%,#0b1a12 60%) fixed}
  html:has(body.fb){background:#0b1a12}
  body.fb header{background:rgba(11,26,18,.88)}
  body.fb.hc{--bg:#000;--bg2:#000;--panel:#111;--line:#666;--ink:#fff;--dim:#ddd;background:#000}
  button.card{font-size:1em;width:100%}
  .series{display:flex;flex-direction:column;gap:8px;min-height:190px}
  .series .genre{font-size:.72em;text-transform:uppercase;letter-spacing:1.5px}
  .series.ember{background:linear-gradient(160deg,#2a1420,#1e2338);border-color:#ff6a3d}
  .series.ember b{color:#ffb347}.series.ember .genre{color:#8fb8ff}
  .series.football{background:linear-gradient(160deg,#173a26,#10241a);border-color:#f2c14e}
  .series.football b{color:#ffe08a}.series.football .genre{color:#9fd3ff}
  .series small{color:#d9d2c6}
  .ver{text-align:center;font-size:.7em;color:var(--dim);margin-top:30px}
  /* v0.4.1: stat points, one stat per row */
  .spend{display:flex;flex-direction:column;gap:8px}
  .spend .stat{display:grid;grid-template-columns:1fr 52px 2.2em 52px;align-items:center;gap:10px;padding:10px 14px}
  .spend .stat small{display:block;line-height:1.3}
  .spend .stat button{width:52px;height:46px;padding:0;font-size:1.4em;font-weight:700;line-height:1;border-radius:10px}
  .spend .stat button:not([disabled]){border-color:var(--ember);color:var(--ember2)}
  .spend .stat .v{font-size:1.4em}
  /* v0.5: Oathbound theme */
  body.ob{--bg:#0d1611;--bg2:#13211a;--panel:#1a2b22;--line:#33503f;--ember:#e3a548;--ember2:#f6d28c;--blue:#b4dcb8;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#3b3a1e 0%,#0d1611 60%) fixed}
  html:has(body.ob){background:#0d1611}
  body.ob header{background:rgba(13,22,17,.9)}
  body.ob.hc{--bg:#000;--bg2:#000;--panel:#111;--line:#666;--ink:#fff;--dim:#ddd;background:#000}
  .series.oath{background:linear-gradient(160deg,#22361f,#13211a);border-color:#e3a548}
  .series.oath b{color:#f6d28c}.series.oath .genre{color:#b4dcb8}
  .slate{display:inline-block;font-family:"Bungee",sans-serif;letter-spacing:1px;background:#1b2421;color:#f3f3ea;border:6px solid #6b4f2e;border-radius:8px;padding:10px 18px;margin:.6em 0;box-shadow:inset 0 0 12px rgba(255,255,255,.08)}
  body.hc .slate{background:#000;color:#fff;border-color:#fff}
  /* v0.6: Wildborn theme */
  body.wb{--bg:#17150f;--bg2:#211d14;--panel:#2a2519;--line:#4d4430;--ember:#d9a441;--ember2:#f2d27a;--blue:#b7c9a0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#4a3550 0%,#17150f 60%) fixed}
  html:has(body.wb){background:#17150f}
  body.wb header{background:rgba(23,21,15,.9)}
  body.wb.hc{--bg:#000;--bg2:#000;--panel:#111;--line:#666;--ink:#fff;--dim:#ddd;background:#000}
  .series.wild{background:linear-gradient(160deg,#3a3020,#2b2238);border-color:#d9a441}
  .series.wild b{color:#f2d27a}.series.wild .genre{color:#b7c9a0}
  .instinct{background:#2b1a14;border:2px solid #e0703a;border-radius:12px;padding:12px 16px;margin:1em 0;font-size:.95em}
  .instinct .iw{display:block;font-family:Bungee,sans-serif;font-size:1.6em;color:#ff9b63;letter-spacing:2px}
  body.hc .instinct{background:#000;border-color:#fff}body.hc .instinct .iw{color:#fff}
  .cs{color:var(--blue);font-size:.92em;margin:.6em 0 .6em .2em}
  .ros .row button{min-width:110px}
  .oath-broken{opacity:.8;border-left:4px solid var(--bad)}.oath-kept{border-left:4px solid var(--good)}.oath-down{opacity:.6}
</style>
</head>
<body>
<style>.demo-bar{background:#2DD4BF;color:#06241f;text-align:center;padding:8px 14px;font-size:14px}.demo-bar a{color:#06241f;font-weight:800}.card.book.locked{opacity:.75}</style>
<div class="demo-bar" role="note"><b>Demo</b> · Play the first book of every series. Nothing is saved when you close the page. <a href="../../#character-books" target="_top">Get the full version →</a></div>
<header>
  <span class="logo" id="homeBtn" title="Library">📚 The Library</span>
  <span class="sp"></span>
  <button id="readBtn" title="Read this page aloud">🔊 Read</button>
  <button id="smallBtn" title="Smaller text">A−</button>
  <button id="bigBtn" title="Bigger text">A+</button>
  <button id="hcBtn" title="High contrast">◐</button>
</header>
<main id="app"></main>
<p class="ver">Character Books v0.6 demo · The Ember Frontier · Under the Lights · Oathbound · Wildborn</p>

// Shared wound library (design doc 4.5a). Append-only.
window.EF = window.EF || { books: [] };
EF.wounds = {
  too_much_light: { name: "Too Much Light", kind: "Spark",
    effect: "Every Ember burn hurts more, and sometimes the spark flares when you don't want it to.",
    edge: "Your Ember feels stronger while it lasts.", way: "Learn control from someone who understands the Ember.",
    scar: "Banked Coal", scarText: "A faint glowing scar. Your Ember is a little stronger, but the Quench can sense it." },
  cracked_shoulder: { name: "Cracked Shoulder", kind: "Body",
    effect: "Climbing, lifting and carrying are harder (Grit −1 on those checks).",
    edge: "You look for the smart way instead of the strong way (Wits +1).", way: "A healer, rest, or somewhere warm.",
    scar: "Warm Bones", scarText: "Aches in the cold, but you always find the smart way." },
  heard_her_call: { name: "Heard Her Call", kind: "Heart",
    effect: "When two people need you at once, you hesitate (Nerve −1).",
    edge: "You're good at judging who's in the most danger.", way: "Hear Dagny say you made the right call.",
    scar: "Crew First", scarText: "When you have to choose fast, you choose, and you stand by it." },
  count_the_breaths: { name: "Count the Breaths", kind: "Mind",
    effect: "In dark or airless places you can't stop counting (Wits −2).",
    edge: "You always know how much time is left.", way: "Go back somewhere dark and tight for someone else's sake.",
    scar: "Steady Breath", scarText: "You can count calmly, and others breathe with you." },
  gave_away_light: { name: "Gave Away the Light", kind: "Spark",
    effect: "The Ember feels wrong. Reaching for it doesn't always work.",
    edge: "You know you can get by without it (Grit +1).", way: "Get the seed back, or find out what the Dominion did with it.",
    scar: "Hard-Won Spark", scarText: "The Ember answers you, and you never take it for granted." },
  untethered: { name: "Untethered", kind: "Mind",
    effect: "In open dark or high places you feel like you're falling (Wits −2).",
    edge: "You never let go of a handhold.", way: "Find something steady to anchor to.",
    scar: "Star-Anchored", scarText: "You can always find your way by something steady." },
  cut_loose: { name: "Cut Loose", kind: "Heart",
    effect: "When it's 'us or them,' you can't choose 'us' anymore.",
    edge: "You stand up for strangers.", way: "Find out the Saltgrass made it home.",
    scar: "Lamp in the Window", scarText: "Some choices can't be perfect. You keep the light on anyway." },
  cast_out: { name: "Cast Out", kind: "Heart",
    effect: "When a group blames someone, you go quiet (Nerve −2 in group choices).",
    edge: "You can read a crowd's mood.", way: "Stand up for someone when a group turns on them.",
    scar: "Never the Crowd", scarText: "You speak up first, every time." },
  cold_hands: { name: "Cold Hands", kind: "Body",
    effect: "Fine work is harder (Tech −1). Your hands ache in the cold.",
    edge: "You held on when it hurt (Grit +1).", way: "A good healer, or time somewhere warm.",
    scar: "Lamp-Keeper", scarText: "Your hands remember the cold, and they steady other people's hands." },
  not_enough_hands: { name: "Not Enough Hands", kind: "Heart",
    effect: "When lots of people need you at once, you freeze choosing (Wits −1).",
    edge: "Once you decide, you move fast (Nerve +1).", way: "Let someone help you carry it.",
    scar: "Shared Weight", scarText: "You ask for help, and you give it." },
  left_the_teacher: { name: "Left the Teacher", kind: "Heart",
    effect: "Your mentor's lessons feel hollow until you find Haldane again.",
    edge: "You think for yourself now.", way: "Find Haldane again.",
    scar: "My Own Rules", scarText: "You keep what he taught you and drop the rest." },
  last_one_out: { name: "Last One Out", kind: "Mind",
    effect: "In any escape, you have to go last.",
    edge: "Other people get out because of you (Grit +1).", way: "Let someone else hold the door for you once.",
    scar: "Shepherd", scarText: "You still go last, but you know when you're allowed to leave." },
  bought_our_way_out: { name: "Bought Our Way Out", kind: "Heart",
    effect: "When someone trusts you with something big, you hesitate (Nerve −1).",
    edge: "You're good at bargains.", way: "Make it right.",
    scar: "Owed", scarText: "You keep every promise, no matter what." },
  // Companion wounds
  holding_her_breath: { name: "Holding Her Breath", kind: "Mind", who: "Nessa",
    effect: "Nessa rations everything and panics when air or light runs low.",
    edge: "She always knows exactly how much is left.", way: "Make her take her share. Let her lead once.",
    scar: "Enough", scarText: "She can rest, and trust there will be enough." },
  crew_turned: { name: "The Crew Turned", kind: "Heart", who: "Hal",
    effect: "Hal won't trust a group, and he won't use his Mark where anyone can see.",
    edge: "He notices when a group is about to turn.", way: "Someone stands up for him without being asked.",
    scar: "Chosen Family", scarText: "He's found the people he trusts." },
  seen: { name: "Seen", kind: "Mind", who: "Hal",
    effect: "Hal is jumpy, talks too fast, and flinches when people stare.",
    edge: "He's stopped hiding. His Mark is stronger now.", way: "Someone sees his Mark and isn't afraid.",
    scar: "Out Loud", scarText: "He uses his Mark without apologizing for it." }
};
// Which checks each wound makes harder: tag -> {stat, amount}
EF.woundMods = {
  cracked_shoulder: [{ tag: "climb", stat: "grit", n: -1 }],
  heard_her_call: [{ tag: "any", stat: "nerve", n: -1 }],
  count_the_breaths: [{ tag: "dark", stat: "wits", n: -2 }],
  untethered: [{ tag: "height", stat: "wits", n: -2 }],
  cast_out: [{ tag: "group", stat: "nerve", n: -2 }],
  cold_hands: [{ tag: "fine", stat: "tech", n: -1 }],
  not_enough_hands: [{ tag: "any", stat: "wits", n: -1 }],
  bought_our_way_out: [{ tag: "trust", stat: "nerve", n: -1 }]
};
EF.burdens = {
  company_secret: "Company Secret — you promised Corin Vask to keep the Door quiet.",
  blacklisted: "Blacklisted by Holloway — the mining company wants you gone.",
  carrying_seed: "Carrying the Seed — a beating piece of Vael. The Quench can sense it.",
  seed_dominion: "The Seed in Dominion hands — Kroll has it now.",
  promise_crew: "Promise to the Crew — you swore you'd come back to Burrow 9.",
  kroll_hunt: "Kroll's Personal Hunt — Warden Kroll is looking for you, personally.",
  grieve_partner: "Grieve's Partner — you made a deal with a bounty hunter.",
  known_marked: "Known Marked to the Guild — the whole convoy saw your Mark.",
  hal_taken: "Hal Taken — the Quench took Hal to a prison barge.",
  quench_face: "The Quench Know Your Face.",
  owe_vane: "Owe the Free Wake — one job, anytime, no questions.",
  haldane_war: "Haldane's War — Commander Haldane has a prison ship full of cannons.",
  kroll_owes: "Kroll Owes You — or maybe you owe her.",
  new_promise: "A New Promise — next time, you'll come faster."
};

</script>
<script>
/* Adventure 02 — Ore and Ash (starting adventure) */
EF.books.push({
  id: "ore", title: "Ore and Ash", where: "The Gnaw", starting: true,
  blurb: "A tunnel collapse traps your crew a mile underground, next to a glowing Door older than the empire. Six hours of air. Not enough for everyone.",
  recommend: s => s.done.length === 0 ? "Great first book" : null,
  start: "s1",
  setup: (s, r) => { ensureComp(s, "Nessa", 1); r.f.dagnyHurt = false; },
  scenes: {
    s1: { title: "Shift Bell", next: "s2",
      text: s => P(
        `The bell in Burrow 9 doesn't ring. It <i>clanks</i>, a big iron hammer on a big iron plate, and the whole rock town shakes a little every time.`,
        { mine: "You were born three tunnels over. You learned to walk on rock and sleep through blasting. Up top, the sky makes your stomach flip. Down here, you can breathe.",
          dust: "You came to the Gnaw for company wages. Every credit goes home before the dry season. Your first week underground, you dreamed about wind every night.",
          orphan: "Your debt got sold to the Holloway Company like a crate of bolts. You work it off one shift at a time, and the number never seems to get smaller.",
          deserter: "Nobody checks papers a mile underground. That's the best thing about the Gnaw. The second best thing is that nobody salutes.",
          guild: "The Lantern Guild sent you to map the new deep seam. It was supposed to take two weeks. That was two months ago.",
          wake: "Your ship dropped you at the Gnaw dock “for one day.” Nobody came back. You stopped waiting at the dock a while ago. Mostly." }[s.origin],
        `The crew lift is a metal cage on a cable, with room for six. Nessa Kade is already in it, swinging from the top bar by one hand.`,
        D("Nessa", `You're last again, ${nm(s)}. That's three shifts in a row. I'm keeping count.`),
        `Nessa is fourteen and the fastest runner in Burrow 9. When a message has to get from the deep tunnels to the surface, Nessa carries it. She knows every shaft by heart, and she likes to remind everyone about it.`,
        `Behind her stands the shift boss, Dagny Roe, arms crossed. She has a scar through one eyebrow and has never been late to anything in her life. Old Sef Malloy leans in the corner, eyes half closed. People say he's been buried in collapses three times and walked out every time.`,
        `The last one in is a stranger in a clean company jacket, holding a slate full of maps. His boots have never met dust.`,
        D("Corin", "Corin Vask. Company survey. I'll be riding along today. Don't mind me."),
        D("Nessa", "(whispering) Company man on a deep shift. That's never good."),
        `The cage drops. Burrow 9 shrinks to one yellow dot above you, then nothing.`,
        hasTrait(s, "Never Left Home") && `The walls slide past close enough to touch. Back home, the sky went on forever. Your heart is pounding.`,
        D("Nessa", "Bet you a ration bar I beat you to the seam.")
      ),
      choices: s => [
        { label: "“You're on.”", go: (s) => ({ text: ["Nessa grins and is out of the cage before it stops moving. You lose. You owe her a ration bar.", trust(s, "Nessa", 1)] }) },
        { label: "“Not today, Nessa.”", go: () => ({ text: ["She shrugs and goes back to swinging on the bar."] }) }
      ]
    },
    s2: { title: "The Warm Seam", next: "s3",
      text: s => P(
        `The deep seam is so new the walls still sweat. You take the big drill. It bites into the rock with a scream, then stops screaming. It slides in too easily, like it's going through clay.`,
        `You pull it back. The rock around the hole is warm. Not mine-warm. Warm like a hand.`,
        D("Sef", "Huh."),
        `Corin Vask is beside you before you can blink, holding his slate to the wall. Numbers scroll across it. He frowns. He doesn't share what he sees.`,
        D("Corin", "Keep drilling. Right here. Please."),
        `Then you feel it under your boots: a faint shiver in the rock. Then another. And another.`
      ),
      choices: s => [
        mentor(s, "ibarra")
          ? { label: "Read the tremors the way Ibarra taught you to read the stars", tag: "Mentor: Navigator Ibarra", go: (s, r) => { r.f.warned = true; return { text: ["Ibarra taught you to watch how stars move together. The shivers move the same way: in a pattern, getting closer. You know what comes next.", N("You get an early warning.", "good")] }; } }
          : { label: "Count the shivers", check: { stat: "wits", dc: 4 }, go: (s, r, pass) => { r.f.warned = pass; return { text: pass ? ["Three shivers, a pause. Three shivers, a shorter pause. Old miners talk about this. You know what comes after it.", N("You get an early warning.", "good")] : ["It's probably just a drill on the next level. You turn back to the warm wall."] }; } },
        { label: "Ignore it and keep drilling", go: () => ({ text: ["You lean into the drill. Corin smiles at you like you're his favorite person."] }) }
      ]
    },
    s3: { title: "The Fall", next: "s4",
      text: (s, r) => P(
        r.f.warned ? `You grab Nessa by the back of her jacket. “Dagny! The rock's moving! Everyone back!” Dagny doesn't ask questions. She's already shoving the crew toward the side gallery when the ceiling lets go.`
                   : `The noise starts as a crack, like a giant snapping a stick. Then it's everywhere. The ceiling lets go.`,
        `It's the loudest thing you've ever heard, and then the quietest. Dust fills your mouth.`
      ),
      choices: (s, r) => [
        { label: "Dive for the side gallery!", check: { stat: "reflex", dc: 5, bonus: r.f.warned ? 1 : 0 }, go: (s, r, pass) => ({ text: [
          pass ? "You throw yourself sideways and roll. Stone slams down right where you were standing." : "You don't move fast enough. Falling rock clips you and you hit the ground hard.",
          !pass && strain(s, "Battered"),
          "Then the lights go out.",
          fearHit(s, r, "dark"),
          "Somewhere in the dark, a lamp clicks on. Old Sef is holding it up, calm as a man lighting a candle at supper.",
          D("Sef", "Well. That's four times now.")
        ] }) }
      ]
    },
    s4: { title: "Counting Heads", next: "s5",
      text: s => P(
        `Dagny calls names, one at a time.`,
        D("Dagny", "Malloy."), D("Sef", "Here. Unfortunately."), D("Dagny", "Vask."), D("Corin", "Here. My slate's cracked."), D("Dagny", "Kade."),
        `Nothing. Then, small: “…Here.”`,
        `Five of you. Behind you, where the tunnel used to be, there's a wall of broken rock from floor to ceiling.`,
        `Old Sef checks the little gauge on his belt. He checks it twice.`,
        D("Sef", "Air line's cut. What's in this pocket is what we've got. Five people breathing easy… six hours. Maybe a bit more, if nobody does anything stupid."),
        `Nobody says anything. Nessa is sitting against the wall with her knees pulled up, staring at Sef's gauge. Her hands are shaking. You've seen her run through a blast drill laughing. You've never seen her like this.`
      ),
      choices: s => [
        { label: "Sit next to her and give her a job", go: s => ({ text: [
          `“Nessa. You're the fastest counter I know. Count every air tank and every drop of water. Tell me exactly what we've got.” She looks at you. Then she nods and gets up. Her hands still shake, but now they're busy.`,
          D("Nessa", "Two half tanks. One full canteen, one half. Four ration bars. Five, if you count the one you owe me."),
          `She almost smiles.`, trust(s, "Nessa", 1)] }) },
        { label: "Tell her to stay put and stay quiet", go: () => ({ text: ["“Stay there. We'll figure it out.” She nods and pulls her knees in tighter. She doesn't say anything else."] }) }
      ]
    },
    s5: { title: "The Glow Behind the Rock", next: "s6",
      onEnter: (s, r) => {
        if (s.marked) return P(
          { lantern: "Your eyes start to glow, and you couldn't stop them if you tried. You look <i>through</i> the Door. Behind it there's open space: a passage, climbing up through the rock. <b>A way out, maybe.</b>",
            forge: "Your hands heat up all on their own. You press a palm to the Door, and it's warm back, exactly as warm as you. Like it's been waiting for hands like yours.",
            ward: "Light pours out of you and wraps the whole crew before you can pull it back. The Door hums. A low, deep note, like it's answering.",
            echo: "You hear it before you understand it. This isn't stone. It's a machine: huge, old, asleep, breathing slowly. And it's starting to wake up, because you're here." }[s.kind],
          `Everyone is staring at you now. At the light coming off you. Dagny looks for a long moment, then nods like she's filing it away.`,
          D("Dagny", "Later. We'll talk about that later."),
          fearHit(s, r, "seen"),
          `Corin is staring too, and he isn't afraid. He's <i>interested</i>. That's worse.`);
        return P(
          `The Door doesn't change when you get close. It doesn't change for anybody. It just glows, slow and steady, like a coal in a stove.`,
          (hasSkill(s, "Salvager") || s.stats.tech >= 4) && `You run your fingers along the carved lines. They aren't decorations. They're seams. Joints. <i>This is a machine,</i> you realize. <i>Older than the empire. Older than anything.</i>`,
          D("Sef", "My granddad told stories about doors like this. I thought he made them up."),
          D("Nessa", "What was behind it? In the story?"),
          D("Sef", "He never said. Just said you don't open one unless you mean it."));
      },
      text: s => P(
        `The crew sets the lamps low to save charge. In the dimness, you notice something nobody saw before.`,
        `Behind the fallen rock, at the bottom of the pile, there's light. Faint and red, the same color as the Ember smear in the sky.`,
        `You brush the rubble away. Under it, the wall is smooth, smoother than any drill could make, carved with curving lines that don't look like any writing you know. It's a door. Tall and narrow and round-topped, set into the rock like it grew there.`,
        D("Corin", "It's real. They said it wasn't… It's <i>real</i>."),
        D("Dagny", "Who said, Vask?"), `He doesn't answer.`
      )
    },
    s6: { title: "Corin's Secret", next: "s7",
      text: s => P(
        `Corin pulls you behind a pile of rock where the others can't hear. Up close, he smells like soap. Nobody in Burrow 9 smells like soap.`,
        `He opens his jacket. Clipped inside is a small silver tank with a mask.`,
        D("Corin", "Company rebreather. One extra hour of air. And this is the private code to the surface office. Not the crew line. The <i>real</i> line. I'll share both. All I want is a promise: when we open that Door, nobody talks about it. And whatever's inside comes to me."),
        `Over his shoulder, Nessa is pretending to count canteens. She's watching you.`
      ),
      choices: s => [
        { label: "Shake his hand. “Deal.”", tag: "Trade: gain air + code, take a burden", go: (s, r) => { r.f.trade = true; return { text: ["Corin smiles like he just won a card game and clips the rebreather to your belt. Nessa saw the handshake. She doesn't say anything.", addBurden(s, "company_secret"), N("You gain the rebreather and the surface code.", "good")] }; } },
        { label: "“Keep your secrets. The air goes to whoever needs it.”", go: s => ({ text: ["His smile slips. “You'll regret that.” Maybe. But when you walk back, Dagny gives you a small nod, and Nessa sits a little closer.", trust(s, "Nessa", 1)] }) }
      ]
    },
    s7: { title: "Voices on the Line", next: "s8",
      text: s => P(
        `Dagny cranks the dented comm box on the wall. It squeals to life.`,
        D("Tasker", "Burrow 9 surface. Overseer Tasker."), `He sounds like a man reading a grocery list.`,
        D("Dagny", "It's Roe. Five of us trapped in the deep seam. Air for six hours."),
        D("Tasker", "Understood. Rescue crew estimates… ten hours."),
        `Ten hours. Four hours too many.`,
        D("Nessa", "(whispering) That's not a rescue. That's a recovery."),
        mentor(s, "haldane") && N(`Haldane always said: <i>“When there's no good news, give people something to do.”</i> You split the crew into breathing shifts. Everyone calms down. The air will last a little longer.`, "good")
      ),
      choices: (s, r) => [
        { label: "Grab the handset and push him for the truth", check: { stat: "nerve", dc: 5, bonus: r.f.trade ? 1 : 0, tags: ["trust"] }, go: (s, r, pass) => { r.f.knowQuench = pass; return { text: pass
          ? ["“Tasker. I can hear a drill crew on your end of the line. Why aren't they digging?” Silence. Then, quietly: “The company wants the deep seam kept… intact. And we've called in some people to look at it. Dominion people.”", "<b>The Quench.</b> You hang up before you say something you can't take back."]
          : ["Tasker just repeats himself. “Ten hours. Please conserve your air.” Click."] }; } },
        hasSkill(s, "Hack") && { label: "Pop the panel and tap the company channel", tag: "Skill: Hack", go: (s, r) => { r.f.knowQuench = true; return { text: ["You splice two wires and press your ear to the box. Tasker's voice, talking to someone else: “…Marked activity at the seam. Quench arrive in four hours. Keep the crew calm.”"] }; } },
        hasTrait(s, "Peacemaker") && { label: "Talk to him about the crew's families, by name", tag: "Strength: Peacemaker", go: (s, r) => { r.f.drill = true; return { text: ["You don't argue. You just talk: about Dagny's kids, Sef's grandkids, Nessa's little brothers. Tasker sighs. “Fine. I'll send a drill team.”", N("A rescue drill starts. That will help later.", "good")] }; } },
        hasTrait(s, "Well Connected") && { label: "“The Lantern Guild knows I'm down here, Tasker.”", tag: "Strength: Well Connected", go: (s, r) => { r.f.drill = true; return { text: ["Tasker coughs. Suddenly the rescue time is eight hours."] }; } }
      ].filter(Boolean)
    },
    s8: { title: "The Second Fall", next: "s9",
      text: s => P(
        D("Sef", "Well. If nobody's coming down, I suppose we're going <i>through</i>."),
        `You're halfway to the Door when the ground groans like a huge, sleepy animal.`,
        D("Sef", "Oh, I don't like that."),
        `A big flat slab tips off the wall and slams onto Dagny's leg, pinning her. At the same moment, a crack splits the floor between you and Old Sef, and it's widening fast.`,
        D("Sef", "Don't mind me! Get the boss!"),
        D("Dagny", `Don't you DARE, ${nm(s)}. Get Sef!`),
        `There's only time for one.`,
        N("<b>Hard choice.</b> Every option costs something.", "mark")
      ),
      choices: s => [
        { label: "Hold the slab for Dagny", go: (s, r) => ({ text: [
          "You get your shoulder under the slab and <i>push</i>. Something in your shoulder goes <i>crack</i>, but the slab rises an inch and Dagny drags herself free. Across the tunnel, Old Sef takes a running start, which looks very funny for a man his age, and flops across the crack on his belly. “Still got it,” he wheezes.",
          addWound(s, "cracked_shoulder"), nessaWound(s), truth(s)] }) },
        { label: "Pull Sef across", go: (s, r) => { r.f.dagnyHurt = true; return { text: [
          "You lie flat at the edge of the crack and stretch out your arm. Sef grabs it. You haul him over just as the gap gets too wide. When you turn around, Dagny is still pinned. It takes all of you and a pry bar to free her, and her leg is hurt bad. She doesn't blame you. But you heard her call your name, and you didn't come.",
          addWound(s, "heard_her_call"), nessaWound(s)] }; } },
        s.marked && s.kind !== "echo" && { label: { forge: "Burn the Ember: hold the slab AND reach Sef", ward: "Burn the Ember: shield them both", lantern: "Burn the Ember: find the safe line" }[s.kind], tag: "Ember burn (costs Strain)", go: (s, r) => ({ text: [
          { forge: "You hold the slab one-handed, your palm glowing orange against the stone, and stretch your other arm out to Sef. Both of them make it. Both of them stare at you.",
            ward: "Light bursts out of you in a shimmering dome. Rocks bounce off it like hail off a tin roof. Dagny wriggles free. Sef walks across the crack <i>on your light</i>, like it's a bridge.",
            lantern: "Your eyes blaze. You see the one spot where the crack is narrowest, shout it to Sef, then throw your weight on the pry bar for Dagny. Everyone makes it." }[s.kind],
          burn(s, r), nessaWound(s), truth(s)] }) }
      ].filter(Boolean)
    },
    s9: { title: "The Long Dark", next: "s9b",
      text: s => P(`Two hours of air left. Maybe three. Corin keeps checking his cracked slate. Dagny keeps saying she's fine. Sef hums an old mining song, badly, which somehow helps.`, `What do you do?`),
      choices: s => [
        hasTrait(s, "Planner") && { label: "Ration the air by the clock", tag: "Strength: Planner", go: s => ({ text: ["You set a timer. Everyone rests and takes turns on the tanks. When it's Nessa's turn, she tries to skip it. “Someone else needs it more.” You hand her the mask and wait, arms crossed, until she takes three full breaths. She glares at you. Then she says “thanks” very quietly.", trust(s, "Nessa", 1)] }) },
        hasTrait(s, "Bold") && { label: "Scout the way to the Door alone", tag: "Strength: Bold", go: (s, r) => ({ text: ["You take a lamp and go. The tunnel narrows. The crew's voices fade.", fearHit(s, r, "alone"), "But you find a safe path around the crack. The whole crew reaches the Door without a scratch."] }) },
        hasTrait(s, "Peacemaker") && { label: "Settle the fight between Corin and Dagny", tag: "Strength: Peacemaker", go: () => ({ text: ["“Hey. We're all breathing the same air. Let's not waste it yelling.” They both laugh, surprised. The whole crew relaxes."] }) },
        hasTrait(s, "Survivor") && { label: "Sneak a little extra air for yourself", tag: "Strength: Survivor", go: s => { s.strain = []; return { text: ["Just a few breaths, when nobody's looking. You feel better right away. But when you put the mask down, Nessa is watching. She looks away fast.", trust(s, "Nessa", -1)] }; } },
        { label: "Keep everyone moving toward the Door", go: () => ({ text: ["One foot in front of the other. That's how you get anywhere down here."] }) }
      ].filter(Boolean)
    },
    s9b: { title: "Lights Out", next: "s10",
      text: s => P(`Then a lamp sputters out, and in the sudden dark, Nessa <i>bolts</i>. She's gone before anyone can grab her, running blind into the black tunnel, her footsteps slapping away.`),
      choices: s => [
        { label: "Run after her!", check: { stat: "reflex", dc: 5, tags: ["dark"] }, go: (s, r, pass) => ({ text: pass ? ["You catch her by the sleeve at the very edge of the crack. She was one step from falling in."] : ["You both trip in the dark and slam into the rock wall. Ow.", strain(s, "Battered")] }) },
        trustOk(s, "Nessa") && { label: "Call her name. Just once, steady.", tag: "Needs Nessa's trust", go: s => ({ text: ["“Nessa. I'm right here. Come back to my voice.” The footsteps stop. Slowly, they come back. She walks into the lamplight, shaking, and sits down next to you without a word.", trust(s, "Nessa", 1)] }) },
        { label: "Let her go. She knows these tunnels.", go: s => ({ text: ["She comes back ten minutes later, limping and covered in dust. “Couldn't find a way out,” she mumbles.", strain(s, "Tired")] }) }
      ].filter(Boolean)
    },
    s10: { title: "Sef's Story", next: "s11",
      text: s => anyWound(s)
        ? P(`The crew rests right in front of the Door, in its warm red glow. Old Sef lowers himself down beside you with a groan, like an old folding chair.`,
            D("Sef", "That's a bad one you're carrying. I've been buried four times now. The rock's not the hard part. The hard part's what you bring out with you. You can sit with it awhile here in the warm, and I'll sit with you. But I'll be honest: sitting costs air."),
            N(`<b>Heal Fork.</b> Take the time to heal, and Corin will go through the Door first, and you'll reach the surface after the Quench arrive. Or push on, still carrying it.`, "mark"))
        : P(`While the others rest, Old Sef sits beside you in the Door's red glow.`,
            D("Sef", "My granddad said these doors weren't built to keep things out. He said they were built to keep a <i>promise</i> in. Never knew what that meant. Still don't."),
            mystery(s, "The Doors were built to keep a promise in.")),
      choices: s => anyWound(s) ? [
        { label: "Take the time to heal", go: (s, r) => { r.f.healed = true; const w = s.wounds[s.wounds.length - 1];
          const txt = { cracked_shoulder: "Dagny splints your shoulder with a pry bar and two belts, grumbling the whole time. Then you lean back against the Door. It's warm, like sitting with your back to a stove. The ache fades.",
            heard_her_call: "Dagny limps over and drops down next to you. “Listen. If you'd picked me and Sef had fallen in that crack, I'd never have forgiven you. You made the right call. Got it?” You nod. Something in your chest unknots.",
            too_much_light: "You lay your palms on the Door. The extra light inside you, the buzzing too-much feeling, drains into the stone like heat out of a coal. The Door glows a little brighter. You feel lighter." }[w] || "Sef sits with you. He doesn't say much. He doesn't have to. Slowly, it gets easier to breathe.";
          return { text: [txt, healWound(s, w), N("The cost: Corin slips through the Door ahead of you. And the Quench will be waiting up top.", "bad")] }; } },
        { label: "Push on carrying it", go: () => ({ text: ["You stand up. Sef shrugs, like he expected that, and stands up too."] }) }
      ] : null
    },
    s11: { title: "Through the Door", next: "s12",
      text: (s, r) => P(
        r.f.healed ? `When you get up, Corin is gone. The Door is open a crack, and red light spills out. You hear metal scraping on stone inside.`
                   : s.marked ? `You put your hands on the Door. It knows you. It slides open like it's been waiting.` : `You find the seam, set the pry bar, and heave. The Door opens with a sigh, like something breathing out after a very long time.`,
        `Inside is a small round room with no dust at all, like time never came in. Carved around the walls are four symbols, each as tall as you: an <b>eye</b>, a <b>hand</b>, a <b>circle</b>, and a <b>wave</b>.`,
        `In the center, on a stone pillar, sits a fist-sized ball of red light. It pulses slowly. <i>Thump. Thump. Thump.</i> Like a heart.`,
        D("Nessa", "(barely a whisper) …It's alive."),
        `Behind the pillar, an old shaft climbs up into the rock with metal rungs set in the wall. A way out.`,
        s.marked ? P(`As you walk past the walls, one symbol lights up bright as a lamp: the <b>${{ lantern: "eye", forge: "hand", ward: "circle", echo: "wave" }[s.kind]}</b>. Your Mark. Somebody carved your Mark into this wall a thousand years before you were born.`, mystery(s, "The four Kinds of Mark are older than the empire."))
          : P(`None of the four symbols light for you. Of course they don't. But low on the wall, between the hand and the circle, there's a fifth shape you almost missed: a smooth, blank circle with nothing carved inside. You touch it without thinking.`, `It glows. Just a little. Just for you.`, `Old Sef sees it. He raises his eyebrows very, very high.`, mystery(s, "There's a fifth symbol, and it's blank."), truth(s)),
        r.f.healed && `Corin is at the pillar, prying at the glowing seed with a screwdriver. Where he's scraped it, the whole room shudders. Little cracks spread across the walls.`
      )
    },
    s12: { title: "The Heartlight", next: "s13",
      text: s => P(
        D("Sef", "That light's holding this place up. Keeping the air fresh, too. That's why there's no dust. Take it off that pillar and…"), `He doesn't finish.`,
        D("Corin", "Do you know what the <i>Dominion</i> would pay for this? What the company would do for the people who found it?"),
        D("Dagny", "I know what the Quench do to people who find things."),
        `Everyone is looking at you.`, N("<b>Dilemma.</b> No choice here is clean.", "mark")
      ),
      choices: (s, r) => [
        { label: "Take the seed", go: s => { r.f.seed = true; return { text: ["You lift it off the pillar. It's warm and heavy and beats against your palm like a tiny drum. For one second you feel something enormous and far away, like the whole sky just noticed you. Then the room starts to shake. “MOVE!” Dagny yells.", mystery(s, "A beating seed of Vael."), addBurden(s, "carrying_seed")] }; } },
        { label: "Leave it, and seal the Door behind you", go: s => ({ text: [
          s.kind === "forge" ? "You press your burning hand to the Door's edge and weld it shut." : s.kind === "echo" ? "You hum to the Door. It hums back, sleepy, and slides closed for good." : "You and Dagny jam the pry bar into the hinge and bend it until the Door can never open again.",
          "Corin looks like you just set his money on fire. “The company will hear about this.”", addBurden(s, "blacklisted"), truth(s)] }) },
        r.f.trade && { label: "Give it to Corin. You promised.", go: s => ({ text: ["Corin wraps the seed in his jacket and hugs it like a baby. “You won't regret this. I'll make sure they pay you.” Behind you, Nessa doesn't say anything at all, which is worse than yelling.", trust(s, "Nessa", -1), addAlly(s, "Corin Vask (company contact)")] }) }
      ].filter(Boolean)
    },
    s13: { title: "Up the Old Shaft", next: "s14",
      text: (s, r) => P(`The shaft goes up, and up, and <i>up</i>. Rung after rung. Your arms burn. Your legs shake.`,

        r.f.dagnyHurt && { label: "Rig a rope and haul her up together", go: () => ({ text: ["Slower, but everyone shares the weight. Nobody gets left behind."], next: trustOk(s, "Nessa") ? "s13b" : "s14" }) },
        !r.f.dagnyHurt && { label: "Keep climbing", go: () => ({ text: [], next: trustOk(s, "Nessa") ? "s13b" : "s14" }) }
      ].filter(Boolean)
    },
    s13b: { title: "Nessa Asks", next: "s14",
      text: s => P(`Halfway up, Nessa stops on the rung below you.`, D("Nessa", "Can I go first? I'm the runner. Leading's my job. I just… need you right behind me."), `She's still scared. You can see it. But she's holding the rungs like she means it.`),
      choices: s => [
        { label: "“Go. I've got you.”", go: s => ({ text: ["She climbs past you, quick and sure, and you stay one rung behind her the whole way. When you look up, she's grinning.", trust(s, "Nessa", 1), compStep(s, "Nessa")] }) },
        { label: "“Better if I lead. Just in case.”", go: () => ({ text: ["She nods and drops back. It's the safe choice."] }) }
      ]
    },
    s14: { title: "The Shaft Head", next: "s15",
      text: (s, r) => P(
        `There's a rusty hatch at the top. You shove it open. Gray daylight pours in, and real air, and everyone gulps it like water.`,
        `Then you see who's waiting.`,
        `You've come out in an old, abandoned pit-head: a rusty shed with half a roof. In the doorway stands Overseer Tasker, and six people in long gray coats with silver collars. <b>The Quench.</b>`,
        `In front of them is a woman with short dark hair and a calm, patient face, like a teacher waiting for a class to quiet down.`,
        D("Kroll", "Good afternoon. I'm Warden Sabeth Kroll. You must be very tired."),
        s.marked && D("Kroll", "And there you are. You glow, you know. Very faintly. Like a candle behind a curtain."),
        r.f.seed && D("Kroll", "And you've brought me something. I can feel it from here."),
        D("Kroll", `Your shift boss needs a doctor. I have one. Your friends can go home and nobody needs to be hurt. I only need ${s.marked && r.f.seed ? "you, and the seed" : s.marked ? "you" : r.f.seed ? "the seed" : "to know how you opened that Door"}.`),
        `Behind you there's an ore chute: a long metal slide down to the cargo yard. If the crew can reach it, they can get away. But the troopers are already walking forward.`,

        N("<b>The Crucible.</b> The biggest choice in the book. What you choose here will follow you.", "mark")

        { label: "Hold them off while the crew escapes down the chute", go: s => ({ text: ["You step into the narrow gap between the troopers and the chute and plant your feet. “Go. GO!” One by one, the crew slides past you and drops away. The troopers push. You push back. The rusty walls press in and the air is full of dust and you count every second until the last one is gone. Then you throw yourself down the chute after them.", N("Everyone escapes.", "good"), addWound(s, "count_the_breaths"), truth(s)] }) },
        s.marked && { label: "Burn the Ember hard and bring the roof down", tag: "Ember burn", go: (s, r) => ({ text: [
          { forge: "You slam your burning fists into the old support beam.", ward: "Your shield blasts outward and knocks the rusty supports flying.", lantern: "Light pours from your eyes, so bright the troopers stagger while you kick out the support beam.", echo: "You yell at the old crane above the door, and it <i>answers</i>, swinging hard into the roof." }[s.kind],
          "The roof crashes down between you and the Quench. When the dust clears, the crew is gone down the chute, and so are you. Through the wreckage, Kroll's voice, still calm: “That was very impressive. I'll see you soon.”",

        r.f.seed && { label: "Give her the seed", go: (s, r) => { s.burdens = s.burdens.filter(b => b !== "carrying_seed"); return { text: ["You hold it out. Kroll takes it in both hands, almost gently. The light dims in her hands. “Thank you.” The troopers step aside, and a medic runs to Dagny. Nobody gets hurt. But as you walk away, it feels like someone turned off a light inside you.", addBurden(s, "seed_dominion"), addWound(s, "gave_away_light")] }; } },
        trustHigh(s, "Nessa") && { label: "Look at Nessa", tag: "Nessa's trust is high", go: s => ({ text: ["She's already looking at you. She tips her head toward a dark gap behind a rusted ore cart.", D("Nessa", "Old runner tunnel. Not on any map. I know it in the dark. Follow me. I'm not holding my breath anymore."), "She ducks behind the cart, and the crew follows her one by one into a crawlway so small the troopers don't notice. Kroll turns around and you're all just… gone.", N("Everyone escapes.", "good"), compHeal(s, "Nessa"), truth(s)] }) },
        !s.marked && s.star >= 3 && { label: "Something is happening to your hands…", tag: "✦ Hidden choice", go: () => ({ text: ["They're warm. Warmer. Warm like the Door was. You look down, and your palms are <i>glowing</i>."], next: "awaken" }) }
      ].filter(Boolean)
    },
    awaken: { title: "The Mark Awakens", next: "s14",
      text: s => P(`Light pours out of you for the first time in your life. It feels like waking up. What kind of light is it?`),
      choices: s => ["lantern", "forge", "ward", "echo"].map(k => ({ label: { lantern: "Lantern: your eyes blaze, and you can see through everything", forge: "Forge: your hands burn hot enough to bend steel", ward: "Ward: light wraps around you like a shield", echo: "Echo: every machine in the room starts humming your name" }[k],
        go: s => { s.marked = true; s.kind = k; s.stats.ember = 2; return { text: [N(`<b>Your Mark has awakened: ${k[0].toUpperCase() + k.slice(1)}.</b> Ember 2. Now choose again, with your new Mark.`, "mark")] }; } }))
    },
    s15: { title: "Daylight in the Gnaw", next: "END",
      text: (s, r) => P(
        hasBurden(s, "seed_dominion") ? `An hour later, you're on a bench outside the Quench medic tent. Dagny's leg is splinted. The crew is safe. Nobody is talking much.`
          : `An hour later, you're all sitting on top of an empty ore hauler, rumbling slowly away from Burrow 9. Gray rocks drift past. Above them, the Ember smear glows red.`,
        `Sef is asleep and snoring. Nessa sits down next to you with her knees pulled up and bumps your shoulder with hers.`,
        D("Nessa", "So. Are you leaving?")),
      choices: s => [
        { label: "“I have to. But I'll miss you, runner.”", go: () => ({ text: ["She nods like she expected it. Then she pulls a stub of blue chalk out of her pocket and draws a little arrow on the back of your hand. “Runner's mark. Means ‘this way out.’ For luck.”", "Old Sef, still asleep, mumbles something that sounds like “four times.”"] }) },
        trustHigh(s, "Nessa") && { label: "“Come with me.”", tag: "Nessa's trust is high", go: s => { ensureComp(s, "Nessa").travel = true; return { text: ["She stares at you. Then at Dagny. Dagny opens one eye. “Go on, kid. Somebody's got to keep this one out of trouble.” Nessa whoops so loud Sef wakes up.", addAlly(s, "Nessa Kade")] }; } },
        { label: "“I'll come back for all of you. I promise.”", go: s => ({ text: ["Nessa holds out her pinky, very seriously, and you shake on it.", addBurden(s, "promise_crew")] }) }
      ].filter(Boolean)
    }
  }
});
function nessaWound(s) { return P(`When the dust settles, you hear something small. Nessa has backed into a corner, hands over her ears, breathing in short fast gasps, like she's trying to save every bit of air in the tunnel.`, compWound(s, "Nessa", "holding_her_breath")); }
