      )
    },
    s4: { title: "The Stone Splits", next: "s4b",
      text: s => P(
        `Brother Tam turns to call the next name. That's when the oathstone makes a sound you will remember for the rest of your life.`,
        `A creak, like a door in an empty house. A groan, deep under the ground. Then a <b>CRACK</b> like thunder right on top of you, and the oathstone splits down the middle from top to bottom: through every promise, through your name, through the scratched-out line.`,
        `The wind hits all at once. Every ribbon on the green tears loose and flies up like startled birds. The torches gutter. And at the forest edge, the trees go <b>dark</b>, darker than night, as if someone pulled a curtain.`,
        `Then something comes out of the trees. It's shaped like a wolf, but it's made of thorn and bramble and moss, woven tight like a basket, with long legs that click when they move and eyes like two green lanterns. Then another. Then ten.`,
        D("Tam", "(barely a whisper) Briarhounds.")
      ),
      choices: (s, r) => [
        { label: "Move!", check: { stat: "courage", dc: 4, bonus: r.f.crack ? 1 : 0 }, go: (s, r, pass) => { const fh = fearHit(s, r, "dark"); return { text: [
          pass ? "You don't freeze. You grab Posy's hand and move." : "Your body won't listen. You stand there with your mouth open until a scream finally breaks the spell.",
          !pass && strain(s, "Shaken"), fh && "The torches go out, all of them at once.", fh] }; } }
      ]
    },
    s4b: { title: "Green Eyes", next: "s5",
      text: s => ob.born(s) ? P(
        `Every briarhound on the green stops. All at once, every head turns: past the screaming people, past Brother Tam, past the split stone. At <b>you</b>.`,
        `The lead hound lifts its thorny head and makes a sound like creaking branches. You don't understand it. But your hands do. They're glowing faintly, the way the stone did.`,
        D("Posy", `(screaming) ${nm(s)}! <b>${nm(s)}, RUN!</b>`),
        `Her voice cuts across the whole green, high and sharp. Several of the hounds turn their heads toward <i>her</i>. She sees them looking. She claps both hands over her mouth.`
      ) : P(
        `The briarhounds sniff the air. Their heads swing back and forth, searching. Then, one by one, they turn toward the ribbon stall. Toward Posy.`,
        `She has gone completely white. She grabs your sleeve with both hands.`,
        D("Posy", `I didn't mean it. ${nm(s)}, I didn't <i>mean</i> it. Last summer at the edge of the woods there was a little fox thing made of leaves, and it was so sad, and I said I'd come play with it forever. It was just a thing you say.`),
        `In Hollin's Ford, nothing is just a thing you say.`
      ),
      onEnter: (s, r) => s.cls === "ranger" ? N(`<b>Trackwise.</b> You watch the hounds the way you'd watch wolves on a hillside. They aren't biting. They're <i>circling</i>, cutting people off. <b>They're herding.</b> They want someone alive.`, "mark") : "",
      choices: s => [
        { label: "Kneel and look her in the eyes. “This isn't your fault. Hold my hand.”", go: (s, r) => { r.f.held = true; return { text: ["She nods hard and grabs your hand.", trust(s, "Posy", 1)] }; } },
        { label: "“Not now. Be quiet and run.”", go: () => ({ text: ["You pull her along. She runs, but she's crying now, silently, and she won't look at you."] }) }
      ]
    },
    s5: { title: "Hold the Green", next: "s5b",
      text: s => P(
        `The green is chaos. People run in every direction. A stall has caught fire from a fallen torch. Kids are crying for parents they can't find. The hounds are everywhere, clicking and circling.`,
        `You can't stop all of them. But you can do <i>something</i>.`
      ),
      choices: s => [
        ob.when(s.cls === "knight", { label: "Stand Firm: plant yourself in front of the crowd", tag: "Knight", go: s => ({ text: ["You grab a fallen pitchfork. “Here! Everyone behind me!” For one second nobody listens. Then Hob Tully, of all people, grabs a bench and steps up beside you. Then the blacksmith. Then six more. A line forms. The hounds circle it and slide away. Twenty people are safe because you didn't run."] }) }),
        ob.when(s.cls === "barbarian", { label: "Rage: flip the hay wagon into a wall", tag: "Barbarian", go: (s, r) => { s.stats.courage = Math.max(0, s.stats.courage - 1); return { text: ["It takes four men to move that wagon. You get your shoulder under it, and something hot and huge roars up inside you, and the wagon goes over in a cloud of hay. People scramble behind it. A hound leaps at the top and you shove it back with both hands. Thorns rip your sleeves. You don't feel it until later.", N("Your hands won't stop shaking afterward. <span class='dim'>(Courage −1 for the rest of the book.)</span>", "bad")] }; } }),
        ob.when(s.cls === "wizard", { label: "Spellwork: throw light over the green", tag: "Wizard", check: { stat: "lore", dc: 5 }, go: (s, r, pass) => ({ text: ["Hounds hate light. Every story says so. You trace the lantern spell bigger, with both hands, and throw it into the air. White light pops over the green like a firework. The hounds flinch and scatter toward the trees.", pass ? "The light holds long enough for everyone to get clear." : "It flickers out too soon, and your head splits with pain. But people got a head start.", !pass && strain(s, "Spell-Drained")] }) }),
        ob.when(s.cls === "healer", { label: "Mend: get the hurt to safety", tag: "Healer", go: s => ({ text: ["An old woman is down with a twisted ankle. A man is holding his bleeding arm. A kid is sitting in the grass, too scared to move. You go to them one by one, talking calmly, pulling them behind the shrine wall. Your voice is the only calm thing on the green. People start to listen to it."] }) }),
        ob.when(s.cls === "rogue" || s.cls === "ranger", { label: "Lead people out the back lanes", tag: s.cls === "ranger" ? "Ranger: Trackwise" : "Rogue", check: s.cls === "ranger" ? null : { stat: "swift", dc: 4 }, go: (s, r, pass) => ({ text: ["You know the lanes: the alley by the tannery, the gap in the Tullys' hedge, the path to the ford. “This way! Stay low!” A line of people follows you, hands on each other's shoulders.", pass ? "Not a single hound notices." : "A hound cuts off the alley and you double back. Everyone gets out, but it was close.", !pass && strain(s, "Winded")] }) }),
        { label: "Shout, grab kids, push them toward the shrine", check: { stat: "courage", dc: 5 }, go: (s, r, pass) => ({ text: [pass ? "It's messy and loud, but it works. People get clear." : "A hound knocks a man flat right in front of you. He gets up, limping. You couldn't stop it.", !pass && strain(s, "Shaken")] }) }
      ]
    },
    s5b: { title: "The Leaf-Fox", next: "s6",
      text: (s, r) => P(
        `When you look down, your hand is empty.`,
        r.f.held ? `You <i>had</i> her. You had her hand. Somewhere in the crowd, it slipped out of yours.` : `She was right behind you. Then she wasn't.`,
        `“Posy? <b>POSY!</b>” Through the smoke you see a flash of ribbons running toward the old shrine at the far end of the green. She's going to hide. The shrine is where kids hide during thunderstorms.`,
        `Then you hear something else: a thin, high crying, coming from the burning ribbon stall. Pinned under a fallen beam, with sparks raining around it, is a creature the size of a cat, shaped like a fox but made of leaves and twigs and moss. One leg is caught. The hounds run right past it.`,
        !ob.born(s) && `<i>A little fox thing, made of leaves.</i> That's what Posy said.`,
        hasTrait(s, "Listens to the Wild") && `It's a baby, and it's hurt. You know it the way you know when a bird is sick.`,
        `The stall roof is about to fall. If you stop, you'll lose sight of Posy.`
      ),
      choices: s => [
        { label: "Free it", tag: "Costs you time", go: (s, r) => { r.f.thorn = true; return { text: ["You kick the beam aside. Sparks bite your hands. The little creature scrambles free, stares at you with green eyes for one long second, and darts into the dark. When you look up, Posy's ribbons are gone.", strain(s, "Burned Hands"), ob.tc(s, r)] }; } },
        { label: "Leave it. Posy comes first.", go: () => ({ text: ["You turn away. The crying follows you across the green until the roof comes down and it stops. You don't look back."] }) }
      ]
    },
    s6: { title: "Old Marrow's Sword", next: "s7",
      text: s => P(
        `Halfway across the green, a hand grabs your shoulder. It's Old Marrow, who runs the Ferryman's Rest. He's been old as long as you can remember, with a bad knee and a voice like gravel. Some say he was a real knight once. He isn't leaning on his cane now. He's holding something long, wrapped in oilcloth.`,
        `He pulls back the cloth. A sword: worn leather grip, dull gray steel. When the firelight hits it, the blade seems to drink the light.`,
        D("Marrow", "I swore never to draw this again. Forty years ago, on that stone. I can't break it now, not even tonight. But <i>you</i> didn't swear that. This was made for cutting thorn. Swear you'll carry it to Greyspire, to the Hall of Oathwardens, and tell them Marrow sent it home. Swear it, and it's yours until then."),
        mentor(s, "marrow") && `He taught you to hold a practice sword, and to hold your temper. You've never once seen him afraid. He's afraid now.`,
        `Near the hilt, where a smith would stamp a mark, the steel is gouged. Somebody scratched the mark away, hard, the same way someone scratched that line off the oathstone.`,
        (s.cls === "wizard" || s.stats.lore >= 5) && `<i>Exactly</i> the same deep, angry strokes. It's like the same hand did both.`,
        `Across the green, a scream from the ferry house: Aunt Bryn's voice. At the same moment, thorns begin to grow over the shrine door where Posy ran.`,
        D("Marrow", "Decide, child.")
      ),
      choices: s => [
        { label: "“I swear I'll carry it to Greyspire.”", tag: "Trade: gain the sword, take an oath", go: s => ({ text: ["The words feel heavy in your mouth, like stones. Marrow puts the sword in your hands. It's lighter than it looks, and it already fits.", ob.born(s) && "As you finish, the sword hums faintly, like it heard you.", ob.give(s, "Marrow's sword"), ob.swear(s, "marrow")] }) },
        { label: "“I can't promise that. Not tonight.”", go: () => ({ text: ["Marrow looks at you for a long moment. Then he nods and wraps the sword back up. “Smart. Maybe smarter than I was.” He limps away into the smoke."] }) }
      ]
    },
    s7: { title: "Two Fires of Thorn", next: "s7b",
      text: s => P(
        `The thorns are coming up through the ground. They burst out of the grass like green snakes, thick as your arm, curling and climbing and squeezing until fence posts snap.`,
        `On one side of the green, the ferry house is groaning. Thorns have wrapped it like a fist, and through the broken window you can see Aunt Bryn pinned against the back wall by a fallen beam.`,
        D("Bryn", `${nm(s)}! Don't you come in here! Get Posy!`),
        `On the other side, the little stone shrine is disappearing. Thorns are knitting across its doorway like a net. Inside, you can hear Posy: the sound of someone trying very hard not to make any sound at all.`,
        `Fifty steps one way. Fifty steps the other. You can't reach both. Not the normal way.`,
        ob.item(s, "Marrow's sword") && `Marrow's sword hums against the thorns, like it's hungry.`
      ),
      choices: (s, r) => [
        { label: "Run for the ferry house. Save Aunt Bryn.", go: (s, r) => { r.f.saved = "bryn"; s.flags.bryn = "home"; return { text: [
          "You hack and tear your way through the thorns at the door. One wraps around your throat and squeezes, and for a terrible moment you can't breathe, can't move. Then you rip free. You get your shoulder under the beam, Bryn pushes, and you stumble out just before the roof caves in.",
          "Across the green, the thorns over the shrine door suddenly go slack and pull back into the ground. Posy walks out. Alone. Her ribbons are torn. Her arms are scratched. She was in the dark with the thorns all by herself, and she isn't making any sound at all.",
          addWound(s, "thorn_dreams"), strain(s, "Thorn-Cut")] }; } },
        { label: "Run for the shrine. Save Posy.", go: (s, r) => { r.f.saved = "posy"; s.flags.bryn = "taken"; return { text: [
          s.cls === "barbarian" ? "The rage comes roaring up again. You rip the whole door off its hinges, thorns and all, and throw it across the green." : "You tear at the thorns over the door with your bare hands until it gives.",
          "Posy is curled under the altar with her hands over her ears. When she sees you, she throws herself at you so hard you both fall over.",
          "Then the ferry house screams. The thorns lift the roof off it like the lid off a box, and they reach inside and lift Aunt Bryn out, gently, almost carefully, the way you'd lift a bird. She's alive. She's shouting your name, and Posy's name, and then the forest closes behind her like water.",
          "Posy saw all of it. She opens her mouth to scream. Nothing comes out.",
          addBurden(s, "bryn_taken"), addWound(s, "into_the_wood"), trust(s, "Posy", -1)] }; } },
        ob.when(s.cls === "knight", { label: "Stand Firm: hold the ferry house, then run", tag: "Knight", go: (s, r) => { r.f.saved = "both"; s.flags.bryn = "home"; return { text: [
          "You go <i>through</i> the thorns and brace your back against the bending wall. “Bryn, crawl! NOW!” The wall wants to fall. You don't let it. Bryn drags herself out through the window.",
          "Then you run. Fifty steps. The thorns grab your legs and you kick free. The shrine door is almost closed, just a gap the size of a hand. You tear it open, and Posy falls into your arms. She was alone in the dark for too long. She doesn't say a word.",
          addWound(s, "thorn_dreams"), strain(s, "Exhausted")] }; } }),
        ob.when(ob.born(s), { label: "Call on your Oath", tag: "Oath: always works, always costs", go: (s, r) => { r.f.saved = "both"; s.flags.bryn = "home"; return { text: [
          { shield: "Gold light wraps around Bryn and Posy at the same moment. The thorns hit it and slide off like rain off glass.",
            truth: "The ringing in your ears becomes a word, and you <i>shout</i> it, and every thorn on the green flinches. For one breath, they remember they aren't supposed to be here.",
            bind: "You throw out both hands and the thorns freeze, every one, like a picture. You hold them. It's like holding a hundred ropes at once.",
            mend: "You reach for the ferry house wall without touching it, and it straightens, beam by beam, and holds. Then you reach for the shrine door." }[s.okind],
          "Bryn gets out. You reach the shrine, and Posy falls into your arms. Then the light goes out of you all at once and you drop to your knees, emptier than you've ever been.",
          ob.call(s, r)] }; } })
      ]
    },
    s7b: { title: "Posy", next: "s8",
      text: (s, r) => {
        let w = "";
        if (r.f.fresh) w = ob.posyGain(s, ob.born(s) ? "posy_shout" : "posy_words");
        return P(
          r.f.fresh && !ob.born(s) && `Posy is staring at the forest. When you say her name, she flinches. She presses both hands over her mouth, hard, like she's holding something in. Slowly you understand what she's thinking: <i>she made a promise. The promise brought the forest. The forest took everything.</i> She's afraid of her own words.`,
          r.f.fresh && ob.born(s) && `You remember her scream across the green, and the hounds turning toward her. Now, every time someone shouts or a dog barks, Posy goes completely still, like a rabbit in the grass. She learned tonight that being heard brings the hounds.`,
          !r.f.fresh && `Posy is shaking. Whatever she was carrying before tonight, it's back now, all of it. She grips your sleeve and won't let go.`,
          w,
          r.f.saved !== "posy" && `Aunt Bryn kneels, pulls Posy in, and holds her. She looks at you over Posy's head, and her face says <i>thank you</i> and <i>I'm sorry</i> at the same time. Then she's Bryn again, already counting heads, already looking for the way out.`
        );
      }
    },
    s8: { title: "Down to the Ford", next: "s8c",
      text: s => P(
        `The hounds are searching house to house now. You run, crouched low, through the tall reeds along the river toward the ford, the shallow place where the water only comes up to your knees.`,
        ob.brynHome(s) && D("Bryn", "The reeds. Stay low. I'm right behind you."),
        `At the ferry dock you pass the post where Aunt Bryn hangs her fare slate: a little square of black slate on a string, with a nub of chalk tied to it. Posy grabs it as she runs past and hugs it to her chest.`
      ),
      choices: s => [
        s.cls === "ranger"
          ? { label: "Read the reeds like a trail", tag: "Ranger: Trackwise", go: (s, r) => ({ text: ["Where the reeds are bent, where the mud is firm, where a deer path cuts through to the water. You reach the ford with the hounds searching the wrong end of the village."], next: hasWound(s, "thorn_dreams") ? "s8t" : "s8c" }) }
          : { label: "Run for the ford", check: { stat: "swift", dc: 5, bonus: ob.brynHome(s) ? 1 : 0 }, go: (s, r, pass) => ({ text: pass ? ["You find the way through and reach the ford with the hounds still searching the wrong end of the village."] : ["A hound crashes through the reeds right behind you. You throw yourselves into the river and let the current carry you, gasping, until you can drag yourselves out on a muddy bank. You lose your pack.", strain(s, "Soaked and Bruised")], next: hasWound(s, "thorn_dreams") ? "s8t" : "s8c" }) }
      ]
    },
    s8t: { title: "The Bramble", next: "s8c",
      text: s => P(`Halfway through the reeds, something thin and rough and <i>grabbing</i> brushes your arm. Only a bramble. But your whole body locks up. You're back in the ferry house with a thorn around your throat.`, N("<b>Thorn-Dreams.</b> Your feet won't move.", "bad")),
      choices: s => [
        ob.when(trustOk(s, "Posy"), { label: "Let Posy help", tag: "Posy's trust: steady or high", go: () => ({ text: ["Something small and cold slips into your hand. Posy squeezes it twice. Tap, tap. <i>I'm here.</i> She doesn't say it. She doesn't have to. You breathe out. Your feet move. <span class='dim'>(From now on, two taps is Posy's signal: “I'm here.”)</span>"] }) }),
        { label: "Rip free on your own", check: { stat: "courage", dc: 5, tags: ["thorn"] }, go: (s, r, pass) => ({ text: [pass ? "You tear your arm free and keep going. Your heart doesn't slow down for a long time." : "You stand frozen too long. A hound finds your trail. You get away, but only just.", !pass && strain(s, "Shaken")] }) }
      ]
    },
    s8c: { title: "Across the River", next: s => anyOf(s, ["thorn_dreams", "into_the_wood", "hollowed"]) ? "s9" : "s9n",
      text: s => P(`You splash across the ford and crawl up the far bank. Hollin's Ford is covered in thorns. Where the oathstone stood, two broken halves lean apart in the dark like a door left open.`, ob.posySilent(s) ? `Posy wipes the slate on her sleeve and slowly writes something. She holds it up.` : `Posy hugs the slate to her chest and looks up at you.`, ob.say(s, "Where now?"))
    },
    s9: { title: "Grandmother Isel's Cottage", next: "s10",
      text: s => P(
        `A light upriver, at the very edge of the trees: Grandmother Isel's cottage. She's a hedge-witch who knows herbs and old songs and things most people would rather not know. The hounds have torn up everything along the river, but thorns have grown right up to her garden fence and stopped, like guests waiting to be invited in.`,
        `She opens the door before you knock. Tiny, ancient, wrapped in about six shawls, eyes sharp as needles.`,
        D("Isel", "There you are. Mind the cat. Mind the <i>other</i> cat. Oh, child. You're carrying something heavy. I can help you with it. It takes the night, though. And by morning, the king's men will hold the ford."),
        hasWound(s, "into_the_wood") && `Every hour you sit by this fire, Aunt Bryn is farther away.`
      ),
      choices: (s, r) => [
        { label: "Stay the night. Let Isel help.", tag: "Heal: lose time", go: (s, r) => { r.f.healed = true; const out = [];
          if (hasWound(s, "thorn_dreams")) out.push("Isel puts a sprig of briar in your hand. You almost throw it across the room. “Just hold it. You don't have to like it.” She sits with you while the fire crackles, until your breathing stops being fast and thin.", healWound(s, "thorn_dreams"));
          if (hasWound(s, "into_the_wood")) out.push("Isel makes you say it out loud: what you chose, what you saw. Your voice breaks twice. When you finish, Posy tugs your sleeve and holds up her slate.", ob.say(s, "You picked me."), "You're not angry about it. You never will be.", healWound(s, "into_the_wood"));
          if (hasWound(s, "hollowed")) out.push("Isel puts one dry hand on your chest and hums a song so old it has no words left. “Promises aren't a bucket, child. They're a well. Let them fill.”", healWound(s, "hollowed"));
          out.push("At dawn she whispers to the thorns along her fence, and they rustle. “I've told the wood you're under my protection. It'll remember that. It'll also remember that you owe me.”", addBurden(s, "isel_favor"));
          return { text: out, next: !ob.born(s) ? "s9p" : "s10" }; } },
        { label: "“I can't stay. We have to keep moving.”", tag: "Keep the wound", go: () => ({ text: ["Isel shrugs. “Your choice, child. It always is.” She presses a little bundle of dried mint into your hand."] }) }
      ]
    },
    s9p: { title: "Isel's Offer", next: "s10",
      text: s => P(`Before you leave, Isel kneels in front of Posy and looks at her for a long time.`, D("Isel", "So you're the one who made a promise to the wood. Oh, little bird. Leave her with me. I know the old ways. I can unpromise her, slowly, over a year or two. She'd be safer here than anywhere."), `Posy grabs your hand with both of hers and holds on.`),
      choices: s => [
        { label: "“No. She stays with me.”", go: s => ({ text: ["Isel sighs, but nods. “Then keep her close.” Posy doesn't let go of your hand for an hour.", trust(s, "Posy", 1)] }) },
        { label: "“Maybe she'd be safer here.”", go: s => ({ text: [`Posy lets go of your hand. She ${ob.posySilent(s) ? "writes <b>OK</b> on her slate" : "says “okay” in a small flat voice"} and won't look at you. When you leave, she follows you anyway.`, trust(s, "Posy", -1), trust(s, "Posy", -1)] }) }
      ]
    },
    s9n: { title: "Isel's Gate", next: "s10",
      text: s => P(
        `You pass Grandmother Isel's cottage at the forest's edge. She's standing at her gate in about six shawls, watching the village.`,
        D("Isel", "You're the lucky one, then. No marks on you. Yet."),
        `“Why did the forest come?”`,
        D("Isel", "People will tell you the forest is angry. It isn't. It's <i>owed</i>. Somebody made it a promise, and somebody broke it. And the wood always collects."),
        mystery(s, "The forest isn't angry. It's owed.")
      )
    },
    s10: { title: "The Ford at Dawn", next: s => hasWound(s, "into_the_wood") ? "s10w" : "s10p",
      text: (s, r) => P(
        r.f.healed ? `By the time you get back to the river, the sun is up, and the ford is full of soldiers.` : `You reach the ford just as the sky turns gray, and you hear them before you see them: hooves, armor, a horn.`,
        `Riders in dark blue cloaks pour across the ford. At the front, on a tall gray horse, is a man with a short gray beard and a face like a closed door: <b>Lord-Warden Garrick Vale</b>, the king's oathwarden. When someone breaks a great oath, the king sends Vale. He always finds them.`,
        D("Vale", "Someone in this village broke the First Oath. That is the only thing that cracks a stone. Until I find them, no one leaves Hollin's Ford. And anyone who lies to me will be treated as the oathbreaker."),
        `You need to get back to the broken stone. Something is pulling you there. But there are riders between you and the green.`
      ),
      choices: (s, r) => [
        ob.when(s.cls === "rogue", { label: "Unseen: slip past behind the ferry dock", tag: "Rogue", go: () => ({ text: ["You wait for a rider to turn his head, then slip under the boardwalk, through the reeds, up the tannery alley. Nobody sees you. Nobody ever does, when you don't want them to."] }) }),
        ob.when(s.cls === "ranger", { label: "Take the otter path under the willow roots", tag: "Ranger", go: () => ({ text: ["The roots of the old willow make a tunnel under the bank. You found it when you were small. The riders ride right over the top of you."] }) }),
        ob.when(s.cls === "knight", { label: "Walk straight up to Vale", tag: "Knight", go: () => ({ text: ["“I swore at that stone yesterday. I have the right to stand at it.” Vale looks down at you. Something almost like respect crosses his face. “So you do. Walk with me.”"] }) }),
        ob.when(s.cls === "wizard", { label: "Read the warrant on the ferry post", tag: "Wizard", go: () => ({ text: ["The name of the oathbreaker has been left blank. Vale doesn't know who he's looking for. “This warrant isn't finished,” you say loudly. “You can't hold anyone with an unfinished warrant. That's the law.” Grumbling, the rider lets you pass."] }) }),
        ob.when(s.cls === "healer", { label: "“There are people hurt on the green.”", tag: "Healer", go: () => ({ text: ["The riders look at your bandages and step aside. Even soldiers let healers through. Along the way, you treat three more people."] }) }),
        ob.when(s.cls === "barbarian", { label: "Push through, and keep your temper", tag: "Barbarian", check: { stat: "courage", dc: 5 }, go: (s, r, pass) => ({ text: pass ? ["A rider shoves Posy back with his spear. Something hot rises in you. You don't swing. You just stand between them and wait, and the rider decides he has somewhere else to be."] : ["A rider shoves Posy back with his spear and you grab it. Before it turns into a fight, Vale's voice cuts across the ford: “Let them through. I want to see who has that much temper.”", addBurden(s, "warden_marked")] }) }),
        { label: "Sneak along the river path", check: { stat: "swift", dc: 5, bonus: r.f.healed ? -1 : 0 }, go: (s, r, pass) => ({ text: [pass ? "You get through." : "A rider spots you and drags you to the green by your collar.", !pass && strain(s, "Roughed Up")] }) }
      ]
    },
    s10w: { title: "Old Pell", next: "s10p",
      text: s => P(`At the edge of the green, two riders are dragging a ferryman named Old Pell toward a cart. He keeps saying he didn't break anything, he only carved his grandson's name at the stone last spring. Something inside you snaps.`, N("<b>Into the Wood.</b> You saw someone dragged away last night. The careful choice is locked.", "bad")),
      choices: s => [
        { label: "Step in. “Let him go!”", go: s => ({ text: ["You grab the rider's arm. The rider shoves you down in the mud. But he lets go of Pell. Vale saw it.", strain(s, "Bruised")] }) }
      ]
    },
    s10p: { title: "Posy and the Riders", next: "s11a",
      text: s => {
        if (ob.posyHas(s, "posy_words")) return P(`Vale's clerk, a thin man with inky fingers, is going down the line of villagers making each one touch the broken stone. “Swear you saw nothing. Next.” He gets to Posy. “You. Hand on the stone. <i>Swear.</i>”`, `Posy backs away so fast she trips, shaking her head, holding her slate in front of her like a shield.`);
        if (ob.posyHas(s, "posy_shout")) return P(`A rider gallops along the road, yelling at people to move. Posy is standing in the middle of the road. When he yells, she goes completely still. The horse is coming straight at her.`);
        return P(`Vale's clerk is making everyone touch the broken stone and swear they saw nothing. Posy does it, white-faced. When she gets back to you, she's trembling.`);

          ob.when(trustHigh(s, "Posy"), { label: "Kneel down. “Can you just write it?”", tag: "Posy's trust: high", go: s => ({ text: ["Posy wipes her slate and writes in careful letters:", `<div class="slate">I SAW THE STONE BREAK. I WAS SCARED.</div>`, "The clerk reads it, and for the first time all morning he looks like a person. “That'll do,” he says quietly. Posy looks at the slate in her hands like she's never seen it before."] }) })
        ];
        if (ob.posyHas(s, "posy_shout")) return [
          { label: "Grab her!", check: { stat: "swift", dc: 5 }, go: (s, r, pass) => ({ text: pass ? ["You dive and yank her out of the road. The horse thunders past close enough to feel."] : ["You get there a hair too slow. The horse's shoulder clips you both into the ditch.", strain(s, "Bruised"), trust(s, "Posy", -1)] }) },
          ob.when(trustOk(s, "Posy"), { label: "Say her name, quietly", tag: "Posy's trust: steady or high", go: s => ({ text: ["Not a shout. Almost a whisper. “Posy. It's me. Come here.” Her eyes find you. Her feet unstick. She takes three quick steps into your arms, and the horse rides past.", trust(s, "Posy", 1)] }) })

    },
    s11a: { title: "Rowan at the Stone", next: "s11",
      text: s => P(
        `Up close, the split oathstone is worse than it looked from the river. The crack goes into the ground, a dark gap you can't see the bottom of. Cold air breathes out of it.`,
        `Someone is crouched behind the bigger half: <b>Rowan Ashe</b>. He's holding a piece of paper against the inside of the crack, rubbing it with charcoal to copy a carving. When he sees you, he freezes and crumples the paper into his coat.`,
        ob.item(s, "Marrow's sword") && `His eyes go straight to Marrow's sword. They go wide.`

      choices: s => [
        { label: "“What are you doing?” (Keep your voice low)", go: (s, r) => { r.f.listened = true; return { text: ["You don't call the riders. You just wait. Rowan looks at you for a long moment, like he's deciding something."] }; } },

    s11: { title: "Rowan's Secret", next: "s12",
      text: s => P(
        `A shadow falls over you both. Lord-Warden Vale, with three riders behind him. He looks at Rowan, at the charcoal on his fingers, at the paper sticking out of his coat.`,

        { label: "Tell the truth", go: (s, r) => { s.flags.rowan = "jailed"; return { text: ["“Yes. He was here last night. And just now, copying something from inside the stone.” Vale nods. Two riders take Rowan by the arms. He doesn't fight. As they lead him away, he looks back once, and his face is perfectly blank, which is worse than angry.", trust(s, "Rowan", -1)] }; } },
        { label: "Lie for him", tag: ob.firstTag(s, "honesty") ? "This will break your first oath" : "", go: (s, r) => { s.flags.rowan = "free"; return { text: ["“No. He was with me last night, the whole night.” Vale looks at you for a long, long time. You make yourself look back.",
          ob.firstTag(s, "honesty") ? ob.breakOath(s, "first") : addBurden(s, "rowan_secret"),
          "Vale finally turns away. “Then someone else was here. I'll find them.” Under his breath, Rowan says, “I owe you. I won't forget.”", trust(s, "Rowan", 1)] }; } },
        { label: "Take the blame yourself", tag: "Hard, and true", go: (s, r) => { r.f.arrested = true; s.flags.rowan = "free"; return { text: ["“It was me. I was at the stone last night. Let him go.” Rowan's head snaps toward you. Vale studies you. “Hold them both. Separately.” As the riders pull you away, Rowan stares at you like you've done the strangest thing he's ever seen.", trust(s, "Rowan", 1), trust(s, "Rowan", 1), ob.tc(s, r)] }; } },
        ob.when(r.f.listened, { label: "“Rowan, tell me. Right now. What did you copy?”", go: (s, r) => { r.f.clear = true; s.flags.rowan = "free"; return { text: [
          D("Rowan", "There's writing on the <i>inside</i> of the stone. Older than the outside. A man in Greyspire paid me to copy it. I don't know who he is. He gave me silver in a market and made me swear to bring him what's carved inside the Hollin's Ford stone. I swore it. But I didn't crack it. I came last night looking for a way in, and there wasn't one. This morning it was just… open."),
          "You turn to Vale. “He didn't break the oath. Look inside the stone. That's what this is about.”", trust(s, "Rowan", 1)] }; } })
      ]
    },
    s12: { title: "The Inner Carving", next: "s13",
      text: (s, r) => P(
        r.f.arrested && P(
          `The riders lock you in the root cellar of the Ferryman's Rest. It smells like onions and old cider. It's dark.`,

          s.flags.rowan === "free" && compTrust(s, "Rowan") >= 2
            ? `An hour later, the trapdoor creaks. Rowan drops down beside you, light as a cat. “Nobody's ever done that for me. Ever. Come on. The guard's asleep. Probably. Mostly.”`
            : `An hour later, the trapdoor creaks. It's Posy, with her slate under her arm. At the top of the ladder a rider is laughing with his hand over his mouth. She has drawn something on her slate and shown it to him, and you will never find out what it was. Tap, tap. She leads you up the ladder, right past him.`),
        `You kneel by the crack in the oathstone. Cold air breathes against your face. Inside, on the face of the stone nobody was ever supposed to see, there's writing: old, older than any letters on the outside, carved deep by someone who meant every word.`

      choices: (s, r) => {
        const auto = s.cls === "wizard" || (ob.born(s) && s.okind === "truth");
        const ok = (s, r) => {

          if (r.f.clear) out.push("Vale crouches beside you and reads it, and for the first time his closed-door face opens a crack. “Thirty years an oathwarden. No one ever told me the stones had an inside.” He looks at Rowan. “The man who paid you. You'll describe him to my clerk. Every detail. The boy is not the oathbreaker.”", trust(s, "Rowan", 1));
          return out;

        return [auto
          ? { label: s.cls === "wizard" ? "Whisper the reading-spell" : "Let your Oath read it to you", tag: s.cls === "wizard" ? "Wizard: Spellwork" : "Oath: Truth", go: (s, r) => ({ text: ok(s, r) }) }
          : { label: "Read the old letters", check: { stat: "lore", dc: 6, bonus: s.home === "shrine" ? 1 : 0 }, go: (s, r, pass) => ({ text: pass ? ok(s, r) : ["The letters are too old and too strange. You make out only a few words: “queen,” “wood,” “owed.” At the bottom there's a name, scratched out like the one on the front.", mystery(s, "The inside of the stone holds the real First Oath.")] }) }];
      }

    s13: { title: "The Briar Lady", next: "s14",
      text: (s, r) => P(
        `From the forest, every bird goes quiet at once. The trees at the edge lean apart, slowly, like people stepping back to let someone through.`,
        `She's taller than any person, thin as a young birch, with skin the gray-green of lichen and long hair full of leaves. On her head is a crown of thorns with tiny white flowers blooming between the spikes. The briarhounds come and sit at her feet like dogs. Vale's riders draw their swords.`,
        D("Vale", "You are on the king's land."),
        `She doesn't look at him. She looks at you.`,
        D("The Briar Lady", "Something was promised to the wood. It was broken. Give me what is owed, or give me a promise in its place."),
        s.flags.bryn === "taken" && `Deep in the trees behind her, you see a shape wrapped in vines like a blanket. Aunt Bryn. Asleep, or something like asleep. Alive.`,
        D("The Briar Lady", `The hounds will go back into the wood. The thorns will leave your village.${s.flags.bryn === "taken" ? " The ferry-woman will come home." : ""} All of this, if someone will swear: one day, when the wood calls, they will come into the deep wood and do what is asked.`),
        D("Vale", "Don't you dare, child. You don't know what she'll ask."),
        ob.calls(r) >= 1 && N("Your Oath is still thin from last night. Calling on it again would cost you more.", "mark")
      ),
      choices: (s, r) => {
        const home = () => { if (s.flags.bryn === "taken") { s.flags.bryn = "home"; return ["Out of the forest, stumbling, blinking, with leaves in her hair, walks Aunt Bryn. Posy runs to her so fast she nearly falls.", dropBurden(s, "bryn_taken")]; } return []; };
        return [
          { label: "Swear it", tag: "Hard, and true", go: (s, r) => ({ text: ["You walk past the riders until you're standing in front of her. “I swear. When the wood calls, I'll come.” The words drift out of you like a silver mist and settle on her crown. She smiles, a little, the way you'd smile at a child who did something brave. “It is sworn.” The hounds walk back into the trees, and every thorn in Hollin's Ford slides back into the ground.",
            ...home(), ob.swear(s, "forest"), N("Courage +1.", "good"), (s.stats.courage += 1, ""), ob.tc(s, r)] }) },
          { label: "Refuse. Fight beside Vale's riders.", go: (s, r) => ({ text: ["“We don't owe you anything. Get out of our village.” She sighs, a sound like a whole forest of leaves falling. The hounds charge. The riders charge. And you charge with them" + (ob.item(s, "Marrow's sword") ? ", Marrow's sword singing as it cuts thorn." : ".") + " It's the worst fight of your life. When it's over, the hounds have pulled back into the trees and you're on your knees in the grass.",
            "Just before she disappeared, the Briar Lady looked at you and said your name. Your <i>real</i> name. The one nobody told her.",
            s.flags.bryn === "taken" && "The shape in the trees is gone too. The forest kept Bryn.",
            addWound(s, "forest_knows"), N("Courage +1. <span class='dim'>(This wound can't be worked through in this book.)</span>", "good"), (s.stats.courage += 1, "")] }) },
          ob.when(ob.born(s), { label: "Call on your Oath, as hard as you can", tag: "Oath", go: (s, r) => ({ text: ["Your parent's promise is in you, like your own heartbeat. You reach for it and pull. Gold light pours out of you and wraps the whole village like a wall. The thorns hiss back from it. Then the Briar Lady bows to you, all the way down. “So it is you. The child of the promise. I will go, for now. But what your parent promised is still owed, and the wood is very, very patient.”",
            s.flags.bryn === "taken" && "The shape in the vines goes with her. You couldn't hold everything.",
            ob.call(s, r), addBurden(s, "parent_promise")] }) }),
          ob.when(ob.item(s, "Marrow's sword") && ob.has(s, "marrow"), { label: "Offer her Marrow's sword", tag: "Breaks Marrow's Errand", go: (s, r) => ({ text: ["You hold it out hilt first, the way Marrow held it out to you. She goes very still, then takes it gently, the way you'd take something you lost a long time ago. “This was owed, too. It is enough. For now.” The hounds go. The thorns go.",
            ...home(), ob.breakOath(s, "marrow"), ob.drop(s, "Marrow's sword"), addBurden(s, "sword_wood"), "Across the green, Old Marrow is watching from the inn door. He doesn't say anything. He just goes inside and closes the door."] }) }),
          ob.when(r.f.thorn, { label: "…something small is climbing up your leg", tag: "The thornling", go: (s, r) => { s.flags.thornling = true; return { text: ["It's the leaf-fox from the burning stall, its leg healed. It settles on your shoulder, wraps its twiggy tail around your neck, and makes a small clear sound like a bird. The Briar Lady stops. For the first time, she looks surprised.",
            D("The Briar Lady", "You pulled it from the fire while your own kin was running away from you. The wood remembers kindness, child. Rarely. But it does. I will ask a smaller price: when the First Oath is judged, come back to the wood and speak for us. Tell them not everything that came out of the forest was cruel."),
            "“I swear it.” The thornling chirps.", ...home(), ob.swear(s, "wood"), N("<b>The thornling</b> is your companion now.", "good"), ob.tc(s, r)] }; } }),
          ob.when(!ob.born(s) && trustHigh(s, "Posy") && ob.posyHas(s, "posy_words"), { label: "Posy lets go of your hand…", tag: "Posy's trust: high", go: (s, r) => ({ text: ["Before you can stop her, she walks all the way up to the Briar Lady, so small, holding her slate against her chest. She opens her mouth. Nothing comes out. She looks back at you. You nod. It's okay.",
            D("Posy", "(tiny and cracked, like it's been locked in a box) I take it back. I'm sorry. I didn't mean it, about playing forever. I didn't know it was real."),
            "The Briar Lady kneels until her green eyes are level with Posy's. “An honest unpromising, from a child who did not know better. It is accepted. The debt is paid.” The hounds go. The thorns go.",
            ...home(), compStep(s, "Posy"), ob.tc(s, r), ob.tc(s, r)] }) }),
          ob.when(ob.canAwaken(s, r), { label: "Your words have weight now. You can feel it.", tag: "Something new", go: (s, r) => ({ text: ["Every choice you made tonight, every time you put someone else first, is humming inside you at once. You don't swear her promise. You swear your own: “I'll come when the wood calls. But I'll come as a friend, not as a debt.” The words come out of you <i>glowing</i>. The Briar Lady laughs like a stream over rocks. “Oh, little one. You've woken up. I'll take it.”",
            ...home(), ob.awaken(s), ob.swear(s, "friend")] }) })
        ];
      }
    },
    s14: { title: "Ferry at Sunrise", next: "END",
      text: (s, r) => P(
        `The sun comes up over a village after a storm. Half the roofs are torn open. The oathstone is still split in two, and Brother Tam is sitting beside it with his head in his hands.`,

      ),
      choices: (s, r) => [
        { label: "“I don't know, Pos. But I'm not going anywhere.”", go: s => ({ text: ["She looks at you a long time. Then she nods and leans her head against your arm.", ribbonEnd(s, r)] }) },
        { label: "“Yes. It's going to be okay. I promise.”", tag: "A promise that carries forward", go: s => ({ text: [ob.posyHas(s, "posy_promises") ? "Posy just looks at you. She doesn't believe promises anymore. But she leans against you anyway." : "Posy's face cracks open into the first real smile since yesterday. You hold her and hope you can keep this one.", !ob.posyHas(s, "posy_promises") && trust(s, "Posy", 1), ob.swear(s, "okay"), ribbonEnd(s, r)] }) },
        { label: "Don't say anything. Just sit with her.", go: s => ({ text: [trustOk(s, "Posy") ? "You put your arm around her. The river goes by. After a while, she taps your hand twice. <i>I'm here.</i>" : "You don't know what to say. Posy waits. Then she wipes her slate clean and walks away.", trustOk(s, "Posy") && trust(s, "Posy", 1), ribbonEnd(s, r), "Out on the river, a heron lands in the shallows: the first bird since yesterday. It looks at the village for a long moment. Then, very carefully, it begins to fish."] }) }
      ]
    }

});
function anyOf(s, ids) { return ids.some(id => hasWound(s, id)); }
function ribbonEnd(s, r) {
  if (r.f.ribbon === "given") return "She's tied the blue ribbon to the string of her slate, in a careful double knot. It's muddy and a little burned at one end.";
  if (r.f.ribbon === "pocket") { trust(s, "Posy", 1); return "You remember the ribbon in your pocket. You hand it to her. She ties it onto her slate string in a careful double knot. <span class='dim'>(Small promise kept.)</span>"; }
  if (r.f.ribbon === "promised") { const t = trust(s, "Posy", -1); return "She watches torn ribbons blowing across the green: red, yellow, green. None of them blue. She doesn't write anything about it. She doesn't have to. <span class='dim'>(Small promise broken.)</span>" + t; }
  return "";
}
window.obOathsList = s => `<ul>${(s.oaths || []).map(o => `<li>${{ open: "🕯 Open", kept: "✓ Kept", broken: "✗ Broken", down: "Set down" }[o.st]}: ${ob.oathName(s, o.id)}</li>`).join("")}</ul>`;
})();

<script>
/* ===== Oathbound Book 02 — The Drowned Road ===== */
(function () {
const fresh = (s, r) => r.f.fresh;
EF.books.push({
  id: "drowned", series: "oath", title: "The Drowned Road", where: "The Gloamfen", starting: true,
  blurb: "The only way to the coast is a flooded causeway through the marsh. Your caravan's guide is funny, kind and wonderful with kids. He's also lying.",
  recommend: s => s.done.length === 0 ? "Great first book" : (!s.done.includes("drowned") ? "Always available" : null),
  start: "s1",
  setup: (s, r) => {
    ensureComp(s, "Posy", 1); s.comp.Posy.travel = true;
    r.f.fresh = ob.posyFresh(s);
  },
  resultsExtra: (s, r) => {
    const next = [];
    if (s.burdens.includes("pike_taken") || r.f.teal) next.push("<b>Teal's Debt:</b> Somewhere in Greyspire, Pike's daughter is waiting for a father who isn't coming home.");
    if (s.burdens.includes("grey_carving") || r.f.letter) next.push("<b>The Road to Greyspire:</b> Follow the gray thumbprint to the capital.");
    if (ob.has(s, "river")) next.push("<b>The River's Due:</b> The Fenmother calls in her promise sooner than you expected.");
    return `<h3>🌿 Oaths and promises</h3>${obOathsList(s)}
      ${next.length ? `<h3>Stories waiting for you</h3><ul>${next.map(x => `<li>${x} <span class="dim">(coming soon)</span></li>`).join("")}</ul>` : ""}
      <p class="dim">You can also play ${["stone", "wolf"].filter(id => !s.done.includes(id)).map(id => `<b>${bookById(id).title}</b>`).join(" or ") || "the other books again with a new hero"} next.</p>`;
  },
  scenes: {
    s1: { title: "Last Dry Ground", next: "s2",
      text: (s, r) => P(
        `The Mudlark Inn is the last building before the marsh. After it there's nothing but reeds and fog and water, all the way to the sea. The yard is packed at dawn: wagons, mules, travelers with their whole lives tied up in blankets, and one goose that has decided it hates everyone.`,
        D("Traveler", "River road's gone. They say the stone at Sedge Crossing cracked, and the river just… climbed out. Only way through now is the Drowned Road."),
        !ob.played(s, "stone") && P(`Aunt Bryn sent you here. She hugged you both too hard and pressed a letter into your hand for Grandmother Wend on the coast.`, D("Bryn", "Just until the stones stop cracking. Look after each other. Look after <i>her</i>.")),
        ob.played(s, "stone") && s.flags.bryn !== "taken" && `Aunt Bryn sent you here while she rebuilds the ferry house. She didn't want Posy anywhere near the forest.`,
        ob.played(s, "stone") && s.flags.bryn === "taken" && `Nobody sent you. You're taking Posy to Grandmother Wend, the only family left, to get help finding Bryn.`,
        ob.played(s, "wolf") && `After a winter in the mountains, the flat marsh looks strange. Uncle Harl said the coast would be safer. You're not so sure.`,
        { millbrook: "You've never been this far from home. The marsh smells like salt and rot and something sweet underneath.",
          greyspire: "In the city there were maps for everything. Out here, the map just says <i>Gloamfen</i> in big wobbly letters and then stops.",
          saltreach: "You can smell the sea, way off past the marsh. Your whole body knows which direction home is.",
          highfall: "Everything here is flat. Flat land, flat water, flat gray sky. You feel like a goat on a plate.",
          fenwood: "The reeds whisper the way the trees did back home. It makes you homesick and calm at the same time.",
          shrine: "Brother Tam gave you a little oath-token for the road. You keep touching it in your pocket." }[s.home],
        hasTrait(s, "Doesn't Trust Lords") && N(`<b>Doesn't Trust Lords.</b> The caravan's owner steps out in fine leather boots that have never been near a fishing boat. You decide not to like her.`, "mark"),
        hasTrait(s, "Afraid of Crowds") && N(`<b>Afraid of Crowds.</b> The yard is so full you can't turn around. You keep your back to the wall.`, "mark"),
        ob.posySilent(s)
          ? P(`Posy sits on your pack with her chalk slate on her knees. She hasn't said a word out loud since the night the stone cracked. She holds up the slate:`, `<div class="slate">SEALS?</div>`, `Grandmother Wend has seal pups on the rocks under her house. It's the first thing Posy has asked about in days.`)
          : D("Posy", "Grandmother Wend has <i>seal pups</i>. One of them is fat and one is very fat and one of them bites. I want to meet the one that bites. A little. Not a lot."),
        s.flags.thornling && `Inside your coat, the thornling sneezes every time the wind blows off the water. It does <i>not</i> like the marsh.`
      )
    },
    s2: { title: "The Guide", next: "s3",
      text: (s, r) => P(
        `The caravan belongs to <b>Mistress Odile Varga</b>: short, sharp-eyed, silver rings on every finger, a ledger under her arm, three wagons of salt and cloth for the Saltmere market. Her guard, <b>Dunn</b>, is so big he ducks under doorways. There's a farm family too, <b>Tobiah and Mae Ambry</b> and their son <b>Kit</b>, eight, with everything they own on one creaky cart.`,
        D("Odile", "Where is that guide? I paid him for dawn."),
        `“Dawn is a feeling, Mistress Varga, not a time!” A thin, quick man strolls into the yard with a marsh pole on his shoulder and a grin on his face. His eyes crinkle when he smiles, and he smiles all the time.`,
        D("Pike", "Jarrow Pike. Best guide in the Gloamfen. Only guide in the Gloamfen, these days, so also the worst."),
        `In one minute he knows everybody's name. He greases the Ambrys' cart wheel. He juggles three apples for Kit until Kit gets the hiccups. Then he crouches in front of Posy and salutes her. “You look like a captain to me. Captain Posy.”`,
        D("Pike", "Here's a secret, Captain. Out in the deep fen there's a pool where the lantern frogs live, and at night they glow like candles, hundreds of them. Stick with me, and on the second night I'll show you. I promise."),
        ob.posyHas(s, "posy_words") ? `At the word <i>promise</i>, Posy flinches back and hides behind you. For one second, Pike stops smiling. “No promises, then. Just frogs.”`
          : ob.posyHas(s, "posy_shout") ? `Pike is loud, and every time his voice goes up, Posy goes still. Pike notices. By the time he stands up, he's talking more quietly. Nobody else sees him do it.`
          : ob.posyHas(s, "posy_promises") ? `Posy rolls her eyes so hard you can almost hear it. Pike laughs. “A tough crowd. I like it.”`
          : `Posy looks like someone just handed her the moon.`,
        { rogue: N(`<b>Rogue.</b> You know this. The easy jokes, learning every name, the little favors that make people like him before they've decided to. It's <i>patter</i>. It's what a good con artist does in the first five minutes. You've done it yourself.`, "mark"),
          healer: N(`<b>Healer.</b> Kit's laugh turns into a wet, rattly cough that goes on too long. The marsh will make it worse. You give Mae your dried thyme: “Steam it at night and have him breathe it.”`, "mark"),
          knight: N(`<b>Knight.</b> Dunn sizes you up. “You've had training. Stay near the back of the line in the water. If something goes wrong, I'll want someone back there who knows what they're doing.”`, "mark"),
          wizard: N(`<b>Wizard.</b> Pike's map case is sealed with wax, and the seal isn't a crest. It's a <b>gray thumbprint</b>. When you look up, Pike is watching you. He tucks the case inside his coat.`, "mark"),
          ranger: N(`<b>Ranger.</b> Pike's boots are stained to the knee with black, sticky deep-fen mud, and it's <i>wet</i>. A day old, maybe two. But everyone says nobody's crossed since the flood.`, "mark"),
          barbarian: N(`<b>Barbarian.</b> A loaded wagon is stuck in a rut. You put your shoulder to it, and it rolls out with a sucking pop. Odile writes your name in her ledger. “Extra pair of shoulders. A silver a day.”`, "mark") }[s.cls]
      ),
      onEnter: (s, r) => { if (s.cls === "rogue" || s.cls === "wizard" || s.cls === "ranger") r.f.sus = true; return ""; }
    },
    s3: { title: "Into the Gloamfen", next: "s4",
      text: s => P(
        `A hundred steps past the inn, the road goes underwater. It slides down into the brown water and keeps going: a long line of flat mossy stones under a foot and a half of cold marsh. On either side the water is black and deep. Reeds taller than Dunn hiss in the wind. Fog lies on everything like wet wool.`,
        D("Pike", "Follow the red rags. Stay on the stones. If you step off, you'll know, because you'll be swimming."),
        `Every hundred steps there's a marker pole with a strip of red cloth on top. Something brushes your ankle and slides away. Kit holds his mother's hand so hard his knuckles are white.`
      ),
      choices: s => [
        s.cls === "ranger"
          ? { label: "Look at the marker poles", tag: "Ranger: Trackwise", go: (s, r) => { r.f.poles = true; return { text: ["You've cut a hundred marker poles. These were cut this month, maybe this week: clean pale wood, no moss, no rot. <b>Someone has walked this road very recently.</b> Pike told Odile nobody had crossed since the flood."] }; } }
          : { label: "Look at the marker poles", check: { stat: "lore", dc: 4 }, go: (s, r, pass) => { r.f.poles = pass; return { text: pass ? ["The cut at the top of the sixth pole is clean and pale: no moss, no gray weathering. It was cut this month. <b>Someone has walked this road very recently.</b> But Pike said nobody had crossed since the flood."] : ["One pole looks like another. You keep your eyes on the stones under your feet."] }; } },
        { label: "Keep your eyes on your feet", go: () => ({ text: ["The stones are slick. You concentrate on not swimming."] }) }
      ]
    },
    s4: { title: "The First Lie", next: "s5",
      text: s => P(`By midday the causeway splits around a tussock island with a rotted signpost. The stones go left into a wide brown channel, or right into a narrow one where the reeds grow close.`, D("Pike", "Left. Coast is this way."), `He wades in without slowing down. The caravan follows. But something is wrong.`),
      choices: (s, r) => {
        const caught = (txt) => (s2, r2) => { r2.f.lie = true; return { text: [txt], next: "s4b" }; };
        const list = [];
        if (s.cls === "ranger") list.push({ label: "Check the sun and the current", tag: "Ranger", go: caught("The sun is a pale coin on your <i>right</i>. You're heading north. The coast is south. And the current flows inland. Pike just turned the whole caravan away from the sea.") });
        if (s.cls === "wizard") list.push({ label: "Remember the old map over the inn fireplace", tag: "Wizard", go: caught("You studied that map for an hour last night. The coast is to the right. The left channel goes north, to the old river, to <b>Sedge Crossing</b>, where the stone cracked.") });
        if (s.cls === "rogue") list.push({ label: "Watch his face", tag: "Rogue", go: caught("When he said it, his hand went up and touched his ear, just for a second. A tell. He did it when he told Odile he'd only just got the job, and when he told the Ambrys their cart would make it.") });
        if (ob.born(s) && s.okind === "truth") list.push({ label: "Listen to your Oath", tag: "Oath: Truth", go: caught("The ringing in your ears goes sharp, like someone tapped a glass. <i>Coast is this way.</i> That's a lie.") });
        list.push({ label: "Try to remember the map at the inn", check: { stat: "lore", dc: 6, bonus: r.f.poles ? 1 : 0 }, go: (s, r, pass) => { r.f.lie = pass; return { text: [pass ? "The coast was to the right. The left goes north, toward the old river. Pike is lying." : "It's a marsh. All the channels look the same. You follow Pike."], next: pass ? "s4b" : "s5" }; } });
        return list;
      }
    },
    s4b: { title: "What Now?", next: "s5",
      text: s => P(`Pike is lying. He's taking the caravan somewhere, and it isn't the coast.`),
      choices: s => [
        { label: "Say nothing. Watch him.", go: () => ({ text: ["You keep your face blank. If he's lying, you want to know why before he knows you know."] }) },
        { label: "Ask him about it, casually", check: { stat: "lore", dc: 5 }, go: (s, r, pass) => ({ text: ["“Pike, isn't the coast the other way?” He laughs. “In the Gloamfen, the long way round is the short way through. Right channel's full of sinkholes. Trust me.”", pass ? "You've never heard of sinkholes in a stone causeway. That's a second lie, smoother than the first. He's good at this." : "It sounds reasonable. But he didn't look at you when he said it."] }) },
        { label: "Drop back and tell Dunn, quietly", go: (s, r) => { r.f.dunn = true; return { text: ["Dunn doesn't turn his head. “I know. Been wondering when someone else would notice.”"] }; } }
      ]
    },
    s5: { title: "The Heron in the Net", next: "s6",
      text: s => P(
        `In the afternoon you pass a half-sunk post in deep water, and on it is the biggest bird you've ever seen: a gray <b>heron</b>, taller than Posy, with a beak like a dagger. It's tangled in a duck snare. It isn't thrashing. It's standing very still, watching the caravan with one round yellow eye. The water is rising. Soon its head will be the only thing above it.`,
        ob.posySilent(s) ? `Posy pulls your sleeve so hard it hurts and points at the heron, then at you. Her face says everything.` : D("Posy", `${nm(s)}! It's stuck! We have to help it!`),
        D("Pike", "(not slowing down) Leave it, Captain. Old fen saying: cut a heron loose and you've cut your own luck loose with it. We need to make the toll-house before dark."),
        hasTrait(s, "Listens to the Wild") && `That isn't a normal heron. It's <i>listening</i> to you.`
      ),
      choices: s => [
        { label: "Free it", tag: "Costs you time", go: (s, r) => { r.f.heron = true; s.flags.heron = true; ob.tc(s, r); return { text: [
          { ranger: "You wade out slowly, humming like you would to a frightened horse. It lets you get close.", rogue: "One clean cut through the net where it's knotted, and the whole thing goes slack.", healer: "Its wing is torn where the net cut in. You pack the cut with moss and bind it while it stands perfectly still.", barbarian: "You grab the whole rotten post with both arms and heave it out of the mud, net and all.", knight: "You wade out chest-deep, gasping at the cold, and pick the knots loose with numb fingers.", wizard: "You whisper a loosening charm, and the knots slide open one by one." }[s.cls],
          "The heron steps free and shakes out wings wider than you are tall. It looks at you a long moment. Then it lifts into the fog without a sound. When you turn around, the caravan has disappeared into the mist."], next: "s5c" }; } },
        { label: "Leave it. The water's rising.", go: s => ({ text: [ob.posySilent(s) ? "Posy keeps looking back until the fog swallows the post." : "“Will it be okay?” Posy asks. You don't answer.", "Somewhere behind you in the fog, a single long cry like a rusty gate. Then nothing."] }) }
      ]
    },
    s5c: { title: "Lost in the Fog", next: "s6",
      text: s => P(`Red rags. Where are the red rags?`),
      choices: s => [{ label: "Catch up!", check: { stat: "swift", dc: 4 }, go: (s, r, pass) => ({ text: pass ? ["You splash along the stones and catch up before anyone notices. Pike looks back once, sees the empty net behind you, and says nothing."] : ["For a long, frightening minute you're alone in the marsh. Then Dunn's voice calls your name, and you follow it.", strain(s, "Chilled")] }) }]
    },
    s6: { title: "Odile's Bargain", next: "s7",
      text: s => P(
        `An hour before sunset, Odile Varga wades up next to you, her fine boots ruined.`,
        D("Odile", "You notice things. You don't panic. That's my skiff, lashed to the last wagon: a reed boat for two. In this marsh a boat is worth more than gold. Everything I own is in those wagons. If I lose them, I lose my business, my house, and my daughter's school. Swear you'll see my cargo safe to Saltmere, and the skiff is yours. For keeps."),
        hasTrait(s, "Keeps Their Word") && `You've never sworn something you didn't mean. You think carefully before you answer.`,
        ob.open(s).length >= 3 && N("You already carry three open oaths. Swearing a new one means setting one down.", "mark")
      ),
      choices: s => [
        { label: "“I swear I'll see your cargo safe to Saltmere.”", tag: "Trade: gain a boat, take an oath", go: (s, r) => ({ text: ["The words settle on you like a heavy pack. Odile shakes your hand. Her grip is strong. “Good. Then we understand each other.”", ob.give(s, "Reed skiff"), ob.swear(s, "odile")] }) },
        { label: "“I can't promise that.”", go: () => ({ text: ["Odile shrugs. “Your loss.” But later you catch her glancing back at you, like she's trying to work out why you said no."] }) }
      ]
    },
    s7: { title: "Night at the Toll-House", next: "s7z",
      text: s => P(
        `Just before dark, an island looms out of the fog with a crumbling stone toll-house on top. Everyone collapses around a fire. Mae makes soup. Kit falls asleep on Posy's shoulder.`,
        s.cls === "healer" && `You steam the thyme for Kit. His cough is quieter tonight. Mae squeezes your hand.`,
        `Pike tells a story, and he's wonderful at it. Long ago the river flooded every spring, so the First Queen went down to the water and made it a promise: <i>I will keep my people out of your deep places, if you will keep inside your banks.</i> For three hundred years the river kept its word. “And then, this spring… crack. And the river remembered it used to be wild.”`,
        ob.posySilent(s) ? P(`Posy writes something and holds it up for you, not for Pike:`, `<div class="slate">LIKE OUR STONE</div>`) : D("Posy", "Is that true?"),
        `Behind Pike, his pack leans against the wall, half in shadow. The map case with the gray thumbprint seal is sticking out of the top.`
      ),
      choices: s => [
        s.cls === "rogue"
          ? { label: "Unseen: go through his pack while he talks", tag: "Rogue", go: (s, r) => { r.f.letter = true; return { next: "s7l" }; } }
          : { label: "Search his pack while he talks", check: { stat: "swift", dc: 5 }, go: (s, r, pass) => { if (pass) { r.f.letter = true; return { next: "s7l" }; } r.f.caught = true; return { text: ["Your elbow knocks a tin cup off the wall. It clangs. Everyone turns. Pike looks at your hand, resting right next to his pack. Then he smiles, but it doesn't reach his eyes. “We all have things in our packs, friend. Best leave them there.” He sleeps with the pack under his head."] }; } },
        { label: "Leave the pack alone. Listen to the story.", go: () => ({ text: ["The fire burns down. You fall asleep listening to the marsh, and to the water, which seems to be getting louder."] }) }
      ]
    },
    s7l: { title: "The Letter", next: "s7z",
      text: s => P(
        `Under the maps is a folded letter in neat, sharp handwriting. Instead of a name at the bottom, there's a gray thumbprint.`,
        ob.born(s)
          ? `<div class="wcard"><i>Pike, our friend in Hollin's Ford was right. An Oathborn child travels south on your road this week. You will know them: the stones warm when they pass. Bring them to Sedge. Their hand will open what the stone hides. Do this, and your daughter's debt will be forgiven. Fail, and it will not.</i></div>`
          : `<div class="wcard"><i>Pike, bring the merchant's wagon-winch and as many strong backs as you can gather to Sedge. The stone must be raised before the river takes it. When it's up and copied, leave the rest to the fen. Do this, and your daughter's debt will be forgiven. Fail, and it will not.</i></div>`,
        ob.played(s, "stone") && s.flags.m1 && `A man in Greyspire who wants what's carved inside the stones. Just like the man who paid Rowan.`,
        `You look up. Across the fire, Pike is looking down at sleeping Posy, and his face isn't the face of a man about to leave anyone in a marsh. It's the face of a man who's very, very tired. Then he sees you watching, and the grin comes back. “Get some sleep, friend.”`,
        `You put the letter back exactly where you found it.`
      )
    },
    s7z: { title: "Midnight", next: "s8",
      text: s => P(`Sometime after midnight you wake up. The fire is out. The sound of the water has changed. It isn't lapping anymore. It's <i>roaring</i>. And down at the low end of the island there's a loud, cracking <b>snap</b>, like a bone breaking.`)
    },
    s8: { title: "The Sluice Gate", next: s => ["under_water", "what_they_lost", "oathbroken", "hollowed"].some(w => hasWound(s, w)) ? "s9" : "s9n",
      text: s => P(
        `You run outside barefoot. The river has come. The whole marsh is sliding south in one black sheet, and it's already over the low end of the island, where the wagons are parked.`,
        `At the bottom of the island is an old <b>sluice gate</b>, a wall of heavy boards holding the flood back. Its great iron bar has snapped. The gate is bulging and spraying water. Any second, it will burst.`,
        D("Dunn", "Everyone UP! Get the wagons UP!"),
        `Ten minutes, at least, to drag three loaded wagons and a cart up the hill. The gate has maybe one. Unless somebody holds it.`,
        ob.posyHas(s, "posy_shout") ? `Everyone is shouting. Posy is frozen in the toll-house doorway.` : ob.posySilent(s) ? `Posy grabs your hand, tap tap, and points at the gate.` : D("Posy", `${nm(s)}! What do we <i>do</i>?`),
        `High on the slope, by the toll-house door, Pike stands with his pack on his back. He isn't helping. He's watching.`,
        ob.has(s, "odile") && N("Odile's wagon is down there, and you swore.", "mark")
      ),
      choices: (s, r) => [
        { label: "Hold the gate yourself", tag: "Save everything. Pay for it.", go: (s, r) => { r.f.sluice = "held"; ob.tc(s, r); return { text: ["You splash down chest-deep, so cold it knocks the breath out of you, and put your back against the boards. “GO! I've got it!” You don't have it. Nobody could. You hold anyway, while the water rises to your chin and the world goes dark at the edges.",
          "Then Dunn's hands haul you up the slope, and behind you the gate bursts with a sound like the sky tearing. Every wagon is at the top of the hill. Every person. Every mule. Even the goose.", addWound(s, "under_water"), strain(s, "Frozen"), addAlly(s, "Dunn")] }; } },
        { label: "Let it go. Save the people.", go: (s, r) => { r.f.sluice = "people"; r.f.cartLost = true; r.f.cargoLost = true; return { text: ["“Leave the wagons! Everybody UP!” You grab Kit and run. Odile screams at you to help with her wagon, and you don't stop. The gate bursts. The flood takes everything: three wagons of salt and cloth, the Ambrys' cart, all of it, spinning into the dark. But everyone is on the hill. Everyone is breathing.",
          ob.has(s, "odile") ? ob.breakOath(s, "odile") : "Odile watches her whole business float away. She takes out her ledger, looks at it a long moment, and closes it."] }; } },
        { label: "Save Odile's cargo", go: (s, r) => { r.f.sluice = "cargo"; r.f.cartLost = true; return { text: ["“Dunn! The salt wagon!” You and Dunn shove Odile's wagons up the slope, one, two, three. Behind you the gate bursts. The only thing still down there is the Ambrys' cart: their blankets, their pots, their seed bag for spring, Kit's little wooden horse. It lifts, turns slowly in the black water, and drifts away. Kit watches it go. Then he looks up at you. You saved the salt.",
          ob.has(s, "odile") && ob.keep(s, "odile"), addWound(s, "what_they_lost")] }; } },
        ob.when(s.cls === "barbarian", { label: "Rage: jam the broken bar back in", tag: "Barbarian", go: (s, r) => { r.f.sluice = "held"; s.stats.courage = Math.max(0, s.stats.courage - 1); return { text: ["You pick up the bigger half of the bar, and the rage comes roaring up hotter than the water is cold. You jam it into the slot crooked and <i>hit</i> it until it wedges in for good. The gate groans. It holds. Everyone and everything gets up the hill.", strain(s, "Torn Shoulder"), N("Courage −1 for the rest of the book.", "bad")] }; } }),
        ob.when(s.cls === "knight", { label: "Stand Firm, with Dunn beside you", tag: "Knight", go: (s, r) => { r.f.sluice = "held"; return { text: ["A huge shape splashes down next to you. Dunn. He puts his back to the gate beside yours, and suddenly it's two of you pushing. When the last wagon is clear, he hauls you up the slope as the gate bursts. “You'd have done that alone,” he says. It isn't a question.", addWound(s, "under_water"), strain(s, "Frozen"), addAlly(s, "Dunn")] }; } }),
        ob.when(ob.born(s), { label: "Call on your Oath", tag: "Oath", go: (s, r) => { r.f.sluice = "held"; return { text: [{ bind: "The cold grip of your Oath takes hold of every board at once. You hold it shut like a door against a storm.", shield: "Gold light spreads over the low ground in a dome. When the gate bursts, the flood splits around it like a river around a rock.", mend: "You feel the two halves of the iron bar pull toward each other, and <i>close</i>. The gate holds.", truth: "You hear the river's voice, huge and slow and angry. “We're not the ones who broke it!” For one breath, the water <i>listens</i>." }[s.okind], "Everyone gets up the hill. Then the power goes out of you and you fall to your knees in the mud.", ob.call(s, r)] }; } })
      ]
    },
    s9: { title: "Tolly Reedman's Hut", next: "s10",
      text: s => P(
        `At dawn a little boat comes out of the fog, poled by an old man in a hat of woven reeds. “Heard the gate go. Thought there might be somebody worth fishing out. Hm. There is.”`,
        `<b>Tolly Reedman</b> has lived on stilts over the Gloamfen for fifty years. He looks at you with small bright eyes, the way a heron looks at a fish.`,
        D("Tolly", "You've got something stuck in you, young one. I can help get it out. Takes the night, though. Things in the marsh always do. And that guide won't wait. You'll be a day behind.")
      ),
      choices: (s, r) => [
        { label: "Stay with Tolly", tag: "Heal: fall a day behind", go: (s, r) => { r.f.healed = true; const out = [];
          if (hasWound(s, "under_water")) out.push("At first light Tolly takes you to a clear, still pool. “Lie back. I'll hold your shirt.” Every part of you screams no. You do it anyway. Slowly, slowly, he lets go. And you float. The water was never trying to pull you down.", healWound(s, "under_water"));
          if (hasWound(s, "what_they_lost")) out.push("Tolly sends you back for an hour with a stub of pencil. “Help that family make a list. Not of what they lost. Of what they've still got.” Each other. Mae's good knife. A cousin in Saltmere with a spare room. The seeds in Mae's apron pocket. The list is longer than they thought. Kit draws a horse at the bottom.", healWound(s, "what_they_lost"));
          if (hasWound(s, "oathbroken")) out.push("“Some promises are worth keeping no matter what,” Tolly says, mending a net. “Some were never worth making. Which kind was yours?” You tell him. It takes a long time.", healWound(s, "oathbroken"));
          if (hasWound(s, "hollowed")) out.push("At sunset you watch the tide fill every channel in the marsh, slowly. “That's what you've got to let happen,” Tolly says.", healWound(s, "hollowed"));
          out.push("In the morning he gives you a scrap of bark with channels scratched on it. “Your lot went north, toward Sedge. Grey boats up that way all week. Shortcut.”", ob.give(s, "Tolly's map"));
          return { text: out }; } },
        { label: "Go on with the caravan", tag: "Keep the wound", go: s => ({ text: ["Tolly shrugs. “Suit yourself.” He gives you his bark map anyway, and some dried eel that smells terrible.", ob.give(s, "Tolly's map")] }) }
      ]
    },
    s9n: { title: "Tolly Reedman", next: "s10",
      text: s => P(
        `At dawn a little boat comes out of the fog, poled by an old man in a reed hat. <b>Tolly Reedman</b> looks at the broken gate, then at the caravan, then at you.`,
        D("Tolly", "Somebody did well last night. You know where he's taking you? People think the Fenmother's cruel. She isn't. The river made a promise, somebody broke it, and the marsh is all that's left of a promise. And there's grey boats up at Sedge. Waiting."),
        mystery(s, "The Fenmother isn't cruel. The marsh is what's left of a broken promise."),
        ob.give(s, "Tolly's map")
      )
    },
    s10: { title: "Expose the Guide", next: "s11",
      text: (s, r) => P(
        r.f.healed ? `By the time you catch up with the caravan, the sun has come up on the <i>right</i>. Everyone can see it now: they're heading north.` : `By morning, the sun comes up on the <i>right</i>. Everyone can see it now. Odile notices. Tobiah notices. Even Kit notices.`,
        D("Odile", "Pike. Why is the sun on the wrong side?"),
        D("Pike", "Shortcut, Mistress. The flood moved the channels."),
        `He's smiling, but he isn't looking at Odile. He's looking at <i>you</i>. ${r.f.letter ? "He knows you know." : ""}`,
        !ob.posySilent(s) && !ob.posyHas(s, "posy_promises") && `Posy is holding Pike's hand. “Is it the second night tonight? Is it the frogs tonight?”`,
        `Whatever you do next, you can't take it back.`
      ),
      choices: (s, r) => [
        { label: "Expose him in front of everyone", go: (s, r) => { r.f.pike = "exposed"; return { text: [
          r.f.letter ? "“He's lying. Someone's paying him to take us to Sedge Crossing, to the broken stone. And then leave us in the marsh.”" : "“He's lying. The poles were cut this week. He took us north on purpose. He watched while the gate broke.”",
          "Odile holds out her hand. “Your pack.” Pike steps back into the reeds instead. “I'm sorry,” he says, and it isn't clear who to. Then he's gone into the fog.",
          "And everyone realizes at once what that means: the middle of the Gloamfen, the water rising, and no guide. Dunn looks at you. “Well. Somebody's got to lead now.”"] }; } },
        { label: "Keep quiet. Keep moving.", go: (s, r) => { r.f.pike = "quiet"; return { text: ["You say nothing, and the caravan keeps wading north. You're going to let him lead you into it, to see who's waiting at the end. Nobody else knows.",
          ob.firstTag(s, "honesty") ? "Then Odile asks you straight out if you think Pike knows the way, and you say yes." : "",
          ob.firstTag(s, "honesty") ? ob.breakOath(s, "first") : addBurden(s, "pike_secret")] }; } },
        ob.when(r.f.dunn || s.stats.lore >= 5, { label: "Tell only Odile and Dunn", go: (s, r) => { r.f.pike = "odile"; return { text: ["At the next rest you tell Odile everything, low and fast, with Dunn close by. She listens without moving her face. “So. We keep walking. We let him think we don't know. And when we get there, we're ready.” She doesn't like keeping it from the family. Neither do you. But it's a plan."] }; } }),
        { label: "Follow Pike into the reeds, alone", go: () => ({ next: "s10c" }) }
      ]
    },
    s10c: { title: "Pike", next: "s11",
      text: (s, r) => { r.f.teal = true; return P(
        `He's sitting on a mossy stone at the water's edge, eating a heel of bread. He doesn't run. “Yeah. Figured you did.”`,
        D("Pike", "I've got a daughter. Teal. She's twelve. Smarter than me, which isn't hard. Two years ago I got sick, real sick, and to keep us fed Teal swore an oath-debt to a moneylender in Greyspire. In Aldermere an oath-debt doesn't go away. Ever. Then a man bought it. A man who signs with his thumb. He said: one job, Jarrow Pike, and I'll tear Teal's debt in half."),
        `His eyes are wet. “I tell stories. I juggle for kids. I'm not <i>this</i>. But she's my girl. Are you going to stop me?”`); },
      choices: s => [
        { label: "“I believe you. But when we get there, you're going to have to choose.”", go: (s, r) => { r.f.pike = "believed"; ob.tc(s, r); return { text: ["He stares at you. Then he nods slowly, like nobody has ever said that to him before."] }; } },
        { label: "“I don't care why. You're putting Posy in danger.”", go: (s, r) => { r.f.pike = "confronted"; return { text: ["Pike flinches. “Yeah,” he says quietly. “I know.” He walks back to the caravan."] }; } }
      ]
    },
    s11: { title: "The Lantern Frogs", next: "s12",
      text: (s, r) => {
        if (r.f.healed) return P(`You spent the second night at Tolly's hut. Whatever happened out on the black water that night, you weren't there for it. You hurry north along Tolly's channels.`);
        if (r.f.pike === "exposed") return P(`With Pike gone, there's no one to follow. No red rags you trust. Just fog, and water, and a long day of choosing. Everyone looks at you.`);
        r.f.frogs = true;
        return P(
          `On the second night, when everyone is asleep, Pike taps your shoulder. He has a little reed boat and a finger to his lips. “Promised the Captain. Bring her.”`,
          `The three of you slide out onto black water. Then Pike stops poling. “Watch.” One tiny gold-green light blinks on the water. Then ten. Then a hundred: little floating candles, rising and drifting, and the water reflects them until the boat is floating in a sky full of stars.`,
          ob.posyHas(s, "posy_words") ? P(`Pike leans over. “Promise you'll keep our frog pool a secret, Captain?” Posy goes stiff and shakes her head, scared. Pike smiles, and it isn't his usual grin. “No promise needed. You don't owe me anything.” Posy smiles at him. It's the first time she's smiled at anyone but you since the stone cracked.`, compStep(s, "Posy"))
            : ob.posyHas(s, "posy_shout") ? P(`Pike whispers the whole time and never raises his voice once. Slowly Posy relaxes against your arm, breathing like a kid who isn't scared.`, trust(s, "Posy", 1))
            : P(`For the first time since you've known her, Posy is too amazed to talk. Then, very quietly: “You kept it.”`, D("Pike", "(and his voice is strange) Yeah, Captain. I kept it.")),
          `On the way back, Pike won't look at either of you.`);
      },
      choices: (s, r) => r.f.pike === "exposed" && !r.f.healed ? [
        s.cls === "ranger"
          ? { label: "Lead them through", tag: "Ranger: Trackwise", go: () => ({ next: "s11f", text: ["You read the reeds and the current and the birds, one channel, then another, and by sunset you've brought everyone to dry land."] }) }
          : { label: "Lead them through", check: { stat: "swift", dc: 5, bonus: (ob.item(s, "Tolly's map") ? 1 : 0) + (ob.item(s, "Reed skiff") ? 1 : 0) }, go: (s, r, pass) => ({ next: "s11f", text: pass ? [ob.item(s, "Tolly's map") ? "You follow Tolly's scratched lines on the bark." : "You feel for the stones under the water.", "By sunset, everyone is on dry land, wet and exhausted and alive."] : ["You take a wrong turn into deep water, and a wagon tips off the causeway and sinks. Everyone is pulled out, but it takes the rest of the day.", strain(s, "Exhausted")] }) }
      ] : null
    },
    s11f: { title: "Little Lights", next: "s12",
      text: s => P(`That night you can't sleep. You walk to the water's edge, and there they are: little lights, floating. One, then ten, then a hundred. Pike told the truth about that, at least.`),
      choices: s => [
