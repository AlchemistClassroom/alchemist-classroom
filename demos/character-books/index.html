        wb.when(s.sp === "bison" || s.sp === "badger", { label: s.sp === "bison" ? "Wall: shelter both against your body" : "Dig: dig a deeper den for both", tag: wb.X(s).name, go: (s, r) => ({ text: [s.sp === "bison" ? "You don't use the warm place at all. You lie down in the open snow with your back to the wind and let Burr and " + weak(s, r) + " curl up against your belly, in the shelter of your huge body. The wind hits you all night. Your thick coat holds most of it. Not all." : "You don't need the warm place. You make a better one: straight down into the snowbank, then sideways into the frozen dirt, a tunnel and a chamber, until the cold can't reach. You pull them both in and lie across the doorway.", `In the morning, they're both alive. You can't feel your ears.`, addWound(s, "frostbitten"), wb.tc(s, r)] }) }),
        { label: "Give in", tag: "⚠ Instinct: you survive, guaranteed", go: (s, r) => { r.f.lost = true; r.f.gave = true; return { text: [`The cold is too much. Your body takes the warm place for itself. You curl up tight, alone, face under your tail. In the morning, Burr is pressed against the outside of the overhang, frozen to the edge of moving, but alive. He found a crack in the bank by himself. And ${weak(s, r)} is gone.`, wb.give(s, r), loseWeak(s, r), addWound(s, "left_behind")] }; } }
      ]
    },
    s8g: { title: "Grief", next: "s9",
      text: (s, r) => P(`The sun comes up over the bottoms, hard and bright on the snow, as if nothing happened.`, r.f.weak === "Wisp" && wb.ridgeAlive(s) ? `Ridge doesn't move. He's lying in the snow with Wisp, and he won't get up.` : r.f.weak === "your mother" ? `You lie down next to her. The others of your ${wb.g(s)} come, one at a time, and touch their noses to her, and go. You stay.` : ""),
      choices: (s, r) => [
        { label: "Stay", go: s => ({ text: [`You stay all day, in the cold. Burr stays with you. At sunset you finally get up.${r.f.weak === "Wisp" && wb.ridgeAlive(s) ? " So does Ridge. He walks beside you back to the " + wb.g(s) + "." : ""}`, r.f.weak === "Wisp" ? trust(s, "Ridge", 1) : ""] }) },
        { label: "Call", go: s => ({ text: [`You call your ${wb.g(s)}'s call out across the frozen valley until your throat is raw.${r.f.weak === "Wisp" && wb.ridgeAlive(s) ? " Ridge lifts his head and calls with you." : ""} The cold carries the sound a long, long way.`] }) },
        { label: "Carry on", go: s => ({ text: ["You get up and walk back to your " + wb.g(s) + ". Burr follows. You don't look back. You can't."] }) }
      ]
    },
    s9: { title: "Go to Ground", next: "s10",
      text: s => P(
        hasWound(s, "long_night") && `You can't rest. Every time anyone in your ${wb.g(s)} shivers, you're up, checking, again and again.`,
        hasWound(s, "frostbitten") && `The tips of your ears are white and hard, and your feet burn when you walk.`,
        hasWound(s, "left_behind") && `Nobody in your ${wb.g(s)} will lie next to you.`,
        bookWounds(s).length ? `${wb.momIn(s) ? "Your mother" : (wb.ridgeAlive(s) ? "Ridge" : "Burr")} finds a place: a deep drift against the bank, with a hollow dug into its side. Inside a snow den, it's warmer than you'd believe.`
          : wb.momIn(s) ? P(`Your mother lies beside you in a snow den.`, D("Your mother", wb.sedgeIn(s) ? "Thistle never trusted Sedge. Not since they were young. I used to think she was just jealous. I don't think that anymore." : "Thistle was the sharpest of all of us. She wouldn't just wander off.")) : `You lie alone in a snow den, thinking about the tracks.`
      ),
      choices: s => bookWounds(s).length ? [
        { label: "Go to ground", tag: "Heal, but lose a day", go: (s, r) => ({ text: [`You crawl into the snow den and lie still and let yourself rest.`, ...bookWounds(s).map(w => healWound(s, w)), `But while you rest, a day goes by. That night, at the edge of the bottoms, a young pronghorn goes out to paw for sagebrush, and doesn't come back.`] }) },
        { label: "Keep moving", tag: "The wound stays", go: () => ({ text: ["You can't stop now."] }) }
      ] : []
    },
    s10: { title: "The Second Walk", next: "s11",
      text: (s, r) => { r.f.me = hasBurden(s, "sedge_watching") || hasBurden(s, "sedge_knows"); return !wb.sedgeIn(s) ? P(`Dusk again. You watch every dusk now. Nobody walks anyone anywhere tonight.`) : P(
        `It happens again two days later, at dusk, when the light goes gold and long on the snow. You're watching for it this time.`,
        r.f.me ? `Sedge is walking toward <b>you</b>.` : `Sedge is walking with <b>${walker(s, r)}</b>, slowly, along the edge of the bottoms, talking warmly.`,
        r.f.me && D("Sedge", "Come for a walk with me. I want to talk to you about something."),
        `They're heading toward the frozen side-creek, the thick willows, the place where the snow was churned the morning Thistle didn't come home.`,
        wb.hasPiece(s, "together") && `You know exactly where they're going.`
      ); },
      choices: (s, r) => !wb.sedgeIn(s) ? [] : r.f.me ? [
        { label: `Go, but bring ${wb.momIn(s) ? "your mother" : wb.ridgeAlive(s) ? "Ridge" : "Burr"} along`, go: (s, r) => ({ text: [`“Sure,” you say, and turn and call ${wb.momIn(s) ? "your mother" : wb.ridgeAlive(s) ? "Ridge" : "Burr"} over. Sedge's face goes still. “Another time,” ${wb.she(s)} says, and walks off alone.`, wb.tc(s, r)] }) },
        { label: "Say no", go: s => ({ text: [`“Not tonight.” Sedge smiles. “Another time.” You don't sleep at all.`] }) },
        { label: "Go alone, and watch", check: { stat: "heart", dc: 6, tags: ["dusk"] }, go: (s, r, pass) => ({ text: pass ? [`You go. At the edge of the willows, Sedge stops, says something warm, and steps back. And deep in the willows, something big moves. You're already backing away, fast, before Sedge can turn. You saw it.`, wb.clue(s, "saw")] : [`You go. At the edge of the willows, Sedge steps back, and something huge comes out of the dark, and you run, and it swats you once, and then the animals in the bottoms are calling and it's gone.`, addWound(s, "eyes_snow"), wb.clue(s, "saw")] }) }
      ] : [
        { label: "Follow, and be ready", check: { stat: "heart", dc: 5, tags: ["dusk"] }, go: (s, r, pass) => ({ text: [
          `You slip into the willows, low and downwind, and follow. At the edge of the willows, Sedge stops, says something warm and quiet, and turns around, and walks back toward the bottoms. Alone. Leaving ${walker(s, r)} at the edge of the willows, in the dusk. And deep in the willows, something moves.`,
          pass ? `You charge. You burst out of the snow between ${walker(s, r)} and the willows, making every sound you know, and get ${walker(s, r) === "Ridge" ? "him" : "them"} moving back toward the ${wb.g(s)}. Behind you, something big goes still, then slips away.` : `You get there. Barely. Something huge comes out of the willows, and you get between it and ${walker(s, r)}, and it swats you aside like a leaf, then stops, and looks at the bottoms, at the animals watching now, and goes.`,
          pass ? "" : strain(s, "Bruised"), `You saw it. The whole thing.`, wb.clue(s, "saw")] }) },
        { label: "Get there first", go: (s, r) => ({ text: [`You cut across the bottoms the other way, fast, and come around the end of the willows, so that when they get there, you're already standing in the snow, as if you just happened to be. “Oh. Hi.” Sedge stops. For one second there's nothing in ${wb.hers(s)} face at all. Then the warm smile comes back.`, D("Sedge", "It's getting dark. We should go back."), wb.ridgeIn(s) && compTrust(s, "Ridge") >= 2 ? "Behind you, Ridge has come too. He looks at Sedge, walking away. Then at you. Something in his face changes." : "", wb.tc(s, r)] }) },
        { label: "Do nothing", go: (s, r) => ({ text: [`You tell yourself you're wrong. You lie down with your ${wb.g(s)} and don't watch. At dark, Sedge comes back alone.`, D("Sedge", `${Walker(s, r)} wanted to walk a little farther.`), `In the morning, there are churned tracks at the edge of the willows.`, loseWalker(s, r), addWound(s, "left_behind")] }) }
      ]
    },
    s11: { title: "What Do You Do With It?", next: "s12",
      text: s => P(
        `You know. You lie awake all night in the cold, and you know.`,
        wb.traitor3(s) ? `And you can prove it. Every piece of it.` : `But knowing isn't the same as proving. Sedge is warm and kind and calm, and everyone loves Sedge, and you're a yearling.`
      ),
      choices: s => !wb.sedgeIn(s) ? [] : [
        { label: `Tell the whole ${wb.g(s)}`, go: (s, r) => wb.traitor3(s) ? { text: ["You'll tell them when the moment comes. All of it, where everyone can see. You know when that will be."] } : { text: [`You stand up in front of everyone in the morning and tell them: Thistle's tracks. The second set.${wb.hasPiece(s, "claw") ? " The crooked foot." : ""}${wb.hasClue(s, "saw") ? " The willows at dusk." : ""} Everyone goes quiet.`, D("Sedge", "(very gently, very sadly) I walked with Thistle a little way. She wanted to go on. I couldn't stop her. Is that a crime?"),
          wb.proof(s) >= 2 ? P(`Half your ${wb.g(s)} looks at you like you've lost your mind. The other half looks at Sedge, and doesn't look away.`, addBurden(s, "split_group")) : N(`Nobody believes you. Your ${wb.g(s)} trusts you less.`, "bad")] } },
        { label: "Tell Sedge to " + wb.hers(s) + " face", go: s => { s.stats.heart = Math.min(10, s.stats.heart + 1); return { text: [`That night you find Sedge alone, walk right up, and say it. “I know what you did. Thistle. The lion. I know.” Sedge looks at you a long time. Sedge doesn't laugh. Sedge doesn't deny it. Sedge just says, very quietly, so only you can hear:`, D("Sedge", "Who would believe you?"), `Then ${wb.she(s)} lies down and closes ${wb.hers(s)} eyes, as if you weren't there. You've never been so scared in your life. But you said it.`, addBurden(s, "sedge_knows"), N("<span class='dim'>(Heart +1.)</span>", "good")] }; } },
        wb.when(!!trusted(s), { label: `Tell ${trusted(s)}`, go: s => ({ text: [`You tell ${trusted(s)}, quietly, everything. When you're done, there's a long silence. Then:`, D(trusted(s) === "your mother" ? "Your mother" : trusted(s), "Then we watch " + wb.her(s) + ". Together. Every dusk."), wb.bond(s, trusted(s) === "your mother" ? "mother" : trusted(s) === "Ridge" ? "ridge" : "flint")] }) }),
        { label: "Keep it to yourself", go: () => ({ text: ["You don't tell anyone. Not yet. You'll watch. You'll wait. You'll collect more. But you carry it alone."] }) }
      ]
    },
    s12: { title: "The Frozen River", next: "s13",
      text: (s, r) => P(
        `The Ghost has changed how it hunts. The snow in the bottoms is too deep and soft now, so it's hunting on the <b>river</b>: out on the ice, where the wind blows the snow away and the going is hard and fast. Its tracks are everywhere along the river, back and forth. Watching the open water at the bend, waiting for something to come down to drink.`,
        s.flags.ghost === "burned" && N(`It's hunting in daylight now. It's too hungry to wait for dusk.`, "bad"),
        sx(s, {
          otter: "You know this ice better than any animal in the valley. And you know what every otter knows: where the current runs fast underneath, the ice is thin. Thin enough for an otter. Not thin enough for anything heavy. There's a long stretch at the bend, below the open water, where the ice is like glass.",
          coyote: "You read the tracks on the ice. The cat's big round prints. Where it lay on the bank, watching the open water. And you notice: it never walks on the middle of the ice below the bend. Not once. <i>It knows the ice is thin there.</i>",
          badger: "You read the tracks on the ice with your nose. And you notice: it never walks on the middle of the ice below the bend. Not once. <i>It knows the ice is thin there.</i>",
          eagle: "From above, you can see it clearly: the dark stretch of ice at the bend, where the fast water shows through like a shadow. Thin.",
          bison: "You stay on the bank. Every bison knows it in its bones: river ice can't hold a bison.",
          pronghorn: "Pronghorn hate ice. Your sharp little hooves slip on it. You stay on the snow and watch."
        }),
        wb.burrHas(s, "burr_frozen") && `On the way back to the bottoms, the wind comes off the ice, hard and cold, and Burr stops, frozen, staring at nothing.`
      ),
      onEnter: (s, r) => { if (["otter", "coyote", "badger", "eagle"].includes(s.sp)) r.f.ice = true; return ""; },
      choices: s => wb.burrHas(s, "burr_frozen") ? [
        { label: "Move through the wind with him", go: s => ({ text: ["You don't push him. You don't call. You walk back and stand right against him, side to side, so he can feel you. Then you take one step, slowly, still pressed against him. He takes one step too. Then another. You walk all the way back to the bottoms that way, step by step, through the wind. When you get there, Burr looks back at the ice and the wind, and shakes himself all over.", wb.burrHeal(s, "burr_frozen"), trust(s, "Burr", 1)] }) },
        { label: "Stand between him and the wind until it passes", go: () => ({ text: ["You stand there a long time. Eventually the gust dies, and he blinks, and follows you home."] }) }
      ] : []
    },
    s13: { title: "Thin Ice", next: "s14",
      text: (s, r) => r.f.reck ? P(`The Ghost is still there, on the bank above the ice.`) : P(
        `It's dusk again. The last light is red on the snow. And Burr is gone.`,
        `You look everywhere. Then you hear him, out on the river: his call, high and frightened.`,
        wb.sedgeIn(s) && `As you run toward the river, you pass Sedge, walking calmly back from the riverbank. Sedge doesn't look at you. <i>Sedge was the last one with Burr.</i>`,
        `He's out at the edge of the ice near the bend, standing on it, shaking. And on the bank above him, low in the snow, long and gold and still: the Ghost. Between Burr and the bottoms. Watching him. Not in a hurry.`,
        wb.bt(s) >= 2 && P(`Then Burr does something you've never seen him do on purpose. He goes still: completely still, low against the ice, in the blue shadow of the bank. In the failing light, the Ghost loses him. Its head lifts, turns, searching. Then Burr lifts his head and calls the alarm, loud and sharp, and every animal in the bottoms hears it and looks toward the river.`, N("<b>Burr's warning.</b>", "good"))
      ),
      choices: (s, r) => [
        wb.when(wb.traitor3(s) && wb.sedgeIn(s) && !r.f.reck, { label: "The reckoning: tell your " + wb.g(s) + " everything", tag: "You have all three pieces", go: (s, r) => { r.f.reck = true; s.flags.sedge = "exposed"; return { text: [
          `You turn around. Your whole ${wb.g(s)} is at the edge of the bottoms, staring at the river. Sedge is with them. And you tell them, right there in the red light. The lion's door at Bone Coulee and the scent laid over and over. Ridge and Wisp sent down a slope into the fire. Thistle's tracks, and the crooked foot that walked back alone.`,
          `You don't say whose. You just look down at the snow, at the tracks Sedge left walking back from the river a few minutes ago. Everyone looks. Everyone sees the gap where the claw should be. Every head turns, slowly, to Sedge.`,
          `Sedge doesn't argue. For the first time in your life, there's nothing warm in ${wb.hers(s)} eyes at all. Then Sedge turns and walks out of the bottoms, across the snow, away from your ${wb.g(s)}, and doesn't come back.`,

function fbHome() {

function fbNote() {
  render(`
    <h2>Before you start</h2>

function fbFinalize(c) {
  const p = FB.paths[c.path];
  const st = { grit: 3, smarts: 3, speed: 3, technique: 3, poise: 3, zone: 0 };
  p.stats.forEach(k => st[k] += 1);
  Object.keys(c.spent).forEach(k => { if (k in st) st[k] += c.spent[k]; });
  if (c.gifted) st.zone = 2;
  c.stats = st;
  c.skills = [p.skill];
  if (!c.gifted && c.extraSkill) c.skills.push(c.extraSkill);
  c.traits = [p.strength, p.weakness, c.strength];
  c.burdens = c.gifted ? ["spotlight"] : [];
  if (c.path === "late" && !c.lateSport) c.lateSport = pick(FB.lateSports);
  c.age = Math.max(p.minAge, c.age || p.minAge);
  if (c.jersey == null || c.jersey === "") c.jersey = Math.floor(Math.random() * 99) + 1;
  c.marked = false;
  return c;
}
function fbQuick(c) {
  c.path = pick(Object.keys(FB.paths)); c.position = pick(Object.keys(FB.positions));
  c.spent = FB_SPENT0();
  const base = k => 3 + (FB.paths[c.path].stats.includes(k) ? 1 : 0);
  let n = 3; while (n) { const k = pick(Object.keys(c.spent)); if (base(k) + c.spent[k] < 6) { c.spent[k]++; n--; } }
  c.gifted = Math.random() < .5; c.zkind = c.gifted ? pick(Object.keys(FB.zones)) : null;
  c.extraSkill = c.gifted ? null : pick(FB.extraSkills.filter(x => x !== FB.paths[c.path].skill));
  c.fear = pick(Object.keys(FB.fears)); c.strength = pick(Object.keys(FB.strengths));
  c.mentor = pick(Object.keys(FB.mentors)); c.gaveUp = pick(Object.keys(FB.gaveUp));
  c.keepsake = pick(FB.keepsakes);
  c.age = FB.paths[c.path].minAge + Math.floor(Math.random() * (24 - FB.paths[c.path].minAge));
  c.jersey = Math.floor(Math.random() * 99) + 1;
}
const cap = t => t[0].toUpperCase() + t.slice(1);
function fbPortrait(c) {
  const p = FB.paths[c.path], th = PRONOUNS[c.pro], pl = c.pro === "they";

    ${c.gifted ? `${S1} ${pl ? "have" : "has"} the <b>Zone (${FB.zones[c.zkind].name})</b>: when it comes, ${FB.zones[c.zkind].feel}.` : `${S1} ${pl ? "are" : "is"} a <b>Grinder</b>: no Zone, just work. Not yet, anyway.`}
    ${FB.mentors[c.mentor].name} taught ${th[1]} the most. ${S1} wear${pl ? "" : "s"} #${esc(c.jersey)}, always carr${pl ? "y" : "ies"} a ${esc(c.keepsake)}, and ${pl ? "are" : "is"} secretly ${FB.fears[c.fear].toLowerCase()}.
    <div class="wcard"><b>Draft scouting report</b><br>Strengths: ${SNAME[sorted[0]]}, ${SNAME[sorted[1]]}. ${p.strength}.<br>Concerns: ${SNAME[sorted[sorted.length - 1]]}. ${p.weakness}.</div>`;
}
function fbSheetStats(c) {
  return `<div class="stats">${[...FB.stats.map(x => x[0]), "zone"].map(k => `<div class="stat"><b>${SNAME[k]}</b><span class="v">${c.stats[k]}</span></div>`).join("")}</div>
    <p><span class="pill ember">${FB.positions[c.position].name}</span>${c.skills.map(k => `<span class="pill ember">${k}</span>`).join("")}${c.traits.map(k => `<span class="pill">${k}</span>`).join("")}<span class="pill">${FB.fears[c.fear]}</span><span class="pill">Age ${c.age}</span></p>`;
}
function fbCreate(c, step) {
  const total = 8;
  const head = `<div class="steps">Step ${step} of ${total}</div>`;
  const nav = (canNext, extra = "") => `<hr><div class="row">
      <button id="prev">${step > 1 ? "← Back" : "Cancel"}</button>
      <button id="rand">🎲 Choose for me</button>${extra}
      <span style="flex:1"></span>
      <button class="primary" id="next" ${canNext ? "" : "disabled"}>${step === total ? "Create my player → Draft Day" : "Next →"}</button></div>`;
  const go = n => fbCreate(c, n);
  const wire = (randFn, valid) => {
    document.getElementById("prev").onclick = () => step > 1 ? go(step - 1) : fbHome();
    document.getElementById("rand").onclick = () => { randFn(); go(step); };
    document.getElementById("next").onclick = () => { if (!valid()) return; if (step === total) { fbFinalize(c); S = c; R = null; saveChar(); startBook("draftday"); } else go(step + 1); };
  };
  const names = ["Jordan", "Casey", "Riley", "Avery", "Marcus", "Dani", "Tate", "Quinn", "Reese", "Jalen"];
  if (step === 1) {
    render(`${head}<h2>Who are you?</h2>
      <p>What's your player's name?</p><input type="text" id="nm" maxlength="24" value="${esc(c.name)}" placeholder="Type a name">
      <p>When other people talk about you, they say…</p>
      <div class="row">${Object.keys(PRONOUNS).map(p => `<button class="card ${c.pro === p ? "sel" : ""}" data-p="${p}">${PRONOUNS[p][0]} / ${PRONOUNS[p][1]}</button>`).join("")}</div>
      ${nav(true, `<button id="quick">⚡ Quick start</button>`)}`);
    const nmEl = document.getElementById("nm");
    nmEl.oninput = () => { c.name = nmEl.value; };
    on("[data-p]", el => { c.pro = el.dataset.p; c.name = nmEl.value; go(1); });
    document.getElementById("quick").onclick = () => { c.name = nmEl.value.trim() || pick(names); fbQuick(c); go(8); };
    wire(() => { c.name = pick(names); c.pro = pick(Object.keys(PRONOUNS)); }, () => { c.name = nmEl.value.trim() || c.name.trim(); if (!c.name) { nmEl.focus(); toast("Type a name first"); return false; } return true; });
  }
  else if (step === 2) {
    render(`${head}<h2>Your path to the draft</h2><p class="dim">Your path gives you +1 to two stats, a skill, a strength and a weakness.</p>
      <div class="grid">${Object.entries(FB.paths).map(([k, o]) => `<div class="card ${c.path === k ? "sel" : ""}" data-o="${k}"><b>${o.name}</b><small>${o.blurb}</small><br>
        <span class="pill ember">+1 ${SNAME[o.stats[0]]}</span><span class="pill ember">+1 ${SNAME[o.stats[1]]}</span><span class="pill">${o.skill}</span><br>
        <small>Strength: ${o.strength}<br>Weakness: ${o.weakness}${o.minAge > 19 ? `<br>Age ${o.minAge}+` : ""}</small></div>`).join("")}</div>${nav(!!c.path)}`);
    on("[data-o]", el => { c.path = el.dataset.o; c.spent = FB_SPENT0(); go(2); });
    wire(() => { c.path = pick(Object.keys(FB.paths)); c.spent = FB_SPENT0(); }, () => !!c.path);
  }
  else if (step === 3) {
    render(`${head}<h2>What position do you play?</h2><p class="dim">Your position opens up its own choices in every game.</p>
      <div class="grid">${Object.entries(FB.positions).map(([k, o]) => `<div class="card ${c.position === k ? "sel" : ""}" data-o="${k}"><b>${o.name}</b><small>${o.what}</small></div>`).join("")}</div>${nav(!!c.position)}`);
    on("[data-o]", el => { c.position = el.dataset.o; go(3); });
    wire(() => { c.position = pick(Object.keys(FB.positions)); }, () => !!c.position);
  }
  else if (step === 4) {
    const base = k => 3 + (FB.paths[c.path].stats.includes(k) ? 1 : 0);
    const left = 3 - Object.values(c.spent).reduce((a, b) => a + b, 0);
    render(`${head}<h2>Spend 3 points</h2><p class="dim">Add points to any stat. No stat can go above 6. Points left: <b>${left}</b></p>
      <div class="spend">${FB.stats.map(([k, n, d]) => `<div class="stat"><div><b>${n}</b><br><small class="dim">${d}</small></div>
        <button data-m="${k}" aria-label="Take a point from ${n}" ${c.spent[k] ? "" : "disabled"}>−</button><span class="v">${base(k) + c.spent[k]}</span><button data-a="${k}" aria-label="Add a point to ${n}" ${left && base(k) + c.spent[k] < 6 ? "" : "disabled"}>+</button></div>`).join("")}</div>
      ${nav(left === 0)}`);
    on("[data-a]", el => { c.spent[el.dataset.a]++; go(4); });
    on("[data-m]", el => { c.spent[el.dataset.m]--; go(4); });
    wire(() => { c.spent = FB_SPENT0(); let n = 3; while (n) { const k = pick(Object.keys(c.spent)); if (base(k) + c.spent[k] < 6) { c.spent[k]++; n--; } } }, () => left === 0);
  }
  else if (step === 5) {
    render(`${head}<h2>Gifted or Grinder?</h2>
      <div class="grid">
        <div class="card ${c.gifted === true ? "sel" : ""}" data-g="1"><b>Gifted</b><small>Sometimes the game slows down for you. That's <b>the Zone</b>. You start with Zone 2. Going into it guarantees a play, but it costs you. And everyone expects big things: <i>In the Spotlight</i>.</small></div>
        <div class="card ${c.gifted === false ? "sel" : ""}" data-g="0"><b>Grinder</b><small>No Zone, just work. You get an extra skill. And maybe, if you make the right choices, the Zone will come someday…</small></div>
      </div>
      ${c.gifted === true ? `<h3>What kind of Zone?</h3><div class="grid">${Object.entries(FB.zones).map(([k, z]) => `<div class="card ${c.zkind === k ? "sel" : ""}" data-k="${k}"><b>${z.name}</b><small>It feels like ${z.feel}.<br>In the Zone you can: ${z.can}.</small></div>`).join("")}</div>` : ""}
      ${c.gifted === false ? `<h3>Pick your extra skill</h3><div class="row">${FB.extraSkills.filter(x => x !== FB.paths[c.path].skill).map(k => `<button class="card ${c.extraSkill === k ? "sel" : ""}" data-x="${k}">${k}</button>`).join("")}</div>` : ""}
      ${nav(c.gifted === true ? !!c.zkind : c.gifted === false ? !!c.extraSkill : false)}`);
    on("[data-g]", el => { c.gifted = el.dataset.g === "1"; go(5); });
    on("[data-k]", el => { c.zkind = el.dataset.k; go(5); });
    on("[data-x]", el => { c.extraSkill = el.dataset.x; go(5); });
    wire(() => { c.gifted = Math.random() < .5; if (c.gifted) c.zkind = pick(Object.keys(FB.zones)); else c.extraSkill = pick(FB.extraSkills.filter(x => x !== FB.paths[c.path].skill)); }, () => c.gifted === true ? !!c.zkind : c.gifted === false ? !!c.extraSkill : false);
  }
  else if (step === 6) {
    render(`${head}<h2>Your story so far</h2>
      <h3>What did you give up to get here?</h3>
      <div class="grid">${Object.entries(FB.gaveUp).map(([k, v]) => `<div class="card ${c.gaveUp === k ? "sel" : ""}" data-u="${k}"><b>${v}</b></div>`).join("")}</div>
      <h3>What scares you most?</h3>
      <div class="grid">${Object.entries(FB.fears).map(([k, f]) => `<div class="card ${c.fear === k ? "sel" : ""}" data-f="${k}"><b>${f.replace("Afraid of ", "")}</b></div>`).join("")}</div>
      <h3>When a teammate's in trouble, you…</h3>
      <div class="grid">${Object.entries(FB.strengths).map(([k, d]) => `<div class="card ${c.strength === k ? "sel" : ""}" data-s="${k}"><b>${k}</b><small>${d}</small></div>`).join("")}</div>
      <h3>Who taught you the most?</h3>
      <div class="grid">${Object.entries(FB.mentors).map(([k, m]) => `<div class="card ${c.mentor === k ? "sel" : ""}" data-t="${k}"><b>${m.name}</b><small>${m.who}.</small></div>`).join("")}</div>
      ${nav(c.gaveUp && c.fear && c.strength && c.mentor)}`);
    on("[data-u]", el => { c.gaveUp = el.dataset.u; go(6); });
    on("[data-f]", el => { c.fear = el.dataset.f; go(6); });
    on("[data-s]", el => { c.strength = el.dataset.s; go(6); });
    on("[data-t]", el => { c.mentor = el.dataset.t; go(6); });
    wire(() => { c.gaveUp = pick(Object.keys(FB.gaveUp)); c.fear = pick(Object.keys(FB.fears)); c.strength = pick(Object.keys(FB.strengths)); c.mentor = pick(Object.keys(FB.mentors)); }, () => c.gaveUp && c.fear && c.strength && c.mentor);
  }
  else if (step === 7) {
    const min = FB.paths[c.path].minAge;
    if (!c.age || c.age < min) c.age = min;
    render(`${head}<h2>Draft Day you</h2>
      <h3>How old are you on Draft Day?</h3>
      ${min > 19 ? `<p class="dim">${FB.paths[c.path].name} players missed a season, so they're at least ${min}.</p>` : ""}
      <div class="row">${[19, 20, 21, 22, 23].filter(a => a >= min).map(a => `<button class="card ${c.age === a ? "sel" : ""}" data-a="${a}">${a}</button>`).join("")}</div>
      <h3>Jersey number</h3><p class="dim">0 to 99.</p>

  }
  else if (step === 8) {

        <span class="pill ember">+1 ${SNAME[o.stats[0]]}</span><span class="pill ember">+1 ${SNAME[o.stats[1]]}</span><span class="pill">${o.skill}</span><br>
        <small>Strength: ${o.strength}<br>Weakness: ${o.weakness}</small></div>`).join("")}</div>${nav(!!c.origin)}`);
    on("[data-o]", el => { c.origin = el.dataset.o; go(2); });
    wire(() => { c.origin = pick(Object.keys(ORIGINS)); }, () => !!c.origin);
  }
  else if (step === 3) {
    const base = k => 3 + (ORIGINS[c.origin].stats.includes(k) ? 1 : 0);
    const left = 3 - Object.values(c.spent).reduce((a, b) => a + b, 0);
    render(`${head}<h2>Spend 3 points</h2><p class="dim">Add points to any stat. No stat can go above 6. Points left: <b>${left}</b></p>
      <div class="spend">${STATS.map(([k, n, d]) => `<div class="stat"><div><b>${n}</b><br><small class="dim">${d}</small></div>
        <button data-m="${k}" aria-label="Take a point from ${n}" ${c.spent[k] ? "" : "disabled"}>−</button><span class="v">${base(k) + c.spent[k]}</span><button data-a="${k}" aria-label="Add a point to ${n}" ${left && base(k) + c.spent[k] < 6 ? "" : "disabled"}>+</button></div>`).join("")}</div>
      ${nav(left === 0)}`);
    on("[data-a]", el => { c.spent[el.dataset.a]++; go(3); });
    on("[data-m]", el => { c.spent[el.dataset.m]--; go(3); });
    wire(() => { c.spent = { grit: 0, wits: 0, reflex: 0, tech: 0, nerve: 0 }; let n = 3; while (n) { const k = pick(Object.keys(c.spent)); if (base(k) + c.spent[k] < 6) { c.spent[k]++; n--; } } }, () => left === 0);
  }
  else if (step === 4) {
    render(`${head}<h2>The Mark</h2>
      <div class="grid">
        <div class="card ${c.marked === true ? "sel" : ""}" data-m="1"><b>Marked</b><small>You have the spark of Vael. You start with Ember 2 and a Kind of Mark. But the Quench, the hunters of the Dominion, are always looking for you.</small></div>
        <div class="card ${c.marked === false ? "sel" : ""}" data-m="0"><b>Unmarked</b><small>No spark, just you. You get an extra skill. And maybe, if you make the right choices, the Mark will wake up someday…</small></div>
      </div>
      ${c.marked === true ? `<h3>What kind of Mark?</h3><div class="grid">${Object.entries(KINDS).map(([k, m]) => `<div class="card ${c.kind === k ? "sel" : ""}" data-k="${k}"><b>${m.name}</b><small>Shows as ${m.look}.<br>Burning it can: ${m.can}.</small></div>`).join("")}</div>` : ""}
      ${c.marked === false ? `<h3>Pick your extra skill</h3><div class="row">${EXTRA_SKILLS.filter(x => x !== ORIGINS[c.origin].skill).map(k => `<button class="card ${c.extraSkill === k ? "sel" : ""}" data-x="${k}">${k}</button>`).join("")}</div>` : ""}
      ${nav(c.marked === true ? !!c.kind : c.marked === false ? !!c.extraSkill : false)}`);
    on("[data-m]", el => { c.marked = el.dataset.m === "1"; go(4); });
    on("[data-k]", el => { c.kind = el.dataset.k; go(4); });
    on("[data-x]", el => { c.extraSkill = el.dataset.x; go(4); });
    wire(() => { c.marked = Math.random() < .5; if (c.marked) c.kind = pick(Object.keys(KINDS)); else c.extraSkill = pick(EXTRA_SKILLS.filter(x => x !== ORIGINS[c.origin].skill)); }, () => c.marked === true ? !!c.kind : c.marked === false ? !!c.extraSkill : false);
  }
  else if (step === 5) {
    render(`${head}<h2>What scares you most?</h2>
      <div class="grid">${Object.entries(FEARS).map(([k, f]) => `<div class="card ${c.fear === k ? "sel" : ""}" data-f="${k}"><b>${f.replace("Afraid of ", "")}</b></div>`).join("")}</div>
      <h3>When someone's in trouble, you…</h3>
      <div class="grid">${Object.entries(STRENGTHS).map(([k, d]) => `<div class="card ${c.strength === k ? "sel" : ""}" data-s="${k}"><b>${k}</b><small>${d}</small></div>`).join("")}</div>
      ${nav(c.fear && c.strength)}`);
    on("[data-f]", el => { c.fear = el.dataset.f; go(5); });
    on("[data-s]", el => { c.strength = el.dataset.s; go(5); });
    wire(() => { c.fear = pick(Object.keys(FEARS)); c.strength = pick(Object.keys(STRENGTHS)); }, () => c.fear && c.strength);
  }
  else if (step === 6) {
    render(`${head}<h2>Who taught you the most?</h2>
      <div class="grid">${Object.entries(MENTORS).map(([k, m]) => `<div class="card ${c.mentor === k ? "sel" : ""}" data-t="${k}"><b>${m.name}</b><small>${m.who}.</small></div>`).join("")}</div>
      <h3>What do you always carry?</h3><p class="dim">Once per book, when fear grabs you, your keepsake helps you hold steady.</p>
      <div class="row">${KEEPSAKES.map(k => `<button class="card ${c.keepsake === k ? "sel" : ""}" data-ks="${k}">${k}</button>`).join("")}</div>
      ${nav(c.mentor && c.keepsake)}`);
    on("[data-t]", el => { c.mentor = el.dataset.t; go(6); });
    on("[data-ks]", el => { c.keepsake = el.dataset.ks; go(6); });
    wire(() => { c.mentor = pick(Object.keys(MENTORS)); c.keepsake = pick(KEEPSAKES); }, () => c.mentor && c.keepsake);
  }
  else if (step === 7) {
    const f = finalizeChar(clone(c));
    render(`${head}<h2>This is ${esc(c.name)}</h2>
      <p>${portrait(f)}</p>
      ${sheetStats(f)}
      ${nav(true)}`);
    wire(() => { quickStart(c); }, () => true);
  }
}
function quickStart(c) {
  c.origin = pick(Object.keys(ORIGINS));
  c.spent = { grit: 0, wits: 0, reflex: 0, tech: 0, nerve: 0 };
  const base = k => 3 + (ORIGINS[c.origin].stats.includes(k) ? 1 : 0);
  let n = 3; while (n) { const k = pick(Object.keys(c.spent)); if (base(k) + c.spent[k] < 6) { c.spent[k]++; n--; } }
  c.marked = Math.random() < .5; c.kind = c.marked ? pick(Object.keys(KINDS)) : null;
  c.extraSkill = c.marked ? null : pick(EXTRA_SKILLS.filter(x => x !== ORIGINS[c.origin].skill));
  c.fear = pick(Object.keys(FEARS)); c.strength = pick(Object.keys(STRENGTHS));
  c.mentor = pick(Object.keys(MENTORS)); c.keepsake = pick(KEEPSAKES);
}
function portrait(c) {
  if (serOf(c) === "football") return fbPortrait(c);
  if (serOf(c) === "oath") return obPortrait(c);
  if (serOf(c) === "wild") return wbPortrait(c);
  const o = ORIGINS[c.origin];
  return `${esc(c.name)} is a <b>${o.name.toLowerCase()}</b>. ${o.blurb} ${c.marked ? `${they(c)[0].toUpperCase() + they(c).slice(1)} carr${c.pro === "they" ? "y" : "ies"} a <b>${KINDS[c.kind].name}</b> Mark: ${KINDS[c.kind].look}.` : `${they(c)[0].toUpperCase() + they(c).slice(1)} ${c.pro === "they" ? "have" : "has"} no Mark. Not yet, anyway.`} ${MENTORS[c.mentor].name} taught ${PRONOUNS[c.pro][1]} the most. ${they(c)[0].toUpperCase() + they(c).slice(1)} always carr${c.pro === "they" ? "y" : "ies"} a ${esc(c.keepsake)}, and ${c.pro === "they" ? "are" : "is"} secretly ${FEARS[c.fear].toLowerCase().replace("afraid", "afraid")}.`;
}
function sheetStats(c) {
  if (serOf(c) === "football") return fbSheetStats(c);
  if (serOf(c) === "oath") return obSheetStats(c);
  if (serOf(c) === "wild") return wbSheetStats(c);
  return `<div class="stats">${[...STATS.map(x => x[0]), "ember"].map(k => `<div class="stat"><b>${SNAME[k]}</b><span class="v">${c.stats[k]}</span></div>`).join("")}</div>
    <p>${c.skills.map(k => `<span class="pill ember">${k}</span>`).join("")}${c.traits.map(k => `<span class="pill">${k}</span>`).join("")}<span class="pill">${FEARS[c.fear]}</span></p>`;
}

// ---------- book picker ----------
window.bookById = id => EF.books.find(b => b.id === id);
function picker(fresh) {
  const ser = serOf(S);
  const books = EF.books.filter(b => (b.series || "ember") === ser);
  render(`
    ${fresh ? `<h1>Welcome, ${nm(S)}!</h1>` : `<h1>Your next choices are…</h1>`}
    <p class="dim">Pick a book to add ${nm(S)} to. You can only play each book once with a character.</p>
    <div class="grid">${books.map(b => {
      const lock = !["ore", "draftday", "stone", "river"].includes(b.id);
      const done = S.done.includes(b.id), rec = !lock && b.recommend && b.recommend(S);
      if (lock) return `<div class="card book done locked"><span class="where">${b.where}</span><b>${b.title}</b><small>${b.blurb}</small><span><span class="pill">🔒 In the full version</span></span></div>`;
      return `<div class="card book ${done ? "done" : ""}" ${done ? "" : `data-b="${b.id}"`}>
        <span class="where">${b.where}</span><b>${b.title}</b><small>${b.blurb}</small>
        <span>${done ? `<span class="pill">✓ Finished</span>` : ""}${rec ? `<span class="pill ember">★ ${rec}</span>` : ""}${b.starting ? `<span class="pill">Starting adventure</span>` : ""}</span>
      </div>`;
    }).join("")}
      ${ser === "oath" ? obSoon() : ser === "wild" ? wbSoon() : ser === "ember" ? `<div class="card book done"><span class="where">Dustwater</span><b>The Night the Sky Burned</b><small>The Quench raid your homestead. Coming soon.</small></div>` : [
        ["Training camp", "Rookie Camp", "Ninety players, fifty-three spots, and a fight with Cole Brandt for the last one."],
        ["Year 1", "The First Snap", "A starter goes down, and you're thrown into your first real game."],
        ["Cutter Creek", "Hometown Game", "A preseason game near home, and the whole town shows up."]
      ].map(x => `<div class="card book done"><span class="where">${x[0]}</span><b>${x[1]}</b><small>${x[2]} Coming soon.</small></div>`).join("")}
    </div>
    <hr><div class="row"><button id="sheet">📜 Character sheet</button><button id="h">Home</button></div>
  `);
  on("[data-b]", el => startBook(el.dataset.b));
  document.getElementById("sheet").onclick = sheet;
  document.getElementById("h").onclick = () => seriesHome(serOf(S));
}

function sheet() {
  const c = S;
  render(`<h2>${nm(c)}</h2><p>${portrait(c)}</p>${sheetStats(c)}
    ${serOf(c) === "oath" ? obSheetExtra(c) : serOf(c) === "wild" ? wbSheetExtra(c) : ""}
    ${c.wounds.length ? `<h3>Wounds</h3>${c.wounds.map(woundCard).join("")}` : ""}
    ${c.scars.length ? `<h3>Scars</h3>${c.scars.map(id => `<div class="wcard"><b>${EF.wounds[id].scar}</b> — ${EF.wounds[id].scarText}</div>`).join("")}` : ""}
    ${c.burdens.length ? `<h3>Burdens</h3>${c.burdens.map(b => `<div class="wcard">${EF.burdens[b]}</div>`).join("")}` : ""}
    ${Object.keys(c.comp).length ? `<h3>Companions</h3>${compList(c)}` : ""}
    ${c.mystery.length ? `<h3>✦ Mystery pieces</h3><ul>${c.mystery.map(m => `<li>${m}</li>`).join("")}</ul>` : ""}
    <h3>Character code</h3><p class="dim">Save this code somewhere safe. Paste it on any device to bring ${nm(c)} back.</p>
    <div class="code" id="cd">${makeCode(c)}</div>
    <div class="row" style="margin-top:10px"><button class="primary" id="cp">Copy code</button><button id="bk">← Back</button></div>`);
  document.getElementById("cp").onclick = () => copyText(makeCode(c));
  document.getElementById("bk").onclick = () => R ? showScene() : picker();
}
function woundCard(id) { const w = EF.wounds[id]; return `<div class="wcard"><b>${w.name}</b> <span class="pill">${w.kind}</span><br>${w.effect}<br><span class="dim">Double edge: ${w.edge}<br>Way through: ${w.way}</span></div>`; }
function compList(c) {
  return Object.entries(c.comp).map(([who, x]) => `<div class="wcard"><b>${who}</b> — trust: ${["low", "steady", "high"][x.trust]}${x.travel ? " · traveling with you" : ""}<br>
    ${x.wound ? `Carrying: <b>${EF.wounds[x.wound].name}</b>. ${EF.wounds[x.wound].effect}${x.step ? " <i>(starting to heal)</i>" : ""}` : ""}
    ${x.wound2 ? `<br>Also carrying: <b>${EF.wounds[x.wound2].name}</b>. ${EF.wounds[x.wound2].effect}` : ""}
    ${x.scar ? `Scar: <b>${EF.wounds[x.scar].scar}</b>. ${EF.wounds[x.scar].scarText}` : ""}</div>`).join("");
}

// ---------- reader ----------
function startBook(id) {
  const b = bookById(id);
  S.strain = []; // strain clears between adventures
  R = { book: id, scene: b.start, burns: 0, keepsakeUsed: false, pen: 0, f: {}, start: clone(S), pending: null };
  if (b.setup) b.setup(S, R);
  saveChar();
  showScene();
}
function showScene() {
  const b = bookById(R.book);
  if (R.pending) return showResult(R.pending);
  if (R.scene === "END") return results();
  const sc = b.scenes[R.scene];
  if (!sc) { console.error("Missing scene", R.scene); return results(); }
  // Scene text can carry one-time effects, so build it once per visit and cache it.
  if (R.cacheFor !== R.scene) {
    R.html = sc.text(S, R) + (sc.onEnter ? (sc.onEnter(S, R) || "") : "");
    R.cacheFor = R.scene;
  }
  const text = R.html;
  const stitle = typeof sc.title === "function" ? sc.title(S, R) : sc.title;
  const choices = ((sc.choices && sc.choices(S, R)) || []).filter(ch => ch && ch.show !== false);
  render(`<div class="scene-title">${b.title} · ${stitle}</div><h2>${stitle}</h2>${text}
    <div class="choices">${choices.length ? choices.map((ch, i) => {
      let tag = ch.tag || "";
      if (ch.check) { const v = checkValue(S, R, ch.check); tag = `${SNAME[ch.check.stat]} check: need ${ch.check.dc}, you have ${v}`; }
      return `<button class="choice" data-key data-c="${i}"><span class="num">${i + 1}</span><span>${ch.label}${tag ? `<span class="tag">${tag}</span>` : ""}</span></button>`;
    }).join("") : `<button class="primary choice" data-key id="cont"><span class="num">1</span><span>Continue →</span></button>`}</div>
    <hr><div class="row"><button id="sheet">📜 ${nm(S)}</button></div>`);
  saveChar();
  document.getElementById("sheet").onclick = sheet;
  const cont = document.getElementById("cont");
  if (cont) cont.onclick = () => advance(typeof sc.next === "function" ? sc.next(S, R) : sc.next);
  on("[data-c]", el => choose(choices[+el.dataset.c], sc));
}
function choose(ch, sc) {
  let pass = true, checkLine = "";
  if (ch.check) {
    const v = checkValue(S, R, ch.check);
    pass = v >= ch.check.dc;
    R.pen = 0;
    checkLine = `<p class="check ${pass ? "pass" : "fail"}">${SNAME[ch.check.stat]} check: ${v} vs ${ch.check.dc} — ${pass ? "Success!" : "Not this time."}</p>`;
  }
  const out = ch.go(S, R, pass) || {};
  const next = out.next || (typeof sc.next === "function" ? sc.next(S, R) : sc.next);
  if (!out.text) return advance(next);
  R.pending = { html: checkLine + (Array.isArray(out.text) ? P(...out.text) : out.text), next };
  saveChar();
  showResult(R.pending);
}
function showResult(p) {
  const b = bookById(R.book);
  render(`<div class="scene-title">${b.title}</div>${p.html}
    <div class="choices"><button class="primary choice" data-key id="cont"><span class="num">1</span><span>Continue →</span></button></div>
    <hr><div class="row"><button id="sheet">📜 ${nm(S)}</button></div>`);
  document.getElementById("cont").onclick = () => { R.pending = null; advance(p.next); };
  document.getElementById("sheet").onclick = sheet;
}
function advance(next) {
  R.scene = next || "END";
  R.cacheFor = null;
  saveChar();
  showScene();
}

// ---------- results ----------
function results() {
  const b = bookById(R.book), a = R.start, c = S;
  if (!c.done.includes(b.id)) c.done.push(b.id);
  const gained = [], lost = [];
  for (const k of Object.keys(c.stats)) { const d = c.stats[k] - a.stats[k]; if (d > 0) gained.push(`${SNAME[k]} +${d}`); if (d < 0) lost.push(`${SNAME[k]} ${d}`); }
  c.allies.filter(x => !a.allies.includes(x)).forEach(x => gained.push(`Ally: ${x}`));
  c.scars.filter(x => !a.scars.includes(x)).forEach(x => gained.push(`Scar: ${EF.wounds[x].scar}`));
  c.burdens.filter(x => !a.burdens.includes(x)).forEach(x => lost.push(`Burden: ${EF.burdens[x].split(" — ")[0]}`));
  a.burdens.filter(x => !c.burdens.includes(x)).forEach(x => gained.push(`Cleared: ${EF.burdens[x].split(" — ")[0]}`));
  c.mystery.filter(x => !a.mystery.includes(x)).forEach(x => gained.push(`✦ ${x}`));
  const newWounds = c.wounds.filter(x => !a.wounds.includes(x));
  const extra = b.resultsExtra ? b.resultsExtra(c, R) : "";
  if (c.marked && !a.marked) gained.unshift(`<b>Your Mark awoke: ${KINDS[c.kind].name}!</b>`);
  if (serOf(c) === "oath") {
    if (c.oathborn && !a.oathborn) gained.unshift(`<b>Your Oath awoke: ${OB.kinds[c.okind].name}!</b>`);
    (c.items || []).filter(x => !(a.items || []).includes(x)).forEach(x => gained.push(`Item: ${x}`));
    (a.items || []).filter(x => !(c.items || []).includes(x)).forEach(x => lost.push(`Item: ${x}`));
  }
  if (serOf(c) === "wild") c.season = (c.season || 0) + 1;
  R = null; saveChar();
  render(`<h1>The end of ${b.title}</h1>
    <p>${nm(c)} made it through. Still standing, and changed.</p>${extra}
    <h3>What you gained</h3>${gained.length ? `<ul>${gained.map(x => `<li>${x}</li>`).join("")}</ul>` : `<p class="dim">Nothing you can hold. But you're still here.</p>`}
    <h3>What it cost</h3>${lost.length || c.strain.length ? `<ul>${lost.map(x => `<li>${x}</li>`).join("")}${c.strain.map(x => `<li>Strain: ${x} <span class="dim">(clears before your next book)</span></li>`).join("")}</ul>` : `<p class="dim">Somehow, nothing. Lucky.</p>`}
    ${newWounds.length ? `<h3>Wounds you carry out</h3>${newWounds.map(woundCard).join("")}` : ""}
    ${Object.keys(c.comp).length ? `<h3>Companions</h3>${compList(c)}` : ""}
    <h3>Your new character code</h3>
    <p class="dim">Copy this and keep it safe. It holds everything ${nm(c)} is now.</p>
    <div class="code">${makeCode(c)}</div>
    <div class="row" style="margin-top:10px"><button class="primary" id="cp">Copy code</button></div>
    <hr><div class="choices">${b.ros ? `<button class="primary choice" data-key id="ros"><span class="num">1</span><span>Real or Story? Check what was true →</span></button>` : ""}<button class="${b.ros ? "" : "primary "}choice" data-key id="nx"><span class="num">${b.ros ? 2 : 1}</span><span>Your next choices are… →</span></button></div>`);
  document.getElementById("cp").onclick = () => copyText(makeCode(c));
  document.getElementById("nx").onclick = () => picker();
  if (b.ros) document.getElementById("ros").onclick = () => realOrStory(b);
}

// boot
window.EFdebug = { home, seriesHome, get SERIESKEYS() { return Object.keys(SERIES); }, get S() { return S; }, get R() { return R; }, setS: v => { S = v; }, setR: v => { R = v; }, newChar, finalizeChar, quickStart, obQuick, obFinalize, wbQuick, wbFinalize, realOrStory, picker, sheet, startBook, choose, makeCode, readCode, checkValue };
home();
})();

</script>
</body>
</html>
