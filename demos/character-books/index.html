          otter: "You're a river otter, and the river is still low, but it's running again: a slow brown trickle with deep pools at the bends. You'll take it."
        }),
        !r.f.burrNew && `Burr is with you. He's grown this summer, a little taller, a little stronger, but he still sleeps pressed against you every night.`,
        wb.sedgeLeads(s) && `Sedge leads your ${wb.g(s)} now. Everyone seems to like it. You try to like it too.`,
        wb.flintIn(s) && `Old Flint still leads your ${wb.g(s)}. ${wb.She(s)} is slower than ever.${wb.sedgeIn(s) ? " And Sedge is always at " + wb.hers(s) + " side." : ""}`,
        `That evening the sky to the west turns dark purple, with a sickly yellow light underneath. The wind stops. Every bird in the cottonwoods goes quiet. Then the storm comes over the Red Buttes: a tower of black cloud, lightning walking across it, thunder rolling down the valley until the ground shakes.`,
        `Your ${wb.g(s)} waits for the rain. A few fat drops hit the dust, <i>plip, plip</i>, and dry up almost as they land. That's all. The storm grumbles east, still dry.`,
        `Then a crack so loud it hurts. Lightning hits the very top of the Red Buttes, and for one second the whole world is white. When you can see again, there's a tiny orange light at the top of the buttes, flickering in the dark.`,
        s.fear === "wfire" && N(`<b>Afraid of Fire.</b> Your whole body goes stiff. You know what that light is. You don't sleep that night.`, "mark")
      )
    },
    s2: { title: "The Smoke Smell", next: (s, r) => r.f.west ? "s2b" : (s.stray ? "s2c" : "s3"),
      text: (s, r) => P(
        `In the morning the sky over the Red Buttes is brown. A long, low cloud of smoke lies across their tops, and the sun shines through it the color of an egg yolk. Ash drifts down in tiny gray flakes. The air catches in your throat.`,
        s.sp === "eagle" ? N(`<b>High Eye.</b> You climb high over the cottonwoods and see it: a long, wavering line of orange along the top of the Red Buttes, miles long, smoke leaning east in the wind. East. Toward you. Every eagle knows what fire does when the afternoon wind comes up.`, "mark") : "",
        s.sp === "pronghorn" ? N(`<b>Pronghorn eyes.</b> From the highest spot on the flat you see what the others can only smell: the smoke is <i>moving</i>, coming down the far side of the ridge in a long gray wall, with a flicker of orange under it.`, "mark") : "",
        `Your ${wb.g(s)} gathers to decide.`,
        wb.momIn(s) ? D("Your mother", "The old gully. The one from the buttes down to the river, below the bend. My mother took me down it the last time the buttes burned. The fire went right over the top, and we waited in the water till it was over.") : D(wb.Elder(s), "The old gully, down to the river. That's how we got through the last fire."),
        s.stray && `You don't know the gully. You weren't born here.`,
        wb.sedgeIn(s) && P(
          `Then Sedge steps up onto a rock where everyone can see. You notice ${wb.hers(s)} front foot as ${wb.she(s)} steps up: an old injury, from a fight long ago. One claw is missing, and the toe beside the gap is a little crooked. You've seen it a hundred times. You've never really thought about it.`,
          D("Sedge", "The gully's a trap. If the fire comes down into it, there's nowhere to go. We go over the top, now, while it's early. Toward Bone Coulee. Away from the smoke."),
          `That sounds smart. A lot of your ${wb.g(s)} start nodding. But something is bothering you.`),
        !wb.sedgeIn(s) && `Some of the ${wb.g(s)} want to go over the top instead, west, toward Bone Coulee. Something about that bothers you.`
      ),
      choices: s => [
        wb.when(s.sp === "eagle" || s.sp === "pronghorn", { label: "You saw it with your own eyes: the fire is west", tag: wb.X(s).name, go: (s, r) => { r.f.saw = true; r.f.west = true; return { text: ["You don't need to sniff the wind. You've seen it. West is where the fire is."] }; } }),
        { label: "Feel the wind on your face", check: { stat: "senses", dc: 4, bonus: hasTrait(s, "Watcher") ? 1 : 0 }, go: (s, r, pass) => {
          if (pass) { r.f.west = true; return { text: ["The wind is coming from the west. Out of the buttes. Out of Bone Coulee. Smoke and ash and heat, blowing straight at you from exactly where they want to go. <i>Toward Bone Coulee isn't away from the smoke. It's toward the fire.</i>"] }; }
          r.f.split = true; return { text: ["The smoke is everywhere. You can't tell which way it's coming from. Your " + wb.g(s) + " splits: some go one way, some the other."] };
        } }
      ]
    },
    s2b: { title: "West Is the Fire", next: s => s.stray ? "s2c" : "s3",
      text: s => P(`Everyone is starting to move.`),
      choices: s => [
        { label: "Say it out loud", go: (s, r) => ({ text: [
          `“The wind's from the west. That's where the fire is. That way goes straight into it.” Everyone goes quiet.`,
          wb.sedgeIn(s) ? P(`Sedge looks at you for a long moment. Then ${wb.she(s)} laughs, easy and kind.`, D("Sedge", "Good nose. I must have gotten turned around in the smoke."), `But ${wb.she(s)} doesn't quite look at you for the rest of the morning.`, wb.clue(s, "west")) : "",
          `Your ${wb.g(s)} goes ${wb.momIn(s) ? "your mother's" : "the gully"} way.`] }) },
        { label: "Keep quiet", go: (s, r) => { r.f.split = true; return { text: [`You don't want to be the yearling who argued in front of everyone. Your ${wb.g(s)} splits: some go west, some go to the gully.`] }; } }
      ]
    },
    s2c: { title: "Bare Ground", next: "s3",
      text: s => P(`And then you remember something nobody else here would know.`, `Along the Black Road there's a long, wide strip of bare, plowed dirt, where the humans scraped away all the grass with their yellow machines. You saw it this summer and didn't understand. You understand now. At the rescue, the people talked about fires, pointing at pictures: <i>firebreaks</i>. Bare ground. Nothing to burn. Fire can't cross it.`),
      choices: s => [
        { label: "Tell them", go: (s, r) => { r.f.firebreak = true; return { text: [wb.ridgeIn(s) ? D("Ridge", "The stray wants us to go toward the <i>humans</i>?") : "Somebody snorts.", "Nobody listens. But you remember where it is."] }; } },
        { label: "Keep it in your head", go: (s, r) => { r.f.firebreak = true; return { text: ["You don't say anything. But you remember where it is."] }; } }
      ]
    },
    s3: { title: "The Fire Comes", next: "s4",
      text: (s, r) => P(
        wb.ridgeAlive(s) ? `${wb.ridgeIn(s) ? "Ridge" : "Ridge, who lives alone on the buttes now,"} is standing at the edge of the ${wb.g(s)}${wb.wispIn(s) ? " with Wisp, his little sister, pressed against his side, still small and thin from the summer and coughing in the smoke" : ""}.${wb.sedgeIn(s) ? ` Sedge walks over to them. You can't hear what Sedge says. But you see Sedge point with ${wb.hers(s)} nose, west and south, toward a long grassy slope down the side of the buttes. Ridge hesitates, looks at ${wb.wispIn(s) ? "Wisp" : "the slope"}, and nods. They start walking that way. Alone.` : " They head off down a long grassy slope on their own."}` : `Two of the youngest in your ${wb.g(s)} wander off down a long grassy slope on the side of the buttes, toward better grass.`,
        `By noon, the wind is roaring. You hear it before you see it: a low, deep, rushing roar, like a river in flood, from the top of the ridge. Then it comes over.`,
        `It isn't a wall of flame. It's worse. It's a long, ragged line of orange running across the top of the grass faster than anything should move, leaping forward with every gust, eating everything. Smoke pours off it, black and boiling. Burning bits of grass float ahead of it on the wind, and wherever they land, new fires leap up. Ash falls like snow.`,
        `And every animal in the valley runs. Deer bound past you, eyes white. A flood of mice and rabbits pours across the flat. A hawk drops out of the smoke to snatch a mouse from the stampede. Coyotes and pronghorn and deer run side by side, all enemies forgotten. The heat hits you like a wall.`,
        wb.panel(s, false, sx(s, { coyote: "Run, now, fast, anywhere, as long as it's away.", pronghorn: "Run, now, fast, anywhere, as long as it's away.", bison: "Face it. Stand your ground. Don't move for anyone.", eagle: "Face it. Stand your ground. Don't move for anyone.", badger: "Face it. Stand your ground. Don't move for anyone.", otter: "Find a hole, any hole, and crawl in, and wait." })),
        `Behind you, your ${wb.g(s)} is scattering. The young ones are confused. ${wb.momIn(s) ? "Your mother is calling." : "Someone is calling."}`
      ),
      choices: s => [
        { label: "Give in", tag: "⚠ Instinct: you survive, guaranteed", go: (s, r) => { r.f.alone = true; return { text: [
          sx(s, { coyote: "You run, faster than you've ever run, and don't look back.", pronghorn: "You run, faster than you've ever run, and don't look back.", bison: "You plant yourself and face the fire with every hair standing, and don't look at anyone else.", eagle: "You beat your wings straight up and away, and don't look at anyone else.", badger: "You plant yourself and face the fire with every hair standing, and don't look at anyone else.", otter: "You find a crack in the cutbank, crawl in, and press your face to the dirt." }),
          `When you come back to yourself, the smoke is all around you, and you're alone. Your ${wb.g(s)} is gone.`, wb.give(s, r), trust(s, "Ridge", -1)] }; } },
        { label: "Fight it: go back for the young ones", check: { stat: "heart", dc: 5, bonus: 0, tags: ["smoke", "young"] }, go: (s, r, pass) => {
          if (pass) { r.f.together = true; s.stats.heart = Math.min(10, s.stats.heart + 1); return { text: [`You make yourself stop. You make yourself turn around. You find the little ones of your ${wb.g(s)}, frozen and confused in the smoke, and you push them and nudge them and call to them until they're all moving the same way: toward ${wb.momIn(s) ? "your mother's" : "the gully"} voice.`, N("Your " + wb.g(s) + " stays together. <span class='dim'>(Heart +1.)</span>", "good"), wb.tc(s, r)] }; }
          return { text: ["You turn back. But a wall of smoke rolls over you, and you can't see or breathe, and your body takes over after all. When you can see again, your " + wb.g(s) + " has scattered.", strain(s, "Shaken")] };
        } }
      ]
    },
    s4: { title: "Through the Smoke", next: "s5",
      text: (s, r) => P(
        `You can't see more than a few body-lengths. The smoke is so thick it's like night. The fire is somewhere behind you, close, roaring. You can feel the heat on your back.`,
        r.f.burrNew
          ? P(`Out of the smoke, something runs straight into you. It's a <b>${B(s)}</b>, born this spring, eyes wide and wild. It bounces off you and stands there, shaking. Behind it, through the smoke, you catch one glimpse of ${wb.bm(s)} running hard the other way, calling for it. Then the smoke closes over her, and she's gone.`,
              s.sp === "eagle" && `(It's a young magpie, still clumsy in the air. It tumbles out of the smoke and lands beside you, beak open, panting. Its family is gone.)`,
              `The little one doesn't follow her. It can't see her. It can only see you. When you run, it runs with you.`)
          : `Burr is right beside you, pressed against your side, trembling.${wb.burrHas(s, "burr_dontleave") ? " He hasn't let you out of his sight for a second. Right now, that's a good thing." : ""}`,
        `You have to get out. Now.`
      ),
      onEnter: (s, r) => { if (r.f.burrNew) wb.burrSet(s, 1); return ""; },
      choices: (s, r) => [
        wb.when(s.sp === "badger", { label: "Dig: dig in and let the fire pass over", tag: "Badger", go: () => ({ text: ["You don't run. Badgers don't need to. You dig, front claws tearing, back feet throwing dirt, faster than you've ever dug. In a few heartbeats there's a tunnel, and you shove the little one in ahead of you and pull the dirt down over the opening behind you.", "Then the fire goes over: a roar right over your heads, like the whole world falling. The dirt above gets warm. Then hot. Then, slowly, cool again. When you dig your way out, the whole world is black. But you're both alive. This is what badgers have always done."] }) }),
        wb.when(s.sp === "pronghorn", { label: "Burst: run sideways to the fire, to the river", tag: "Pronghorn", go: () => ({ text: ["You run, not away from the fire in a panic like everyone else, but sideways to it, across the open flat toward the gap in the smoke you saw this morning. You are faster than the fire. The little one can't keep up, so you slow just enough to let it run in your shadow, calling to it, short and sharp. You hit the river at a full run and turn around and watch the fire roar up to the bank, and stop."] }) }),
        wb.when(s.sp === "eagle", { label: "High Eye: climb above the smoke and guide them", tag: "Golden Eagle", go: (s, r) => ({ text: ["You go up, through the smoke, choking, until you burst out of the top into clear air and the whole fire is spread out below you like a map. You can see where the gaps are. And you can see your neighbors, and the little one, tumbling through the smoke below. So you call, over and over, the way your mother calls you home: this way. This way. And they follow you out to the river.", "All around you, other hawks and eagles are diving at the fire's edge, catching the mice and rabbits running from it. You don't. Not today. Today you're busy.", wb.tc(s, r)] }) }),
        wb.when(s.sp === "bison", { label: "Wall: lead the herd onto the black", tag: "Bison", go: () => ({ text: ["Bison don't run from fire if they can help it. They're smarter than that. You remember where the fire went through first, an hour ago: the black, where nothing is left to burn. You put your head down and walk straight through the smoke toward it, and the herd follows you, and the little one follows you, through a gap in the burning grass onto the hot black ground. You stand there together while the fire roars past all around you and can't touch you."] }) }),
        wb.when(s.sp === "otter", { label: "Slip: get to the river and under the bank", tag: "River Otter", go: () => ({ text: ["You run for the river, low and fast, the little one beside you, and hit the water and pull it in after you, and swim under the cutbank where the old roots hang down. There's a pocket of air there. You stay with your noses just above the water while the fire goes over the bank and burning leaves fall hissing into the river."] }) }),
        wb.when(s.sp === "coyote", { label: "Trickster: find the gap nobody else will try", tag: "Coyote", go: () => ({ text: ["Coyotes know where the gaps are. You put your nose down and go straight into the smoke, following the coolest air and the thinnest grass. Twice the fire is so close you feel your fur singe. Once you double back. But you find it: a dry wash with sand at the bottom, where the fire can't follow. You and the little one lie in the sand and wait for it to pass."] }) }),
        wb.when(!s.stray, { label: "Find your mother's gully", check: { stat: "speed", dc: 4, bonus: r.f.together ? 1 : 0 }, go: (s, r, pass) => ({ text: ["You follow the base of the buttes through the smoke until you find it: the old gully, deep and narrow, with a trickle of water at the bottom. You go down it, all the way, to the river.", pass ? "You reach the river ahead of the flames." : "The fire reaches the top of the gully just as you reach the bottom. Burning grass rains down on you. You make it, but your coat is singed and your throat is raw.", pass ? "" : strain(s, "Smoke")] }) }),
        wb.when(!!r.f.firebreak, { label: "Run for the firebreak by the Black Road", tag: "Stray: you trusted what you knew", go: (s, r) => { s.stats.heart = Math.min(10, s.stats.heart + 1); return { text: ["You run for the Black Road. Every animal you pass is going the other way. You lie down on the bare, plowed strip with the little one beside you. The fire comes right up to the edge of the dirt. And it stops. It has nothing left to eat. On the road, a yellow truck with flashing lights goes past, spraying water.", N("<span class='dim'>(Heart +1.)</span>", "good")] }; } }),
        { label: "Just run", check: { stat: "speed", dc: 5, bonus: r.f.saw ? 1 : 0 }, go: (s, r, pass) => ({ text: pass ? ["You run, and keep running, and reach the river just ahead of the fire."] : ["The smoke is too thick. You get turned around, and the fire catches up with you at the river's edge. You make it into the water just in time. But the smell of it, the roar, the heat on your back, sink into you, deep.", addWound(s, "fire_shy")] }) }
      ]
    },
    s5: { title: "On the Black", next: (s, r) => r.f.burrNew ? "s5b" : "s6",
      text: (s, r) => P(
        `By evening, the fire has passed east toward the Black Road. Behind it, the valley is a different place. Everything is black. The buttes are black. The flats are black. The grass is just gone, burned to stubble and ash, and the ground is still smoking in a thousand places. Here and there a sagebrush is still burning, like a candle.`,
        `But the cottonwoods along the river bottoms are still standing. The fire stopped at the river. The bottoms are the only place in the whole valley that didn't burn.`,
        `One by one, your ${wb.g(s)} finds each other, coughing, singed, stunned.${wb.momIn(s) ? " Your mother." : ""}${wb.flintIn(s) ? " Old Flint, limping worse than ever." : ""}${wb.sedgeIn(s) ? " Sedge, calm as always, counting heads." : ""}`,
        r.f.burrNew
          ? P(`The little one is still with you. It's starting to understand that its mother isn't coming back. It keeps lifting its head and calling into the smoke, a small, broken call, and listening. Nothing calls back.`,
              wb.ridgeIn(s) ? "" : "",
              wb.sedgeIn(s) && D("Sedge", "It's just a baby. Let it stay, if it wants to."),
              `The little one looks up at you.`)
          : P(`Burr is gray with ash from his nose to his tail, and shaking.`, wb.trigger(s),
              `Then you try to lead him across the black ground to the river to drink. He won't go. He stops right at the edge, where the green stops and the black starts. He puts one foot on the ash and snatches it back like it bit him.`,
              wb.burrW(s).length < 2 ? wb.burrGain(s, "burr_black") : N("You walk the long way around, through the edge of the bottoms where it didn't burn. It takes twice as long.", "dim"))
      ),
      choices: (s, r) => r.f.burrNew ? [
        { label: "Let it stay", go: s => ({ text: ["You lie down, and let it lie down next to you.", wb.bond(s, "burr"), trust(s, "Burr", 1)] }) },
        { label: "Drive it off", go: s => ({ text: ["You push it away. It stumbles, stops, and lies down alone at the edge of your " + wb.g(s) + ", where it can see you. It doesn't stop calling.", trust(s, "Burr", -1)] }) }
      ] : []
    },
    s5b: { title: "Burr", next: "s6",
      text: s => P(`It sticks to you the way a burr sticks to fur. That's what you start calling it in your head. <b>Burr.</b>`, `Night comes. The ground is still warm. Burr keeps calling for his mother.`),
      choices: s => [
        { label: "Stay with Burr all night", go: s => ({ text: ["You don't sleep. Every time he calls, you make the low, soft sound your own mother made for you. Sometime before dawn, he falls asleep, still calling in his sleep.", wb.burrGain(s, "burr_calls")] }) },
        { label: `Hide Burr and go back to your ${wb.g(s)}`, go: s => ({ text: ["You settle him in a hollow under a cottonwood root and go back to your " + wb.g(s) + ". In the dark you hear him wake and find you gone. He stops calling for his mother. He calls for <b>you</b>, frantic, until he finds you again.", wb.burrGain(s, "burr_dontleave")] }) }
      ]
    },
    s6: { title: "Count the Missing", next: "s7",
      text: (s, r) => P(
        `In the morning, ${wb.sedgeIn(s) ? "Sedge" : wb.Elder(s)} counts. ${missing(r).length > 1 ? "Two are" : "One is"} missing: <b>${missingTxt(r)}</b>.`,
        r.f.m1 && !wb.ridgeIn(s) && `(Ridge isn't part of your ${wb.g(s)} anymore. But nobody has seen him since the fire.)`,
        `You remember the long grassy slope they went down. The slope that, by noon yesterday, was a river of fire.`,
        wb.momIn(s) ? D("Your mother", "We have to look for them.") : "",
        wb.sedgeIn(s) && D("Sedge", "Look where? It's all burned, for miles. The ground is still hot. If they were caught in it… I know it's hard. But we have to think about the ones who are still here."),
        `Some of the ${wb.g(s)} nod. They're tired and scared and hungry.${wb.momIn(s) ? " Your mother looks at you. She doesn't have to say anything." : ""}`
      )
    },
    s7: { title: "Bramble's Ground", next: "s8",
      text: s => P(
        `That afternoon, strangers come down to the river: ${wb.k(s)}, a big group, more than your whole ${wb.g(s)} twice over, coming out of the buttes on the far side of the river. They're sleek and well-fed. Their coats aren't singed.`,
        sx(s, { coyote: "It's the Red Butte pack, the biggest pack in the valley.", bison: "It's the Red Butte herd: Hundred Winters' herd.", pronghorn: "It's the Red Butte band, which has been growing all fall, the way the bands always join up before winter.", otter: "It's the Red Butte romp, the otter families from the big river below the valley, where there's always water.", eagle: "It's the eagles from the Red Butte cliffs: a line of neighboring ranges, all following one big, strong old eagle.", badger: "It's the badgers from the Red Butte side: a line of neighboring ranges, all following one big, strong old badger." }),
        `Their leader walks out ahead and looks across at your ${wb.g(s)}: the singed coats, the empty bellies, the black ground behind you. This is <b>Bramble</b>: big and calm and proud, with a scarred face and steady eyes.`,
        hasBurden(s, "lost_ground")
          ? P(D("Bramble", "Your ground burned. Mine didn't. You already live by my leave. Come across. Eat."), `Your ${wb.g(s)} wades across behind Bramble. There's nothing to decide. That decision was made last summer.`)
          : P(D("Bramble", "Your ground is burned. Ours isn't. The fire stopped at the river. There's food over there. Cover. Room for all of you."),
              D("Bramble", "Come across. Live with us. But this side of the river, the ground you were born on, becomes ours. For good. You'll be Red Butte now."),
              wb.sedgeIn(s) ? P(`Everyone looks at ${wb.flintIn(s) ? "Old Flint, who is too tired to answer, and then at Sedge" : "Sedge"}. Sedge looks at <b>you</b>.`, D("Sedge", "The young ones should decide. It's their future.")) : `Everyone looks at you.`)
      ),
      choices: s => hasBurden(s, "lost_ground") ? [] : [
        { label: "Accept", go: s => ({ text: ["“We'll come.” Your " + wb.g(s) + " wades across behind Bramble into the gold, unburned grass. That night, for the first time in days, your belly is full. But when you wake up and look back across the river at the black ground where you were born, it doesn't belong to you anymore.", addBurden(s, "lost_ground")] }) },
        { label: "Refuse", go: s => ({ text: ["“It's ours. We were born here. The green will come back.” Bramble looks at you a long moment, then shrugs, as much as a " + wb.k1(s) + " can shrug. “Our side stays our side. Don't cross it.” Your " + wb.g(s) + " stays on the black, hungry.", strain(s, "Hungry")] }) }
      ]
    },
    s8: { title: "Into the Burned Badlands", next: "s8b",
      text: (s, r) => P(
        `You can't stop thinking about it: <i>why did ${wb.sedgeIn(s) ? "Sedge send them that way" : "they go that way"}?</i> You get up and walk out onto the black.`,
        `It's like another world. Ash puffs up in gray clouds with every step. Stumps of sagebrush stick up like black bones. And it's silent: no birds, no insects, no wind in the grass, because there is no grass.`,
        s.flags.tattle && `A black-and-white shape drops out of the smoky sky onto a burned stump ahead of you, screaming. Tattle. Magpies love a burned field. She flies ahead, lands, screams, flies again. You follow.`,
        wb.burrHas(s, "burr_black") ? `Burr won't follow you onto the black. He stands at the edge of the green, shaking.` : wb.hasBond(s, "burr") ? `Burr gets up and follows you.` : ""
      ),
      choices: s => [
        wb.when(wb.burrHas(s, "burr_black"), { label: "Wait, and let Burr find his own way", go: s => ({ text: ["You wait. And Burr does what his wound lets him do: he finds the unburned paths. A strip of green along a gully where the fire jumped. A rocky ridge with nothing to burn. A line of wet ground by a spring. It's a crazy zigzag, but you follow him, and he never once steps on black.", trust(s, "Burr", 1)] }) }),
        wb.when(s.sp === "eagle", { label: "High Eye: search the whole slope from above", tag: "Golden Eagle", go: () => ({ text: ["Everything below is black and gray, and nothing moves, except one place: near the bottom of the slope, where a dry wash cuts deep into the hillside, a small dark shape lifts its head."] }) }),
        wb.when(s.sp === "pronghorn", { label: "Burst: run the whole slope", tag: "Pronghorn", go: () => ({ text: ["You run the slope end to end, faster than the others could walk it, and your eyes catch every movement. There: in a deep cutbank in a dry wash near the bottom, something moves."] }) }),
        wb.when(s.sp === "badger", { label: "Dig: think like a badger in a fire", tag: "Badger", go: () => ({ text: ["You know where a smart animal would go in a fire, because it's where you'd go: underground, or as close as it can get. You head for the deepest cutbank on the slope, where the dry wash has carved a cave into the hill. At its mouth, you smell your own kind."] }) }),
        { label: "Search the slope", check: { stat: "senses", dc: 4 }, go: (s, r, pass) => ({ text: pass ? [`Faint and bitter under the smoke, your own kind's scent leads you down the slope to a deep cutbank in a dry wash.`] : [`You search until your feet burn on the hot ground. You find them eventually, in a deep cutbank in a dry wash, but it costs you.`, strain(s, "Burned Feet")] }) }
      ]
    },
    s8b: { title: "The Cutbank", next: "s9",
      text: (s, r) => P(
        `They're there, pressed into the back of the cutbank under an overhang of dirt and roots.`,
        r.f.m1 ? `<b>Ridge</b> is alive. He's covered in ash, and the pads of his feet${["bison", "pronghorn"].includes(s.sp) ? " (his legs, above the hooves)" : ""} are burned raw. He can barely stand.` : "",
        r.f.m2 ? `And curled up ${r.f.m1 ? "against him" : "at the back"}, hardly moving, so thin you can count her ribs, is <b>${r.f.m2}</b>.` : "",
        r.f.m1 ? `He looks up at you. For a second you think he's going to tell you to go away. He doesn't. He just looks too tired to say anything.` : ""
      ),
      choices: (s, r) => [
        compTrust(s, "Ridge") === 0 && r.f.m1
          ? { label: "Lie down next to him and wait", check: { stat: "heart", dc: 5 }, go: (s, r, pass) => pass ? { text: ["After a long time, he starts talking."], next: "s8c" } : { text: ["Ridge won't talk to you. He just stares at the wall of the cutbank. You'll have to get them out without knowing what happened."] } }
          : { label: r.f.m1 ? "“What happened? Why did you come this way?”" : "Ask her what happened", go: () => ({ next: "s8c" }) }
      ]
    },
    s8c: { title: "The Safe Way", next: "s9",
      text: (s, r) => P(
        D(r.f.m1 || r.f.m2, wb.sedgeIn(s) ? "Sedge told us to. Sedge said it was the safe way. Said the fire would go north, over the top, and this slope would be clear. That we should go ahead, fast, because we're slow." : "Sedge told us, before Sedge was gone, that this slope was always the safe way. It wasn't."),
        D(r.f.m1 || r.f.m2, "The fire came right down it. We barely made it here. And Sedge is never wrong. About anything. That's the thing I can't stop thinking about."),
        wb.hasClue(s, "west") && `You remember the morning: Sedge pointing west, into the smoke, and laughing it off. <i>Good nose. I must have gotten turned around.</i> Sedge got turned around twice.`,
        wb.piece(s, "wrongway"),
        wb.hasPiece(s, "here") && `And you remember Bone Coulee, and the scent at the lion's door, layered over and over. You don't want to think what you're thinking.`
      )
    },
    s9: { title: "The Fire Comes Back", next: (s, r) => r.f.lost && !r.f.gave ? "s9g" : "s10",
      text: (s, r) => P(
        `You smell it before anyone else. The wind has turned, and it's carrying <i>fresh</i> smoke. When you crawl to the mouth of the cutbank, your heart stops.`,
        `The fire skipped places on its way through yesterday: patches of grass it jumped right over. Now the wind has turned and is blowing embers back over the black, and every one of those patches is catching. The slope around the cutbank is lighting up, patch after patch, and smoke is rolling down the wash toward you.`,
        `${r.f.m1 ? "Ridge can barely walk. " : ""}${r.f.m2 ? r.f.m2 + " can't walk at all." : "He can't make it on his own."}`,
        wb.hasBond(s, "burr") || wb.burrHas(s, "burr_dontleave") ? `And Burr is pressed into the back of the cutbank behind you, eyes wide.` : `And through the smoke, from up the slope, you hear Burr. He followed you after all. He's out there on the burning slope, calling.`,
        `There's an old den up the wash, dug deep into the bank. If you could get one young one into it, they'd be safe. There's only time for one.`,
        r.f.m1 ? P(`Ridge looks at you. He can see what you're seeing.`, D("Ridge", "Please.")) : ""
      ),
      choices: (s, r) => [
        { label: `Save ${v2(r)}`, tag: "Burr will be on his own", go: (s, r) => ({ text: [
          `You take ${v2(r)}. ${sx(s, { coyote: "You pick " + v2her(r) + " up by the scruff the way your mother carried you,", badger: "You drag " + v2her(r) + " by the scruff,", otter: "You drag " + v2her(r) + " by the scruff,", bison: "You push " + v2her(r) + " ahead of you, step by step,", pronghorn: "You nudge " + v2her(r) + " ahead of you, step by step,", eagle: "You can't carry anyone, so you go first and call, and show the way," })} and you get to the old den${r.f.m1 && r.f.m2 ? ", and Ridge drags himself in behind" : ""}. Then you turn around, and the slope is on fire. You can't get to Burr.`,
          `When the fire has passed, you run, and you find him. He's alive. He squeezed his head and shoulders into a tiny ground-squirrel hole and lay there while the fire went over. He's covered in ash and singed, and when you get to him he flinches away. He saw you choose.`,
          addWound(s, "smoke_throat"), trust(s, "Burr", -1), r.f.m1 ? trust(s, "Ridge", 2) : ""] }) },
        { label: "Save Burr", tag: `${v2(r)} will be on ${v2her(r) === "her" ? "her" : "his"} own`, go: (s, r) => { r.f.lost = true; return { text: [
          `You go for Burr. You get him up the wash into the old den, and go in after him, and turn around.`,
          r.f.m1 && r.f.m2 ? `Ridge is trying. He's dragging himself up the wash, pushing ${r.f.m2} with his nose, one step at a time. He's almost there. Then the smoke rolls down the wash, black and thick, and you can't see them anymore.` : `${v2(r)} is trying, dragging along the wash. Then the smoke rolls down it, black and thick, and you can't see anymore.`,
          r.f.m1 && r.f.m2 ? `When the fire has passed, you crawl out. Ridge is lying in the wash near the mouth of the den, alive. ${r.f.m2} is lying against him, and isn't moving. Ridge doesn't look at you. He doesn't make a sound.` : `When the fire has passed, you crawl out. ${v2(r)} is lying in the wash, and isn't moving.`,
          loseV2(s, r), addWound(s, "chose_too_fast"), trust(s, "Burr", 1)] }; } },
        wb.when(s.sp === "badger" || s.sp === "bison", { label: s.sp === "badger" ? "Dig: make a new den, right here, for everyone" : "Wall: get everyone onto the black and stand over them", tag: wb.X(s).name, go: (s, r) => ({ text: [
          s.sp === "badger" ? "There isn't time to reach the old den. So you make a new one. You dig deep into the back of the cutbank and pull them all in, as many as will fit, and lie across the opening with your back to the fire." : "You get them all out of the cutbank onto the black, the ground that already burned yesterday, and stand over them, a wall of fur and muscle between them and the heat, while the new fire burns in the patches all around.",
          "The heat is unbearable. You feel your coat singe and your skin blister. But you don't move. And when it's over, they're all alive. All of them.",
          addWound(s, "singed"), r.f.m1 ? trust(s, "Ridge", 2) : "", wb.tc(s, r)] }) }),
        { label: "Give in", tag: "⚠ Instinct: you survive, guaranteed", go: (s, r) => { r.f.lost = true; r.f.gave = true; return { text: [
          `The smoke rolls in, and your body takes over, and you're gone. When you come back to yourself, it's over. Burr found a hole on his own. He's alive. ${r.f.m1 && r.f.m2 ? `Ridge got himself and ${r.f.m2} back into the cutbank, but the smoke filled it. Ridge is alive. ${r.f.m2} isn't.` : `${v2(r)} isn't.`}`,
          wb.give(s, r), loseV2(s, r), addWound(s, "left_behind")] }; } }
      ]
    },
    s9g: { title: "Grief", next: "s10",
      text: (s, r) => P(r.f.m1 && r.f.m2 ? `You stay in the wash with Ridge a long time. Every once in a while he lifts his head and makes a sound you've never heard from any of your kind: low and long and broken.` : `You stay in the wash a long time.`),
      choices: (s, r) => [
        { label: r.f.m1 && r.f.m2 ? "Stay with him" : "Stay", go: s => ({ text: ["You don't say anything. You just stay. When the sun goes down, you get up and walk back toward the river." + (r.f.m1 && r.f.m2 ? " Ridge walks beside you." : ""), r.f.m1 && r.f.m2 ? trust(s, "Ridge", 1) : ""] }) },
        { label: `Call for ${v2her(r)}`, go: s => ({ text: [`You lift your head and call your ${wb.g(s)}'s call out across the black.${r.f.m1 && r.f.m2 ? " Ridge looks up, startled. Then he calls too. The two of you call together until your throats are raw." : ""}`] }) },
        { label: "Carry on", go: s => ({ text: [`You have to get Burr back to the river. You leave.${r.f.m1 && r.f.m2 ? " Ridge doesn't watch you go." : ""}`] }) }
      ]
    },
    s10: { title: "Go to Ground", next: "s11",
      text: s => P(
        hasWound(s, "smoke_throat") && `Every breath feels like breathing sand.`,
        hasWound(s, "chose_too_fast") && `You can't stop seeing it: the wash, and what you left in it.`,
        hasWound(s, "singed") && `Your skin is blistered under your burned fur. Everything hurts.`,
        hasWound(s, "left_behind") && `Nobody says it. But they all know.`,
        hasWound(s, "fire_shy") && `Every time the wind brings the smell of smoke, your legs start running before you can stop them.`,
        bookWounds(s).length ? `${wb.momIn(s) ? "Your mother" : "Ridge"} finds a place by the water, under the cutbank, where it's cool and damp and the smoke can't reach.`
          : wb.momIn(s) && wb.sedgeIn(s) ? P(`Your mother lies down beside you by the river. For a while, neither of you says anything.`, D("Your mother", "Sedge sent them that way. Didn't " + wb.she(s) + "? I've known Sedge since " + wb.she(s) + " was born. I never once saw " + wb.her(s) + " make a mistake.")) : `You lie by the river and rest a little.`
      ),
      choices: s => bookWounds(s).length ? [
        { label: "Go to ground", tag: "Heal, but lose a day", go: (s, r) => { r.f.lostDay = true; return { text: [`You lie down in the cool mud by the water, and rest.`, ...bookWounds(s).map(w => healWound(s, w)), `But while you rest, the day goes by. And that night, down in the bottoms, something screams in the dark. In the morning, the deer are one fewer.`] }; } },
        { label: "Keep moving", tag: "The wound stays", go: () => ({ text: ["There's no time."] }) }
      ] : []
    },
    s11: { title: "The Ghost in the Bottoms", next: s => wb.sedgeIn(s) ? "s12" : "s13",
      text: (s, r) => P(
        `The bottoms are crowded. Every animal in the valley that survived the fire is here now, in the narrow strip of cottonwoods and willows along the river: the only place that didn't burn. Deer in the willows. Pronghorn at the edges. Bison along the bank. Everyone hungry and tense and much too close together.`,
        `And everyone is afraid. Because last night, something hunted in the bottoms.`,
        `The fire burned the coulees, Bone Coulee all the way to the top. There's nowhere left up there to hide. So the Ghost came down. Here. To ${hasBurden(s, "lost_ground") ? "your old home range, Bramble's now" : "<i>your</i> home range"}, where every animal in the valley is crowded together.`,
        ["tricked", "burned"].includes(s.flags.ghost) || hasBurden(s, "being_hunted") ? N(`In the soft dirt at the edge of the thicket are tracks that circle the place where your ${wb.g(s)} sleeps, over and over. <i>It knows where you are.</i>`, "bad") : "",
        ["spared", "off"].includes(s.flags.ghost) && wb.played(s, "river") ? `The fire on the far bank drove it back across the river. Whatever you did last summer, it's here again now.` : ""
      ),
      choices: s => [
        wb.when(["coyote", "badger", "eagle"].includes(s.sp), { label: s.sp === "eagle" ? "High Eye: find where it lies up" : "Follow your nose to where it sleeps", tag: wb.X(s).name, go: (s, r) => lieUp(s, r) }),
        { label: "Search the bottoms for where it sleeps", check: { stat: "senses", dc: 5 }, go: (s, r, pass) => pass ? lieUp(s, r) : { text: ["You search all day and find nothing but its tracks, everywhere, crossing and recrossing the bottoms, as if it owns them now.", strain(s, "Exhausted")] } }
      ]
    },
    s12: { title: "Sedge at Dusk", next: "s13",
      text: (s, r) => P(
        `The sun goes down orange through the smoke. Dusk: the time that frightens everyone now.`,
        `And that's when you see them. At the far end of the bottoms, walking slowly along the riverbank: <b>Sedge</b>, and <b>${wb.elder(s)}</b>${wb.flintIn(s) ? ", limping" : ""}. Sedge is walking close, warm and easy, talking. You can't hear what. But you can see where they're going.`,
        `Toward the thicket. Toward the lion's door.`,
        r.f.lieup ? `You <i>know</i> what's in there.` : `You don't know for sure. But that's where all the lion's tracks lead.`,
        wb.ridgeIn(s) && compTrust(s, "Ridge") >= 2 && `Ridge is lying next to you. He's seen it too. He's looking at you, waiting.`
      ),
      choices: (s, r) => [
        { label: "Go with them", go: (s, r) => ({ text: [`You walk straight down the riverbank, fast, catch up, and fall in beside ${wb.elder(s)}, as if you just wanted company. “Can I walk with you?” Sedge stops. For one second there's nothing in ${wb.hers(s)} face at all. Then the warm smile comes back.`, D("Sedge", "Of course. Actually, it's getting dark. We should all head back."), `And Sedge turns around.`, addBurden(s, "sedge_watching"), wb.tc(s, r)] }) },
        { label: `Warn your ${wb.g(s)} out loud`, go: s => ({ text: [`You run back and tell them, right in the open: “Sedge is taking ${wb.elder(s)} to the lion's thicket. Right now.” Everybody stares at you. Then they look down the riverbank and see Sedge walking back toward them with ${wb.elder(s)}, perfectly calm.`, D("Sedge", "We were walking by the river. Why would you say something like that?"),
          wb.proof(s) >= 2 ? P(`But some of the ${wb.g(s)} are looking at Sedge now, not at you. Your ${wb.g(s)} is split right down the middle.`, addBurden(s, "split_group")) : P(`Nobody believes you. Why would they? You're the yearling who's scared of everything.`, N(`Your ${wb.g(s)} trusts you less.`, "bad"))] }) },
        { label: "Follow them quietly", go: s => ({ text: [`You slip into the willows and follow, low and downwind. Sedge walks ${wb.elder(s)} right up to the edge of the thicket. Then Sedge stops. Says something. Steps back. And walks away, back along the riverbank. Leaving ${wb.elder(s)} alone, at dusk, at the lion's door.`, `You don't wait. You burst out of the willows and get ${wb.elder(s)} moving, fast, back toward the ${wb.g(s)}. Behind you, deep in the thicket, something stirs. Then is still. You saw it. The whole thing.`, wb.clue(s, "saw"), strain(s, "Shaken")] }) },
        wb.when(wb.ridgeIn(s) && compTrust(s, "Ridge") >= 2, { label: "Look at Ridge", tag: "Ridge trusts you", go: s => ({ text: [`Neither of you says anything. You both get up, walk down the riverbank together, catch up, and walk beside ${wb.elder(s)}, one of you on each side.`, D("Sedge", "Lovely evening. Let's go back."), `Sedge doesn't know which of you to watch.`, wb.bond(s, "ridge")] }) })
      ]
    },
    s13: { title: "Fire in the Bottoms", next: "s14",
      text: (s, r) => r.f.reck ? P(`The fire is still coming. So is the cat.`) : P(
        `That night the wind turns again. You wake to the smell, and the low rushing roar, close. A line of fire is creeping down off the last unburned slope into the edge of the cottonwoods. Toward the thicket at the far end of the bottoms.`,
        `The whole bottoms come awake at once: animals running, crying, splashing into the river. And through the smoke, you see it.`,
        `The Ghost is out of its thicket, trapped. Fire behind it. The steep cutbank and the river ahead. The only open ground between runs straight past the dens, past your ${wb.g(s)}, past the young ones, past Burr.`,
        `It's pacing, back and forth. Its eyes are wild in the firelight, and its injured leg is dragging. It's as scared as anything in the valley. And it's coming this way.`,
        wb.bt(s) >= 2 && P(`Before anyone else moves, Burr calls out: the sharp, short alarm call of his own kind. Every animal near the dens hears it and turns, and sees the cat, and moves.`, N("<b>Burr's warning.</b> The young ones are already clear.", "good"))
      ),
      choices: (s, r) => [
        wb.when(wb.traitor3(s) && wb.sedgeIn(s) && !r.f.reck, { label: "The reckoning: tell your " + wb.g(s) + " everything", tag: "You have all three pieces", go: (s, r) => { r.f.reck = true; s.flags.sedge = "exposed"; return { text: [
          `You turn away from the fire and the cat, face your ${wb.g(s)}, and tell them all of it. The lion's door at Bone Coulee, the scent laid over and over. Ridge and Wisp, sent down the slope into the fire. The torn-claw tracks in the snow.`,
          `You don't have to say whose. Everyone has seen that crooked front foot their whole lives. Every head turns, slowly, to Sedge. Sedge doesn't argue. Sedge just looks at you, and for the first time there's nothing warm in ${wb.hers(s)} eyes at all. Then Sedge walks out of the firelight, away from your ${wb.g(s)}, and doesn't come back.`,
          addBurden(s, "sedge_out"), wb.tc(s, r), N("The cat is still coming. Choose what you do next.", "mark")], next: "s13" }; } }),
        wb.when(wb.legend(s, 2) && s.stats.heart >= 6, { label: "Show it the way out", tag: "Rare", go: (s, r) => ({ text: [
          `You walk toward it. Not to fight. You walk to the edge of the smoke, where it can see you, and stop. It stops pacing.`,
          `Then you walk away from it, slowly, not toward the dens but along the very edge of the fire, where the grass has already burned out, onto the black. The ground is hot under your feet. You keep walking. And behind you, out of the smoke, it follows.`,
          `You walk it out past the bottoms into the burned badlands, a long way, toward the empty way back to the buttes. Then you stop, and it walks past you, close enough to see the ash on its coat and the old scar on its leg. It looks at you one more time. Then it goes.`,
          wb.ghost(s, "spared"), wb.tc(s, r)] }) }),
        { label: "Drive it into the river", tag: (s.sp === "bison" || wb.hw(s)) ? (s.sp === "bison" ? "Bison" : "Hundred Winters respects you") : "Heart check", check: (s.sp === "bison" || wb.hw(s)) ? null : { stat: "heart", dc: 5, tags: ["smoke"] }, go: (s, r, pass) => pass ? { text: [
          s.sp === "bison" ? "You bellow the herd's call." : "You run to the bison crowded along the riverbank and make every alarm call you know.",
          wb.hw(s) ? "And Hundred Winters hears." : "",
          `The bison close ranks: a wall of horns and shoulders between the cat and the dens. The Ghost stops. Fire behind. Wall ahead. River to its side. It goes over the cutbank into the water and swims hard to the far bank and is gone into the dark.`,
          wb.ghost(s, "off")] } : { text: ["You run for the bison, but they're already scattering in the smoke. The cat comes out past the dens on its own, burned and desperate, and disappears toward the buttes.", wb.ghost(s, "burned")] } },
        wb.when(s.sp === "coyote" || s.stats.cunning >= 6, { label: "Trick it away", tag: s.sp === "coyote" ? "Coyote: Trickster" : "Cunning 6+", go: s => ({ text: [`You run out into the open right in front of it, yelp, and run, away from the dens, along the edge of the fire, out onto the black and into the badlands, with the Ghost behind you. You lose it in the dark at the top of the burned buttes.`, wb.ghost(s, "tricked"), addBurden(s, "being_hunted")] }) }),
        { label: "Leave it. Let the fire decide.", go: s => ({ text: [`You get your ${wb.g(s)} and Burr into the river and stay there, in the cold water, all night. You hear things you will never forget. In the morning, the cat's tracks go out of the thicket, through the edge of the fire, toward the buttes. Some of them are smeared, as if it was dragging its own paws. Burned.`, wb.ghost(s, "burned"), strain(s, "Can't Stop Hearing It")] }) },
        { label: "Stand alone between it and the dens", go: s => ({ text: [`You plant yourself between the open ground and the dens and face it. ${sx(s, { coyote: "Snarling.", bison: "Head down, horns out.", pronghorn: "Stamping, snorting, every hair standing.", eagle: "Wings wide, screaming.", otter: "Shrieking, back arched.", badger: "Hissing, huge, claws out." })} In the firelight it looks at you: smoke, fire, pale gold eyes. Then it turns aside, over the cutbank, into the river.`, wb.ghost(s, "off"), addWound(s, "eyes_smoke")] }) },
        { label: "Give in", tag: "⚠ Instinct: you survive, guaranteed", go: (s, r) => ({ text: [`You run, or fight, or hide, and you don't know what happens to anyone else until morning. In the morning the Ghost is gone, and so is one of the deer from the willows by the dens. Every animal in the bottoms is fighting now: over cover, over grass, over water.`, wb.give(s, r), addBurden(s, "no_peace")] }) },
        wb.when(wb.legend(s, 4), { label: "Stand, and see who stands with you", tag: "Very rare", go: (s, r) => { s.flags.hw = true; return { text: [`You walk to the open ground and stand there. And one by one, out of the smoke, they come and stand with you: your ${wb.g(s)}, the bison, the pronghorn, the deer, the coyotes. A whole valley of animals in a line between the fire and the young ones. The Ghost looks at all of you. Then it goes over the cutbank, into the river, and away.`, wb.ghost(s, "off"), N("<b>Awakening.</b>", "mark")] }; } })
      ]
    },
    s14: { title: "The First Green", next: "END",
      text: (s, r) => P(
        `Three days later, it rains. Real rain, soft and steady, all night and all the next day. You stand out in it with your face turned up and let it wash the ash out of your coat until the water running off you is clear.`,
        `A week after that, you walk out onto the black and stop, amazed. It's green. All across the burned slopes, tiny green shoots are pushing up through the ash. The roots were alive the whole time, deep underground, where the fire couldn't reach. They were just waiting for the rain.`,
        `The bison are already out on it, grazing the new green with their heads down, as happy as you've ever seen bison look. Somewhere, a meadowlark is singing.`,
        wb.burrHas(s, "burr_black") && `Burr stands at the edge of the burned ground, where he always stops. He looks at the green coming up through the black.`,
        r.f.m1 && r.f.m2 && wb.wispIn(s) && `At the edge of the green, Ridge is lying in the sun, and Wisp is nibbling the new grass beside him, stronger than you've ever seen her. When Ridge sees you, he doesn't look away.`,
        r.f.lost && r.f.m1 && wb.ridgeAlive(s) && `Ridge is out on the far edge of the green, alone. He comes every day. He just lies there, where the slope comes down to the wash.`,
        wb.sedgeIn(s) && `At the edge of the cottonwoods, Sedge is watching you, the way ${wb.she(s)} always does now.`
      ),
      choices: s => [
        wb.when(wb.burrHas(s, "burr_black"), { label: "Walk him out onto the green", go: s => ({ text: ["You step out onto the green-and-black ground and wait. Burr stares at you, then at the green. One foot. Another. Then he's beside you in the new grass, sniffing it, looking around like he's never seen the world before. Maybe he hasn't. Not like this.", wb.burrHeal(s, "burr_black"), trust(s, "Burr", 1)] }) }),
        { label: "Stay close", go: s => ({ text: ["You lie down in the new grass, and Burr lies down beside you, and you watch the bison graze until the sun goes down.", wb.bond(s, "burr"), wb.stood(s, "burr"), trust(s, "Burr", 1)] }) },
        { label: "Go, and come back", go: s => ({ text: ["You walk off across the green, and Burr panics, and you turn around and come back. Again. And again. The last time, he just watches.", wb.burrHeal(s, "burr_dontleave"), trust(s, "Burr", 1)] }) }
      ]
    }
  }
});
function bookWounds(s) { return ["smoke_throat", "chose_too_fast", "singed", "left_behind", "fire_shy"].filter(w => hasWound(s, w)); }
function loseV2(s, r) {
  const v = v2(r);
  if (v === "Wisp") { s.flags.wisp = "lost"; return N("Wisp is lost.", "bad"); }
  if (v === "Ridge") { s.flags.ridge = "lost"; return wb.lose(s, "ridge") + N("Ridge is lost.", "bad"); }
  return N(`${v} is lost.`, "bad");
}
function lieUp(s, r) {
  r.f.lieup = true;
  const had = wb.hasPiece(s, "here");
  return { text: [
    `You find it. Deep in a thicket of buffaloberry and wild rose at the far end of the bottoms, where the brush is so thick nothing bigger than a rabbit could get through: a hollow pressed into the leaves. A big one. <i>It's sleeping here.</i>`,
    had ? `At the edge of the thicket the smell hits you, and you go cold all over. You've smelled this before, at the mouth of Bone Coulee: your own kind's scent, layered over the lion's. <i>Somebody followed it here.</i> Somebody found its new door, just like the old one.`
        : P(`At the edge of the thicket, there's another smell mixed with the lion's: <b>${wb.k(s)}</b>. Your own kind. Again and again, old and new, each layer right on top of the lion's scent from a hunt. As if someone came to the lion's door, every time, just before it went out to kill.`, wb.piece(s, "here"))
  ] };
}
})();
</script>

<script>
/* ===== Wildborn Book 03 — The First Hard Snow ===== */
(function () {
const sx = (s, m) => m[s.sp];
const B = s => wb.bk(s);
const walker = (s, r) => r.f.walker;
const Walker = (s, r) => r.f.walker[0].toUpperCase() + r.f.walker.slice(1);
const weak = (s, r) => r.f.weak;
const Weak = (s, r) => r.f.weak[0].toUpperCase() + r.f.weak.slice(1);
EF.books.push({
  id: "snow", series: "wild", title: "The First Hard Snow", where: "The cottonwood bottoms", starting: true,
  blurb: "An early blizzard drives every animal in the valley into the river bottoms. Then animals start vanishing at dusk, and the tracks in the snow don't add up.",
  recommend: s => s.done.length === 0 ? "Snow and secrets" : null,
  ros: [
    ["Bison face into a blizzard instead of turning away from it.", true, "Their huge heads and thick woolly fronts are built to face the wind."],
    ["Coyotes can hear mice moving under the snow.", true, "They listen, then leap high and pounce straight down."],
    ["Badgers sleep through the whole winter without ever waking up.", false, "Badgers sleep for days at a time in deep cold, but they wake up and come out on warmer days."],
    ["Fences can trap pronghorn in deep snow.", true, "Pronghorn won't jump fences, and in storms they can get stuck against them."],
    ["River otters slide on snow and ice.", true, "It's a fast way to travel, and they seem to enjoy it."],
    ["In very deep cold, trees can crack with a loud bang.", true, "Water in the wood freezes and expands until the tree splits."]
  ],
  start: "s1",
  setup: (s, r) => {
    r.f.burrNew = !s.flags.burr;
    if (!r.f.burrNew) s.comp.Burr.travel = true;
    ensureComp(s, "Ridge", 1);
    if (!s.flags.ghost) s.flags.ghost = "hunting";
    r.f.walker = wb.flintIn(s) ? "Old Flint" : wb.momIn(s) ? "your mother" : (wb.ridgeAlive(s) && wb.ridgeIn(s)) ? "Ridge" : `an old ${wb.k1(s)} of your ${wb.g(s)}`;
    r.f.weak = wb.wispIn(s) ? "Wisp" : wb.momIn(s) ? "your mother" : `an old ${wb.k1(s)} of your ${wb.g(s)}`;
    r.f.wk = s.sp === "eagle";
  },
  resultsExtra: (s, r) => {
    const next = [];
    if (!wb.sedgeIn(s)) next.push("<b>Sedge Is Out There:</b> Sedge is gone from your group. Not gone from the valley.");
    if (hasBurden(s, "sedge_knows")) next.push("<b>The Leader's Place:</b> Sedge knows you know. Something has to give.");
    if (hasBurden(s, "ranch_dogs")) next.push("<b>The Ranch Past the Fence:</b> The dogs know your scent now.");
    if (s.flags.ghost === "spared") next.push("<b>Over the River:</b> The Ghost is up at the far end of the valley, alive.");
    next.push("<b>The Green Year:</b> Spring is coming.");
    return wb.results(s, r, next, "You can also play <b>The Summer the River Dropped</b> or <b>Smoke on the Buttes</b> (next year).");
  },
  scenes: {
    s1: { title: "The Last Warm Day", next: "s2",
      text: (s, r) => P(
        `It's December, and it shouldn't be this warm. A soft wind is blowing up the valley from the south, warm as spring. Last week's thin snow is melting off the buttes, and water drips from the cottonwood branches.`,
        `Your ${wb.g(s)} is in the bottoms, where you always spend the winter: the long, sheltered strip of cottonwoods and willows along the river, out of the wind.`,
        wb.played(s, "smoke") ? `The black ground from the fire is buried under a thin skin of snow now, and the new green that came up after the rain has gone brown. But the roots are there. You know they are.` : `It was a hard year in the valley: a drought all summer, a fire on the buttes in the fall. Everyone is thinner than they should be, going into winter.`,
        sx(s, {
          coyote: "You're a coyote, and you've been hunting mice all fall in the dry grass. You might be the best mouser in your pack. You might be a little proud of it.",
          bison: "You're a bison, and your winter coat is all the way in: thick and dark and woolly across your huge shoulders. Bison were made for cold.",
          pronghorn: "You're a pronghorn, and every fall the bands drift together into one big herd for winter. There are hundreds of you now on the flats above the bottoms. Your coat is full of hollow hairs that trap warmth.",
          eagle: "You're a golden eagle, and your second-year feathers are coming in. Winter is when eagles find the most food: animals that didn't make it. It isn't pretty. It's how the valley works.",
          otter: "You're a river otter, and winter is fine by you. The river freezes on top, but underneath it's still running, and the fish are still there.",
          badger: "You're a badger, and lately you've been sleeping more. A day at a time. Two days. Your body just wants to stay down there in the dark, slow and warm. Today you woke up hungry and came out into the warm wind."
        }),
        !r.f.burrNew && `Burr is curled up beside you. He's almost half grown now, but in the cold he still sleeps pressed right against your side.`,
        `<b>Thistle</b> is complaining again. Thistle is the oldest one in your ${wb.g(s)}${wb.flintIn(s) ? " after Old Flint" : ""}: thin and gray, with a sharp tongue and sharper eyes. She grumbles at everyone, but most of all at Sedge.`,
        D("Thistle", "Look at it. Warm wind and a ring around the sun. My grandmother would have been digging in already. But I suppose <i>some</i> of us know better than my grandmother."),
        wb.sedgeIn(s) && D("Sedge", "(without opening " + wb.hers(s) + " eyes) It's a beautiful day, Thistle. Enjoy it."),
        wb.sedgeIn(s) && `Thistle stalks off. Sedge gets up, stretches, and walks to the river. In the soft snow by the water, ${wb.hers(s)} tracks are clear: big, steady, even. Except one. One front foot leaves a strange print, with a gap where a claw should be and a crooked toe beside it. An old injury. You've seen it all your life.`,
        wb.sedgeIn(s) && wb.played(s, "smoke") && `You remember the morning of the fire: Sedge on a rock, pointing west, into the smoke. You look at that crooked foot for a long time.`
      )
    },
    s2: { title: "The Storm", next: s => s.sp === "pronghorn" ? "s2p" : "s2b",
      text: s => P(
        `It starts that night. First the warm wind stops. Then it comes back from the north, so cold it hurts. Then, out of the black sky, the snow: hard and small and stinging, and it doesn't fall. It <i>flies</i>, sideways, on a wind that screams down the valley. In minutes you can't see the cottonwoods. In an hour you can't see your own feet.`,
        `A <b>blizzard</b>. The real thing. And your ${wb.g(s)} is caught out in it.`,
        sx(s, {
          bison: "Every other animal turns its back to the wind and runs from it. Not bison. You do what bison have done for a million years on the open prairie: you turn around and put your huge woolly head right into the wind, and face it. Step by step, with the herd beside you, you walk <i>into</i> the storm, toward the bottoms.",
          pronghorn: "The wind pushes the herd, and the herd goes with it, drifting south across the flats in a long running line, because that's what pronghorn do in a storm. Then the herd stops all at once, animals crashing into each other in the whiteout, crying out. It's the <b>Long Fence</b>. The snow has drifted against it, deep and hard, and the gap under the bottom wire is buried. Pronghorn are piling up along the wire. You know, deep down, that animals die at fences like this in storms like this.",
          otter: "You find the river by the sound of water under the ice, find a hole where the current runs fast, and dive through. Under the ice it's dark and cold and completely calm. You swim along under it toward the bottoms, coming up at the air holes to breathe, while the storm screams overhead.",
          eagle: "You can't fly in this. Nothing can. You find a crack in the cliff face at the edge of the bottoms, push yourself in as deep as you can go, puff your feathers up, and wait.",
          badger: "You dig down, deep, into the side of a cutbank, until the wind is just a hum, far away. Then you curl up in the dark and let your body do what it's been wanting to do all month. You sleep.",
          coyote: "You find a hollow in the snow behind a sagebrush and curl up nose-to-tail, your thick tail over your face, and the snow covers you like a blanket. But your pack is scattered."
        })
      ),
      choices: s => s.sp === "pronghorn" ? [] : []
    },
    s2p: { title: "The Long Fence", next: "s2b",
      text: s => P(`You have to find a way through, or around.`),
      choices: s => [
        { label: "Search along the wire for a gap", check: { stat: "senses", dc: 4, tags: ["cold"] }, go: (s, r, pass) => fenceOut(s, r, pass) },
        { label: "Run the fence line, fast", check: { stat: "speed", dc: 4, tags: ["cold"] }, go: (s, r, pass) => fenceOut(s, r, pass) }
      ]
    },
    s2b: { title: "Into the White", next: "s3",
      text: (s, r) => P(
        r.f.burrNew && P(
          `Out of the white, something stumbles into you. It's a <b>${B(s)}</b>, born this spring, half grown, its coat crusted with ice. It's lost. It's been walking blind into the storm, calling, and nobody has answered.`,
          s.sp === "eagle" && `(It's a young magpie. It blew into your crack in the cliff like a leaf and lies there, beak open, too cold to move.)`,
          `You know what happened without seeing it. When the storm started, its mother went out into the whiteout to find food or shelter. And she didn't come back. In storms like this, animals don't. It presses against you, shaking. You're the only warm thing it's found all night.`),
        `Somewhere in the storm, you hear your ${wb.g(s)}'s call: faint, scattered, frightened.`,
        wb.panel(s, true, sx(s, { coyote: "Curl up where you are and don't move until it's over.", pronghorn: "Curl up where you are and don't move until it's over.", bison: "Brace. Hold your ground. Don't move one step, no matter who's calling.", eagle: "Brace. Hold your ground. Don't move one step, no matter who's calling.", badger: "Stay down. Sleep. Don't move, no matter who's calling.", otter: "Stay under the ice, in the calm dark, until it's over." }))
      ),
      onEnter: (s, r) => { if (r.f.burrNew) wb.burrSet(s, 1); return ""; },
      choices: s => [
        { label: "Give in", tag: "⚠ Instinct: you survive, guaranteed", go: (s, r) => ({ text: [`You stay where you are. You're safe. When the storm finally ends, three days later, you come out and find your ${wb.g(s)} scattered all over the bottoms. They all made it. But you weren't there.`, wb.give(s, r)] }) },
        { label: "Fight it: go out and find them", check: { stat: "heart", dc: 5, bonus: s.sp === "bison" ? 1 : 0, tags: ["cold"] }, go: (s, r, pass) => {
          if (pass) { s.stats.heart = Math.min(10, s.stats.heart + 1); return { text: [`You get up. You go out into the white, toward the calls, and call back, over and over, until they come to you one by one out of the storm. Then you lead them, slowly, to the shelter of the bottoms.`, N(`Your ${wb.g(s)} stays together. <span class='dim'>(Heart +1.)</span>`, "good"), wb.tc(s, r)] }; }
          return { text: [`You get up and go into the storm. But the wind knocks you flat, again and again, and you have to dig in where you are.`, strain(s, "Frozen")] };
        } }
      ]
    },
    s3: { title: "The Bottoms", next: (s, r) => r.f.burrNew ? "s3b" : "s3d",
      text: (s, r) => P(
        `The storm lasts three days. When it ends, the sky is a hard, perfect blue, the sun is blinding on the snow, and it's so cold the air seems to sparkle.`,
        `The bottoms are crowded. Every animal that made it through is here: deer in the willows, bison along the bank, pronghorn at the edges, coyotes, a few badgers, otters in the open water at the bend. Everyone is quiet. Everyone is hungry.`,
        !s.stray ? P(
          `Your ${wb.momIn(s) ? "mother" : wb.g(s)} leads the way to the place your ${wb.g(s)} always shelters in winter: a deep, curving bank with a wall of dirt and roots on the north side that blocks the wind. The best shelter in the valley.`,
          `There are ${wb.k(s)} already in it: <b>Bramble's ${wb.g(s)}</b>, from the Red Buttes, big and well fed, lying all along the bank.`,
          hasBurden(s, "lost_ground") && `(Your ${wb.g(s)} lives under Bramble now. And Bramble is giving the best shelter to Bramble's own.)`,
          D("Bramble", "It's taken."))
        : P(`Your ${wb.g(s)} finds a place to shelter in the willows. But you're thinking about something else. When you lived with the humans, you heard them talk about the ranch past the Long Fence, where they put out <b>hay</b> for their cattle, and where the water in a big metal tank never freezes because they keep a heater in it. The haystacks are there right now, under the snow. You also know about the dogs.`)
      ),
      choices: s => !s.stray ? [
        { label: "Push for it", check: { stat: "strength", dc: 6, bonus: s.sp === "bison" ? 2 : 0 }, go: (s, r, pass) => ({ text: pass ? ["You walk up to Bramble and stand there and don't back down. After a long moment, Bramble moves over, and lets your " + wb.g(s) + " into the far end of the bank."] : ["Bramble shoves you back, hard, and you go sprawling in the snow. Your " + wb.g(s) + " shelters in the open.", strain(s, "Bruised"), (r.f.open = true, "")] }) },
        { label: "Ask to share", check: { stat: "heart", dc: 5, bonus: hasTrait(s, "Peacemaker") ? 1 : 0 }, go: (s, r, pass) => ({ text: pass ? ["“There's room for all of us at the back. We'll keep each other warm.” Bramble grunts, then moves over. Your " + wb.g(s) + " squeezes in at the far end."] : ["“No.” Your " + wb.g(s) + " shelters in the open.", (r.f.open = true, "")] }) },
        { label: "Find another place", go: (s, r) => { r.f.open = true; return { text: ["You lead your " + wb.g(s) + " down the river to a shallow bank that's half as good. It'll have to do.", strain(s, "Cold")] }; } }
      ] : []
    },
    s3b: { title: "The First Night", next: "s3c",
      text: s => P(
        `That first night in the bottoms, the ${B(s)} won't leave you. It's calling for its mother: a small, broken call, over and over, into the cold.`,
        wb.ridgeIn(s) && D("Ridge", "Make it be quiet. It'll bring the cat."),
        wb.sedgeIn(s) && D("Sedge", "It's just a baby. Let it stay.")
      ),
      choices: s => [
        { label: "Let it stay", go: s => ({ text: ["You let it press in against you, out of the wind.", wb.bond(s, "burr"), trust(s, "Burr", 1)] }) },
        { label: "Drive it off", go: s => ({ text: ["It lies down alone in the snow at the edge of your " + wb.g(s) + ", and keeps calling.", trust(s, "Burr", -1)] }) }
      ]
    },
    s3c: { title: "Burr", next: "s4",
      text: s => P(`It sticks to you the way a burr sticks to fur. <b>Burr.</b>`),
      choices: s => [
        { label: "Stay with Burr all night", go: s => ({ text: ["You lie against him all night so he can feel your warmth, and every time he calls, you make the low sound. Before dawn he's asleep.", wb.burrGain(s, "burr_calls")] }) },
        { label: `Hide Burr and go back to your ${wb.g(s)}`, go: s => ({ text: ["You dig him a hollow in the snow under the roots and leave him there. In the dark he wakes and finds you gone, and calls for <b>you</b>.", wb.burrGain(s, "burr_dontleave")] }) }
      ]
    },
    s3d: { title: "The Wind", next: "s4",
      text: s => P(
        `That first night in the bottoms, the wind comes up again: not a storm, just a hard, cold wind howling through the cottonwoods. And Burr freezes.`,
        `He's standing at the edge of the shelter, and the wind hits him, and he just stops. He doesn't shiver. He doesn't blink. He stares into the dark with his whole body locked, like a rabbit when a hawk goes over, and he won't move, not when you call, not when you nudge him. You have to stand between him and the wind a long time before he blinks and lets you lead him in.`,
        wb.burrW(s).length < 2 ? wb.burrGain(s, "burr_frozen") : "",
        wb.trigger(s)
      )
    },
    s4: { title: "Snowbound", next: "s5",
      text: (s, r) => P(
        `For three days after the storm, it gets colder every day. The snow is deep${s.sp === "bison" ? " (past the calves' chests)" : ", past your knees"}. The grass is buried. The ground is frozen hard as rock. And Burr has to eat too. He's too young to find enough on his own.`,
        sx(s, {
          coyote: "You stand perfectly still at the edge of a meadow, and listen. Under the snow there are tunnels where mice and voles live all winter. Nobody can see them. But you can hear them. Tiny scratching, a body-length ahead. You turn your head back and forth until you know exactly where it is. Then you leap straight up, high, and come down nose-first into the snow, and when you come up, you've got it. Again. And again. You bring the last two back for Burr.",
          bison: "You put your huge head down into the snow and swing it, side to side, like a plow, sweeping until you've cleared a patch of brown grass. You eat. You sweep again. Behind you, smaller animals follow the path you've cleared: a few deer, a pronghorn, Burr.",
          pronghorn: "The grass is too deep, but the sagebrush on the flats sticks up out of the snow, gray-green and bitter. Pronghorn can eat sagebrush all winter; most animals can't. You paw through the drifts with your sharp hooves to the low branches, and eat. You show Burr how to paw for food.",
          otter: "You find a hole in the ice at the bend, where the current runs too fast to freeze, and dive. Under the ice the fish are slow in the cold. You catch one, two, three, and bring them up onto the ice, and slide back to the hole on your belly, the fast way, the fun way. You find willow bark at the bank for Burr.",
          eagle: "You fly out over the valley in the hard blue cold, looking. Winter kills. It always has. At the far end of the valley, half-buried in a drift, you find a deer that didn't make it through the storm. You eat. It isn't pretty. You remember where it is.",
          badger: "You wake in your burrow, deep in the cutbank. You don't know how long you've been asleep. Days, maybe. You're so hungry it hurts. You dig sideways through the frozen dirt, following a smell, and there, curled up tight in a little round chamber, is a ground squirrel, fast asleep. When you finally come up into the light, your " + wb.g(s) + " stares at you like you came back from the dead."
        }),
        s.flags.tattle && s.sp !== "eagle" && P(`Tattle shows up, screaming, fat from somewhere. You follow her for the scraps, and she leads you to the far end of the valley, where a deer the storm killed lies half-buried in a drift. You remember where it is.`, (r.f.wk = true, ""))
      )
    },
    s5: { title: "The First Vanishing", next: "s6",
      text: s => P(
        `On the third day after the storm, at dusk, Thistle is gone.`,
        `Nobody saw her go. She was there at midday, grumbling about the cold and the crowding. Then the sun went down, gold and red on the snow, and when your ${wb.g(s)} gathered for the night, she wasn't there. You call for her. Your whole ${wb.g(s)} calls. Nothing calls back.`,
        wb.sedgeIn(s) && D("Sedge", "(quietly, sadly) She went out to find food. She was old. She was hungry. The cold got her. It happens in winter. We all know it does."),
        `Everyone nods. It's true. It does happen. But you're thinking about Thistle at midday, squinting at the sky. Thistle, who knew everything about storms and cold.`,
        wb.flintIn(s) && `Old Flint lies apart from the ${wb.g(s)} that night, and doesn't sleep. When you look over, ${wb.she(s)}'s watching Sedge.`
      ),
      choices: s => [
        { label: "Think about it", check: { stat: "senses", dc: 4, bonus: hasTrait(s, "Watcher") ? 1 : 0 }, go: (s, r, pass) => ({ text: pass ? ["It isn't storming. The wind is calm. It's cold, but not the killing cold of the storm. <i>Why would Thistle, of all of them, go out alone, at dusk, on a calm night, when there was nowhere to go?</i>", wb.clue(s, "cold")] : ["You lie down with your " + wb.g(s) + " and try to sleep. Poor Thistle. But something keeps bothering you."] }) }
      ]
    },
    s6: { title: "The Tracks", next: "s7",
      text: s => P(
        `In the morning, you go looking for her. And here's the thing about snow: it tells you everything. Every animal that walked through the bottoms last night wrote its story there. The deer, stepping careful through the willows. A rabbit bounding in long jumps. A fox trotting in a straight line.`,
        s.sp === "coyote" && `You read tracks better than anyone. Coyotes have to.`,
        s.sp === "badger" && `You don't even need your eyes. Your nose tells you everything the snow does, and more.`,
        `You find Thistle's tracks at the edge of the shelter: small, light, a little uneven, because her back leg is stiff in the cold. You follow them out of the bottoms toward a frozen side-creek where the willows grow thick.`,
        `They aren't alone. Right beside them, side by side, step for step, there's another set. Your own kind. Bigger. Steady. Walking right next to Thistle, close, the way you'd walk with a friend.`,
        wb.piece(s, "together"),
        `At the edge of the willows, the second set stops. Turns around. And walks back toward the bottoms. Alone. Thistle's tracks go on a little way into the willows. And then the snow is churned, pushed up, torn, and there are other tracks: huge, round, no claw marks, as wide as your whole face. You don't follow those. You don't have to.`,
        `You turn around and make yourself look closely at the tracks that walked Thistle out here and walked home alone.`
      ),
      choices: s => [
        wb.when(s.sp === "coyote" || s.sp === "badger" || s.stats.senses >= 6, { label: "Read the tracks that came back", tag: s.sp === "coyote" ? "Coyote" : s.sp === "badger" ? "Badger" : "Senses 6+", go: (s, r) => clawFound(s) }),
        { label: "Look closely at the tracks that came back", check: { stat: "cunning", dc: 5 }, go: (s, r, pass) => pass ? clawFound(s) : { text: ["They're just tracks: your own kind, walking out with Thistle and walking back. Someone must have walked with her a way and turned back when she wouldn't come home. That's all. But it doesn't feel like all."] } }
      ]
    },
    s7: { title: "Food Now, Danger Later", next: "s8",
      text: s => P(
        `By the end of the week, everyone is starving. Whatever you found after the storm is gone, and everyone in the bottoms is getting thinner, slower and meaner. Burr is hungry all the time. And then you find it.`,
        ["coyote", "badger", "eagle"].includes(s.sp)
          ? `At the edge of the bottoms, in a hollow under a fallen cottonwood, there's a low mound in the snow. It smells like meat. You dig, carefully: a deer, half-eaten, with snow and leaves and sticks pushed over it. <i>Hidden.</i> Big cats bury what they can't finish and come back for it. <b>This is the Ghost's food.</b> There's enough here for you and Burr for days. But when the Ghost comes back, it will smell you on it. It will know exactly who took it.`
          : P(s.stray ? `You remember the ranch.` : `Tattle has been flying out past the Long Fence every morning and coming back fat. You follow her one day.`,
              `It's the <b>ranch</b>, past the Long Fence at the edge of the valley.`,
              s.sp === "otter" ? `There's a dam across the creek where the humans keep a pond for their cattle. Below it, where the water comes out, it never freezes, and the fish gather in the open water by the hundreds.` : `There are huge round <b>hay bales</b> stacked behind a fence by the barns, with snow on top: golden, sweet-smelling hay, enough to feed a whole herd for a week. The fence is low on one side, where the snow has drifted against it.`,
              `And there are dogs: two big ranch dogs, one black and one gray, lying on the porch of the house, watching.${s.stray ? " You know about dogs. They're not like coyotes. They don't give up." : ""}`)
      ),
      choices: s => ["coyote", "badger", "eagle"].includes(s.sp) ? [
        { label: "Eat", go: s => ({ text: ["You eat until your belly is tight, and bring Burr, and he eats too. Then you push the snow back over it and go, fast. That night, at the edge of the bottoms, something stops where you were, and sniffs, for a long time.", addBurden(s, "being_hunted")] }) },
        { label: "Leave it", go: s => ({ text: ["You push the snow back over it and walk away, hungry. Nothing follows you.", strain(s, "Hungry")] }) }
      ] : [
        { label: "Go in at dawn", check: s.sp === "otter" ? { stat: "cunning", dc: 4, bonus: s.stray ? 1 : 0 } : { stat: "speed", dc: 4, bonus: s.stray ? 1 : 0 }, go: (s, r, pass) => ({ text: [pass ? "You eat fast, as much as you can, and bring Burr, and you're gone before the dogs come off the porch." : "You're halfway through your first mouthful when the dogs come off the porch, barking, and chase you all the way to the Long Fence. You get away. Barely.", "Either way, they know your scent now.", addBurden(s, "ranch_dogs")] }) },
        { label: "Stay away", go: s => ({ text: ["You turn around and go back to the bottoms, hungry.", strain(s, "Hungry")] }) }
      ]
    },
    s8: { title: "The Coldest Night", next: (s, r) => r.f.lost && !r.f.gave ? "s8g" : "s9",
      text: (s, r) => P(
        `That night the cold drops in a way it hasn't yet. It drops and keeps dropping, and somewhere in the cottonwoods there's a sound like a stick breaking. Then a loud, sharp <b>CRACK</b>, like the sky splitting. It's the trees. It's so cold the trees are cracking.`,
        `Every breath burns all the way down. The snow squeaks when anything moves. Your ${wb.g(s)} is pressed together in the lee of the bank, sharing warmth. Nobody sleeps.`,
        r.f.open && `And your ${wb.g(s)} doesn't have the good bank. You're in the open, with only the willows to stop the wind.`,
        `There's one place, right against the bank under an overhang of frozen roots, where the wind can't reach at all. It's just big enough for you, and one more pressed against you, sharing your warmth.`,
        `Burr is shaking so hard you can hear his teeth.${wb.burrHas(s, "burr_frozen") ? " And he's gone still. Completely still, staring at nothing, the way he does in the wind." : ""}`,
        `And ${weak(s, r)} is shaking too.`,
        r.f.weak === "Wisp" ? `Wisp has never been strong. Every winter night she gets weaker.${wb.ridgeAlive(s) ? " Ridge is pressed against her, trying to keep her warm, but he's shaking too. He looks at the warm place under the roots. Then at you." : ""}`
          : r.f.weak === "your mother" ? `Your mother is old. You never really noticed it until this winter. She's thinner than you've ever seen her, and her breath is slow and shallow, and when you press your nose to her coat, she's cold. Too cold.` : `${Weak(s, r)} is old and thin and too cold.`,
        `There's room for one more in the warm place. You know what happens to animals that get too cold on a night like this.`
      ),
      choices: (s, r) => [
        { label: "Warm Burr", go: (s, r) => { r.f.lost = true; return { text: [`You take Burr into the warm place and curl around him and hold him there all night, until he stops shaking and his breathing goes slow and deep. When the sun comes up, gray and cold, you go to ${weak(s, r)}. ${r.f.weak === "Wisp" && wb.ridgeAlive(s) ? "Ridge is lying against her, the way he was last night. He hasn't moved. Wisp hasn't either." : r.f.weak === "your mother" ? "She's lying where she lay last night, curled in the snow. She looks like she's sleeping. She isn't." : "They aren't moving."}`, loseWeak(s, r), addWound(s, "long_night"), trust(s, "Burr", 1)] }; } },
        { label: `Warm ${weak(s, r)}`, go: (s, r) => ({ text: [`You bring ${weak(s, r)} into the warm place and hold on all night. Burr lies outside, pressed against your back, as close as he can get, curled in the snow. You feel him shaking through the night. Toward dawn he stops shaking, and you think the worst. Then he coughs, and lifts his head, and looks at you. He made it. Barely. But he spent the coldest night of his life outside, while you held someone else.`, addWound(s, "frostbitten"), wb.burrW(s).length ? N("Burr's wound deepens.", "bad") : "", trust(s, "Burr", -1)] }) },
