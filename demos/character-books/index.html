    s2b: { title: "Something on the Wind", next: "s3",
      text: s => P(`The smell is already fading on the hot wind. Your heart is pounding.`),
      choices: s => [
        { label: "Warn your " + wb.g(s), go: s => ({ text: [
          `“Something's out there. A big cat.” Heads go up. Noses go up. But the wind has shifted again, and the smell is gone.`,
          wb.sedgeIn(s) ? D("Sedge", "There hasn't been a lion in this valley in your mother's whole life. It's the heat. It plays tricks on the nose.") : `Nobody else can smell it now.`,
          wb.ridgeIn(s) ? "A few of the others laugh. Ridge laughs loudest." : "A few of the others laugh.",
          "But you know what you smelled."] }) },
        { label: "Keep it to yourself", go: () => ({ text: ["Maybe you imagined it. You don't want to be laughed at. But you keep sniffing the wind the rest of the way."] }) }
      ]
    },
    s3: { title: "The Pool Peace", next: "s3b",
      text: (s, r) => P(
        `You hear the Deep Bend before you see it: hundreds of animals in one place. Hooves shifting. Splashing. Snorts and chirps and cries. And under it all, the sound you've missed so much it almost hurts: water lapping against mud.`,
        `The Deep Bend is the one place where the river runs under a cutbank so deep that even this summer couldn't dry it out. Huge old cottonwoods lean over it. The water is green and still, no wider than a few long jumps.`,
        `And around it, everyone. Bison standing knee-deep in the shallows. Pronghorn drinking in quick, nervous sips. Mule deer waiting in the shade. A family of otters out in the deepest middle. Coyotes slipping along the edges. A pair of golden eagles on the dead cottonwood. Two badgers on the far bank, pretending very hard not to notice each other.`,
        `Animals that would <i>eat</i> each other on any other day, drinking side by side, because there's nowhere else to go. Nobody hunts. Everybody watches. Your mother taught you the name for it: <b>the Pool Peace</b>. It isn't a promise. It's just what happens when everyone is thirsty enough. And it holds, as long as everyone keeps watching.`,
        `Standing in the middle of the shallows like a boulder that grew legs is the biggest animal you've ever seen: a bison bull so old his horns are worn to stubs and his beard has gone white. Every other animal steps around him.`,
        s.sp === "bison" ? `Every bison knows him: <b>Hundred Winters</b>, from the Red Butte herd. In late summer, when the bulls come back to the herds, he walks in like he owns the river. This year, maybe he does.` : `In your head you call him <b>Hundred Winters</b>, because he looks like he's seen that many.`,
        `Your ${wb.g(s)} drinks. The water is warm and tastes like mud and old leaves, and you've never had anything better in your life.`,
        s.sp === "coyote"
          ? P(`Feeling good, maybe a little silly, you drop your front legs flat and stick your tail in the air at a young otter: a play bow, the coyote way of saying <i>let's be friends</i>.`, wb.cs("the otter goes stiff, hisses and dives. To an otter, a coyote crouching low at the water's edge doesn't mean “let's play.” It means “I'm about to pounce.”"))
          : s.sp === "otter"
            ? P(`A young coyote at the edge of the water drops its front legs flat and sticks its tail in the air, staring right at you.`, wb.cs("to you, a crouching coyote can only mean one thing. You hiss and dive. When you come up, the coyote is walking away with its ears down, looking embarrassed. Your mother chirps something that sounds a lot like laughing."))
            : P(`A young coyote crouches with its tail in the air, grinning at a young otter. The otter hisses and dives. The coyote's ears go flat and it slinks off, embarrassed.`, wb.cs("you're pretty sure they meant two different things.")),
        r.f.burrNew
          ? P(`Then you notice you're being watched. There's a <b>${B(s)}</b> at the edge of the water, born this spring, all legs and big eyes, staring at you. Just behind it, ${wb.bm(s)} is drinking.`,
              sx(s, {
                coyote: "The badger kit is round and flat and grumpy-looking, with a white stripe down its nose. It waddles toward you, sniffing, completely unafraid. Its mother growls at it, low. It ignores her.",
                badger: "The coyote pup is all ears and paws, with a tail that won't stop wagging. It keeps creeping toward you, belly low, then bouncing back when you look at it.",
                bison: "The pronghorn fawn is so small it could fit under your chin. It stares up at you like you're a mountain that walked here.",
                pronghorn: "The mule deer fawn still has spots on its back, and huge ears that it keeps tilting toward you like you're the most interesting thing it's ever heard.",
                otter: "The beaver kit is round and brown and wet, paddling slowly toward you with only its nose and eyes above the water. It's been following you around the pool for an hour.",
                eagle: "The young magpie has a stubby tail and a lot of opinions. It's been hopping closer along the branch below yours all afternoon, squawking at you. Its mother keeps calling it back. It keeps not going."
              }))
          : P(`Burr is pressed against your side, drinking when you drink. Near you, a mule deer doe and her spotted fawn are drinking in the shade. Burr watches the fawn the whole time.`)
      ),
      choices: (s, r) => r.f.burrNew ? [
        { label: "Let them be", go: (s, r) => { r.f.letBe = true; return { text: ["You stay where you are and let the little one come close. It sniffs you, or squawks at you, or stares at you, then wanders back to its mother. Its mother gives you a long look.", wb.cs("“I see you. You're not a danger.”")] }; } },
        { label: "Chase them off. This is your spot.", go: (s, r) => { r.f.chased = true; return { text: ["You lower your head and step toward them, and the little one scrambles back to its mother.", wb.cs("very clear. “Go away.”")] }; } }
      ] : []
    },
    s3b: { title: "Tattle", next: "s4",
      text: s => P(
        `A flash of black and white lands on the bank next to you: a magpie with a long tail and a voice like two rocks scraping together. She cocks her head, looks at you with one bright eye, then looks at the bit of food you didn't finish.`,
        s.sp === "eagle" ? `You know this magpie. She follows your family everywhere, waiting for scraps. Your mother calls her <b>Tattle</b>, because she can't keep quiet about anything.` : `You've seen her before, picking ticks off bison and stealing scraps from coyotes. In your head you call her <b>Tattle</b>, because she never shuts up.`
      ),
      choices: s => [
        { label: "Leave her a scrap", go: (s, r) => { s.flags.tattle = true; return { text: [
          `She gulps it, and instead of flying away she hops along the bank, looks back at you, screams, and hops again. You follow. At the very edge of your ${wb.g(s)}'s side of the pool, she lands on a dry stick and scolds the ground below her.`,
          `There are tracks in the mud there. Fresh ones. The scent is your own kind, ${wb.k(s)}, and it's from last night. Somebody came to the water in the dark. Nobody's supposed to do that. Everybody drinks together, in daylight, when everyone can watch.`,
          N("Tattle likes you now.", "good")] }; } },
        { label: "Ignore her", go: () => ({ text: ["She screams at you for a while, then gives up and goes to bother a bison."] }) }
      ]
    },
    s4: { title: "Dusk: The Peace Breaks", next: "s4b",
      text: (s, r) => P(
        `For two days the Pool Peace holds. On the third evening, the light goes long and gold, and the cottonwood shadows stretch across the water. It's the most beautiful time of day at the Deep Bend. It's also when hunters hunt.`,
        r.f.burrNew ? `You're drinking at the edge of your ${wb.g(s)}. The ${B(s)} is at the water a little way off with its mother, splashing.` : `Burr has wandered a few steps down the bank, close to the mule deer doe and her fawn, curious.`,
        `The tall grass at the top of the bank moves. That's not strange. Grass moves in the wind. But there isn't any wind.`,
        r.f.smelled && `And then you smell it again, the smell from the walk. <b>Big cat.</b> Close.`,
        `A shadow comes out of the grass, low and long and gold-colored, faster than anything you've ever seen. It doesn't run. It <i>flows</i>, down the bank and into the shallows, and there's a splash, and a scream, and every animal at the pool explodes in every direction at once.`,
        `You don't see what happens. You're glad you don't.`,
        r.f.burrNew
          ? P(`When the spray settles, the long gold shadow is gone back into the grass, and so is ${wb.bm(s)}.`,
              s.sp === "eagle" && `(The mother magpie had been on the bank among the bison's legs. When the herd stampeded, there was no time for her to fly.)`,
              `The ${B(s)} is standing at the water's edge. Alone. Not running. Not hiding. Just staring at the place where its mother was, while hooves and wings and bodies crash past it.`)
          : `When the spray settles, the gold shadow is gone, and so is the mule deer doe. And Burr is standing frozen at the edge of the water, right where she was, while hooves and wings and bodies crash past him.`,
        `And your body is screaming at you.`,
        wb.panel(s, false, sx(s, { coyote: "Every muscle in your legs is begging you. Run now, run far.", pronghorn: "Every muscle in your legs is begging you. Run now, run far.", bison: "Every muscle in your body is clenched. Turn and face it. Don't think about anyone else.", eagle: "Every muscle is clenched. Turn and face it. Don't think about anyone else.", badger: "Every muscle is clenched. Turn and face it. Don't think about anyone else.", otter: "Every part of you wants to dive to the bottom and stay there until it's over." }))
      ),
      choices: (s, r) => [
        { label: "Give in", tag: "⚠ Instinct: you survive, guaranteed", go: (s, r) => {
          wb.burrSet(s, r.f.burrNew ? 0 : Math.max(0, wb.bt(s) - 1));
          return { text: [
            sx(s, { coyote: "You run, faster than you've ever run, up the bank and out onto the flat.", pronghorn: "You run, faster than you've ever run, up the bank and out onto the flat.", bison: "You wheel toward the grass, every hair up, ready to take on the whole world, and you don't look at anything else.", eagle: "You wheel toward the grass, every feather up, and you don't look at anything else.", badger: "You wheel toward the grass, every hair up, and you don't look at anything else.", otter: "You dive and stay at the bottom, in the cool green dark, until your lungs burn." }),
            `You're safe. When you finally look back, ${r.f.burrNew ? "the little one" : "Burr"} is still standing alone at the edge of the water. Then Hundred Winters comes through the shallows like a landslide, bellowing, and plants himself between the grass and the water, and nothing comes out of the grass again.`,
            wb.give(s, r)] };
        } },
        ...(abilityRescue(s, r)),
        { label: "Fight it: go get the little one", check: { stat: "heart", dc: 5, tags: ["young"] }, go: (s, r, pass) => {
          if (pass) { wb.burrSet(s, r.f.burrNew ? (r.f.chased ? 1 : 2) : Math.min(2, wb.bt(s) + 1)); s.stats.heart = Math.min(10, s.stats.heart + 1); return { text: ["You make your body stop. It's the hardest thing you've ever done. Then you go, not away, but <i>toward</i>, and you get the little one out of the open and behind you, and you stand there shaking until it's over.", N("You went against your instinct. <span class='dim'>(Heart +1.)</span>", "good"), wb.tc(s, r)] }; }
          wb.burrSet(s, r.f.burrNew ? (r.f.chased ? 0 : 1) : wb.bt(s));
          return { text: ["You try. You really try. But your body takes over halfway there, and by the time you're yourself again, Hundred Winters has planted himself between the grass and the water. The little one is still alive. It saw you coming for it.", strain(s, "Shaken")] };
        } }
      ]
    },
    s4b: { title: "Your Side of the Pool", next: "s5",
      text: s => P(
        `When it's over, the Deep Bend is quiet. The animals come back to the water slowly, heads up, eyes wide. Nobody drinks for a long time.`,
        `Then something changes. One by one, the animals around the pool start backing away from your side of it.`,
        s.stray
          ? P(`As you walk back to the water, the animals nearest you lift their heads and sniff, and step back. Then the ones next to them. Under the dust and the mud, there's still that faint smell of soap and human hands.`, wb.cs("from every species at once: “Humans. Danger. Stay back.”"), `Even some of your own ${wb.g(s)} won't look at you.`)
          : P(`The long gold shadow came out of the grass on your ${wb.g(s)}'s side of the pool. Everyone saw it.`, wb.cs("from every species at once: “That side is dangerous. <i>You</i> are dangerous.”"))
      )
    },
    s5: { title: "The First Night", next: (s, r) => r.f.burrNew ? "s5b" : "s6",
      text: (s, r) => r.f.burrNew ? P(
        `That night, nobody sleeps. Your ${wb.g(s)} lies close together under the cottonwoods, as far from the tall grass as they can get.`,
        `And the ${B(s)} won't leave you. ${wb.bt(s) >= 2 ? "It stuck to you as soon as you got it away from the water." : "It came looking for you after dark. Maybe because you were the last animal it saw before everything went wrong."} It's making a small, high, broken call, over and over. It's calling for its mother.`,
        wb.ridgeIn(s) && D("Ridge", "Make it stop. It's going to bring that thing right to us."),
        wb.sedgeIn(s) && D("Sedge", "It's a baby. It's just a baby. Let it stay."),
        wb.ridgeIn(s) && D("Ridge", "It's not even <i>one of us</i>."),
        `Everybody looks at you. The little one looks up at you too. It doesn't understand a word. It only understands that you're bigger than it, and you haven't hurt it.`
      ) : P(
        `That night, nobody sleeps. Your ${wb.g(s)} lies close together under the cottonwoods, as far from the tall grass as they can get.`,
        `Burr presses against you. He saw the whole thing at the water. He keeps lifting his head and staring at the long grass at the top of the bank, trembling.`,
        wb.trigger(s),
        wb.burrW(s).length < 2 ? wb.burrGain(s, "burr_tallgrass") : N("Burr shakes all night, but by morning he's steady enough to walk.", "dim")
      ),
      choices: (s, r) => r.f.burrNew ? [
        { label: "Let it stay", go: s => ({ text: [`You lie down, and you let it lie down next to you.${wb.ridgeIn(s) ? " Ridge growls and stalks off." : ""} Your mother doesn't say anything. But she doesn't send it away either.`, wb.bond(s, "burr"), trust(s, "Burr", 1)] }) },
        { label: "Drive it off", go: s => ({ text: ["You push it away, back toward the water. It stumbles and stops and stares at you. Then it lies down all alone at the edge of your " + wb.g(s) + ", close enough to see you, too far to touch. It doesn't stop calling.", trust(s, "Burr", -1)] }) }
      ] : []
    },
    s5b: { title: "Burr", next: "s6",
      text: (s, r) => P(
        `It needs a name. You realize you've been calling it one in your head since it first walked up to you, all big eyes and stubbornness. It sticks to you the way a burr sticks to fur. So that's what it is. <b>Burr.</b>`,
        r.burns > 0 && `Once, Burr comes close, and you lift your head, and Burr flinches back, fast, like it's remembering you running and leaving it alone at the water.`,
        `The night goes on. Burr keeps calling. Your ${wb.g(s)} keeps shifting and glaring. You have to choose.`
      ),
      choices: s => [
        { label: "Stay with Burr all night", go: s => ({ text: ["You don't sleep. Every time Burr calls, you make a low, soft sound back, the sound your own mother made for you when you were small. Sometime before dawn, it falls asleep, still calling in its sleep.", wb.burrGain(s, "burr_calls")] }) },
        { label: `Hide Burr and go back to your ${wb.g(s)}`, go: s => ({ text: ["You push Burr into a hollow under the cottonwood roots and wait until its calls get quieter. Then you go back to your " + wb.g(s) + ", where it's warm, and where everyone stops glaring. Behind you in the dark, you hear Burr wake up and find you gone. It doesn't call for its mother anymore. It calls for <b>you</b>, frantic, until it finds you again.", wb.burrGain(s, "burr_dontleave")] }) }
      ]
    },
    s6: { title: "Pushed Off the Water", next: "s7",
      text: s => P(
        `In the morning, your ${wb.g(s)} goes down to drink. You don't make it to the water.`,
        `Hundred Winters is standing in the shallows on your side of the pool. He doesn't charge. He doesn't even look angry. He just stands there, huge and still, right where you need to drink, and two more bulls come and stand beside him, like a wall.`,
        wb.flintIn(s) ? `Old Flint walks toward the water, slow and careful, head low. Hundred Winters swings his huge head once, side to side.` : `${wb.leader(s)[0].toUpperCase() + wb.leader(s).slice(1)} walks toward the water, head low. Hundred Winters swings his huge head once, side to side.`,
        wb.cs("“No.”"),
        wb.flintIn(s) ? `Flint backs away. You've never seen Flint back away from anything.` : `Your ${wb.g(s)} backs away.`,
        s.flags.hw ? `Then Hundred Winters looks at <i>you</i>, for a long moment. He shifts one step aside. Just enough for one animal. You drink, alone, while your ${wb.g(s)} watches.` : "",
        addBurden(s, "blamed"),
        `When the sun is high and the other animals move into the shade, your ${wb.g(s)} finally gets a few muddy mouthfuls at the very edge. That's when you see the line on the bank. Yesterday the water came up to a root of the big cottonwood. Today it's a whole body-length below it.`,
        wb.momIn(s) ? D("Your mother", "Three days. Maybe less. Then there won't be enough for everybody. And when there isn't enough, the big ones drink, and the rest of us…") : `Three days, maybe less, and there won't be enough for everybody.`,
        `If the valley keeps thinking your ${wb.g(s)} brought the cat, your ${wb.g(s)} will be the first ones pushed away for good. You have to find out where that cat really came from. And you have to make everyone else <i>see</i> it.`
      ),
      onEnter: (s, r) => s.sp === "pronghorn" ? P(N(`<b>Pronghorn eyes.</b> You find a high spot above the pool. You remember counting your ${wb.g(s)} at dusk last night, the way pronghorn always count each other. Every single one was there.${wb.sedgeIn(s) ? ` Every one except Sedge. Sedge came down late, from the far end of the pool. From the direction of <b>Bone Coulee</b>.` : ""}`, "mark"), wb.sedgeIn(s) ? wb.clue(s, "late") : "") : "",
      choices: s => [
        wb.when(s.sp === "coyote", { label: "Read the cat's trail, the coyote way", tag: "Coyote", go: (s, r) => ({ text: [trailText(s), wb.clue(s, "trail")] }) }),
        { label: "Look at where the cat came down", check: { stat: "cunning", dc: 4 }, go: (s, r, pass) => ({ text: pass ? [trailText(s), wb.clue(s, "trail")] : ["It's just tracks in the dirt. A cat came down here and took someone, and now everyone hates you. That's all you can tell."] }) }
      ]
    },
    s7: { title: (s) => wb.sedgeIn(s) ? "Sedge's Offer" : "Bramble's Offer", next: "s8",
      text: (s, r) => wb.sedgeIn(s) ? P(
        `That night, Sedge finds you alone at the edge of the ${wb.g(s)}.`,
        wb.hasBond(s, "burr") && `Burr is asleep against you. Sedge looks at the little one for a long moment and makes a soft, kind sound.`,
        D("Sedge", `Hard day. I want to tell you something, and I want you to keep it between us. ${wb.flintIn(s) ? `Flint is old. You saw ${wb.her(s)} today. A year ago, ${wb.she(s)} would never have backed down from that bull.` : "Since Flint, this group has been lost."}`),
        D("Sedge", "This group needs someone who can stand up for it. Someone who can walk up to that water and make them let us drink. I can be that. But I'll need the young ones to stand with me. " + (wb.flintIn(s) ? "Not with Flint. With me." : "With me.")),
        D("Sedge", "Stand with me, and I'll make sure you drink. I'll make sure that little one of yours is safe. Nobody touches it." + (s.stray ? " And I'll make sure the group stops talking about where you came from." : "") + " Think about it.")
      ) : P(
        `Sedge is gone from your ${wb.g(s)}. But that night, a big ${wb.k1(s)} you know comes walking around the far end of the pool: <b>Bramble</b>, leader of the Red Butte ${wb.g(s)}, the strongest of your kind in the valley.`,
        D("Bramble", `My ${wb.g(s)} holds the deep end of this pool. Nobody pushes us off it. Your ${wb.g(s)} can drink with us.`),
        D("Bramble", "All I want in return is your home range, when the rains come back. For good.")
      ),
      onEnter: (s, r) => (wb.sedgeIn(s) && s.stats.senses >= 6) ? P(N(`As Sedge gets up, the wind shifts, and you catch something in ${wb.hers(s)} coat: faint, old and sour. The smell of dry stone and old bones. <i>The smell of Bone Coulee.</i>`, "mark"), wb.clue(s, "coulee")) : "",
      choices: s => wb.sedgeIn(s) ? [
        { label: "“I'll stand with you.”", go: (s, r) => ({ text: [`Sedge's eyes go warm, and ${wb.she(s)} touches noses with you, the way you'd greet family. “I knew I could count on you.”`, addBurden(s, "sedge_favor"), wb.flintIn(s) ? "As Sedge walks away, you see Old Flint at the edge of the group. Flint isn't asleep. Flint's eyes are open, looking right at you. Then Flint looks away." : ""] }) },
        { label: wb.flintIn(s) ? "“Flint has led us my whole life.”" : "“No. Not like this.”", go: (s, r) => { r.f.refused = true; return { text: [`For a moment something flickers in Sedge's eyes, quick, like a fish under water. Then ${wb.she(s)} smiles. “Of course. That's loyal of you.”`, wb.ridgeIn(s) ? "The next morning you notice Ridge watching you, trying to figure out which way you'll go." : ""] }; } }
      ] : [
        { label: "Accept Bramble's offer", go: s => ({ text: ["Your " + wb.g(s) + " drinks from the deep end with the Red Butte " + wb.g(s) + " that night. It's the best water you've had in a week. Your home range will be Bramble's.", addBurden(s, "lost_ground")] }) },
        { label: "Refuse", go: (s, r) => { r.f.refused = true; return { text: ["“Our ground is ours.” Bramble shrugs. “Then drink last.”"] }; } }
      ]
    },
    s8: { title: "The Trail to Bone Coulee", next: "s8b",
      text: (s, r) => P(
        `In the gray light before dawn, you go looking for the cat. It's the most frightening thing you've ever chosen to do. But two days from now there won't be enough water for everyone.`,
        wb.hasBond(s, "burr") ? `Burr comes too. You try to make him stay with your mother. He doesn't.` : `You don't take Burr. But when you look back from the top of the bank, he's following you anyway, stubborn as a stone.`,
        r.f.victim === "flint" ? P(`And Old Flint comes too.`, D("Old Flint", "I've been walking this valley since before your mother was born. If there's a lion in it, I want to see it with my own eyes."))
          : r.f.victim === "wisp" ? `And Wisp, Ridge's little sister, tags along behind you, the way the little ones do. You can't make her go back.`
          : `And ${vName(s, r)} comes too. ${vShe(s, r) === "she" ? "She" : "He"} won't let you go alone.`,
        s.flags.tattle && `A black-and-white shape drops out of the cottonwoods ahead of you, screaming. Tattle. She hops up the dry riverbed toward the badlands and looks back. Magpies follow hunters everywhere. Maybe she's been following this one too.`,
        hasBurden(s, "being_hunted") && N(`Up on the coulee rim, something long and gold is already watching you. It knows you.`, "bad")
      ),
      choices: s => [
        wb.when(s.sp === "eagle", { label: "High Eye: climb and look", tag: "Golden Eagle", go: () => ({ text: ["You climb into the first warm air of morning until you can see every coulee for miles. There: on a ledge high in a dry side-canyon, in the shadow of an overhang, a long, gold shape stretched out flat. It's sleeping in <b>Bone Coulee</b>."] }) }),
        wb.when(s.sp === "badger", { label: "Dig: follow your nose underground", tag: "Badger", go: () => ({ text: ["At the mouth of a dry side-canyon, under a pile of brush and dirt, something is buried. You dig, and find what's left of a mule deer, covered with dirt and sticks. Big cats hide what they can't finish and come back for it. This is the cat's food, and this canyon is <b>Bone Coulee</b>."] }) }),
        wb.when(s.sp === "pronghorn", { label: "Burst: scout the open flats", tag: "Pronghorn", go: () => ({ text: ["You run out ahead, circling, looking, faster than the others could follow. From a low rise you see a line of dust-free rock at the mouth of a side-canyon, where something has walked back and forth so often the dust is worn away. A hunter's path, into <b>Bone Coulee</b>."] }) }),
        wb.when(s.sp === "coyote", { label: "Trickster's nose: read the whole scent story", tag: "Coyote", go: () => ({ text: ["Not just the cat's smell, but everything around it: where it stopped, where it sat and waited, where it rolled in the dust. It's big, it's been here a long time, and it's been hungry the whole time. It leads you to the mouth of <b>Bone Coulee</b>."] }) }),
        wb.when(s.sp === "otter", { label: "Slip: follow the dry creek like running water", tag: "River Otter", go: () => ({ text: ["In the soft sand of the old creekbed you find them: big round paw prints, wider than your whole body. No claw marks. Cats keep their claws pulled in. The creek goes back into <b>Bone Coulee</b>."] }) }),
        wb.when(s.sp === "bison", { label: "Wall: push straight through the thorn brush", tag: "Bison", go: () => ({ text: ["The trail goes into a buffaloberry thicket nothing your size could fit through. You lower your head and walk into it anyway, and the brush cracks and gives way, and you come out scratched and covered in thorns at the mouth of <b>Bone Coulee</b>."] }) }),
        { label: "Search the ground for the real trail", check: { stat: "senses", dc: 5 }, go: (s, r, pass) => ({ text: pass ? ["You find it: the cat's real trail, up out of the riverbed into the badlands, toward <b>Bone Coulee</b>."] : ["You lose the trail three times as the sun gets higher. You find it eventually, near <b>Bone Coulee</b>, but it costs you.", strain(s, "Exhausted")] }) }
      ]
    },
    s8b: { title: "Bone Coulee", next: "s9",
      text: (s, r) => P(
        `Bone Coulee is a narrow, dry canyon with high walls of gray and red rock, and nobody ever goes in it. Now you know why. The ground at its mouth is covered in bones. Old ones, bleached white. Newer ones.`,
        `The smell of big cat is so strong it makes your eyes water. And there's something else mixed into it: <b>${wb.k(s)}</b>. Your own kind. Again and again, old scent and new, layered on top of each other like the rings in a tree.`,
        `You sort the smells out, the way your mother taught you. Each layer of your own kind's scent sits right on top of the cat's scent from a hunt. <i>As if someone came here, to the lion's own door, every time, just before it went out hunting.</i>`,
        wb.piece(s, "here"),
        wb.hasClue(s, "coulee") && `You've smelled this before. On Sedge.`,
        r.f.victim === "flint" && D("Old Flint", "(quietly) Who would come <i>here</i>?"),
        `Before you can answer, the wind changes, and Bone Coulee goes completely silent.`
      )
    },
    s9: { title: "Two in the Coulee", next: (s, r) => r.f.lost && !r.f.gave ? "s9g" : "s9h",
      text: (s, r) => P(
        `It comes down the canyon wall like water pouring over a rock: smooth, silent, gold. Now you see it clearly. It's long and thin, so thin you can count its ribs. One front leg is twisted, an old injury. Its eyes are pale gold and completely calm. The animals who've seen it and lived have a name for it now. <b>The Ghost.</b>`,
        `It's looking at ${vName(s, r)}, who is old, or small, or slow, and standing with ${vHer(s, r)} back against the coulee wall, where there's nowhere to go.`,
        s.sp === "eagle" && r.f.victim === "flint" && `(Flint had come down to the cat's buried kill. An old eagle with a bad wing is slow to take off from the ground.)`,
        `And behind you, from the open ground at the mouth of the coulee, you hear Burr, calling for you, high and frightened. ${wb.burrHas(s, "burr_calls") ? "At dusk and in danger he calls for his mother. He can't help it." : wb.burrHas(s, "burr_dontleave") ? "He lost sight of you behind the rocks, and he can't bear it." : ""}`,
        `The Ghost's ears twitch toward the sound. You can't reach both. Not in time.`
      ),
      choices: (s, r) => [
        { label: `Save ${vName(s, r)}`, tag: "Burr will be alone", go: (s, r) => ({ text: [
          `You throw yourself between the cat and ${vName(s, r)} with everything you have: ${sx(s, { coyote: "barking, darting, snapping at its face", bison: "head down, horns first", pronghorn: "stamping, snorting, the loudest alarm you've ever made", eagle: "screaming, wings wide, talons out", otter: "hissing and shrieking like something much bigger", badger: "every hair on end, claws out, a badger with nothing to lose" })}, and the Ghost hesitates. That's all it takes. ${VName(s, r)} gets past it.`,
          `Then the Ghost turns, slowly, and walks toward Burr. By the time you get there, Burr has squeezed into a crack in the rocks, and the Ghost is circling it, sniffing. Then something on the wind makes it lift its head, and it walks away up the canyon. Burr doesn't come out for a long time. When he does, he won't look at you.`,
          addWound(s, "heard_calling"), trust(s, "Burr", -1), wb.burrW(s).length ? N(`Burr's wound deepens.`, "bad") : ""] }) },
        { label: "Save Burr", tag: `${VName(s, r)} will be alone`, go: (s, r) => { r.f.lost = true; return { text: [
          `You run for Burr harder than you've ever run, and you get him behind you, ${sx(s, { bison: "under your belly", otter: "down into the soft sand of the creekbed", eagle: "under your wings", coyote: "into a crack in the rocks", pronghorn: "into a crack in the rocks", badger: "into a crack in the rocks" })}, and you turn around.`,
          `Behind you, in the coulee, there's a sound. Just one. Then nothing at all. You stand there a long time with Burr pressed against you, shaking.`,
          loseVictim(s, r), addWound(s, "couldnt_reach"), trust(s, "Burr", 1)] }; } },
        wb.when(s.sp === "bison" || s.sp === "badger", { label: s.sp === "bison" ? "Wall: go through the gap and plant yourself" : "Dig: come up under its nose", tag: wb.X(s).name, go: (s, r) => ({ text: [
          s.sp === "bison" ? "You don't go around the cat. You go through the space between it and the wall, all of you, a yearling bison, head down, and you plant yourself." : "You go under, through the soft dirt at the foot of the coulee wall, and come up right under the cat's nose, all teeth and claws and fury.",
          `The Ghost strikes once. Its claws rake across your side like fire. But you don't move. Behind you, ${vName(s, r)} limps out of the coulee. Ahead of you, Burr scrambles into the rocks. The Ghost looks at you with its pale, calm eyes. Then it decides you're not worth it, and walks away.`,
          addWound(s, "raked"), wb.tc(s, r)] }) }),
        { label: "Give in", tag: "⚠ Instinct: you survive, guaranteed", go: (s, r) => { r.f.lost = true; r.f.gave = true; return { text: [
          sx(s, { coyote: "You run.", pronghorn: "You run.", bison: "You turn on the danger and fight with your eyes shut and your mind gone.", eagle: "You turn on the danger and fight with your eyes shut and your mind gone.", badger: "You turn on the danger and fight with your eyes shut and your mind gone.", otter: "You dive into a crack in the rocks and press yourself against the stone." }),
          `When you're yourself again, it's quiet. High above, Tattle is screaming from the coulee rim, and the Ghost is standing in the open, looking up at her, irritated. That was all the time Burr needed. He's hidden under a ledge. He's safe. But ${vName(s, r)} isn't anywhere.`,
          wb.give(s, r), loseVictim(s, r), addWound(s, "left_behind")] }; } }
      ]
    },
    s9g: { title: "Grief", next: "s10",
      text: (s, r) => P(
        `It's quiet in the mouth of the coulee. The sun is high and hot, and there's no shade. You know ${vName(s, r)} is gone. You know it the way animals know things: in your whole body at once.`,
        `You've seen animals grieve. A bison cow standing over her calf for a whole day. Coyotes on the Red Buttes calling and calling for one of their own who didn't come back. Nobody taught you that. It's just what you do.`
      ),
      choices: (s, r) => [
        { label: "Stay", go: (s, r) => ({ text: [`You lie down where you can still smell ${vHer(s, r)}, and you stay through the heat of the day with Burr against you. You don't do anything. You just stay. It's the only thing left to do.`, afterLoss(s, r)] }) },
        { label: `Call for ${vHer(s, r)}`, go: (s, r) => ({ text: [`You lift your head and call, the call your ${wb.g(s)} uses to find each other, again and again, out across the badlands. Nothing calls back. You knew nothing would. You do it anyway.`, afterLoss(s, r)] }) },
        { label: "Carry on", go: (s, r) => ({ text: [`You can't stay. It isn't safe, and your ${wb.g(s)} needs to know. You turn and walk back toward the Deep Bend. It's the hardest thing you've ever done.`, afterLoss(s, r)] }) }
      ]
    },
    s9h: { title: "Back at the Deep Bend", next: "s10",
      text: (s, r) => r.f.lost ? P(`When you get back to your ${wb.g(s)}, you don't have to say anything. They can tell by looking at you.`, afterLoss(s, r))
        : P(`When you get back to the Deep Bend, ${vName(s, r)} lies down at the edge of the ${wb.g(s)} and doesn't get up for the rest of the day, shaking from how close it was.`,
            r.f.victim === "flint" ? P(`But before you sleep, Flint limps over and touches ${wb.hers(s)} nose to yours, just once, the way ${wb.she(s)} only ever does with family.`, D("Old Flint", "I'm not done yet. Not yet.")) : "")
    },
    s10: { title: "Go to Ground", next: "s11",
      text: (s, r) => P(
        hasWound(s, "heard_calling") && `Every time a young animal calls out anywhere at the Deep Bend, your whole body freezes.`,
        hasWound(s, "couldnt_reach") && `You keep looking toward Bone Coulee. <i>If I'd been faster. If I'd been stronger.</i>`,
        hasWound(s, "raked") && `The cuts down your side are hot and swollen. Every step pulls at them.`,
        hasWound(s, "left_behind") && `You can't look at your ${wb.g(s)}. They don't say it. They don't have to. <i>You ran.</i>`,
        bookWounds(s).length
          ? `${wb.momIn(s) ? "Your mother" : "Ridge"} finds a cool, hidden place under the cottonwood roots, and looks at you. <i>Rest. Let it heal.</i> But there's only one day left. Maybe less.`
          : P(`${wb.momIn(s) ? "Your mother lies down beside you and tells you about the last drought, the summer she was a yearling." : "You lie in the shade and think about what your mother told you once, about the last drought."}`,
              D(wb.momIn(s) ? "Your mother" : "(remembered)", "We all got through it. Not because we were strong. Because, for once, nobody hunted at the water. Somebody wants that to stop. I don't know why. But I know it isn't the lion."))
      ),
      choices: s => bookWounds(s).length ? [
        { label: "Go to ground", tag: "Heal, but lose a day", go: (s, r) => ({ text: [`You lie down in the cool dark and let yourself be small.`, ...bookWounds(s).map(w => healWound(s, w)), `When you come out at sunset, the line on the bank has dropped again, and the day is gone.${wb.ridgeIn(s) ? " Ridge spoke for your " + wb.g(s) + " at the water while you rested." : ""}`, wb.ridgeIn(s) ? trust(s, "Ridge", 1) : ""] }) },
        { label: "Keep moving", tag: "The wound stays", go: () => ({ text: ["There's no time. You get up, shake it off as best you can, and keep going."] }) }
      ] : []
    },
    s11: { title: "The Dry Creek", next: "s11b",
      text: (s, r) => P(
        hasBurden(s, "sedge_favor") ? `Sedge makes sure you drink, and Burr too. The rest of your ${wb.g(s)} only get a few mouthfuls each, and they look at you differently now.` : `The big animals push your ${wb.g(s)} away from the water again. A few muddy mouthfuls at dawn, and that's all.`,
        `Your tongue feels like dry bark. You have to find more water, or make the valley let your ${wb.g(s)} drink.`,
        waterText(s, r),
        hasWound(s, "heard_calling") && N(`<b>Heard It Calling.</b> A fawn bleats for its mother at the pool, and you freeze until it stops.`, "bad"),
        hasWound(s, "couldnt_reach") && N(`<b>Couldn't Reach Them.</b> An old pronghorn stumbles at the pool, and you're running toward it before you think, scattering the herd.`, "bad"),
        hasWound(s, "left_behind") && N(`<b>Left Behind.</b> Your ${wb.g(s)} is lying together under the cottonwoods. There's no space left for you.`, "bad")
      ),
      onEnter: (s, r) => r.f.water ? "" : strain(s, "Thirsty")
    },
    s11b: { title: "The Black Road", next: "s12",
      text: s => P(
        `Late in the afternoon, you go somewhere you've never gone. East, over the buttes, to the edge of the valley. You hear it before you see it: a low, endless roar, like wind that never stops.`,
        s.stray && `You know that sound. You heard it every day when you lived with the humans. Trucks.`,
        `It's the <b>Black Road</b>: a long, straight, black strip, hot enough to burn your paws, with machines roaring along it. On the other side, the buttes have been torn open, cut in half and scraped flat, and there are machines there too, digging.`,
        `And at the edge of the road, in the dry grass, the same smell as Bone Coulee. Big cat. Weeks old.`
      ),
      choices: s => [
        wb.when(s.stray, { label: "Knows Humans: you know what those machines are for", tag: "Stray", go: s => ({ text: ["You've seen humans do this. The cat's old scent is on this side of the road. On the other side, where it should be strongest, there's nothing but torn-up ground. <i>This is where it lived. Its whole home. It didn't come to your valley because it wanted to.</i>", wb.piece(s, "pushed")] }) }),
        { label: "Put it together", check: { stat: "cunning", dc: 5 }, go: (s, r, pass) => ({ text: pass ? ["The cat's old scent is here, on this side of the road. On the other side, where it should be strongest, there's nothing but torn-up ground and machines. <i>This is where it lived. It came to your valley because it had nowhere else to go.</i>", wb.piece(s, "pushed")] : ["It's loud, and it stinks, and it scares you. You run back to the valley and don't stop until the road sound is gone."] }) }
      ]
    },
    s12: { title: "Ridge's Secret", next: "s13",
      text: (s, r) => !wb.ridgeAlive(s) ? P(
        `That night, Tattle won't leave you alone. She leads you back to the night tracks at the edge of your ${wb.g(s)}'s side of the pool. There are new ones, from last night.`,
        `Since Ridge is gone, there's only one ${wb.k1(s)} who'd come here in the dark. The tracks have a gap where a claw should be.`
      ) : P(
        s.flags.tattle ? `That evening, Tattle leads you back to the place where she showed you the night tracks. There are new ones, fresh from last night. You know this scent. You've smelled it every day of your life.` : `That night, you can't sleep. You walk down toward the pool, just to be close to it, and you see a shape at the very edge of the water on your ${wb.g(s)}'s side, drinking fast, looking around after every mouthful.`,
        `<b>Ridge.</b>`,
        `He sees you. He freezes. Water drips from his chin, and you see that he isn't angry, the way he always is. He's scared.`,
        D("Ridge", "Don't."),
        wb.wispIn(s)
          ? `He walks back up the bank, and you follow, and you see where he's going. At the edge of the ${wb.g(s)}, curled up tight, is <b>Wisp</b>, his little sister, born this spring, the smallest of all. She's been sick for weeks. Too weak to push in at the water. Ridge lets the water drip from his own mouth into hers, slowly, the way a mother would. That's why he's been coming to the water at night. Every night. For Wisp.`
          : `He walks back up the bank alone. Since Wisp, he can't stop coming to the water at night. He doesn't know why. He just can't.`,
        `Your kind has a rule older than anyone: when there isn't enough, the leader's family drinks first, then everyone else. And sneaking to the water at night, when the whole valley is supposed to drink together? Nobody does that. <i>And those night tracks are what made the valley look at your ${wb.g(s)}.</i>`,
        D("Ridge", "(not looking at you) Go ahead. Tell them.")
      ),
      choices: (s, r) => !wb.ridgeAlive(s) ? [
        { label: "Tell your " + wb.g(s), go: s => ({ text: wb.proof(s) >= 2 ? ["Some of them look at Sedge, and don't look away.", addBurden(s, "split_group")] : ["Nobody believes you. Why would they?"] }) },
        { label: "Keep it to yourself, and keep watching", go: () => ({ text: ["You'll collect more. You'll wait."] }) }
      ] : [
        wb.when(!wb.ridgeIn(s), { label: `Tell your ${wb.g(s)}`, go: (s, r) => { const c = ensureComp(s, "Ridge"); c.trust = 0; return { text: [
          `In the morning, you tell them: the night tracks were Ridge's. He's been living on his own, and sneaking to the water in the dark. The blame slides off your ${wb.g(s)} and onto him. Out on the dry flat, Ridge hears about it by evening. He doesn't come near you again.`,
          hasBurden(s, "blamed") ? dropBurden(s, "blamed") : "", N("Ridge's trust: low.", "bad")] }; } }),
        wb.when(wb.ridgeIn(s), { label: `Tell your ${wb.g(s)}`, go: (s, r) => { s.flags.ridge = "out"; const c = ensureComp(s, "Ridge"); c.trust = 0; return { text: [
          `In the morning, you tell them. The whole ${wb.g(s)} goes quiet. ${wb.sedgeLeads(s) ? `Sedge says, very gently, “I'm sorry, Ridge. You know what this means.”` : `“Rules are rules, Ridge.”`}`,
          `Ridge doesn't argue. He walks away from the ${wb.g(s)}, out onto the dry flat${wb.wispIn(s) ? ", with Wisp stumbling behind him" : ""}. He looks back at you once. You'll remember that look.`,
          hasBurden(s, "blamed") ? dropBurden(s, "blamed") : "", N(`Ridge is pushed out of your ${wb.g(s)}. Ridge's trust: low.`, "bad")] }; } }),
        { label: "Keep his secret", go: s => ({ text: [`You don't say anything. Ridge doesn't thank you. But the next time you see him at the water, he steps aside and lets you drink first. That has never happened before.`, addBurden(s, "ridge_secret"), trust(s, "Ridge", 1)] }) },
        { label: "Take the blame yourself", go: (s, r) => { const c = ensureComp(s, "Ridge"); c.trust = 2; r.f.ridgeWith = true; return { text: [
          `In the morning, before anyone can ask, you stand up in front of your ${wb.g(s)}: “It was me. I've been going to the water at night.” Everyone stares. Ridge's mouth falls open.`,
          wb.sedgeIn(s) ? `Sedge looks at you, and for a second, just for a second, ${wb.she(s)} looks almost pleased.` : "",
          wb.wispIn(s) ? `For the rest of the summer you drink last. But Ridge drinks with Wisp, in the open, in daylight, and nobody says a word.` : `For the rest of the summer you drink last.`,
          strain(s, "Thirsty"), N("Ridge's trust: high.", "good"), wb.tc(s, r)] }; } },
        wb.when(fair(s, r), { label: "Ask Ridge first", tag: "You've been fair to him", go: (s, r) => { const c = ensureComp(s, "Ridge"); c.trust = 2; r.f.ridgeWith = true; return { text: [
          D("Ridge", wb.wispIn(s) ? "Because they'd make me stop. Wisp would die. I'd rather they hate me." : "Because I can't stop. That's all."),
          `He's quiet a long time. Then:`,
          D("Ridge", "There's something else. Those nights at the water, I wasn't the only one out there. Twice I smelled someone else. One of us. Walking out toward Bone Coulee in the dark, right before the cat came down. Too dark to see who. But it wasn't me."),
          wb.clue(s, "ridgesmelled"), N("Ridge's trust: high. He'll stand with you.", "good")] }; } })
      ]
    },
    s13: { title: "The Last Night at the Deep Bend", next: "s14",
      text: (s, r) => r.f.reck ? P(`The grass is still moving.`) : P(
        `The third night comes. The Deep Bend isn't a pool anymore. It's a puddle in a wide ring of cracked mud, and every animal in the valley is crowded around it. Your ${wb.g(s)} is pushed to the edge, closest to the tall grass.`,
        `Hundred Winters stands in the middle of the last water like he's guarding it, and maybe he is.`,
        wb.flintIn(s) && `Flint is lying at the edge of your ${wb.g(s)}, stiff leg out, watching the grass.`,
        wb.sedgeLeads(s) && `Sedge stands at the front of your ${wb.g(s)}, calm and strong. You can't stop thinking about Bone Coulee.`,
        `The sun goes down. From high in the cottonwoods, Tattle starts to scream: the long, harsh, rattling alarm every animal understands.`,
        wb.cs("“DANGER. Hunter. Coming.”"),
        wb.bt(s) >= 2 && P(`And before anyone else moves, Burr calls out. It isn't his calling-for-his-mother sound. It's sharp and loud and short: the alarm call of his own kind. It's the first sound he's made since that first night that isn't him calling for her. He's calling a <i>warning</i>.`, N("<b>Burr's warning.</b> Everyone at the pool has time to get ready.", "good")),
        `The tall grass on your side of the pool goes still. It's coming to the place it always comes: the side closest to the grass, where the weakest are, where the valley put your ${wb.g(s)}.`,
        `Whatever you do now, the whole valley will see it.`
      ),
      onEnter: (s, r) => { if (wb.bt(s) >= 2) r.f.warn = true; return ""; },
      choices: (s, r) => [
        wb.when(wb.traitor3(s) && wb.sedgeIn(s) && !r.f.reck, { label: "The reckoning: tell your " + wb.g(s) + " everything", tag: "You have all three pieces", go: (s, r) => { r.f.reck = true; s.flags.sedge = "exposed"; return { text: [
          `You turn your back on the grass, face your ${wb.g(s)}, and tell them. The lion's door at Bone Coulee, the scent laid there over and over, right before every hunt. Ridge and Wisp, sent down a slope into a fire. The tracks in the snow that walked out beside Thistle and walked home alone, with a gap where a claw should be.`,
          `You don't say whose. You just look at the mud by the water, where Sedge walked down to drink an hour ago. Everyone looks. There's the crooked toe. There's the gap.`,
          `Every head turns, slowly, to Sedge. Sedge doesn't argue. For the first time, there's nothing warm in ${wb.hers(s)} eyes at all. Then Sedge turns and walks up the bank into the dark, away from your ${wb.g(s)}, and doesn't come back.`,
          addBurden(s, "sedge_out"), wb.tc(s, r), N("Behind you, the grass moves. Choose what you do next.", "mark")], next: "s13" }; } }),
        wb.when(wb.hasPiece(s, "here") && (wb.flintIn(s) || r.f.ridgeWith || r.f.warn), { label: "Make them see where it comes from", tag: "You know where it lives", go: (s, r) => { s.flags.hw = true; return { text: [
          `You know where it lives. You know where it's coming from: not from your side, but from Bone Coulee, down the dry creekbed. You don't wait for it. You go out to meet it.`,
          r.f.ridgeWith ? "Ridge comes with you, without a word." : "",
          wb.flintIn(s) ? P(`Old Flint gets up, slowly, and limps out beside you.`, D("Old Flint", "I told you. I'm not done yet.")) : "",
          r.f.warn ? "Behind you, every animal at the pool is already looking where Burr told them to look." : "",
          `You go up the creekbed making every noise you can make, and the grass twitches, and out of the dark it comes: the Ghost, out in the open, <i>on the coulee side of the pool</i>, where every animal can see exactly where it comes from.`,
          `One long moment. Then Hundred Winters bellows, and the bison do what bison have always done. They close ranks: a wall of horns and shoulders in front of the water, the young ones behind it, the other animals pulling in behind them. The Ghost looks at the wall. It looks at you. And it turns and walks back into the dark.`,
          `In the morning, when your ${wb.g(s)} walks down to drink, Hundred Winters looks at you for a long time. Then he steps aside.`,
          hasBurden(s, "blamed") ? dropBurden(s, "blamed") : "", wb.ghost(s, "off"), stat1(s, "heart"), wb.tc(s, r)] }; } }),
        wb.when(s.sp === "coyote" || s.stats.cunning >= 6, { label: "Trick it away", tag: s.sp === "coyote" ? "Coyote: Trickster" : "Cunning 6+", go: s => ({ text: [
          `You go out into the grass toward it, until your legs are shaking so hard you can barely stand. Then you yelp, loud, and run: not back to the pool, but out into the badlands. You're the easiest thing it's seen all night, and it follows you.`,
          `You run all night, up coulees and down buttes, with the Ghost always just behind you, quiet and patient. Just before dawn you lose it in the maze of the Red Buttes. When you limp back, every animal at the pool is drinking. Nobody died last night. Nobody knows why.`,
          wb.ghost(s, "tricked"), addBurden(s, "being_hunted")] }) }),
        { label: "Stand alone at the edge of the grass", go: s => ({ text: [
          `You plant yourself between the dark and the water, and wait. When it comes, you don't run. ${sx(s, { coyote: "You bare every tooth you have and snarl.", bison: "You drop your head and paw the dirt and bellow.", pronghorn: "You stamp and snort and flare your white rump hairs.", eagle: "You spread your wings as wide as they'll go and scream.", otter: "You arch your back and shriek, every bit of you bristling.", badger: "You puff yourself up twice your size and hiss." })}`,
          `It's enough. Barely. The Ghost stops, stares at you, and goes. But you saw its eyes. You'll see them again every time the grass moves.`,
          wb.ghost(s, "off"), addWound(s, "eyes_grass"), s.sp === "bison" ? (s.flags.hw = true, "") : ""] }) },
        { label: "Give in", tag: "⚠ Instinct: you survive, guaranteed", go: (s, r) => ({ text: [
          `It's too much. Your body takes over, and you're gone, and so is everyone else. The Deep Bend explodes, and the Ghost walks down to the edge of the water and takes what it came for. You don't see what.`,
          `In the morning, the Pool Peace is over. Animals come to drink one at a time, terrified, and fight each other at the edge.`,
          wb.give(s, r), addBurden(s, "no_peace")] }) },
        wb.when(wb.legend(s, 2) && s.stats.heart >= 6, { label: "Spare the starving cat", tag: "Rare", go: (s, r) => ({ text: [
          `You go against every instinct you've ever had. You don't run. You don't fight. You walk out in front of the tall grass and stand still, right where it can see you. And it comes out.`,
          `It's so close now you can see everything. It's thin. Its ribs stand out like the ribs of the dead fish in the riverbed. Its bad leg is shaking. It isn't a monster. It's starving. It's what you'll be, if the water runs out.`,
          `So you move, slowly, away from the pool and the dens. And it follows you, down the dry riverbed to where the Hollow River meets the big river, still running, with deer on the far bank. You cross. ${sx(s, { eagle: "You fly over, low and slow, so it can follow you with its eyes.", badger: "You swim, barely, badly, nearly going under twice.", coyote: "You swim hard, the current pulling at you.", bison: "You swim hard, the current pulling at you.", pronghorn: "You swim hard, the current pulling at you.", otter: "You swim it like breathing." })} Behind you there's a splash. Big cats can swim.`,
          `It comes out on the far bank, shakes itself, looks at you one long moment with those pale gold eyes, then smells the deer and disappears into the trees. Tonight, nobody at the Deep Bend is going to die.`,
          wb.ghost(s, "spared"), wb.tc(s, r)] }) }),
        wb.when(wb.legend(s, 4), { label: "Stand, and see who stands with you", tag: "Very rare", go: (s, r) => { s.flags.hw = true; return { text: [

function fbNote() {
  render(`
    <h2>Before you start</h2>
    <p>These stories are about football, and about what pressure does to people. Players get hurt, lose games, get cut, and let people down. Families and friends get hurt too. Nobody ever dies.</p>

function fbFinalize(c) {
  const p = FB.paths[c.path];
  const st = { grit: 3, smarts: 3, speed: 3, technique: 3, poise: 3, zone: 0 };
  p.stats.forEach(k => st[k] += 1);
  Object.keys(c.spent).forEach(k => { if (k in st) st[k] += c.spent[k]; });
  if (c.gifted) st.zone = 2;
  c.stats = st;
  c.skills = [p.skill];
  if (!c.gifted && c.extraSkill) c.skills.push(c.extraSkill);
  c.traits = [p.strength, p.weakness, c.strength];
  c.burdens = c.gifted ? ["spotlight"] : [];
  if (c.path === "late" && !c.lateSport) c.lateSport = pick(FB.lateSports);
  c.age = Math.max(p.minAge, c.age || p.minAge);
  if (c.jersey == null || c.jersey === "") c.jersey = Math.floor(Math.random() * 99) + 1;
  c.marked = false;
  return c;
}
function fbQuick(c) {
  c.path = pick(Object.keys(FB.paths)); c.position = pick(Object.keys(FB.positions));
  c.spent = FB_SPENT0();
  const base = k => 3 + (FB.paths[c.path].stats.includes(k) ? 1 : 0);
  let n = 3; while (n) { const k = pick(Object.keys(c.spent)); if (base(k) + c.spent[k] < 6) { c.spent[k]++; n--; } }
  c.gifted = Math.random() < .5; c.zkind = c.gifted ? pick(Object.keys(FB.zones)) : null;
  c.extraSkill = c.gifted ? null : pick(FB.extraSkills.filter(x => x !== FB.paths[c.path].skill));
  c.fear = pick(Object.keys(FB.fears)); c.strength = pick(Object.keys(FB.strengths));
  c.mentor = pick(Object.keys(FB.mentors)); c.gaveUp = pick(Object.keys(FB.gaveUp));
  c.keepsake = pick(FB.keepsakes);
  c.age = FB.paths[c.path].minAge + Math.floor(Math.random() * (24 - FB.paths[c.path].minAge));
  c.jersey = Math.floor(Math.random() * 99) + 1;
}
const cap = t => t[0].toUpperCase() + t.slice(1);
function fbPortrait(c) {
  const p = FB.paths[c.path], th = PRONOUNS[c.pro], pl = c.pro === "they";

    ${c.gifted ? `${S1} ${pl ? "have" : "has"} the <b>Zone (${FB.zones[c.zkind].name})</b>: when it comes, ${FB.zones[c.zkind].feel}.` : `${S1} ${pl ? "are" : "is"} a <b>Grinder</b>: no Zone, just work. Not yet, anyway.`}
    ${FB.mentors[c.mentor].name} taught ${th[1]} the most. ${S1} wear${pl ? "" : "s"} #${esc(c.jersey)}, always carr${pl ? "y" : "ies"} a ${esc(c.keepsake)}, and ${pl ? "are" : "is"} secretly ${FB.fears[c.fear].toLowerCase()}.
    <div class="wcard"><b>Draft scouting report</b><br>Strengths: ${SNAME[sorted[0]]}, ${SNAME[sorted[1]]}. ${p.strength}.<br>Concerns: ${SNAME[sorted[sorted.length - 1]]}. ${p.weakness}.</div>`;
}
function fbSheetStats(c) {
  return `<div class="stats">${[...FB.stats.map(x => x[0]), "zone"].map(k => `<div class="stat"><b>${SNAME[k]}</b><span class="v">${c.stats[k]}</span></div>`).join("")}</div>
    <p><span class="pill ember">${FB.positions[c.position].name}</span>${c.skills.map(k => `<span class="pill ember">${k}</span>`).join("")}${c.traits.map(k => `<span class="pill">${k}</span>`).join("")}<span class="pill">${FB.fears[c.fear]}</span><span class="pill">Age ${c.age}</span></p>`;
}
function fbCreate(c, step) {
  const total = 8;
  const head = `<div class="steps">Step ${step} of ${total}</div>`;
  const nav = (canNext, extra = "") => `<hr><div class="row">
      <button id="prev">${step > 1 ? "← Back" : "Cancel"}</button>

  const go = n => fbCreate(c, n);
  const wire = (randFn, valid) => {
    document.getElementById("prev").onclick = () => step > 1 ? go(step - 1) : fbHome();
    document.getElementById("rand").onclick = () => { randFn(); go(step); };
    document.getElementById("next").onclick = () => { if (!valid()) return; if (step === total) { fbFinalize(c); S = c; R = null; saveChar(); startBook("draftday"); } else go(step + 1); };
  };
  const names = ["Jordan", "Casey", "Riley", "Avery", "Marcus", "Dani", "Tate", "Quinn", "Reese", "Jalen"];
  if (step === 1) {
    render(`${head}<h2>Who are you?</h2>
      <p>What's your player's name?</p><input type="text" id="nm" maxlength="24" value="${esc(c.name)}" placeholder="Type a name">
      <p>When other people talk about you, they say…</p>
      <div class="row">${Object.keys(PRONOUNS).map(p => `<button class="card ${c.pro === p ? "sel" : ""}" data-p="${p}">${PRONOUNS[p][0]} / ${PRONOUNS[p][1]}</button>`).join("")}</div>
      ${nav(true, `<button id="quick">⚡ Quick start</button>`)}`);
    const nmEl = document.getElementById("nm");
    nmEl.oninput = () => { c.name = nmEl.value; };
    on("[data-p]", el => { c.pro = el.dataset.p; c.name = nmEl.value; go(1); });
    document.getElementById("quick").onclick = () => { c.name = nmEl.value.trim() || pick(names); fbQuick(c); go(8); };
    wire(() => { c.name = pick(names); c.pro = pick(Object.keys(PRONOUNS)); }, () => { c.name = nmEl.value.trim() || c.name.trim(); if (!c.name) { nmEl.focus(); toast("Type a name first"); return false; } return true; });
  }
  else if (step === 2) {
    render(`${head}<h2>Your path to the draft</h2><p class="dim">Your path gives you +1 to two stats, a skill, a strength and a weakness.</p>
      <div class="grid">${Object.entries(FB.paths).map(([k, o]) => `<div class="card ${c.path === k ? "sel" : ""}" data-o="${k}"><b>${o.name}</b><small>${o.blurb}</small><br>
        <span class="pill ember">+1 ${SNAME[o.stats[0]]}</span><span class="pill ember">+1 ${SNAME[o.stats[1]]}</span><span class="pill">${o.skill}</span><br>
        <small>Strength: ${o.strength}<br>Weakness: ${o.weakness}${o.minAge > 19 ? `<br>Age ${o.minAge}+` : ""}</small></div>`).join("")}</div>${nav(!!c.path)}`);
    on("[data-o]", el => { c.path = el.dataset.o; c.spent = FB_SPENT0(); go(2); });
    wire(() => { c.path = pick(Object.keys(FB.paths)); c.spent = FB_SPENT0(); }, () => !!c.path);
  }
  else if (step === 3) {
    render(`${head}<h2>What position do you play?</h2><p class="dim">Your position opens up its own choices in every game.</p>
      <div class="grid">${Object.entries(FB.positions).map(([k, o]) => `<div class="card ${c.position === k ? "sel" : ""}" data-o="${k}"><b>${o.name}</b><small>${o.what}</small></div>`).join("")}</div>${nav(!!c.position)}`);
    on("[data-o]", el => { c.position = el.dataset.o; go(3); });
    wire(() => { c.position = pick(Object.keys(FB.positions)); }, () => !!c.position);
  }
  else if (step === 4) {
    const base = k => 3 + (FB.paths[c.path].stats.includes(k) ? 1 : 0);
    const left = 3 - Object.values(c.spent).reduce((a, b) => a + b, 0);
    render(`${head}<h2>Spend 3 points</h2><p class="dim">Add points to any stat. No stat can go above 6. Points left: <b>${left}</b></p>
      <div class="spend">${FB.stats.map(([k, n, d]) => `<div class="stat"><div><b>${n}</b><br><small class="dim">${d}</small></div>
        <button data-m="${k}" aria-label="Take a point from ${n}" ${c.spent[k] ? "" : "disabled"}>−</button><span class="v">${base(k) + c.spent[k]}</span><button data-a="${k}" aria-label="Add a point to ${n}" ${left && base(k) + c.spent[k] < 6 ? "" : "disabled"}>+</button></div>`).join("")}</div>
      ${nav(left === 0)}`);
    on("[data-a]", el => { c.spent[el.dataset.a]++; go(4); });
    on("[data-m]", el => { c.spent[el.dataset.m]--; go(4); });
    wire(() => { c.spent = FB_SPENT0(); let n = 3; while (n) { const k = pick(Object.keys(c.spent)); if (base(k) + c.spent[k] < 6) { c.spent[k]++; n--; } } }, () => left === 0);

      <div class="grid">
        <div class="card ${c.gifted === true ? "sel" : ""}" data-g="1"><b>Gifted</b><small>Sometimes the game slows down for you. That's <b>the Zone</b>. You start with Zone 2. Going into it guarantees a play, but it costs you. And everyone expects big things: <i>In the Spotlight</i>.</small></div>
        <div class="card ${c.gifted === false ? "sel" : ""}" data-g="0"><b>Grinder</b><small>No Zone, just work. You get an extra skill. And maybe, if you make the right choices, the Zone will come someday…</small></div>
      </div>
      ${c.gifted === true ? `<h3>What kind of Zone?</h3><div class="grid">${Object.entries(FB.zones).map(([k, z]) => `<div class="card ${c.zkind === k ? "sel" : ""}" data-k="${k}"><b>${z.name}</b><small>It feels like ${z.feel}.<br>In the Zone you can: ${z.can}.</small></div>`).join("")}</div>` : ""}
      ${c.gifted === false ? `<h3>Pick your extra skill</h3><div class="row">${FB.extraSkills.filter(x => x !== FB.paths[c.path].skill).map(k => `<button class="card ${c.extraSkill === k ? "sel" : ""}" data-x="${k}">${k}</button>`).join("")}</div>` : ""}
      ${nav(c.gifted === true ? !!c.zkind : c.gifted === false ? !!c.extraSkill : false)}`);
    on("[data-g]", el => { c.gifted = el.dataset.g === "1"; go(5); });
    on("[data-k]", el => { c.zkind = el.dataset.k; go(5); });

  }
  else if (step === 6) {

      <h3>What scares you most?</h3>
      <div class="grid">${Object.entries(FB.fears).map(([k, f]) => `<div class="card ${c.fear === k ? "sel" : ""}" data-f="${k}"><b>${f.replace("Afraid of ", "")}</b></div>`).join("")}</div>
      <h3>When a teammate's in trouble, you…</h3>
      <div class="grid">${Object.entries(FB.strengths).map(([k, d]) => `<div class="card ${c.strength === k ? "sel" : ""}" data-s="${k}"><b>${k}</b><small>${d}</small></div>`).join("")}</div>
      <h3>Who taught you the most?</h3>
      <div class="grid">${Object.entries(FB.mentors).map(([k, m]) => `<div class="card ${c.mentor === k ? "sel" : ""}" data-t="${k}"><b>${m.name}</b><small>${m.who}.</small></div>`).join("")}</div>
      ${nav(c.gaveUp && c.fear && c.strength && c.mentor)}`);
    on("[data-u]", el => { c.gaveUp = el.dataset.u; go(6); });
    on("[data-f]", el => { c.fear = el.dataset.f; go(6); });
    on("[data-s]", el => { c.strength = el.dataset.s; go(6); });
    on("[data-t]", el => { c.mentor = el.dataset.t; go(6); });
    wire(() => { c.gaveUp = pick(Object.keys(FB.gaveUp)); c.fear = pick(Object.keys(FB.fears)); c.strength = pick(Object.keys(FB.strengths)); c.mentor = pick(Object.keys(FB.mentors)); }, () => c.gaveUp && c.fear && c.strength && c.mentor);
  }
  else if (step === 7) {
    const min = FB.paths[c.path].minAge;
    if (!c.age || c.age < min) c.age = min;
    render(`${head}<h2>Draft Day you</h2>
      <h3>How old are you on Draft Day?</h3>

      <div class="row">${[19, 20, 21, 22, 23].filter(a => a >= min).map(a => `<button class="card ${c.age === a ? "sel" : ""}" data-a="${a}">${a}</button>`).join("")}</div>

function wbCreate(c, step) {

    on("[data-y]", el => { c.firstYear = el.dataset.y; go(6); });
    on("[data-f]", el => { c.fear = el.dataset.f; go(6); });
    on("[data-s]", el => { c.strength = el.dataset.s; go(6); });
    on("[data-t]", el => { c.teacher = el.dataset.t; go(6); });
    wire(() => { c.firstYear = pick(Object.keys(WB.firstYears)); c.fear = pick(Object.keys(WB.fears)); c.strength = pick(Object.keys(WB.strengths)); c.teacher = pick(Object.keys(WB.teachers)); }, () => c.firstYear && c.fear && c.strength && c.teacher);
  }
